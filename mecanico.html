function MontajeModal({ tipo, pos, equipo, clienteId, cfg, axleCfg, user, onClose, onConfirm }) {
  const [fuego, setFuego] = useState("");
  const [tipoNeumatico, setTipoNeumatico] = useState("");
  const [marca, setMarca] = useState("");
  const [modelo, setModelo] = useState("");
  const [marcaModeloNoRegistrado, setMarcaModeloNoRegistrado] = useState(false);
  const [medida, setMedida] = useState("");
  const [psi, setPsi] = useState("");
  const [mm, setMm] = useState("");
  const [torqueado, setTorqueado] = useState(false);
  const [fisicoConfirmado, setFisicoConfirmado] = useState(false);
  const [fotoUrl, setFotoUrl] = useState(null);
  const [fotoNombre, setFotoNombre] = useState("");
  const [subiendoFoto, setSubiendoFoto] = useState(false);
  const [fotoError, setFotoError] = useState("");
  const [search, setSearch] = useState("");
  const esBuscable = tipo === "transito" || tipo === "recauchado";
  const [buscando, setBuscando] = useState(esBuscable);
  const [opciones, setOpciones] = useState(null); // null = cargando
  // Recauchado: tras elegir del buscador, preguntar si tiene N de fuego marcado
  // fisicamente (HC-8). null = sin preguntar todavia.
  const [fuegoMarcado, setFuegoMarcado] = useState(null);

  useEffect(() => {
    if (tipo !== "nuevo") return;
    generarNumeroFuegoSugerido(clienteId, cfg, equipo.numero_interno, pos, todayISO())
      .then(sug => setFuego(f => (f ? f : sug)))
      .catch(() => {});
  }, []);

  useEffect(() => {
    if (esBuscable) fetchNeumaticosBodega(clienteId, tipo).then(setOpciones).catch(() => setOpciones([]));
  }, [tipo]);

  const filtradas = (opciones || []).filter(o => {
    if (!search) return true;
    const s = search.toLowerCase();
    return (o.numero_fuego || "").toLowerCase().includes(s) || (o.marca || "").toLowerCase().includes(s) || (o.modelo || "").toLowerCase().includes(s);
  });

  async function onFotoChange(e) {
    const file = e.target.files && e.target.files[0];
    if (!file) return;
    setFotoNombre(file.name); setSubiendoFoto(true); setFotoError(""); setFotoUrl(null);
    try {
      const url = await subirFotoCheckpoint(clienteId, pos, file);
      setFotoUrl(url);
    } catch (err) {
      setFotoError("No se pudo subir la foto. Verificá que exista el bucket público 'checkpoints' en Supabase Storage.");
    } finally {
      setSubiendoFoto(false);
    }
  }

  function elegirTipoIncorrecto(slug, esperado) {
    pushQueue({
      id: uuid(), tipo: "alerta", clienteId, ts: Date.now(), data: {
        id: uuid(), cliente_id: clienteId, equipo_id: equipo.id_equipo, mecanico_id: user.id,
        tipo: "tipo_neumatico_incorrecto", severidad: "amarillo",
        titulo: `Tipo incorrecto — ${equipo.patente} pos ${pos}`,
        descripcion: `El mecánico intentó montar un ${TIPO_NEUMATICO_OPCIONES.find(o => o.slug === slug).label.toLowerCase()} en posición ${pos} (${TIPO_NEUMATICO_OPCIONES.find(o => o.slug === esperado).label.toLowerCase()} en ${equipo.tipo === "SEMI" ? "semi" : equipo.configuracion_ejes})`,
        posicion: pos, leida_mecanico: true, leida_admin: false, leida_superadmin: false
      }
    });
    syncQueue();
  }

  // HC-7: bodega recauchado sin stock -> bloquea antes de mostrar el buscador.
  if (tipo === "recauchado" && opciones !== null && opciones.length === 0) {
    return <SinStockRecauchadoModal equipo={equipo} clienteId={clienteId} user={user} onClose={onClose} />;
  }

  if (esBuscable && buscando) {
    if (opciones === null) return <Modal title={tipo === "transito" ? "Montar desde tránsito" : "Montar recauchado"} onClose={onClose}><div className="flex justify-center py-10"><span className="spinner" /></div></Modal>;
    return (
      <Modal title={tipo === "transito" ? "Montar desde tránsito" : "Montar recauchado"} onClose={onClose}>
        <TextInput placeholder="Buscar por N° fuego, marca o modelo" value={search} onChange={e => setSearch(e.target.value)} className="mb-3" />
        <div className="space-y-2 max-h-72 overflow-y-auto">
          {filtradas.map(o => (
            <button key={o.id_neumatico} onClick={() => {
              setMarca(o.marca || ""); setModelo(o.modelo || ""); setMedida(o.medida || ""); setBuscando(false);
              if (tipo === "transito") setFuego(o.numero_fuego);
              else { setFuego(""); setFuegoMarcado(null); }
            }}
              className="w-full text-left bg-[#F9FAFB] rounded-xl px-3 py-2.5 flex items-center justify-between">
              <div><p className="font-bold text-[14px]">{o.numero_fuego}</p><p className="text-[12px] text-muted">{o.marca} {o.modelo}</p></div>
              <span className="text-[12px] text-muted">P{o.posicion_actual || "-"}</span>
            </button>
          ))}
          {filtradas.length === 0 && <p className="text-center text-muted text-sm py-6">No hay neumáticos que coincidan.</p>}
        </div>
      </Modal>
    );
  }

  // HC-8: recauchado, tras elegir del buscador, preguntar si el N de fuego esta marcado fisicamente.
  if (tipo === "recauchado" && fuegoMarcado === null) {
    return (
      <Modal title="N° de fuego" onClose={onClose}>
        <p className="text-[14px] text-[#374151] mb-5">¿Este neumático tiene N° de fuego marcado?</p>
        <div className="space-y-3">
          <Button className="w-full" onClick={() => setFuegoMarcado(true)}>Sí, tiene N° de fuego</Button>
          <Button variant="subtle" className="w-full" onClick={async () => {
            setFuegoMarcado(false);
            try { const sug = await generarNumeroFuegoSugerido(clienteId, cfg, equipo.numero_interno, pos, todayISO()); setFuego(sug); } catch (e) {}
          }}>No tiene N° de fuego</Button>
        </div>
      </Modal>
    );
  }

  const titulo = tipo === "nuevo" ? "Montar neumático nuevo" : tipo === "transito" ? "Confirmar montaje" : "Montar recauchado";
  const tipoOk = tipo !== "nuevo" || (tipoNeumatico && (tipoNeumaticoEsperado(equipo, axleCfg, pos) == null || tipoNeumatico === tipoNeumaticoEsperado(equipo, axleCfg, pos)));
  const disabled = !fuego || psi === "" || mm === "" || !tipoOk
    || (tipo === "nuevo" && (!torqueado || !fotoUrl || subiendoFoto || !fisicoConfirmado));

  return (
    <Modal title={titulo} onClose={onClose}>
      <div className="space-y-4">
        {tipo === "nuevo" && (
          <TipoNeumaticoField equipo={equipo} axleCfg={axleCfg} pos={pos} tipo={tipoNeumatico} onChange={setTipoNeumatico} onIncorrecto={elegirTipoIncorrecto} />
        )}
        <Field label="N° de fuego" required hint={tipo === "nuevo" ? "Sugerido automáticamente, podés modificarlo (solo números)" : tipo === "recauchado" && fuegoMarcado ? "Escribí el N° marcado en el neumático" : null}>
          <TextInput inputMode="numeric" value={fuego} onChange={e => setFuego(e.target.value.replace(/[^0-9]/g, ""))} className="font-extrabold" disabled={tipo === "transito"} />
        </Field>
        <div className="grid grid-cols-2 gap-3">
          <MarcaModeloAuditoriaField clienteId={clienteId} marca={marca} modelo={modelo}
            onChange={(m, mo, noRegistrado) => { setMarca(m); setModelo(mo); setMarcaModeloNoRegistrado(noRegistrado); }} />
        </div>
        {tipo !== "transito" && (
          <Field label="Medida"><TextInput value={medida} onChange={e => setMedida(e.target.value)} /></Field>
        )}
        <div className="grid grid-cols-2 gap-3">
          <Field label="PSI actual" required><TextInput type="number" inputMode="numeric" value={psi} onChange={e => setPsi(e.target.value)} /></Field>
          <Field label="MM actual" required><TextInput type="number" step="0.1" value={mm} onChange={e => setMm(e.target.value)} /></Field>
        </div>
        {tipo === "nuevo" && (
          <div className="space-y-3">
            <label className="flex items-center gap-2 text-[13.5px] font-semibold"><input type="checkbox" checked={torqueado} onChange={e => setTorqueado(e.target.checked)} /> Ruedas torqueadas</label>
            <Field label="Foto de checkpoint" required hint="Obligatoria para completar el montaje">
              <label className="h-14 px-5 rounded-2xl font-bold text-[15px] bg-ink text-white flex items-center justify-center gap-2 cursor-pointer active:scale-[0.98] transition w-full">
                <span className="text-[18px]">📷</span> Tomar foto
                <input type="file" accept="image/*" capture="environment" onChange={onFotoChange} className="hidden" />
              </label>
            </Field>
            {subiendoFoto && <p className="text-[12.5px] text-muted">Subiendo foto...</p>}
            {fotoUrl && <p className="text-[12.5px] font-bold text-[#15803D]">✓ Foto subida: {fotoNombre}</p>}
            {fotoError && <p className="text-[12.5px] font-bold text-[#B91C1C]">{fotoError}</p>}
            {fuego && (
              <label className="flex items-start gap-2 text-[13.5px] font-semibold bg-[#F9FAFB] rounded-2xl p-3">
                <input type="checkbox" className="mt-0.5" checked={fisicoConfirmado} onChange={e => setFisicoConfirmado(e.target.checked)} />
                <span>Confirmé que el neumático fue marcado físicamente con el N° de fuego {fuego}</span>
              </label>
            )}
          </div>
        )}
        <Button className="w-full" disabled={disabled} onClick={() => onConfirm({ numero_fuego: fuego, marca, modelo, marcaModeloNoRegistrado, medida, psi, mm, fotoUrl })}>Continuar</Button>
      </div>
    </Modal>
  );
}

/* =====================================================================
   PANTALLA 8 - RECONTEO DE STOCK AL CIERRE
   Paso obligatorio antes de cerrar: mismo formato checkbox+stepper del
   check diario (reusa NEUMATICO_FIELDS/LLANTA_CIERRE_FIELDS/Stepper), pero
   arranca siempre en 0 sin precargar nada, para no inducir al mecanico.
===================================================================== */
function ReconteoCierre({ onConfirmar, verificando }) {
  const RECONTEO_FIELDS = [...NEUMATICO_FIELDS, ...LLANTA_CIERRE_FIELDS];
  const [stock, setStock] = useState(() => Object.fromEntries(RECONTEO_FIELDS.map(f => [f.key, { value: 0, checked: false }])));

  const filled = RECONTEO_FIELDS.filter(f => stock[f.key].checked).length;
  const complete = filled === RECONTEO_FIELDS.length;

  function setVal(key, v) { setStock(s => ({ ...s, [key]: { value: v, checked: true } })); }
  function toggle(key) { setStock(s => ({ ...s, [key]: { ...s[key], checked: !s[key].checked } })); }

  function renderSeccion(titulo, fields) {
    return (
      <>
        <p className="font-bold text-[15px] mb-2">{titulo}</p>
        <div className="space-y-2 mb-4">
          {fields.map(f => (
            <div key={f.key} className={cx("bg-white rounded-2xl border shadow-card px-4 py-3 flex items-center gap-3", stock[f.key].checked ? "border-bd" : "border-[#F59E0B]")}>
              <button type="button" onClick={() => toggle(f.key)} className={cx("w-7 h-7 rounded-lg flex items-center justify-center shrink-0 border", stock[f.key].checked ? "bg-ink border-ink" : "bg-white border-[#D1D5DB]")}>
                {stock[f.key].checked && <Icon.check width="15" height="15" className="text-white" />}
              </button>
              <span className="text-[14px] font-semibold text-[#1F2937] flex-1">{f.label}</span>
              <Stepper value={stock[f.key].value} onChange={v => setVal(f.key, v)} />
            </div>
          ))}
        </div>
      </>
    );
  }

  function confirmar() {
    const totalesNeumaticos = { nuevo: stock.nuevos.value, transito: stock.transito.value, recauchado: stock.recauchados.value, reparacion: stock.reparar.value };
    const totalesLlantas = Object.fromEntries(LLANTA_CIERRE_FIELDS.map(f => [f.key, stock[f.key].value]));
    onConfirmar(totalesNeumaticos, totalesLlantas);
  }

  return (
    <div className="min-h-screen pb-28 px-5 pt-14 safe-top">
      <h1 className="text-[26px] font-extrabold mb-1">Antes de cerrar, confirmá el stock actual</h1>
      <div className="bg-[#F9FAFB] rounded-[20px] p-5 my-4">
        <div className="flex items-center justify-between mb-2">
          <span className="font-bold text-[16px]">Ítems confirmados</span>
          <span className="text-[13px] font-bold">{filled}/{RECONTEO_FIELDS.length}</span>
        </div>
        <div className="h-2 rounded-full bg-[#E5E7EB] overflow-hidden">
          <div className="h-full bg-ink transition-all" style={{ width: (RECONTEO_FIELDS.length ? Math.round((filled / RECONTEO_FIELDS.length) * 100) : 0) + "%" }} />
        </div>
      </div>
      {renderSeccion("Neumáticos", NEUMATICO_FIELDS)}
      {renderSeccion("Llantas", LLANTA_CIERRE_FIELDS)}
      <div className="fixed bottom-0 left-0 right-0 bg-white border-t border-bd p-4 safe-bottom">
        <Button className="w-full" disabled={!complete || verificando} onClick={confirmar}>
          {verificando ? <span className="spinner" /> : "Confirmar y cerrar jornada"}
        </Button>
        {!complete && <p className="text-center text-[12px] text-muted mt-2">Marcá el checkbox de los {RECONTEO_FIELDS.length} ítems para continuar</p>}
      </div>
    </div>
  );
}

/* =====================================================================
   PANTALLA 8b - CIERRE DEL DIA
===================================================================== */
function CierreDelDia({ user, clienteId, onCerrado }) {
  const [resumen, setResumen] = useState(null);
  const [reconteando, setReconteando] = useState(false);
  const [cerrando, setCerrando] = useState(false);
  const [cerrado, setCerrado] = useState(false);
  const [pushToast, toastNode] = useToasts();

  useEffect(() => {
    construirResumenJornada(user.id, clienteId, todayISO()).then(({ conteos }) => setResumen(conteos)).catch(() => setResumen(null));
  }, [clienteId]);

  async function confirmarReconteo(totalesNeumaticos, totalesLlantas) {
    setCerrando(true);
    try {
      const { neuDiffs, llantaDiffs } = await compararStockCierre(clienteId, totalesNeumaticos, totalesLlantas);
      if (neuDiffs.length || llantaDiffs.length) {
        await registrarDiscrepanciasCierre(clienteId, user, todayISO(), neuDiffs, llantaDiffs);
        pushToast("⚠ Se detectaron diferencias de stock — se avisó a tu supervisor", "amber");
      } else {
        pushToast("✓ Stock verificado");
      }
    } catch (e) {
      console.error("No se pudo comparar el stock al cierre", e);
    }
    try {
      await cerrarJornadaConResumen({ user, clienteId, fecha: todayISO(), horaCierre: nowHM(), motivoSinCierre: null });
      localStorage.setItem("jornada_cerrada_hoy", "true");
      setCerrado(true);
      if (onCerrado) onCerrado();
    } catch (e) {
      console.error("No se pudo cerrar la jornada", e);
    } finally {
      setCerrando(false);
      setReconteando(false);
    }
  }

  if (cerrado) {
    return (
      <div className="min-h-screen flex flex-col items-center justify-center px-8 text-center">
        <div className="w-14 h-14 rounded-2xl bg-[#DCFCE7] flex items-center justify-center mb-5"><Icon.check width="26" height="26" className="text-[#15803D]" /></div>
        <p className="text-[22px] font-extrabold mb-2">¡Jornada cerrada!</p>
        <p className="text-[15px] text-sub">Hasta mañana, {user.nombre}</p>
      </div>
    );
  }

  if (reconteando) {
    return <>{toastNode}<ReconteoCierre verificando={cerrando} onConfirmar={confirmarReconteo} /></>;
  }

  return (
    <div className="min-h-screen pb-24 px-5 pt-14 safe-top">
      {toastNode}
      <h1 className="text-[30px] font-extrabold mb-6">Cierre del día</h1>
      {!resumen ? <div className="flex justify-center py-10"><span className="spinner" /></div> : (
        <>
          <div className="grid grid-cols-2 gap-3 mb-4">
            {[["Auditorías", resumen.auditorias_realizadas], ["Cambios", resumen.cambios_realizados], ["Regulaciones PSI", resumen.regulaciones_psi], ["Retorqueos", resumen.retorqueos], ["Rotaciones", resumen.rotaciones], ["Reparaciones", resumen.reparaciones]].map(([l, v]) => (
              <div key={l} className="bg-[#F9FAFB] rounded-[18px] p-4">
                <p className="text-[11.5px] font-semibold text-muted mb-1">{l}</p>
                <p className="text-[22px] font-extrabold">{v}</p>
              </div>
            ))}
          </div>
          {resumen.pct_receta_promedio != null && (
            <Card className="mb-6">
              <p className="text-[13px] font-semibold text-sub mb-1">% promedio de instructivo seguido</p>
              <p className="text-[26px] font-extrabold">{resumen.pct_receta_promedio}%</p>
            </Card>
          )}
          <Button className="w-full" onClick={() => setReconteando(true)}>Cerrar jornada</Button>
        </>
      )}
    </div>
  );
}

function AlertasScreen({ user, clienteId }) {
  const [remotas, setRemotas] = useState([]);
  const [loading, setLoading] = useState(true);
  const [filter, setFilter] = useState("todas");
  const [equiposMap, setEquiposMap] = useState({});
  const pendientesCount = useQueueCount();

  useEffect(() => {
    db.fetchAlertas(clienteId, user.id).then(setRemotas).catch(() => {}).finally(() => setLoading(false));
  }, [clienteId, user.id, pendientesCount]);

  useEffect(() => {
    db.fetchEquipos(clienteId).then(eqs => {
      const map = {};
      (eqs || []).forEach(e => { map[e.id_equipo] = e.numero_interno ? `${e.numero_interno} · ${e.patente}` : e.patente; });
      setEquiposMap(map);
    }).catch(() => {});
  }, [clienteId]);

  // Alertas propias pendientes de sincronizar (aun en la cola offline) tambien
  // son del mecanico actual, ya que se generan siempre con mecanico_id=user.id.
  const pendientes = getQueue().filter(q => q.tipo === "alerta" && q.clienteId === clienteId && q.data.mecanico_id === user.id && q.data.tipo !== "discrepancia_inventario").map(q => ({ ...q.data, __pendiente: true }));
  const alertas = [...pendientes, ...remotas.filter(r => !pendientes.some(p => p.id === r.id))]
    .sort((a, b) => (b.creado_en || "").localeCompare(a.creado_en || ""));

  async function marcarLeida(a) {
    if (a.__pendiente || a.leida_mecanico) return;
    setRemotas(as => as.map(x => x.id === a.id ? { ...x, leida_mecanico: true } : x));
    await sb.from("alertas").update({ leida_mecanico: true }).eq("id", a.id);
    window.dispatchEvent(new Event("mosa-alertas-changed"));
  }

  const filtradas = alertas.filter(a => filter === "todas" ? true : filter === "noleidas" ? !a.leida_mecanico : true);

  return (
    <div className="min-h-screen pb-24 px-5 pt-14 safe-top">
      <h1 className="text-[30px] font-extrabold mb-4">Alertas</h1>
      <div className="flex gap-2 mb-5">
        {[["todas", "Todas"], ["noleidas", "No leídas"]].map(([k, l]) => (
          <button key={k} onClick={() => setFilter(k)} className={cx("px-4 py-2 rounded-full text-[13px] font-bold", filter === k ? "bg-ink text-white" : "bg-[#F3F4F6] text-[#374151]")}>{l}</button>
        ))}
      </div>
      {loading && <div className="flex justify-center py-10"><span className="spinner" /></div>}
      <div className="space-y-3">
        {filtradas.map(a => (
          <div key={a.id} className="w-full text-left bg-white rounded-2xl border border-bd shadow-card p-4">
            <div className="flex items-start justify-between gap-2">
              <div className="flex-1">
                <p className="font-bold text-[14.5px]">{a.titulo}</p>
                <p className="text-[12.5px] text-muted mt-0.5">{a.descripcion}</p>
              </div>
              <Badge color={a.severidad === "rojo" ? "red" : a.severidad === "amarillo" ? "amber" : "gray"}>{a.severidad === "rojo" ? "Alerta" : a.severidad === "amarillo" ? "Atención" : "Info"}</Badge>
            </div>
            <div className="flex flex-wrap items-center gap-x-3 gap-y-1 mt-2 text-[12px] text-muted">
              {a.equipo_id && <span>{equiposMap[a.equipo_id] || "Equipo"}</span>}
              {a.posicion != null && <span>P{a.posicion}</span>}
              {a.creado_en && <span>{(a.creado_en).slice(0, 10)} · {(a.creado_en).slice(11, 16)}</span>}
            </div>
            <div className="flex items-center justify-between gap-2 mt-2.5">
              <div className="flex items-center gap-2">
                {!a.leida_mecanico && <span className="text-[11px] font-bold text-ink">● No leída</span>}
                {a.__pendiente && <span className="text-[11px] font-bold text-[#92400E]">Sincronizando...</span>}
              </div>
              {!a.leida_mecanico && !a.__pendiente && (
                <button onClick={() => marcarLeida(a)} className="text-[12px] font-bold text-ink px-3 py-1.5 rounded-full bg-[#F3F4F6]">Marcar como leída</button>
              )}
            </div>
          </div>
        ))}
        {!loading && filtradas.length === 0 && <p className="text-center text-muted py-10 text-sm">Sin alertas.</p>}
      </div>
    </div>
  );
}

/* =====================================================================
   APP DEL MECANICO
===================================================================== */
function MecanicoApp({ user }) {
  const [clienteId, setClienteId] = useState(null);
  const [empresaConfirmada, setEmpresaConfirmada] = useState(false);
  const [checkDone, setCheckDone] = useState(false);
  const [cfg, setCfg] = useState(DEFAULT_CFG);
  const [tab, setTab] = useState("inicio");
  const [flow, setFlow] = useState(null);
  const [pushToast, toastNode] = useToasts();
  const alertasNoLeidas = useAlertasNoLeidas(clienteId, user.id);
  // Bloqueo tras cerrar jornada: solo se levanta con un login nuevo (MecanicoGate
  // reevalua desde la DB). En esta misma sesion, solo queda accesible Alertas.
  const [jornadaCerrada, setJornadaCerrada] = useState(() => {
    const t = getTurno();
    return localStorage.getItem("jornada_cerrada_hoy") === "true" && !!t && t.fecha === todayISO();
  });
  const [horasExtrasInfo, setHorasExtrasInfo] = useState(null);

  // MEJ cierre-2: alerta de horas extras. Se dispara una sola vez (localStorage
  // alerta_horas_extras_enviada_hoy) mientras el mecanico tiene la app abierta,
  // sin bloquear el flujo — solo informa y crea la alerta para el Admin.
  useEffect(() => {
    if (!clienteId || !checkDone) return;
    let cancel = false;
    function chequear() {
      if (localStorage.getItem("alerta_horas_extras_enviada_hoy") === "true") return;
      verificarHorasExtras(clienteId, user, cfg).then(info => {
        if (cancel || !info) return;
        setHorasExtrasInfo(info);
        localStorage.setItem("alerta_horas_extras_enviada_hoy", "true");
      }).catch(e => console.error("No se pudo chequear horas extras", e));
    }
    chequear();
    const t = setInterval(chequear, 5 * 60 * 1000);
    return () => { cancel = true; clearInterval(t); };
  }, [clienteId, checkDone, cfg]);

  useEffect(() => {
    const turno = getTurno();
    if (turno && turno.fecha === todayISO()) {
      setClienteId(turno.clienteId); setEmpresaConfirmada(true); setCheckDone(!!turno.checkDone);
    }
  }, []);
  useEffect(() => { if (clienteId) db.fetchConfig(clienteId).then(setCfg).catch(() => setCfg(getCache(LS.cfg(clienteId), DEFAULT_CFG))); }, [clienteId]);
  // Precarga de equipos apenas se conoce la empresa (no espera a que el mecanico
  // entre a la pantalla de seleccion): asi la cache de LS.equipos queda lista
  // para trabajar offline aunque despues se pierda la conexion antes de llegar ahi.
  useEffect(() => { if (clienteId && navigator.onLine) db.fetchEquipos(clienteId).catch(() => {}); }, [clienteId]);
  // Reintenta la precarga cada vez que vuelve la conexion, para que la lista de
  // equipos (y sus altas/bajas) se mantenga al dia mientras el mecanico trabaja.
  useEffect(() => {
    if (!clienteId) return;
    const onOnline = () => db.fetchEquipos(clienteId).catch(() => {});
    window.addEventListener("online", onOnline);
    return () => window.removeEventListener("online", onOnline);
  }, [clienteId]);

  if (!empresaConfirmada) {
    return <SeleccionEmpresa user={user} onConfirm={(cid) => { setClienteId(cid); setEmpresaConfirmada(true); setTurno({ clienteId: cid, fecha: todayISO(), checkDone: false }); }} />;
  }
  if (!checkDone) {
    return <CheckDiario user={user} clienteId={clienteId} onDone={() => setCheckDone(true)} />;
  }

  let body;
  if (jornadaCerrada && tab !== "alertas" && tab !== "perfil") {
    body = (
      <div className="min-h-screen flex flex-col items-center justify-center px-8 text-center">
        <div className="w-14 h-14 rounded-2xl bg-[#DCFCE7] flex items-center justify-center mb-5"><Icon.check width="26" height="26" className="text-[#15803D]" /></div>
        <p className="text-[22px] font-extrabold mb-2">¡Jornada cerrada!</p>
        <p className="text-[15px] text-sub">Hasta mañana, {user.nombre}</p>
      </div>
    );
  } else if (flow && flow.stage === "accion") {
    body = (
      <>
        <SeleccionEquipo clienteId={clienteId} cfg={cfg} onPick={async (eq) => {
          let vencida = false, enProcesoHoy = false;
          try {
            const info = await db.fetchEstadoAuditoriaEquipo(eq.id_equipo);
            const estado = equipoAuditEstado(info, cfg.meses_vencimiento_auditoria);
            vencida = estado === "vencida" || estado === "sin_auditoria";
          } catch (e) { console.error(e); }
          try {
            const receta = await db.fetchRecetaEnProcesoHoy(eq.id_equipo);
            enProcesoHoy = !!receta;
          } catch (e) { console.error(e); }
          setFlow({ stage: "accion", equipo: eq, estadoInfo: { vencida, enProcesoHoy } });
        }} />
        <AccionEquipo equipo={flow.equipo} estadoInfo={flow.estadoInfo} onClose={() => setFlow(null)}
          onAuditoria={() => setFlow({ stage: "auditoria", equipo: flow.equipo })}
          onContinuarCambio={async () => {
            const pd = await construirPosDataDesdeEquipo(flow.equipo.id_equipo, cfg, axleConfigFor(flow.equipo), flow.equipo);
            let recetaEnProceso = null;
            try { recetaEnProceso = await db.fetchRecetaEnProcesoHoy(flow.equipo.id_equipo); } catch (e) { console.error("No se pudo buscar el instructivo en curso", e); }
            if (!recetaEnProceso) { setFlow(null); return; }
            const pa = recetaEnProceso.posiciones_alerta || {};
            const recs = Array.isArray(pa.recomendaciones) ? pa.recomendaciones : [];
            const extras = Array.isArray(pa.tareas_extra) ? pa.tareas_extra : [];
            const cl = [
              ...recs.map(r => ({ id: r.id || uuid(), texto: r.texto, done: !!r.done, extra: false })),
              ...extras.map(t => ({ id: uuid(), texto: t.texto, done: !!t.done, extra: true, origen: t.origen || null }))
            ];
            const discrepNeus = Array.isArray(pa.discrepancias_neumaticos) ? pa.discrepancias_neumaticos : [];
            setFlow({ stage: "cambio", equipo: flow.equipo, axleCfg: axleConfigFor(flow.equipo), posData: pd, checklist: cl, recetaIdInicial: recetaEnProceso.id, pendiente: null, discrepanciasNeumaticos: discrepNeus });
          }} />
      </>
    );
  } else if (flow && flow.stage === "auditoria") {
    body = (
      <AuditoriaForm user={user} clienteId={clienteId} equipo={flow.equipo} cfg={cfg}
        onCancel={() => setFlow(null)}
        onGenerarInstructivo={async (posData, axleCfg, km, startedAt, tareasExtra) => {
          const recsInfo = generarRecomendaciones(posData, axleCfg, flow.equipo.tipo, cfg);
          const checklist = [
            ...recsInfo.recs.map(r => ({ id: r.id, texto: r.texto, done: false, extra: false })),
            ...(tareasExtra || []).map(t => ({ id: uuid(), texto: t.texto, done: false, extra: true, origen: t.origen || null }))
          ];
          let discrepanciasNeumaticos = [];
          try { discrepanciasNeumaticos = await compararNeumaticosAuditoria(clienteId, flow.equipo.id_equipo, posData); }
          catch (e) { console.error("No se pudo comparar neumáticos contra el sistema", e); }
          setFlow({ stage: "instructivo", equipo: flow.equipo, posData, axleCfg, km, recsInfo, checklist, discrepanciasNeumaticos });
        }} />
    );
  } else if (flow && flow.stage === "instructivo") {
    body = (
      <Instructivo equipo={flow.equipo} axleCfg={flow.axleCfg} posData={flow.posData} recsInfo={flow.recsInfo}
        checklist={flow.checklist} setChecklist={(fn) => setFlow(f => ({ ...f, checklist: typeof fn === "function" ? fn(f.checklist) : fn }))}
        discrepancias={flow.discrepanciasNeumaticos}
        onContinuar={async () => {
          const res = await construirYGuardarAuditoria({ user, clienteId, equipo: flow.equipo, cfg, posData: flow.posData, axleCfg: flow.axleCfg, km: flow.km, checklist: flow.checklist, recsInfo: flow.recsInfo, discrepanciasNeumaticos: flow.discrepanciasNeumaticos, recetaEstado: "en_proceso" });
          const n = res.alertas;
          if (navigator.onLine) pushToast(n > 0 ? `✓ Auditoría guardada · ${n} alerta${n !== 1 ? "s" : ""} generada${n !== 1 ? "s" : ""}` : "✓ Auditoría guardada");
          else pushToast("📋 Guardado localmente — se sincronizará al reconectar", "amber");
          setFlow({ stage: "cambio", equipo: flow.equipo, axleCfg: flow.axleCfg, posData: flow.posData, checklist: flow.checklist, kmInicial: flow.km, recetaIdInicial: res.recetaId, discrepanciasNeumaticos: flow.discrepanciasNeumaticos });
        }}
        onCerrar={async () => {
          const res = await construirYGuardarAuditoria({ user, clienteId, equipo: flow.equipo, cfg, posData: flow.posData, axleCfg: flow.axleCfg, km: flow.km, checklist: flow.checklist, recsInfo: flow.recsInfo, discrepanciasNeumaticos: flow.discrepanciasNeumaticos, recetaEstado: "pendiente" });
          const n = res.alertas;
          if (navigator.onLine) pushToast(n > 0 ? `✓ Auditoría guardada · ${n} alerta${n !== 1 ? "s" : ""} generada${n !== 1 ? "s" : ""}` : "✓ Auditoría guardada");
          else pushToast("📋 Guardado localmente — se sincronizará al reconectar", "amber");
          setFlow(null);
        }} />
    );
  } else if (flow && flow.stage === "cambio") {
    body = (
      <CambioForm user={user} clienteId={clienteId} equipo={flow.equipo} cfg={cfg} axleCfg={flow.axleCfg}
        posDataInicial={flow.posData} checklistInicial={flow.checklist} kmInicial={flow.kmInicial}
        recetaIdInicial={flow.recetaIdInicial} pendiente={flow.pendiente} discrepanciasNeumaticosInicial={flow.discrepanciasNeumaticos}
        onCancel={() => setFlow(null)} onFinish={() => setFlow(null)} />
    );
  } else if (tab === "cierre") {
    body = <CierreDelDia user={user} clienteId={clienteId} onCerrado={() => setJornadaCerrada(true)} />;
  } else if (tab === "alertas") {
    body = <AlertasScreen user={user} clienteId={clienteId} />;
  } else if (tab === "perfil") {
    body = <PerfilScreen user={user} />;
  } else {
    body = <SeleccionEquipo clienteId={clienteId} cfg={cfg} onPick={async (eq) => {
      let vencida = false, enProcesoHoy = false;
      try {
        const info = await db.fetchEstadoAuditoriaEquipo(eq.id_equipo);
        const estado = equipoAuditEstado(info, cfg.meses_vencimiento_auditoria);
        vencida = estado === "vencida" || estado === "sin_auditoria";
      } catch (e) { console.error(e); }
      try {
        const receta = await db.fetchRecetaEnProcesoHoy(eq.id_equipo);
        enProcesoHoy = !!receta;
      } catch (e) { console.error(e); }
      setFlow({ stage: "accion", equipo: eq, estadoInfo: { vencida, enProcesoHoy } });
    }} />;
  }

  const showBottomNav = !flow || flow.stage === "accion";

  return (
    <div>
      <div className="fixed top-2 left-0 right-0 z-40"><OfflineBadge /></div>
      <SyncStatusToast />
      {toastNode}
      {body}
      {showBottomNav && <BottomNav view={tab} setView={(t) => { setTab(t); setFlow(null); }} disabledExcept={jornadaCerrada ? ["alertas", "perfil"] : null} alertasNoLeidas={alertasNoLeidas} />}
      {horasExtrasInfo && (
        <Modal title="⏰ Horas extras" onClose={() => setHorasExtrasInfo(null)}>
          <p className="text-[14px] text-[#374151] mb-5">
            Superaste las {horasExtrasInfo.horasNormal} horas de jornada. A partir de este momento corren horas extras.
          </p>
          <Button className="w-full" onClick={() => setHorasExtrasInfo(null)}>Entendido, continuar</Button>
        </Modal>
      )}
    </div>
  );
}

function PerfilScreen({ user }) {
  const [confirming, setConfirming] = useState(false);
  return (
    <div className="min-h-screen pb-24 px-5 pt-14 safe-top">
      <h1 className="text-[30px] font-extrabold mb-6">Perfil</h1>
      <Card className="mb-6">
        <div className="flex items-center gap-3">
          <div className="w-12 h-12 rounded-full bg-[#F3F4F6] flex items-center justify-center"><Icon.user width="22" height="22" /></div>
          <div>
            <p className="font-bold text-[16px]">{user.nombre} {user.apellido || ""}</p>
            <p className="text-[12.5px] text-muted">Usuario: {user.usuario} · Rol: {user.rol}</p>
          </div>
        </div>
      </Card>
      <Button variant="danger" className="w-full" onClick={() => setConfirming(true)}>Cerrar sesión</Button>
      {confirming && (
        <Confirm title="Cerrar sesión" desc="¿Seguro que querés cerrar tu sesión?"
          onCancel={() => setConfirming(false)}
          onConfirm={() => { clearSession(); location.href = "index.html"; }} />
      )}
    </div>
  );
}

/* =====================================================================
   ENTRADA DE LA PAGINA
   Guarda de sesion: solo mecanicos con sesion valida llegan a MecanicoApp;
   cualquier otro caso (sin sesion, rol distinto, usuario desactivado)
   redirige a index.html.
===================================================================== */
function MecanicoPage() {
  const [user, setUser] = useState(null);
  const [checking, setChecking] = useState(true);

  useEffect(() => {
    const cached = getSession();
    if (!cached || cached.rol !== "mecanico") { location.replace("index.html"); return; }
    db.fetchUsuario(cached.id).then(fresh => {
      if (!fresh || !fresh.activo || fresh.rol !== "mecanico") { clearSession(); location.replace("index.html"); return; }
      setSession(fresh); setUser(fresh); setChecking(false);
    }).catch(() => { setUser(cached); setChecking(false); }); // sin conexion: seguir con la sesion cacheada
  }, []);

  if (checking || !user) return <div className="min-h-screen flex items-center justify-center"><span className="spinner" /></div>;
  return <MecanicoApp user={user} key={user.id} />;
}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<MecanicoPage />);

if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => { navigator.serviceWorker.register("./sw.js").catch(e => console.error("SW registration failed", e)); });
}
</script>
