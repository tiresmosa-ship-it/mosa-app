/* =====================================================================
   MOSA TIRES — kit de UI compartido (JSX). Cargado con Babel en modo
   clásico (sin módulos) antes del script propio de cada página, así que
   todo lo declarado acá (Icon, Button, Card, Modal, BottomNav, hooks...)
   queda disponible como global. Depende de React (CDN) y de
   js/supabase.js (LS, getQueue, db) ya cargados antes que este archivo.
===================================================================== */
const { useState, useEffect, useCallback, createContext, useContext } = React;

/* =====================================================================
   CONTEXTO GLOBAL
===================================================================== */
const AppCtx = createContext(null);
function useApp() { return useContext(AppCtx); }
function useOnline() {
  const [online, setOnline] = useState(navigator.onLine);
  useEffect(() => {
    const on = () => setOnline(true), off = () => setOnline(false);
    window.addEventListener("online", on); window.addEventListener("offline", off);
    return () => { window.removeEventListener("online", on); window.removeEventListener("offline", off); };
  }, []);
  return online;
}
function useQueueCount() {
  const [count, setCount] = useState(getQueue().length);
  useEffect(() => {
    const upd = () => setCount(getQueue().length);
    window.addEventListener("mosa-queue-changed", upd);
    const t = setInterval(upd, 3000);
    return () => { window.removeEventListener("mosa-queue-changed", upd); clearInterval(t); };
  }, []);
  return count;
}
function useAlertasNoLeidas(clienteId, mecanicoId) {
  const [count, setCount] = useState(0);
  const queuePending = useQueueCount();
  useEffect(() => {
    if (!clienteId || !mecanicoId) return;
    let cancel = false;
    const cargar = () => db.fetchAlertas(clienteId, mecanicoId).then(as => { if (!cancel) setCount(as.filter(a => !a.leida_mecanico).length); }).catch(() => {});
    cargar();
    window.addEventListener("mosa-alertas-changed", cargar);
    const t = setInterval(cargar, 15000);
    return () => { cancel = true; window.removeEventListener("mosa-alertas-changed", cargar); clearInterval(t); };
  }, [clienteId, mecanicoId, queuePending]);
  return count;
}

/* =====================================================================
   UI BASICOS
===================================================================== */
function Button({ variant = "primary", className = "", children, ...props }) {
  const base = "h-14 px-5 rounded-2xl font-bold text-[15px] transition active:scale-[0.98] disabled:opacity-50 disabled:active:scale-100 flex items-center justify-center gap-2";
  const variants = {
    primary: "bg-ink text-white",
    ghost: "bg-transparent text-ink border border-bdstrong",
    danger: "bg-[#FEE2E2] text-[#B91C1C]",
    subtle: "bg-[#F3F4F6] text-ink"
  };
  return <button className={cx(base, variants[variant], className)} {...props}>{children}</button>;
}
function Field({ label, required, children, hint }) {
  return (
    <label className="block">
      <span className="block text-[13px] font-semibold text-[#374151] mb-1.5">{label}{required && <span className="text-red-500"> *</span>}</span>
      {children}
      {hint && <span className="block text-xs text-muted mt-1">{hint}</span>}
    </label>
  );
}
function TextInput({ className = "", alert, warn, ...props }) {
  return <input className={cx("w-full h-[52px] px-4 rounded-2xl border bg-[#F3F4F6] border-[#E5E7EB] focus:outline-none focus:ring-2 focus:ring-ink/20 placeholder:text-muted", alert && "field-alert", warn && !alert && "field-warn", className)} {...props} />;
}
function Select({ className = "", children, ...props }) {
  return <select className={cx("w-full h-[52px] px-4 rounded-2xl border bg-[#F3F4F6] border-[#E5E7EB] focus:outline-none focus:ring-2 focus:ring-ink/20", className)} {...props}>{children}</select>;
}
function MarcaSelect({ value, onChange }) {
  const isOtra = value && !MARCAS_NEUMATICOS.slice(0, -1).includes(value);
  const [otra, setOtra] = useState(isOtra ? value : "");
  return (
    <div>
      <Select value={isOtra ? "Otra" : value} onChange={e => { if (e.target.value === "Otra") { onChange(otra); } else { onChange(e.target.value); } }}>
        <option value="">Seleccionar</option>
        {MARCAS_NEUMATICOS.map(m => <option key={m} value={m}>{m}</option>)}
      </Select>
      {isOtra && (
        <TextInput className="mt-2" placeholder="Escribí la marca" value={otra}
          onChange={e => { setOtra(e.target.value); onChange(e.target.value); }} />
      )}
    </div>
  );
}
function TextArea({ className = "", ...props }) {
  return <textarea className={cx("w-full min-h-[90px] px-4 py-3 rounded-2xl border bg-[#F3F4F6] border-[#E5E7EB] focus:outline-none focus:ring-2 focus:ring-ink/20", className)} {...props} />;
}
function Card({ className = "", children }) {
  return <div className={cx("bg-white rounded-card shadow-card border border-bd p-5", className)}>{children}</div>;
}
function Badge({ children, color = "gray" }) {
  const colors = {
    gray: "bg-[#F3F4F6] text-[#374151]", green: "bg-[#DCFCE7] text-[#15803D]",
    red: "bg-[#FEE2E2] text-[#B91C1C]", amber: "bg-[#FEF3C7] text-[#92400E]", black: "bg-ink text-white"
  };
  return <span className={cx("px-3 py-1 rounded-full text-[12px] font-bold", colors[color])}>{children}</span>;
}
function Modal({ title, onClose, children, wide, footer }) {
  return (
    <div className="fixed inset-0 z-50 flex items-end sm:items-center justify-center bg-black/40 p-0 sm:p-4" onClick={(e) => { if (e.target === e.currentTarget && onClose) onClose(); }}>
      <div className={cx("bg-white w-full sm:rounded-card rounded-t-[24px] max-h-[92vh] overflow-y-auto", wide ? "sm:max-w-2xl" : "sm:max-w-md")}>
        <div className="sticky top-0 bg-white border-b border-bd px-5 py-4 flex items-center justify-between z-10">
          <h3 className="text-lg font-extrabold">{title}</h3>
          {onClose && <button onClick={onClose} className="w-9 h-9 rounded-full hover:bg-[#F3F4F6] flex items-center justify-center text-sub"><Icon.close width="18" height="18"/></button>}
        </div>
        <div className="p-5">{children}</div>
        {footer && <div className="sticky bottom-0 bg-white border-t border-bd p-4">{footer}</div>}
      </div>
    </div>
  );
}
function Toast({ msg, onDone, color = "green" }) {
  useEffect(() => { const t = setTimeout(onDone, 2000); return () => clearTimeout(t); }, []);
  const styles = color === "amber" ? { background: "#FEF3C7", color: "#92400E" }
    : color === "red" ? { background: "#FEE2E2", color: "#B91C1C" }
    : { background: "#DCFCE7", color: "#15803D" };
  return (
    <div className="fixed top-4 left-1/2 -translate-x-1/2 z-[80] px-4 py-3 rounded-2xl shadow-lg text-sm font-semibold flex items-center gap-3" style={styles}>
      <span>{msg}</span>
      <button onClick={onDone} className="opacity-60">✕</button>
    </div>
  );
}
function useToasts() {
  const [toasts, setToasts] = useState([]);
  const push = useCallback((msg, color = "green") => setToasts(t => [...t, { id: uuid(), msg, color }]), []);
  const remove = (id) => setToasts(t => t.filter(x => x.id !== id));
  const node = <div>{toasts.map(t => <Toast key={t.id} msg={t.msg} color={t.color} onDone={() => remove(t.id)} />)}</div>;
  return [push, node];
}
function SyncStatusToast() {
  const [state, setState] = useState(null); // null | {type:'syncing'} | {type:'done', failed}
  useEffect(() => {
    let doneTimer;
    const onStart = () => { clearTimeout(doneTimer); setState({ type: "syncing" }); };
    const onDone = (e) => {
      const failed = (e.detail && e.detail.failed) || 0;
      setState({ type: "done", failed });
      doneTimer = setTimeout(() => setState(null), failed > 0 ? 3500 : 2000);
    };
    window.addEventListener("mosa-sync-start", onStart);
    window.addEventListener("mosa-sync-done", onDone);
    return () => { window.removeEventListener("mosa-sync-start", onStart); window.removeEventListener("mosa-sync-done", onDone); clearTimeout(doneTimer); };
  }, []);
  if (!state) return null;
  let bg = "#E5E7EB", color = "#374151", text = "🔄 Sincronizando…";
  if (state.type === "done") {
    if (state.failed === 0) { bg = "#DCFCE7"; color = "#15803D"; text = "✓ Todo sincronizado"; }
    else { bg = "#FEF3C7"; color = "#92400E"; text = `⚠ ${state.failed} registro${state.failed !== 1 ? "s" : ""} no pudieron sincronizarse`; }
  }
  return (
    <div className="fixed top-4 left-1/2 -translate-x-1/2 z-[85] px-4 py-3 rounded-2xl shadow-lg text-sm font-semibold" style={{ background: bg, color }}>
      {text}
    </div>
  );
}
function Confirm({ title, desc, onConfirm, onCancel }) {
  return (
    <Modal title={title} onClose={onCancel}>
      <p className="text-[14px] text-[#374151] mb-5">{desc}</p>
      <div className="flex gap-3">
        <Button variant="subtle" className="flex-1" onClick={onCancel}>Cancelar</Button>
        <Button className="flex-1" onClick={onConfirm}>Confirmar</Button>
      </div>
    </Modal>
  );
}
function OfflineBadge() {
  const online = useOnline();
  const pending = useQueueCount();
  if (online && pending === 0) return null;
  return (
    <div className="px-4">
      {!online && <div className="mb-2 rounded-xl bg-[#FEE2E2] text-[#B91C1C] text-xs font-bold px-3 py-2 text-center">Sin conexión</div>}
      {pending > 0 && <div className="mb-2 rounded-xl bg-[#FEF3C7] text-[#92400E] text-xs font-bold px-3 py-2 text-center">{pending} registro{pending !== 1 ? "s" : ""} pendiente{pending !== 1 ? "s" : ""} de sincronizar</div>}
    </div>
  );
}

===================================================================== */
function BottomNav({ view, setView, disabledExcept, alertasNoLeidas }) {
  const items = [
    { id: "inicio", label: "Inicio", icon: Icon.home },
    { id: "cierre", label: "Cierre", icon: Icon.clipboard },
    { id: "alertas", label: "Alertas", icon: Icon.bell },
    { id: "perfil", label: "Perfil", icon: Icon.user }
  ];
  return (
    <div className="fixed bottom-0 left-0 right-0 bg-white border-t border-bd safe-bottom z-30">
      <div className="flex">
        {items.map(it => {
          const active = view === it.id;
          const disabled = disabledExcept && !disabledExcept.includes(it.id);
          return (
            <button key={it.id} disabled={disabled} onClick={() => setView(it.id)} className={cx("relative flex-1 flex flex-col items-center gap-1 py-2.5", disabled && "opacity-30")}>
              <span className="relative">
                <it.icon width="24" height="24" className={active ? "text-ink" : "text-[#B0B3B8]"} />
                {it.id === "alertas" && alertasNoLeidas > 0 && (
                  <span className="absolute -top-1 -right-2.5 min-w-[16px] h-4 px-1 rounded-full bg-[#EF4444] text-white text-[10px] font-bold flex items-center justify-center">{alertasNoLeidas > 99 ? "99+" : alertasNoLeidas}</span>
                )}
              </span>
              <span className={cx("text-[10.5px] font-semibold", active ? "text-ink" : "text-[#B0B3B8]")}>{it.label}</span>
            </button>
          );
        })}
      </div>
    </div>
  );
}

  const [cliente, setCliente] = useState(null);
  useEffect(() => { db.fetchCliente(user.cliente_id).then(setCliente).catch(() => setCliente({ nombre: user.cliente_id })); }, []);
  function confirmar() {
    localStorage.setItem("empresa_activa_hoy", user.cliente_id);

      <Card className="mb-4">
        <div className="flex items-center gap-3">
          <div className="w-12 h-12 rounded-2xl bg-[#F3F4F6] flex items-center justify-center"><Icon.truck width="24" height="24" /></div>
          <div>
            <p className="font-extrabold text-[16px]">{cliente ? cliente.nombre : "Cargando..."}</p>
            <p className="text-[12.5px] text-muted">Empresa asignada</p>

      <Button className="w-full mb-8" disabled={!cliente} onClick={confirmar}>Confirmar empresa</Button>
    </div>
  );
}

/* =====================================================================
   PANTALLA 2 - BIENVENIDA + CHECK DIARIO
===================================================================== */
function Stepper({ value, onChange }) {
  const [editing, setEditing] = useState(false);
  const [tmp, setTmp] = useState(String(value));
  if (editing) {
    return (
      <input autoFocus inputMode="numeric" pattern="[0-9]*" value={tmp}
        onChange={e => setTmp(e.target.value.replace(/[^0-9]/g, ""))}
        onBlur={() => { setEditing(false); onChange(Math.max(0, parseInt(tmp || "0", 10))); }}
        onKeyDown={e => { if (e.key === "Enter") e.target.blur(); }}
        className="w-14 h-9 text-center rounded-lg border border-bdstrong font-bold" />
    );
  }
  return (
    <div className="flex items-center gap-2">
      <button type="button" disabled={value <= 0} onClick={() => onChange(Math.max(0, value - 1))} className="w-9 h-9 rounded-lg bg-[#F3F4F6] font-bold text-lg disabled:opacity-40">−</button>
      <button type="button" onClick={() => { setTmp(String(value)); setEditing(true); }} className="w-10 text-center font-bold">{value}</button>
      <button type="button" onClick={() => onChange(value + 1)} className="w-9 h-9 rounded-lg bg-[#F3F4F6] font-bold text-lg">+</button>
    </div>
  );
}

function PasoStockNeumaticos({ titulo, stockNeu, toggleStockNeu, setStockNeuVal }) {
  return (
    <div className="px-0 pt-4">
      <p className="font-extrabold text-[17px] mb-3">{titulo}</p>
      <p className="text-[12.5px] text-muted mb-3">Marcá el check para confirmar que revisaste el ítem, aunque tengas 0.</p>
      {BODEGAS_NEU.map(b => (
        <Card key={b.key} className="mb-4">
          <p className="font-bold text-[15px] mb-3">{b.label}</p>
          <div className="space-y-2">
            {TIPOS_NEU.map(t => (
              <div key={t.key} className={cx("bg-white rounded-2xl border shadow-card px-4 py-3 flex items-center gap-3", stockNeu[b.key][t.key].checked ? "border-bd" : "border-[#F59E0B]")}>
                <button type="button" onClick={() => toggleStockNeu(b.key, t.key)} className={cx("w-7 h-7 rounded-lg flex items-center justify-center shrink-0 border", stockNeu[b.key][t.key].checked ? "bg-ink border-ink" : "bg-white border-[#D1D5DB]")}>
                  {stockNeu[b.key][t.key].checked && <Icon.check width="15" height="15" className="text-white" />}
                </button>
                <span className="text-[14px] font-semibold text-[#1F2937] flex-1">{t.label}</span>
                <Stepper value={stockNeu[b.key][t.key].value} onChange={v => setStockNeuVal(b.key, t.key, v)} />
              </div>
            ))}
          </div>
        </Card>
      ))}
    </div>
  );
}
function PasoStockLlantas({ stockPatio, toggleStockPatio, setStockPatioVal, fields }) {
  const campos = fields || PATIO_FIELDS;
  return (
    <div className="px-0 pt-4">
      <p className="font-extrabold text-[17px] mb-3">Stock de llantas</p>
      <p className="text-[12.5px] text-muted mb-3">Marcá el check para confirmar que revisaste el ítem, aunque tengas 0.</p>
      <div className="space-y-2 mb-4">
        {campos.map(f => (
          <div key={f.key} className={cx("bg-white rounded-2xl border shadow-card px-4 py-3 flex items-center gap-3", stockPatio[f.key].checked ? "border-bd" : "border-[#F59E0B]")}>
            <button type="button" onClick={() => toggleStockPatio(f.key)} className={cx("w-7 h-7 rounded-lg flex items-center justify-center shrink-0 border", stockPatio[f.key].checked ? "bg-ink border-ink" : "bg-white border-[#D1D5DB]")}>
              {stockPatio[f.key].checked && <Icon.check width="15" height="15" className="text-white" />}
            </button>
            <span className="text-[14px] font-semibold text-[#1F2937] flex-1">{f.label}</span>
            <Stepper value={stockPatio[f.key].value} onChange={v => setStockPatioVal(f.key, v)} />
          </div>
        ))}
      </div>
    </div>
  );
}

function CheckDiario({ user, clienteId, onDone }) {
  // Requerimiento 3.3: restaurar el borrador (paso + conteos) si el mecanico
  // dejo el check a medias hoy y refresco/volvio a entrar.
  const draftInicial = (() => {
    try {
      const raw = localStorage.getItem(CHECK_DIARIO_DRAFT_KEY(clienteId));
      if (!raw) return null;
      const d = JSON.parse(raw);
      return d && d.fecha === todayISO() ? d : null;
    } catch (e) { return null; }
  })();

  const [step, setStep] = useState(draftInicial ? draftInicial.step : 1);
  // Requerimiento 2: catalogo dinamico (herramientas_inventario de la
  // empresa) en vez de TOOLS_CHECKLIST hardcodeado. Arranca con lo que haya
  // en el borrador o con TOOLS_CHECKLIST como fallback instantaneo (evita
  // pantalla vacia mientras se resuelve el fetch), y se actualiza apenas
  // llega la respuesta del servidor.
  const [catalogo, setCatalogo] = useState(() => (draftInicial && draftInicial.catalogo) || TOOLS_CHECKLIST);
  const [stockNeu, setStockNeu] = useState(() => draftInicial ? draftInicial.stockNeu :
    Object.fromEntries(BODEGAS_NEU.map(b => [b.key, Object.fromEntries(TIPOS_NEU.map(t => [t.key, { value: 0, checked: false }]))])));
  const [stockPatio, setStockPatio] = useState(() => draftInicial ? draftInicial.stockPatio :
    Object.fromEntries(PATIO_FIELDS.map(f => [f.key, { value: 0, checked: false }])));
  const [tools, setTools] = useState(() => draftInicial ? draftInicial.tools :
    Object.fromEntries(catalogo.map(t => [t, { checked: false, cantidad: 0 }])));
  const [toolsExtra, setToolsExtra] = useState(() => draftInicial ? draftInicial.toolsExtra : []);
  const [saving, setSaving] = useState(false);
  const [discrepancias, setDiscrepancias] = useState(null); // null = no evaluado, [] = sin diferencias, [...] = con diferencias
  const [observacion, setObservacion] = useState("");
  const [pushToast, toastNode] = useToasts();

  useEffect(() => {
    fetchHerramientasCatalogo(clienteId).then(list => {
      if (!list || !list.length) return;
      setCatalogo(list);
      // Agrega entradas nuevas al checklist sin pisar lo que el mecanico ya
      // marco (por si el catalogo cambio mientras tenia el check a medias).
      setTools(s => { const next = { ...s }; list.forEach(n => { if (!next[n]) next[n] = { checked: false, cantidad: 0 }; }); return next; });
    }).catch(e => console.error("No se pudo cargar el catálogo de herramientas", e));
  }, [clienteId]);

  // Guarda el borrador en localStorage en cada cambio -- si el mecanico sale
  // sin terminar, al volver hoy lo encuentra tal cual lo dejo.
  useEffect(() => {
    try { localStorage.setItem(CHECK_DIARIO_DRAFT_KEY(clienteId), JSON.stringify({ fecha: todayISO(), step, catalogo, stockNeu, stockPatio, tools, toolsExtra })); } catch (e) {}
  }, [step, catalogo, stockNeu, stockPatio, tools, toolsExtra, clienteId]);

  const stockNeuFilled = BODEGAS_NEU.reduce((n, b) => n + TIPOS_NEU.filter(t => stockNeu[b.key][t.key].checked).length, 0);
  const stockNeuTotal = BODEGAS_NEU.length * TIPOS_NEU.length;
  const toolsFilled = catalogo.filter(t => tools[t] && tools[t].checked).length;
  const stockPatioFilled = PATIO_FIELDS.filter(f => stockPatio[f.key].checked).length;
  const totalItems = catalogo.length + stockNeuTotal + PATIO_FIELDS.length;
  const itemsCompletos = toolsFilled + stockNeuFilled + stockPatioFilled;
  const progress = Math.round((itemsCompletos / totalItems) * 100);
  const paso1Completo = stockNeuFilled === stockNeuTotal;
  const paso2Completo = stockPatioFilled === PATIO_FIELDS.length;
  const paso3Completo = toolsFilled === catalogo.length;
  const complete = paso1Completo && paso2Completo && paso3Completo;

  function setStockNeuVal(bKey, tKey, v) { setStockNeu(s => ({ ...s, [bKey]: { ...s[bKey], [tKey]: { value: v, checked: true } } })); }
  function toggleStockNeu(bKey, tKey) { setStockNeu(s => ({ ...s, [bKey]: { ...s[bKey], [tKey]: { ...s[bKey][tKey], checked: !s[bKey][tKey].checked } } })); }
  function setStockPatioVal(key, v) { setStockPatio(s => ({ ...s, [key]: { value: v, checked: true } })); }
  function toggleStockPatio(key) { setStockPatio(s => ({ ...s, [key]: { ...s[key], checked: !s[key].checked } })); }
  function setToolQty(t, v) { setTools(s => ({ ...s, [t]: { checked: true, cantidad: v } })); }
  function toggleTool(t) { setTools(s => ({ ...s, [t]: { ...s[t], checked: !s[t].checked } })); }
  function agregarHerramientaExtra() { setToolsExtra(l => [...l, { id: uuid(), nombre: "", cantidad: 0 }]); }
  function actualizarHerramientaExtra(id, campo, v) { setToolsExtra(l => l.map(x => x.id === id ? { ...x, [campo]: v } : x)); }
  function quitarHerramientaExtra(id) { setToolsExtra(l => l.filter(x => x.id !== id)); }

  async function continuar() {
    setSaving(true);
    const id = uuid();
    const horaInicio = nowHM();
    const totalBodega = (bKey) => TIPOS_NEU.reduce((n, t) => n + (stockNeu[bKey][t.key].value || 0), 0);
    const totales = { nuevo: totalBodega("nuevos"), transito: totalBodega("transito"), recauchado: totalBodega("recauchados"), reparacion: totalBodega("reparar") };
    const toolsCounted = Object.fromEntries(catalogo.map(t => [t, tools[t].cantidad]));
    const discNeu = {};
    BODEGAS_NEU.forEach(b => TIPOS_NEU.forEach(t => { discNeu[`neu_${t.col}_${b.col}`] = stockNeu[b.key][t.key].value || 0; }));
    const data = {
      id, cliente_id: clienteId, empresa_id: clienteId, bultero_id: user.id, fecha: todayISO(), hora_inicio: horaInicio,
      numero_hoja: uuid().slice(0, 8), completado: true,
      nuevos: totales.nuevo, transito: totales.transito, reparar: totales.reparacion, recauchados: totales.recauchado,
      ...discNeu,
      llantas_am_aluminio: stockPatio.llantas_am_aluminio.value, llantas_am_fierro: stockPatio.llantas_am_fierro.value,
      llantas_eu_aluminio: stockPatio.llantas_eu_aluminio.value, llantas_eu_fierro: stockPatio.llantas_eu_fierro.value,
      herramientas_extra: toolsExtra.filter(x => x.nombre.trim()).map(x => ({ nombre: x.nombre.trim(), cantidad: x.cantidad || 0 })),
      checklist: catalogo.map(t => ({ herramienta: t, cantidad: tools[t].cantidad }))
    };
    pushQueue({ id: uuid(), tipo: "novedad", clienteId, ts: Date.now(), data });
    // Requerimiento 2.2: una herramienta que el mecanico agrego a mano y que
    // no esta en el catalogo oficial le dispara una alerta al Admin para que
    // la revise y la sume (o no) al catalogo — ver aprobarHerramientaNueva.
    data.herramientas_extra.forEach(h => {
      pushQueue({
        id: uuid(), tipo: "alerta", clienteId, ts: Date.now(), data: {
          id: uuid(), cliente_id: clienteId, equipo_id: null, mecanico_id: user.id,
          tipo: "herramienta_nueva", severidad: "amarillo", estado: "nueva",
          titulo: "Nueva herramienta declarada en terreno",
          descripcion: `El mecánico ${user.nombre} agregó la herramienta "${h.nombre}" (Cantidad: ${h.cantidad}) en el Check Diario del ${formatDateLong()}.`,
          datos_extra: { nombre_herramienta: h.nombre, cantidad: h.cantidad, empresa_id: clienteId },
          leida_mecanico: true, leida_admin: false, leida_superadmin: false
        }
      });
    });
    syncQueue();
    setTurno({ clienteId, fecha: todayISO(), checkDone: true });
    localStorage.setItem("check_completado_hoy", "true");
    try { localStorage.removeItem(CHECK_DIARIO_DRAFT_KEY(clienteId)); } catch (e) {}

    try {
      await marcarInicioJornada(clienteId, user.id, todayISO(), horaInicio);
      const [neuDiffs, herrDiffs] = await Promise.all([
        compararInventarioNeumaticos(clienteId, totales),
        compararHerramientasInventario(clienteId, toolsCounted).catch(e => { console.error("No se pudo comparar herramientas", e); return []; })
      ]);
      const neuIds = neuDiffs.length ? await registrarDiscrepancias(clienteId, user.id, todayISO(), neuDiffs) : [];
      if (herrDiffs.length) await registrarDiscrepanciasHerramientas(clienteId, user.id, todayISO(), herrDiffs);
      if (neuDiffs.length || herrDiffs.length) {
        setDiscrepancias({
          diffs: [...neuDiffs, ...herrDiffs.map(d => ({ bucket: d.nombre, label: d.nombre, sistema: d.sistema, fisico: d.fisico }))],
          ids: neuIds
        });
        setSaving(false);
        return;
      }
    } catch (e) { console.error("No se pudo comparar el inventario", e); }

    pushToast(navigator.onLine ? "✓ Check diario completado" : "📋 Guardado localmente — se sincronizará al reconectar", navigator.onLine ? "green" : "amber");
    setSaving(false);
    setTimeout(onDone, 700);
  }

  if (discrepancias) {
    return (
      <div className="min-h-screen flex flex-col px-6 pt-16 safe-top">
        {toastNode}
        <div className="w-14 h-14 rounded-2xl bg-[#FEE2E2] flex items-center justify-center mb-5 text-2xl">⚠</div>
        <h1 className="text-[22px] font-extrabold leading-tight mb-2">Tu conteo difiere del inventario registrado</h1>
        <p className="text-[13.5px] text-sub mb-5">Podés seguir trabajando igual. Se le enviará una alerta a tu supervisor.</p>
        <div className="space-y-2 mb-5">
          {discrepancias.diffs.map(d => (
            <div key={d.bucket} className="bg-[#FEF3C7] rounded-2xl px-4 py-3">
              <p className="font-bold text-[14px] text-[#92400E]">{d.label}</p>
              <p className="text-[12.5px] text-[#92400E]">Sistema: {d.sistema} · Contado: {d.fisico}</p>
            </div>
          ))}
        </div>
        <Field label="Observación (opcional)">
          <TextArea placeholder="Contanos si sabés por qué difiere..." value={observacion} onChange={e => setObservacion(e.target.value)} />
        </Field>
        <div className="flex-1" />
        <Button className="w-full mt-5 mb-8" onClick={() => { guardarObservacionDiscrepancia(discrepancias.ids, observacion).catch(() => {}); onDone(); }}>Entendido, continuar</Button>
      </div>
    );
  }

  return (
    <div className="min-h-screen pb-28 px-5 safe-top">
      {toastNode}
      {/* Regla 1: header de progreso sin tocar -- mismo componente/markup de
          siempre, ahora comun a los 3 pasos. */}
      <div className="sticky top-0 z-30 bg-white px-5 pt-14 pb-3">
        <p className="text-[14px] text-muted mb-1">{formatDateLong()}</p>
        <h1 className="text-[30px] font-extrabold leading-none">Hola, {user.nombre}</h1>
        <p className="text-[14px] text-sub mt-2 mb-4">Para iniciar tenés que completar el check del día — Paso {step} de 3</p>
        <div className="bg-[#F9FAFB] rounded-[20px] p-5">
          <div className="flex items-center justify-between mb-2">
            <span className="font-bold text-[16px]">Progreso del check</span>
            <span className="text-[13px] font-bold">{itemsCompletos}/{totalItems}</span>
          </div>
          <div className="h-2 rounded-full bg-[#E5E7EB] overflow-hidden">
            <div className="h-full bg-ink transition-all" style={{ width: progress + "%" }} />
          </div>
        </div>
      </div>

      {step === 1 && (
        <>
          <PasoStockNeumaticos titulo="Paso 1 · Stock de neumáticos" stockNeu={stockNeu} toggleStockNeu={toggleStockNeu} setStockNeuVal={setStockNeuVal} />
          <Button className="w-full mb-4" onClick={() => setStep(2)}>Continuar</Button>
        </>
      )}

      {step === 2 && (
        <>
          <PasoStockLlantas stockPatio={stockPatio} toggleStockPatio={toggleStockPatio} setStockPatioVal={setStockPatioVal} />
          <div className="flex gap-3 mb-4">
            <Button variant="subtle" className="flex-1" onClick={() => setStep(1)}>Volver</Button>
            <Button className="flex-1" onClick={() => setStep(3)}>Continuar</Button>
          </div>
        </>
      )}

      {step === 3 && (
        <div className="px-0 pt-4">
          <p className="font-bold text-[15px] mb-2">Paso 3 · Checklist de herramientas</p>
          <p className="text-[12.5px] text-muted mb-3">Marcá el check para confirmar que revisaste la herramienta, aunque tengas 0.</p>
          <div className="space-y-2 mb-4">
            {catalogo.map(t => tools[t] && (
              <div key={t} className={cx("bg-white rounded-2xl border shadow-card px-4 py-3 flex items-center gap-3", tools[t].checked ? "border-bd" : "border-[#F59E0B]")}>
                <button type="button" onClick={() => toggleTool(t)} className={cx("w-7 h-7 rounded-lg flex items-center justify-center shrink-0 border", tools[t].checked ? "bg-ink border-ink" : "bg-white border-[#D1D5DB]")}>
                  {tools[t].checked && <Icon.check width="15" height="15" className="text-white" />}
                </button>
                <span className="text-[14px] font-semibold text-[#1F2937] flex-1">{t}</span>
                <Stepper value={tools[t].cantidad} onChange={v => setToolQty(t, v)} />
              </div>
            ))}
          </div>

          <p className="font-bold text-[15px] mb-2">Herramientas extra</p>
          <div className="space-y-2 mb-2">
            {toolsExtra.map(x => (
              <div key={x.id} className="bg-white rounded-2xl border border-bd shadow-card px-4 py-3 flex items-center gap-2">
                <TextInput placeholder="Nombre" value={x.nombre} onChange={e => actualizarHerramientaExtra(x.id, "nombre", e.target.value)} className="h-11 flex-1" />
                <Stepper value={x.cantidad} onChange={v => actualizarHerramientaExtra(x.id, "cantidad", v)} />
                <button type="button" onClick={() => quitarHerramientaExtra(x.id)} className="w-9 h-9 rounded-lg bg-[#FEE2E2] flex items-center justify-center shrink-0"><Icon.trash width="15" height="15" className="text-[#B91C1C]" /></button>
              </div>
            ))}
          </div>
          <button type="button" onClick={agregarHerramientaExtra} className="w-full h-11 rounded-2xl border border-dashed border-bdstrong text-[13.5px] font-bold text-muted mb-6">+ Agregar Herramienta Extra</button>

          <div className="flex gap-3 mb-4">
            <Button variant="subtle" className="flex-1" onClick={() => setStep(2)}>Volver</Button>
          </div>
        </div>
      )}

      {step === 3 && (
        <div className="fixed bottom-0 left-0 right-0 bg-white border-t border-bd p-4 safe-bottom">
          <Button className="w-full" disabled={!complete || saving} onClick={continuar}>
            {saving ? <span className="spinner" /> : "Finalizar e Iniciar Jornada"}
          </Button>
          {!complete && <p className="text-center text-[12px] text-muted mt-2">Completá el conteo de neumáticos, llantas y confirmá las {catalogo.length} herramientas</p>}
        </div>
      )}
    </div>
  );
}

/* =====================================================================
   PANTALLA 3 - SELECCION DE EQUIPO
===================================================================== */
function SeleccionEquipo({ clienteId, cfg, onPick }) {
  const [equipos, setEquipos] = useState(() => getCache(LS.equipos(clienteId), []));
  const [estadosByEquipo, setEstadosByEquipo] = useState({});
  const [filter, setFilter] = useState("todos");
  const [search, setSearch] = useState("");
  const [loading, setLoading] = useState(true);

  useEffect(() => {
    let cancel = false;
    (async () => {
      try {
        const eqs = await db.fetchEquipos(clienteId);
        if (cancel) return;
        setEquipos(eqs);
        const estados = await db.fetchEstadoAuditorias(clienteId);
        if (!cancel) setEstadosByEquipo(estados);
      } catch (e) { console.error(e); } finally { if (!cancel) setLoading(false); }
    })();
    return () => { cancel = true; };
  }, [clienteId]);

  const filtered = equipos.filter(eq => {
    const estado = equipoAuditEstado(estadosByEquipo[eq.id_equipo], cfg.meses_vencimiento_auditoria);
    if (filter !== "todos" && filter !== estado) return false;
    if (search) {
      const s = search.toLowerCase();
      if (!(eq.patente || "").toLowerCase().includes(s) && !(eq.numero_interno || "").toLowerCase().includes(s)) return false;
    }
    return true;
  });

  return (
    <div className="min-h-screen pb-24 px-5 pt-14 safe-top">
      <div className="flex items-center justify-between mb-4">
        <h1 className="text-[30px] font-extrabold">Equipos</h1>
        <div className="w-10 h-10 rounded-full bg-[#F3F4F6] flex items-center justify-center"><Icon.search width="18" height="18" /></div>
      </div>
      <TextInput placeholder="Buscar por patente o número interno" value={search} onChange={e => setSearch(e.target.value)} className="mb-4" />
      <div className="flex gap-2 mb-5 overflow-x-auto">
        {[["todos", "Todos"], ["al_dia", "Al día"], ["abierta", "Aud. Abierta"], ["vencida", "Aud. Vencida"], ["sin_auditoria", "Sin Auditoría"]].map(([k, l]) => (
          <button key={k} onClick={() => setFilter(k)} className={cx("px-4 py-2 rounded-full text-[13px] font-bold whitespace-nowrap", filter === k ? "bg-ink text-white" : "bg-[#F3F4F6] text-[#374151]")}>{l}</button>
        ))}
      </div>
      {loading && <div className="flex justify-center py-10"><span className="spinner" /></div>}
      <div className="space-y-3">
        {filtered.map(eq => {
          const estado = equipoAuditEstado(estadosByEquipo[eq.id_equipo], cfg.meses_vencimiento_auditoria);
          return (
            <button key={eq.id_equipo} onClick={() => onPick(eq)} className="w-full text-left bg-white rounded-[20px] border border-bd shadow-card p-4 flex items-center gap-3">
              <div className="w-[52px] h-[52px] rounded-2xl bg-[#F3F4F6] flex items-center justify-center shrink-0"><Icon.truck width="26" height="26" /></div>
              <div className="flex-1 min-w-0">
                <p className="font-bold text-[15.5px] truncate">{eq.numero_interno ? `${eq.numero_interno} · ` : ""}{eq.patente}</p>
                <p className="text-[12.5px] text-muted truncate">{eq.tipo === "SEMI" ? "Semirremolque" : `Tracto ${eq.configuracion_ejes || ""}`} · {eq.modelo || ""}</p>
              </div>
              <Badge color={equipoAuditColor(estado)}>{equipoAuditLabel(estado)}</Badge>
            </button>
          );
        })}
        {!loading && filtered.length === 0 && <p className="text-center text-muted py-10 text-sm">No hay equipos que coincidan.</p>}
      </div>
    </div>
  );
}

function AccionEquipo({ equipo, estadoInfo, onClose, onAuditoria, onContinuarCambio }) {
  return (
    <Modal title={`${equipo.numero_interno || ""} · ${equipo.patente}`} onClose={onClose}>

        <Button className="w-full" variant={estadoInfo && estadoInfo.vencida ? "danger" : "primary"} onClick={onAuditoria}><Icon.audit width="20" height="20" /> Auditoría</Button>
        {estadoInfo && estadoInfo.enProcesoHoy && (
          <Button variant="subtle" className="w-full" onClick={onContinuarCambio}><Icon.swap width="20" height="20" /> Continuar hoja de cambio</Button>
        )}
      </div>
    </Modal>
  );
}

function TireCircle({ pos, filled, status, mm, psi, fuego, selected, onTap, dragHandlers, desgasteIrregular, pendienteAprobacion, alargadera, checkpoint }) {
  const styles = {
    empty: "border-2 border-dashed border-[#D1D5DB] bg-[#F9FAFB] text-muted",
    ok: "border-2 border-[#D1D5DB] bg-white text-ink",
    atencion: "border-2 border-[#F59E0B] bg-[#FEF3C7] text-[#92400E]",
    alerta: "border-2 border-[#EF4444] bg-[#FEE2E2] text-[#B91C1C]"
  };
  const key = !filled ? "empty" : (status || "ok");
  return (
    <button type="button" data-pos={pos} onClick={onTap} {...dragHandlers}
      style={dragHandlers ? { touchAction: "none" } : undefined}
      className={cx("relative w-[54px] h-[54px] rounded-full flex flex-col items-center justify-center shrink-0 shadow-sm transition",
        styles[key], selected && "ring-2 ring-ink anim-blink")}>
      {filled && desgasteIrregular && <span className="absolute -top-1.5 -right-1 text-[13px] leading-none">⚠️</span>}
      {filled && pendienteAprobacion && <span className="absolute -bottom-1 -right-1 text-[13px] leading-none">🔒</span>}
      {filled && (alargadera || checkpoint) && (
        <span className="absolute -bottom-1 -left-1 flex gap-0.5 text-[10px] leading-none">
          {alargadera && <span title="Alargadera colocada">🔘</span>}
          {checkpoint && <span title="Checkpoint colocado">✅</span>}
        </span>
      )}
      <span className="text-[9.5px] font-bold opacity-70 leading-none">P{pos}</span>
      {filled ? (
        <>
          <span className="text-[13px] font-extrabold leading-none mt-0.5">{mm != null ? mm : "—"}</span>
          <span className="text-[8.5px] font-semibold opacity-70 leading-none">{psi ? psi + "psi" : ""}</span>
        </>
      ) : <span className="text-[11px] font-bold text-[#D1D5DB] mt-0.5">— —</span>}
    </button>
  );
}

function AxleMap({ cfg, posData, selectedPos, onTap, getDragHandlers, pendientesPos }) {
  return (
    <div className="space-y-6">
      {cfg.rows.map(row => (
        <div key={row.label} className={cx("relative", row.type === "auxilio" && "mt-4 pt-4 border-t border-dashed border-bdstrong")}>
          <div className="flex items-center gap-3">
            <span className="text-[12px] font-bold text-muted w-6 shrink-0">{row.label}</span>
            <div className="flex-1 relative flex items-center justify-around">
              <div className="absolute left-0 right-0 h-[1.5px] bg-[#E5E7EB]" />
              {row.positions.map(p => {
                const d = posData[p] || {};
                return (
                  <div key={p} className="relative z-10">
                    <TireCircle pos={p} filled={d.posicion != null} status={d.status} mm={d.minMM} psi={d.psi} fuego={d.numero_fuego}
                      selected={selectedPos === p} onTap={() => onTap(p)}
                      dragHandlers={getDragHandlers ? getDragHandlers(p) : undefined}
                      desgasteIrregular={d.tipo_desgaste === "irregular"}
                      pendienteAprobacion={!!(pendientesPos && pendientesPos.has(p))}
                      alargadera={!!d.alargadera} checkpoint={!!d.checkpoint} />
                  </div>
                );
              })}
            </div>
          </div>
        </div>
      ))}
    </div>
  );
}

function GhostTire({ x, y }) {

      style={{ left: x, top: y, background: "#111", border: "3px solid #333" }}>

}

/* =====================================================================
   PANTALLA 4 - AUDITORIA
===================================================================== */
function KmModal({ equipo, clienteId, mecanicoId, km, setKm, onContinue }) {
  const kmActual = equipo.kilometros;
  const kmNum = parseInt(km, 10);
  const menor = km !== "" && !isNaN(kmNum) && kmActual != null && kmNum < kmActual;
  const igual = km !== "" && !isNaN(kmNum) && kmActual != null && kmNum === kmActual;
  const [confirmandoIgual, setConfirmandoIgual] = useState(false);

  function intentarContinuar() {
    if (menor) return;
    if (igual) { setConfirmandoIgual(true); return; }
    onContinue();
  }
  function confirmarIgual() {
    pushQueue({
      id: uuid(), tipo: "alerta", clienteId, ts: Date.now(), data: {
        id: uuid(), cliente_id: clienteId, equipo_id: equipo.id_equipo, mecanico_id: mecanicoId,
        tipo: "km_repetidos", severidad: "amarillo", titulo: `KM repetidos — ${equipo.patente}`,
        descripcion: `El mecánico ingresó los mismos km que el registro anterior: ${km}`,
        leida_mecanico: true, leida_admin: false, leida_superadmin: false
      }
    });
    syncQueue();
    setConfirmandoIgual(false);
    onContinue();
  }

  return (
    <Modal title="Kilometraje actual">
      <Field label="Kilómetros" required>
        <TextInput type="number" inputMode="numeric" value={km} alert={menor} onChange={e => setKm(e.target.value.replace(/[^0-9]/g, ""))} placeholder="Ingresá los km actuales" />
      </Field>
      {menor && <p className="text-[12.5px] font-bold text-[#B91C1C] mt-2">Los km ingresados son menores al último registro. Verificá el odómetro.</p>}
      {igual && !confirmandoIgual && <p className="text-[12.5px] font-bold text-[#92400E] mt-2">⚠ Los km son iguales al último registro. ¿Estás seguro?</p>}
      <Button className="w-full mt-5" disabled={!km || menor} onClick={intentarContinuar}>Continuar</Button>
      {confirmandoIgual && (
        <Confirm title="KM repetidos" desc={`Ingresaste ${km} km, igual al último registro. ¿Confirmás que es correcto?`}
          onConfirm={confirmarIgual} onCancel={() => setConfirmandoIgual(false)} />
      )}
    </Modal>
  );
}

function TareasPendientesModal({ pendientes, onSumar, onSoloHoy }) {
  return (
    <Modal title="Tenés tareas sin terminar">
      <p className="text-[13.5px] text-sub mb-4">Tenés tareas sin terminar de auditorías anteriores de este equipo.</p>
      <div className="space-y-3 mb-5">
        {pendientes.map(p => {
          const fecha = p.auditorias ? p.auditorias.fecha : null;
          const tareas = tareasIncompletasDeReceta(p);
          return (
            <div key={p.id} className="bg-[#FEF3C7] rounded-2xl px-4 py-3">
              <p className="font-bold text-[13.5px] text-[#92400E]">Auditoría {fecha ? formatDateLong(fecha) : "—"}</p>
              <p className="text-[12.5px] text-[#92400E] mt-1">{tareas.length} tarea{tareas.length !== 1 ? "s" : ""} pendiente{tareas.length !== 1 ? "s" : ""}{tareas.length ? ": " + tareas.join(", ") : ""}</p>
            </div>
          );
        })}
      </div>
      <p className="text-[14px] text-[#374151] mb-5">¿Querés sumar estas tareas al instructivo de hoy?</p>
      <div className="space-y-3">
        <Button className="w-full" onClick={onSumar}>Sí, sumar tareas</Button>
        <Button variant="ghost" className="w-full" onClick={onSoloHoy}>No, solo las de hoy</Button>
      </div>
    </Modal>
  );
}

function AuditoriaForm({ user, clienteId, equipo, cfg, onCancel, onGenerarInstructivo }) {
  const [frioConfirmado, setFrioConfirmado] = useState(false);
  const [km, setKm] = useState("");
  const [kmSet, setKmSet] = useState(false);
  const axleCfg = axleConfigFor(equipo);
  const allPositions = axleCfg.rows.flatMap(r => r.positions);
  const [posData, setPosData] = useState({});
  const [editingPos, setEditingPos] = useState(null);
  const [generando, setGenerando] = useState(false);
  const [pendientesAnteriores, setPendientesAnteriores] = useState(null); // null = sin chequear
  const startedAt = useRef(Date.now());

  async function generarInstructivo() {
    setGenerando(true);
    try {
      if (pendientesAnteriores === null) {
        const pend = await db.fetchTareasPendientesAnteriores(equipo.id_equipo).catch(() => []);
        if (pend && pend.length) { setPendientesAnteriores(pend); setGenerando(false); return; }
      }
      await onGenerarInstructivo(posData, axleCfg, km, startedAt.current, []);
    } catch (e) { setGenerando(false); }
  }
  async function confirmarSumarTareas() {
    const fecha = pendientesAnteriores[0] && pendientesAnteriores[0].auditorias ? pendientesAnteriores[0].auditorias.fecha : null;
    const tareasExtra = [];
    pendientesAnteriores.forEach(p => {
      const f = p.auditorias ? p.auditorias.fecha : fecha;
      tareasIncompletasDeReceta(p).forEach(texto => tareasExtra.push({ texto, origen: f }));
    });
    db.marcarRecetasSinCambio(pendientesAnteriores.map(p => p.id)).catch(e => console.error(e));
    setPendientesAnteriores([]);
    setGenerando(true);
    try { await onGenerarInstructivo(posData, axleCfg, km, startedAt.current, tareasExtra); } catch (e) { setGenerando(false); }
  }
  async function confirmarSoloHoy() {
    setPendientesAnteriores([]);
    setGenerando(true);
    try { await onGenerarInstructivo(posData, axleCfg, km, startedAt.current, []); } catch (e) { setGenerando(false); }
  }

  function abrirPosicion(p) { setEditingPos(p); }

  function guardarPosicion(p, data) {
    const ev = evaluarPosicion(axleCfg, cfg, p, equipo.tipo, data);
    if (data.marca_modelo_no_registrado) {
      pushQueue({
        id: uuid(), tipo: "alerta", clienteId, ts: Date.now(), data: {
          id: uuid(), cliente_id: clienteId, equipo_id: equipo.id_equipo, mecanico_id: user.id,
          tipo: "marca_modelo_no_registrado", severidad: "amarillo",
          titulo: `Marca/modelo no registrado — ${equipo.patente} pos ${p}`,
          descripcion: `El mecánico ingresó ${data.marca || ""} ${data.modelo || ""} que no está en el catálogo del cliente`,
          posicion: p, numero_fuego: data.numero_fuego || null,
          leida_mecanico: true, leida_admin: false, leida_superadmin: false
        }
      });
      syncQueue();
    }
    // Requerimiento 2.2: medida ingresada como "Otra" (no esta en
    // config_cliente.medidas_permitidas) -- avisa al Admin para que la
    // revise y, si corresponde, la sume a la lista estandar de la faena.
    if (data.medida_no_registrada && (data.medida || "").trim()) {
      pushQueue({
        id: uuid(), tipo: "alerta", clienteId, ts: Date.now(), data: {
          id: uuid(), cliente_id: clienteId, equipo_id: equipo.id_equipo, mecanico_id: user.id,
          tipo: "marca_modelo_no_registrado", severidad: "amarillo",
          titulo: "Medida de neumático no estandarizada",
          descripcion: `El mecánico ${user.nombre} ingresó manualmente la medida ${data.medida} en el equipo ${equipo.patente} pos ${p}, la cual no está en la lista estándar.`,
          posicion: p, numero_fuego: data.numero_fuego || null,
          leida_mecanico: true, leida_admin: false, leida_superadmin: false
        }
      });
      syncQueue();
    }
    setPosData(s => ({ ...s, [p]: { ...data, posicion: p, status: ev.status, minMM: ev.minMM, motivos: ev.motivos } }));
    setEditingPos(null);
  }

  const completas = allPositions.filter(p => posData[p] && posData[p].posicion != null).length;
  const todasCompletas = completas === allPositions.length;

  if (!frioConfirmado) {
    return (
      <Modal title="Antes de empezar">
        <p className="text-[14px] text-[#374151] mb-2">Las presiones de aire deben controlarse en frío. ¿Confirmás que los neumáticos están fríos?</p>
        <p className="text-[14px] text-[#374151] mb-2">Recordá los mm mínimos de retiro: Tracto: {cfg.mm_minimo_tracto}mm · Semi: {cfg.mm_minimo_semi}mm · Auxilio: {cfg.mm_minimo_auxilio}mm</p>
        <p className="text-[14px] text-[#374151] mb-5">Presiones estándar de la faena: Direccionales: {cfg.psi_delantero ?? DEFAULT_CFG.psi_delantero} PSI | Traccionales: {cfg.psi_traccion ?? DEFAULT_CFG.psi_traccion} PSI</p>
        <div className="flex gap-3">
          <Button variant="subtle" className="flex-1" onClick={onCancel}>Cancelar</Button>
          <Button className="flex-1" onClick={() => setFrioConfirmado(true)}>Confirmar</Button>
        </div>
      </Modal>
    );
  }
  if (!kmSet) {
    return <KmModal equipo={equipo} clienteId={clienteId} mecanicoId={user.id} km={km} setKm={setKm} onContinue={() => setKmSet(true)} />;
  }

  return (
    <div className="min-h-screen pb-40 px-5 pt-14 safe-top">
      <div className="flex items-center gap-3 mb-1">
        <button onClick={onCancel} className="w-9 h-9 rounded-full bg-[#F3F4F6] flex items-center justify-center"><Icon.back width="18" height="18" /></button>
        <div>
          <h1 className="text-[20px] font-extrabold">Auditoría · {equipo.patente}</h1>
          <p className="text-[12.5px] text-muted">{equipo.tipo === "SEMI" ? "Semirremolque" : `Tracto ${equipo.configuracion_ejes}`} · {axleCfg.total} posiciones</p>
        </div>
      </div>

      <Card className="mt-6 mb-4">
        <p className="text-[13px] mb-4"><span className="font-bold">{equipo.numero_interno ? equipo.numero_interno + " · " : ""}{equipo.patente}</span> <span className="text-muted">· {equipo.configuracion_ejes || "semi"} · Interno {equipo.numero_interno || "-"}</span></p>
        <AxleMap cfg={axleCfg} posData={posData} selectedPos={editingPos} onTap={abrirPosicion} />
      </Card>

      <p className="text-[12.5px] text-muted px-1">{completas}/{allPositions.length} posiciones cargadas</p>

      <div className="fixed bottom-0 left-0 right-0 bg-white border-t border-bd p-4 safe-bottom z-30">
        <Button className="w-full" disabled={!todasCompletas || generando} onClick={generarInstructivo}>
          {generando ? <span className="spinner" /> : "Generar Instructivo"}
        </Button>
      </div>

      {editingPos != null && (
        <PosicionModal
          pos={editingPos} equipo={equipo} cfg={cfg} clienteId={clienteId} axleCfg={axleCfg}
          existing={posData[editingPos]}
          onClose={() => setEditingPos(null)}
          onSave={(data) => guardarPosicion(editingPos, data)}
        />
      )}

      {pendientesAnteriores && pendientesAnteriores.length > 0 && (
        <TareasPendientesModal pendientes={pendientesAnteriores} onSumar={confirmarSumarTareas} onSoloHoy={confirmarSoloHoy} />
      )}
    </div>
  );
}

// Marca/Modelo con dropdown del catalogo del cliente (marcas_modelos_cliente)
// en vez de texto libre. Si el catalogo esta vacio para el cliente, cae a
// texto libre sin generar alertas. Si el mecanico elige "+ Otra marca"/"+
// Otro modelo", el campo se vuelve texto libre y se marca noRegistrado=true
// para que el llamador genere la alerta al guardar. Compartido entre el
// modal de posicion de la auditoria (PosicionModal) y el modal de montaje
// de la hoja de cambio (MontajeModal).
function MarcaModeloAuditoriaField({ clienteId, marca, modelo, onChange }) {
  const [catalogo, setCatalogo] = useState(null); // null = cargando
  const [otraMarca, setOtraMarca] = useState(false);
  const [otroModelo, setOtroModelo] = useState(false);
  useEffect(() => { db.fetchMarcasModelosCliente(clienteId).then(setCatalogo).catch(() => setCatalogo([])); }, [clienteId]);

  if (catalogo === null) {
    return (
      <>
        <Field label="Marca"><TextInput disabled placeholder="Cargando..." /></Field>
        <Field label="Modelo"><TextInput disabled placeholder="Cargando..." /></Field>
      </>
    );
  }
  const activos = catalogo.filter(c => c.activo);
  if (!activos.length) {
    return (
      <>
        <Field label="Marca"><TextInput placeholder="Marca" value={marca} onChange={e => onChange(e.target.value, modelo, false)} /></Field>
        <Field label="Modelo"><TextInput placeholder="Modelo" value={modelo} onChange={e => onChange(marca, e.target.value, false)} /></Field>
      </>
    );
  }
  const marcas = [...new Set(activos.map(c => c.marca))].sort();
  const marcaEsOtra = otraMarca || (marca && !marcas.includes(marca));
  const modelos = marca && !marcaEsOtra ? [...new Set(activos.filter(c => c.marca === marca).map(c => c.modelo))].sort() : [];
  const modeloEsOtro = otroModelo || (modelo && !marcaEsOtra && modelos.length && !modelos.includes(modelo));

  return (
    <>
      <Field label="Marca">
        {marcaEsOtra ? (
          <TextInput placeholder="Escribí la marca" value={marca} onChange={e => onChange(e.target.value, modelo, true)} />
        ) : (
          <Select value={marca} onChange={e => {
            const v = e.target.value;
            if (v === "__otra__") { setOtraMarca(true); onChange("", "", true); }
            else { setOtraMarca(false); setOtroModelo(false); onChange(v, "", false); }
          }}>
            <option value="">Seleccionar</option>
            {marcas.map(m => <option key={m} value={m}>{m}</option>)}
            <option value="__otra__">+ Otra marca</option>
          </Select>
        )}
      </Field>
      <Field label="Modelo">
        {marcaEsOtra || modeloEsOtro ? (
          <TextInput placeholder="Escribí el modelo" value={modelo} disabled={!marca} onChange={e => onChange(marca, e.target.value, true)} />
        ) : (
          <Select value={modelo} disabled={!marca} onChange={e => {
            const v = e.target.value;
            if (v === "__otro__") { setOtroModelo(true); onChange(marca, "", true); }
            else { setOtroModelo(false); onChange(marca, v, marcaEsOtra); }
          }}>
            <option value="">Seleccionar</option>
            {modelos.map(m => <option key={m} value={m}>{m}</option>)}
            <option value="__otro__">+ Otro modelo</option>
          </Select>
        )}
      </Field>
    </>
  );
}

// Requerimiento 2: selector de medidas de config_cliente.medidas_permitidas
// con opcion "Otra" para texto libre. isManual lo decide el llamador (se
// prende solo o al tocar "Otra") -- asi el form del padre siempre sabe si la
// medida ingresada es no estandar, para poder disparar la alerta al guardar.
function MedidaField({ cfg, value, isManual, onChange }) {
  const opciones = (cfg.medidas_permitidas && cfg.medidas_permitidas.length) ? cfg.medidas_permitidas : DEFAULT_CFG.medidas_permitidas;
  return (
    <Field label="Medida">
      <Select value={isManual ? "__otra__" : value} onChange={e => {
        const v = e.target.value;
        if (v === "__otra__") onChange("", true);
        else onChange(v, false);
      }}>
        <option value="">Seleccionar</option>
        {opciones.map(m => <option key={m} value={m}>{m}</option>)}
        <option value="__otra__">Otra</option>
      </Select>
      {isManual && <TextInput className="mt-2" placeholder="Ingresá la medida" value={value} onChange={e => onChange(e.target.value, true)} autoFocus />}
    </Field>
  );
}
function PosicionModal({ pos, equipo, cfg, clienteId, axleCfg, existing, onClose, onSave }) {
  const [form, setForm] = useState(() => existing || { numero_fuego: "", marca: "", modelo: "", medida: cfg.medida_default || "", psi: "", mm_borde_izq: "", mm_centro: "", mm_borde_der: "", tipo_desgaste: "normal", marca_modelo_no_registrado: false, medida_no_registrada: false });
  const medidasOpciones = (cfg.medidas_permitidas && cfg.medidas_permitidas.length) ? cfg.medidas_permitidas : DEFAULT_CFG.medidas_permitidas;
  const medidaEsManual = form.medida_no_registrada || (!!form.medida && !medidasOpciones.includes(form.medida));
  const ev = evaluarPosicion(axleCfg, cfg, pos, equipo.tipo, form);
  const mmAlert = ["mm_borde_izq", "mm_centro", "mm_borde_der"].some(k => form[k] !== "" && parseFloat(form[k]) < ev.mmMin);
  const mmWarn = ["mm_borde_izq", "mm_centro", "mm_borde_der"].some(k => form[k] !== "" && parseFloat(form[k]) < ev.mmAmarillo);
  const psiVal = parseFloat(form.psi);
  const psiAlert = form.psi !== "" && Math.abs(psiVal - ev.psiObjetivo) > (ev.psiObjetivo * cfg.psi_tolerancia_pct / 100) * 2;
  const psiWarn = form.psi !== "" && Math.abs(psiVal - ev.psiObjetivo) > (ev.psiObjetivo * cfg.psi_tolerancia_pct / 100);

  return (
    <Modal title={`Posición P${pos}`} onClose={onClose}>
      <div className="space-y-4">
        <Field label="N° de fuego">
          <TextInput inputMode="numeric" value={form.numero_fuego} onChange={e => setForm(f => ({ ...f, numero_fuego: e.target.value.replace(/[^0-9]/g, "") }))} className="font-extrabold" placeholder="N° de fuego" />
        </Field>
        <div className="grid grid-cols-2 gap-3">
          <MarcaModeloAuditoriaField clienteId={clienteId} marca={form.marca} modelo={form.modelo}
            onChange={(marca, modelo, noRegistrado) => setForm(f => ({ ...f, marca, modelo, marca_modelo_no_registrado: noRegistrado }))} />
        </div>
        <MedidaField cfg={cfg} value={form.medida} isManual={medidaEsManual} onChange={(v, manual) => setForm(f => ({ ...f, medida: v, medida_no_registrada: manual }))} />
        <Field label="PSI" required>
          <TextInput type="number" inputMode="numeric" value={form.psi} alert={psiAlert} warn={psiWarn}
            onChange={e => setForm(f => ({ ...f, psi: e.target.value }))} placeholder={`Objetivo ${ev.psiObjetivo}`} />
        </Field>
        <div className="grid grid-cols-3 gap-2">
          <Field label="MM izq" required><TextInput type="number" step="0.1" value={form.mm_borde_izq} alert={form.mm_borde_izq !== "" && parseFloat(form.mm_borde_izq) < ev.mmMin} warn={form.mm_borde_izq !== "" && parseFloat(form.mm_borde_izq) < ev.mmAmarillo} onChange={e => setForm(f => ({ ...f, mm_borde_izq: e.target.value }))} /></Field>
          <Field label="MM centro" required><TextInput type="number" step="0.1" value={form.mm_centro} alert={form.mm_centro !== "" && parseFloat(form.mm_centro) < ev.mmMin} warn={form.mm_centro !== "" && parseFloat(form.mm_centro) < ev.mmAmarillo} onChange={e => setForm(f => ({ ...f, mm_centro: e.target.value }))} /></Field>
          <Field label="MM der" required><TextInput type="number" step="0.1" value={form.mm_borde_der} alert={form.mm_borde_der !== "" && parseFloat(form.mm_borde_der) < ev.mmMin} warn={form.mm_borde_der !== "" && parseFloat(form.mm_borde_der) < ev.mmAmarillo} onChange={e => setForm(f => ({ ...f, mm_borde_der: e.target.value }))} /></Field>
        </div>
        {(mmAlert || psiAlert) && <p className="text-[12.5px] font-bold text-[#B91C1C]">⚠ Valor por debajo del mínimo permitido</p>}
        {!mmAlert && !psiAlert && (mmWarn || psiWarn) && <p className="text-[12.5px] font-bold text-[#92400E]">⚠ Cerca del límite recomendado</p>}
        <Field label="Tipo de desgaste" required>
          <div className="flex gap-3">
            {[["normal", "Normal"], ["irregular", "Irregular"]].map(([v, l]) => (
              <button key={v} type="button" onClick={() => setForm(f => ({ ...f, tipo_desgaste: v }))}
                className={cx("flex-1 rounded-2xl border px-4 py-3 flex items-center gap-2", form.tipo_desgaste === v ? "border-ink bg-[#F3F4F6]" : "border-bd bg-white")}>
                <span className={cx("w-5 h-5 rounded-full border-2 flex items-center justify-center shrink-0", form.tipo_desgaste === v ? "border-ink" : "border-[#D1D5DB]")}>
                  {form.tipo_desgaste === v && <span className="w-2.5 h-2.5 rounded-full bg-ink" />}
                </span>
                <span className="text-[14px] font-semibold">{l}</span>
              </button>
            ))}
          </div>
        </Field>
        <Button className="w-full" disabled={form.psi === "" || form.mm_borde_izq === "" || form.mm_centro === "" || form.mm_borde_der === "" || !form.tipo_desgaste}
          onClick={() => onSave(form)}>Guardar posición</Button>
      </div>
    </Modal>
  );
}

function Instructivo({ equipo, axleCfg, posData, recsInfo, checklist, setChecklist, discrepancias, onContinuar, onCerrar }) {
  const [nuevaTarea, setNuevaTarea] = useState("");
  // Fix 6: tarea -> modal del neumatico de esa posicion (solo consulta, sin
  // acciones de HC). infoPos != null abre el mismo TireInfoModal que la HC;
  // al cerrar, se vuelve al instructivo tal cual estaba (no se pierde nada,
  // es el mismo checklist/estado, solo se cierra un modal encima).
  const [infoPos, setInfoPos] = useState(null);
  const sistemaTotal = checklist.filter(c => !c.extra).length;
  const cumplidas = checklist.filter(c => !c.extra && c.done).length;
  const extra = checklist.filter(c => c.extra).length;
  const pct = sistemaTotal ? Math.round((cumplidas / sistemaTotal) * 100) : 100;

  function toggle(id) { setChecklist(cs => cs.map(c => c.id === id ? { ...c, done: !c.done } : c)); }
  function agregar() {
    if (!nuevaTarea.trim()) return;
    setChecklist(cs => [...cs, { id: uuid(), texto: nuevaTarea.trim(), done: false, extra: true }]);
    setNuevaTarea("");
  }

  return (
    <div className="min-h-screen pb-8 px-5 pt-14 safe-top">
      <h1 className="text-[20px] font-extrabold mb-1">Instructivo · {equipo.patente}</h1>
      <p className="text-[12.5px] text-muted mb-5">Revisá el mapa y marcá las tareas cumplidas</p>

      <Card className="mb-4">
        <AxleMap cfg={axleCfg} posData={posData} selectedPos={infoPos} onTap={(p) => posData[p] && setInfoPos(p)} />
        <div className="flex items-center gap-4 mt-5 pt-4 border-t border-bd">
          {[["#D1D5DB", "OK"], ["#F59E0B", "Atención"], ["#EF4444", "Alerta"]].map(([c, l]) => (
            <div key={l} className="flex items-center gap-1.5"><span className="w-2.5 h-2.5 rounded-full" style={{ border: `2px solid ${c}` }} /><span className="text-[11.5px] text-sub">{l}</span></div>
          ))}
        </div>
      </Card>

      {/* Fix 2: si la auditoria no genera ninguna recomendacion, no tiene
          sentido mostrar un checklist vacio (baja el % sin motivo) — se
          avisa que esta todo en orden. Las tareas extra que el mecanico
          agregue igual se muestran y se pueden seguir sumando. */}
      {sistemaTotal === 0 ? (
        <div className="bg-[#DCFCE7] rounded-2xl p-4 mb-3">
          <p className="font-bold text-[14px] text-[#15803D]">✅ Todo en orden — no hay tareas pendientes para este equipo</p>
        </div>
      ) : (
        <div className="flex items-center justify-between mb-2">
          <p className="font-bold text-[15px]">Recomendaciones</p>
          <span className="text-[12.5px] font-bold text-muted">{pct}% cumplido</span>
        </div>
      )}
      <div className="space-y-2 mb-3">
        {checklist.filter(c => sistemaTotal > 0 || c.extra).map(c => {
          // Fix 6: detecta "posición N"/"pos N" en el texto de la tarea para
          // ofrecer un atajo directo al neumatico de esa posicion.
          const m = /posici[oó]n\s*(\d+)|\bpos\.?\s*(\d+)/i.exec(c.texto);
          const posMatch = m ? parseInt(m[1] || m[2], 10) : null;
          return (
            <div key={c.id} className="w-full text-left bg-white rounded-2xl border border-bd shadow-card px-4 py-3 flex items-center gap-3">
              <button onClick={() => toggle(c.id)} className="flex items-center gap-3 flex-1 min-w-0 text-left">
                <span className={cx("w-6 h-6 rounded-lg flex items-center justify-center shrink-0", c.done ? "bg-ink" : "bg-white border border-[#D1D5DB]")}>
                  {c.done && <Icon.check width="14" height="14" className="text-white" />}
                </span>
                <span className={cx("text-[14px] font-semibold flex-1", c.done && "strike")}>{c.texto}</span>
              </button>
              {c.origen && <Badge color="amber">De auditoría {formatDateLong(c.origen)}</Badge>}
              {c.extra && <Icon.pencil width="15" height="15" className="text-muted shrink-0" />}
              {posMatch != null && posData[posMatch] && (
                <button onClick={() => setInfoPos(posMatch)} className="text-[11px] font-bold text-ink px-2.5 py-1.5 rounded-full bg-[#F3F4F6] shrink-0 whitespace-nowrap">🔗</button>
              )}
            </div>
          );
        })}
      </div>
      <div className="flex gap-2 mb-6">
        <TextInput placeholder="Agregar tarea personalizada" value={nuevaTarea} onChange={e => setNuevaTarea(e.target.value)} onKeyDown={e => { if (e.key === "Enter") agregar(); }} />
        <Button variant="subtle" onClick={agregar}>+ Agregar</Button>
      </div>

      {sistemaTotal > 0 && <p className="text-[12.5px] text-muted mb-6">Recomendadas: {sistemaTotal} · Cumplidas: {cumplidas} · Extra agregadas: {extra}</p>}

      {infoPos != null && posData[infoPos] && (
        <TireInfoModal pos={infoPos} data={posData[infoPos]} equipo={equipo} axleCfg={axleCfg} onClose={() => setInfoPos(null)} />
      )}

      {discrepancias && discrepancias.length > 0 && (
        <div className="bg-[#FEE2E2] rounded-2xl p-4 mb-6">
          <p className="font-extrabold text-[15px] text-[#B91C1C] mb-3">⚠ Neumáticos que no coinciden</p>
          <div className="space-y-2">
            {discrepancias.map((d, i) => (
              <div key={i} className="bg-white rounded-xl px-3 py-2 border border-[#FCA5A5]">
                <p className="text-[13px] font-semibold text-[#7F1D1D]">
                  Posición {d.posicion}: {CAMPO_LABELS[d.campo] || d.campo} registrado {d.valor_sistema == null ? "sin registro" : d.valor_sistema}, mecánico encontró {d.valor_mecanico}
                </p>
              </div>
            ))}
          </div>
          <p className="text-[12px] text-[#92400E] mt-3 font-semibold">Pendiente de aprobación por administrador</p>
        </div>
      )}

      <div className="space-y-3">
        <Button className="w-full" onClick={() => onContinuar({ pct, cumplidas, sistemaTotal, extra })}>Continuar a hoja de cambio</Button>
        <Button variant="ghost" className="w-full" onClick={() => onCerrar({ pct, cumplidas, sistemaTotal, extra })}>Cerrar sin cambios</Button>
      </div>
    </div>
  );
}

/* =====================================================================
   PANTALLAS 6-7 - HOJA DE CAMBIO
   Interacción: arrastre real con Pointer Events. Los 3 botones de
   "Entrada" y cada neumático montado son fuentes de arrastre; un ghost
   con forma de neumático sigue el dedo/cursor. Soltar sobre una posición
   vacía monta (o abre el buscador si es tránsito); soltar un neumático

function RetiroModal({ pos, fuego, patente, mmActual, onClose, onConfirm }) {
  // Dos pasos: 1) confirmacion simple, 2) motivo (desgaste normal pide mm,
  // otro pide texto libre obligatorio; daño no pide campo extra pero ambos
  // daño/otro generan alerta de baja prematura al confirmar, ver CambioForm).
  const [step, setStep] = useState("confirm");
  const [sel, setSel] = useState("desgaste_normal");
  // Requerimiento 1: precargado con el mm real conocido de esta posicion (no
  // en blanco) para que la validacion de "<=3mm para retirar por desgaste"
  // salte de entrada en vez de depender de que el mecanico lo tipee bien.
  // Sigue siendo editable por si el mecanico mide de nuevo al momento del retiro.
  const [mm, setMm] = useState(mmActual != null ? String(mmActual) : "");
  const [justificacion, setJustificacion] = useState("");
  const [errorMM, setErrorMM] = useState("");
  const puedeConfirmar = sel === "desgaste_normal" ? mm.trim() !== "" : sel === "otro" ? justificacion.trim() !== "" : true;

  // Requerimiento 1: un retiro por desgaste solo se permite con <=3mm — con
  // mas profundidad el neumatico todavia tiene vida util.
  function confirmar() {
    if (sel === "desgaste_normal") {
      const v = parseFloat(mm);
      if (!isNaN(v) && v > 3) {
        setErrorMM(`Acción no permitida: el neumático posee ${v}mm de profundidad remanente (mayor a 3mm). Aún conserva vida útil y no se puede retirar por desgaste.`);
        return;
      }
    }
    setErrorMM("");
    onConfirm({ sel, mm, justificacion });
  }

  if (step === "confirm") {
    return (
      <Modal title="Confirmar retiro" onClose={onClose}>
        <p className="text-[14px] text-[#374151] mb-5">¿Estás seguro que querés retirar el neumático <span className="font-bold text-ink">{fuego}</span> de posición P{pos}?</p>
        <div className="flex gap-3">
          <Button variant="subtle" className="flex-1" onClick={onClose}>Cancelar</Button>
          <Button variant="danger" className="flex-1" onClick={() => setStep("motivo")}>Confirmar</Button>
        </div>
      </Modal>
    );
  }

  return (
    <Modal title="Motivo de retiro" onClose={onClose}>
      <p className="text-[13.5px] text-sub mb-4">Neumático <span className="font-bold text-ink">{fuego}</span> · Posición P{pos}</p>
      <div className="space-y-2 mb-4">
        {RETIRO_MOTIVOS.map(m => (
          <button key={m.slug} type="button" onClick={() => setSel(m.slug)}
            className={cx("w-full text-left rounded-2xl border px-4 py-3 flex items-center gap-3", sel === m.slug ? "border-ink bg-[#F3F4F6]" : "border-bd bg-white")}>
            <span className={cx("w-5 h-5 rounded-full border-2 flex items-center justify-center shrink-0", sel === m.slug ? "border-ink" : "border-[#D1D5DB]")}>
              {sel === m.slug && <span className="w-2.5 h-2.5 rounded-full bg-ink" />}
            </span>
            <span className="text-[14px] font-semibold">{m.label}</span>
          </button>
        ))}
      </div>
      {sel === "desgaste_normal" && (
        <Field label="MM al momento del retiro" required>
          <TextInput type="number" inputMode="decimal" value={mm} onChange={e => { setMm(e.target.value); setErrorMM(""); }} placeholder="Ej: 3" />
        </Field>
      )}
      {sel === "otro" && (
        <Field label="Detalle" required>
          <TextArea value={justificacion} onChange={e => setJustificacion(e.target.value)} placeholder="Describí el motivo del retiro" />
        </Field>
      )}
      {errorMM && <p className="text-[12.5px] font-bold text-[#B91C1C] bg-[#FEE2E2] rounded-xl px-3 py-2.5 mb-1">{errorMM}</p>}
      <Button variant="danger" className="w-full mt-5" disabled={!puedeConfirmar} onClick={confirmar}>Confirmar retiro</Button>
    </Modal>
  );
}
