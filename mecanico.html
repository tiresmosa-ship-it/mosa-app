/* =====================================================================
   MOSA TIRES — kit de UI compartido (JSX). Cargado con Babel en modo
   clásico (sin módulos) antes del script propio de cada página, así que
   todo lo declarado acá (Icon, Button, Card, Modal, BottomNav, hooks...)
   queda disponible como global. Depende de React (CDN) y de
   js/supabase.js (LS, getQueue, db) ya cargados antes que este archivo.
===================================================================== */
const { useState, useEffect, useCallback, createContext, useContext } = React;

/* =====================================================================
   CONTEXTO GLOBAL
===================================================================== */
const AppCtx = createContext(null);
function useApp() { return useContext(AppCtx); }
function useOnline() {
  const [online, setOnline] = useState(navigator.onLine);
  useEffect(() => {
    const on = () => setOnline(true), off = () => setOnline(false);
    window.addEventListener("online", on); window.addEventListener("offline", off);
    return () => { window.removeEventListener("online", on); window.removeEventListener("offline", off); };
  }, []);
  return online;
}
function useQueueCount() {
  const [count, setCount] = useState(getQueue().length);
  useEffect(() => {
    const upd = () => setCount(getQueue().length);
    window.addEventListener("mosa-queue-changed", upd);
    const t = setInterval(upd, 3000);
    return () => { window.removeEventListener("mosa-queue-changed", upd); clearInterval(t); };
  }, []);
  return count;
}
function useAlertasNoLeidas(clienteId, mecanicoId) {
  const [count, setCount] = useState(0);
  const queuePending = useQueueCount();
  useEffect(() => {
    if (!clienteId || !mecanicoId) return;
    let cancel = false;
    const cargar = () => db.fetchAlertas(clienteId, mecanicoId).then(as => { if (!cancel) setCount(as.filter(a => !a.leida_mecanico).length); }).catch(() => {});
    cargar();
    window.addEventListener("mosa-alertas-changed", cargar);
    const t = setInterval(cargar, 15000);
    return () => { cancel = true; window.removeEventListener("mosa-alertas-changed", cargar); clearInterval(t); };
  }, [clienteId, mecanicoId, queuePending]);
  return count;
}

  gauge: (p) => <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" {...p}><path d="M12 15l3-3"/><circle cx="12" cy="14" r="8"/><path d="M6 8l1.5 1.5M18 8l-1.5 1.5M4 14h2M18 14h2M12 5v2"/></svg>,

  eye: (p) => <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" {...p}><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z"/><circle cx="12" cy="12" r="3"/></svg>,

/* =====================================================================
   UI BASICOS
===================================================================== */
function Button({ variant = "primary", className = "", children, ...props }) {
  const base = "h-14 px-5 rounded-2xl font-bold text-[15px] transition active:scale-[0.98] disabled:opacity-50 disabled:active:scale-100 flex items-center justify-center gap-2";
  const variants = {
    primary: "bg-ink text-white",
    ghost: "bg-transparent text-ink border border-bdstrong",
    danger: "bg-[#FEE2E2] text-[#B91C1C]",
    subtle: "bg-[#F3F4F6] text-ink"
  };
  return <button className={cx(base, variants[variant], className)} {...props}>{children}</button>;
}
function Field({ label, required, children, hint }) {
  return (
    <label className="block">
      <span className="block text-[13px] font-semibold text-[#374151] mb-1.5">{label}{required && <span className="text-red-500"> *</span>}</span>
      {children}
      {hint && <span className="block text-xs text-muted mt-1">{hint}</span>}
    </label>
  );
}
function TextInput({ className = "", alert, warn, ...props }) {
  return <input className={cx("w-full h-[52px] px-4 rounded-2xl border bg-[#F3F4F6] border-[#E5E7EB] focus:outline-none focus:ring-2 focus:ring-ink/20 placeholder:text-muted", alert && "field-alert", warn && !alert && "field-warn", className)} {...props} />;
}
function Select({ className = "", children, ...props }) {
  return <select className={cx("w-full h-[52px] px-4 rounded-2xl border bg-[#F3F4F6] border-[#E5E7EB] focus:outline-none focus:ring-2 focus:ring-ink/20", className)} {...props}>{children}</select>;
}
function MarcaSelect({ value, onChange }) {
  const isOtra = value && !MARCAS_NEUMATICOS.slice(0, -1).includes(value);
  const [otra, setOtra] = useState(isOtra ? value : "");
  return (
    <div>
      <Select value={isOtra ? "Otra" : value} onChange={e => { if (e.target.value === "Otra") { onChange(otra); } else { onChange(e.target.value); } }}>
        <option value="">Seleccionar</option>
        {MARCAS_NEUMATICOS.map(m => <option key={m} value={m}>{m}</option>)}
      </Select>
      {isOtra && (
        <TextInput className="mt-2" placeholder="Escribí la marca" value={otra}
          onChange={e => { setOtra(e.target.value); onChange(e.target.value); }} />
      )}
    </div>
  );
}
function TextArea({ className = "", ...props }) {
  return <textarea className={cx("w-full min-h-[90px] px-4 py-3 rounded-2xl border bg-[#F3F4F6] border-[#E5E7EB] focus:outline-none focus:ring-2 focus:ring-ink/20", className)} {...props} />;
}
function Card({ className = "", children }) {
  return <div className={cx("bg-white rounded-card shadow-card border border-bd p-5", className)}>{children}</div>;
}
function Badge({ children, color = "gray" }) {
  const colors = {
    gray: "bg-[#F3F4F6] text-[#374151]", green: "bg-[#DCFCE7] text-[#15803D]",
    red: "bg-[#FEE2E2] text-[#B91C1C]", amber: "bg-[#FEF3C7] text-[#92400E]", black: "bg-ink text-white"
  };
  return <span className={cx("px-3 py-1 rounded-full text-[12px] font-bold", colors[color])}>{children}</span>;
}
function Modal({ title, onClose, children, wide, footer }) {
  return (
    <div className="fixed inset-0 z-50 flex items-end sm:items-center justify-center bg-black/40 p-0 sm:p-4" onClick={(e) => { if (e.target === e.currentTarget && onClose) onClose(); }}>
      <div className={cx("bg-white w-full sm:rounded-card rounded-t-[24px] max-h-[92vh] overflow-y-auto", wide ? "sm:max-w-2xl" : "sm:max-w-md")}>
        <div className="sticky top-0 bg-white border-b border-bd px-5 py-4 flex items-center justify-between z-10">
          <h3 className="text-lg font-extrabold">{title}</h3>
          {onClose && <button onClick={onClose} className="w-9 h-9 rounded-full hover:bg-[#F3F4F6] flex items-center justify-center text-sub"><Icon.close width="18" height="18"/></button>}
        </div>
        <div className="p-5">{children}</div>
        {footer && <div className="sticky bottom-0 bg-white border-t border-bd p-4">{footer}</div>}
      </div>
    </div>
  );
}
function Toast({ msg, onDone, color = "green" }) {
  useEffect(() => { const t = setTimeout(onDone, 2000); return () => clearTimeout(t); }, []);
  const styles = color === "amber" ? { background: "#FEF3C7", color: "#92400E" }
    : color === "red" ? { background: "#FEE2E2", color: "#B91C1C" }
    : { background: "#DCFCE7", color: "#15803D" };
  return (
    <div className="fixed top-4 left-1/2 -translate-x-1/2 z-[80] px-4 py-3 rounded-2xl shadow-lg text-sm font-semibold flex items-center gap-3" style={styles}>
      <span>{msg}</span>
      <button onClick={onDone} className="opacity-60">✕</button>
    </div>
  );
}
function useToasts() {
  const [toasts, setToasts] = useState([]);
  const push = useCallback((msg, color = "green") => setToasts(t => [...t, { id: uuid(), msg, color }]), []);
  const remove = (id) => setToasts(t => t.filter(x => x.id !== id));
  const node = <div>{toasts.map(t => <Toast key={t.id} msg={t.msg} color={t.color} onDone={() => remove(t.id)} />)}</div>;
  return [push, node];
}
function SyncStatusToast() {
  const [state, setState] = useState(null); // null | {type:'syncing'} | {type:'done', failed}
  useEffect(() => {
    let doneTimer;
    const onStart = () => { clearTimeout(doneTimer); setState({ type: "syncing" }); };
    const onDone = (e) => {
      const failed = (e.detail && e.detail.failed) || 0;
      setState({ type: "done", failed });
      doneTimer = setTimeout(() => setState(null), failed > 0 ? 3500 : 2000);
    };
    window.addEventListener("mosa-sync-start", onStart);
    window.addEventListener("mosa-sync-done", onDone);
    return () => { window.removeEventListener("mosa-sync-start", onStart); window.removeEventListener("mosa-sync-done", onDone); clearTimeout(doneTimer); };
  }, []);
  if (!state) return null;
  let bg = "#E5E7EB", color = "#374151", text = "🔄 Sincronizando…";
  if (state.type === "done") {
    if (state.failed === 0) { bg = "#DCFCE7"; color = "#15803D"; text = "✓ Todo sincronizado"; }
    else { bg = "#FEF3C7"; color = "#92400E"; text = `⚠ ${state.failed} registro${state.failed !== 1 ? "s" : ""} no pudieron sincronizarse`; }
  }
  return (
    <div className="fixed top-4 left-1/2 -translate-x-1/2 z-[85] px-4 py-3 rounded-2xl shadow-lg text-sm font-semibold" style={{ background: bg, color }}>
      {text}
    </div>
  );
}
function Confirm({ title, desc, onConfirm, onCancel }) {
  return (
    <Modal title={title} onClose={onCancel}>
      <p className="text-[14px] text-[#374151] mb-5">{desc}</p>
      <div className="flex gap-3">
        <Button variant="subtle" className="flex-1" onClick={onCancel}>Cancelar</Button>
        <Button className="flex-1" onClick={onConfirm}>Confirmar</Button>
      </div>
    </Modal>
  );
}
function OfflineBadge() {
  const online = useOnline();
  const pending = useQueueCount();
  if (online && pending === 0) return null;
  return (
    <div className="px-4">
      {!online && <div className="mb-2 rounded-xl bg-[#FEE2E2] text-[#B91C1C] text-xs font-bold px-3 py-2 text-center">Sin conexión</div>}
      {pending > 0 && <div className="mb-2 rounded-xl bg-[#FEF3C7] text-[#92400E] text-xs font-bold px-3 py-2 text-center">{pending} registro{pending !== 1 ? "s" : ""} pendiente{pending !== 1 ? "s" : ""} de sincronizar</div>}
    </div>
  );
}

/* =====================================================================
   NAV
===================================================================== */
function BottomNav({ view, setView, disabledExcept, alertasNoLeidas }) {
  const items = [
    { id: "inicio", label: "Inicio", icon: Icon.home },
    { id: "cierre", label: "Cierre", icon: Icon.clipboard },
    { id: "alertas", label: "Alertas", icon: Icon.bell },
    { id: "perfil", label: "Perfil", icon: Icon.user }
  ];
  return (
    <div className="fixed bottom-0 left-0 right-0 bg-white border-t border-bd safe-bottom z-30">
      <div className="flex">
        {items.map(it => {
          const active = view === it.id;
          const disabled = disabledExcept && !disabledExcept.includes(it.id);
          return (
            <button key={it.id} disabled={disabled} onClick={() => setView(it.id)} className={cx("relative flex-1 flex flex-col items-center gap-1 py-2.5", disabled && "opacity-30")}>
              <span className="relative">
                <it.icon width="24" height="24" className={active ? "text-ink" : "text-[#B0B3B8]"} />
                {it.id === "alertas" && alertasNoLeidas > 0 && (
                  <span className="absolute -top-1 -right-2.5 min-w-[16px] h-4 px-1 rounded-full bg-[#EF4444] text-white text-[10px] font-bold flex items-center justify-center">{alertasNoLeidas > 99 ? "99+" : alertasNoLeidas}</span>
                )}
              </span>
              <span className={cx("text-[10.5px] font-semibold", active ? "text-ink" : "text-[#B0B3B8]")}>{it.label}</span>
            </button>
          );
        })}
      </div>
    </div>
  );
}
const { useRef } = React;

      <Card className="mb-4">

/* =====================================================================
   PANTALLA 2 - BIENVENIDA + CHECK DIARIO
===================================================================== */
function Stepper({ value, onChange }) {
  const [editing, setEditing] = useState(false);
  const [tmp, setTmp] = useState(String(value));
  if (editing) {
    return (
      <input autoFocus inputMode="numeric" pattern="[0-9]*" value={tmp}
        onChange={e => setTmp(e.target.value.replace(/[^0-9]/g, ""))}
        onBlur={() => { setEditing(false); onChange(Math.max(0, parseInt(tmp || "0", 10))); }}
        onKeyDown={e => { if (e.key === "Enter") e.target.blur(); }}
        className="w-14 h-9 text-center rounded-lg border border-bdstrong font-bold" />
    );
  }
  return (
    <div className="flex items-center gap-2">
      <button type="button" disabled={value <= 0} onClick={() => onChange(Math.max(0, value - 1))} className="w-9 h-9 rounded-lg bg-[#F3F4F6] font-bold text-lg disabled:opacity-40">−</button>
      <button type="button" onClick={() => { setTmp(String(value)); setEditing(true); }} className="w-10 text-center font-bold">{value}</button>
      <button type="button" onClick={() => onChange(value + 1)} className="w-9 h-9 rounded-lg bg-[#F3F4F6] font-bold text-lg">+</button>
    </div>
  );
}

function CheckDiario({ user, clienteId, onDone }) {
  const [stock, setStock] = useState(() => Object.fromEntries(ALL_STOCK_FIELDS.map(f => [f.key, { value: 0, checked: false }])));
  const [tools, setTools] = useState(() => Object.fromEntries(TOOLS_CHECKLIST.map(t => [t, { checked: false, cantidad: 0 }])));
  const [saving, setSaving] = useState(false);
  const [discrepancias, setDiscrepancias] = useState(null); // null = no evaluado, [] = sin diferencias, [...] = con diferencias
  const [observacion, setObservacion] = useState("");
  const [pushToast, toastNode] = useToasts();

  const toolsFilled = TOOLS_CHECKLIST.filter(t => tools[t].checked).length;
  const stockFilled = ALL_STOCK_FIELDS.filter(f => stock[f.key].checked).length;
  const totalItems = TOOLS_CHECKLIST.length + ALL_STOCK_FIELDS.length;
  const progress = Math.round(((toolsFilled + stockFilled) / totalItems) * 100);
  const complete = toolsFilled === TOOLS_CHECKLIST.length && stockFilled === ALL_STOCK_FIELDS.length;

  function setStockVal(key, v) { setStock(s => ({ ...s, [key]: { value: v, checked: true } })); }
  function toggleStock(key) { setStock(s => ({ ...s, [key]: { ...s[key], checked: !s[key].checked } })); }
  function setToolQty(t, v) { setTools(s => ({ ...s, [t]: { checked: true, cantidad: v } })); }
  function toggleTool(t) { setTools(s => ({ ...s, [t]: { ...s[t], checked: !s[t].checked } })); }

  function renderSeccion(titulo, fields) {
    return (
      <>
        <p className="font-bold text-[15px] mb-2">{titulo}</p>
        <div className="space-y-2 mb-4">
          {fields.map(f => (
            <div key={f.key} className={cx("bg-white rounded-2xl border shadow-card px-4 py-3 flex items-center gap-3", stock[f.key].checked ? "border-bd" : "border-[#F59E0B]")}>
              <button type="button" onClick={() => toggleStock(f.key)} className={cx("w-7 h-7 rounded-lg flex items-center justify-center shrink-0 border", stock[f.key].checked ? "bg-ink border-ink" : "bg-white border-[#D1D5DB]")}>
                {stock[f.key].checked && <Icon.check width="15" height="15" className="text-white" />}
              </button>
              <span className="text-[14px] font-semibold text-[#1F2937] flex-1">{f.label}</span>
              <Stepper value={stock[f.key].value} onChange={v => setStockVal(f.key, v)} />
            </div>
          ))}
        </div>
      </>
    );
  }

  async function continuar() {
    setSaving(true);
    const id = uuid();
    const horaInicio = nowHM();
    const totales = { nuevo: stock.nuevos.value, transito: stock.transito.value, recauchado: stock.recauchados.value, reparacion: stock.reparar.value };
    const toolsCounted = Object.fromEntries(TOOLS_CHECKLIST.map(t => [t, tools[t].cantidad]));
    const data = {
      id, cliente_id: clienteId, empresa_id: clienteId, bultero_id: user.id, fecha: todayISO(), hora_inicio: horaInicio,
      numero_hoja: uuid().slice(0, 8), completado: true,
      nuevos: stock.nuevos.value, transito: stock.transito.value, reparar: stock.reparar.value, recauchados: stock.recauchados.value,
      llantas_am_aluminio: stock.llantas_am_aluminio.value, llantas_am_fierro: stock.llantas_am_fierro.value,
      llantas_eu_aluminio: stock.llantas_eu_aluminio.value, llantas_eu_fierro: stock.llantas_eu_fierro.value,
      checklist: TOOLS_CHECKLIST.map(t => ({ herramienta: t, cantidad: tools[t].cantidad }))
    };
    pushQueue({ id: uuid(), tipo: "novedad", clienteId, ts: Date.now(), data });
    syncQueue();
    setTurno({ clienteId, fecha: todayISO(), checkDone: true });
    localStorage.setItem("check_completado_hoy", "true");

    try {
      await marcarInicioJornada(clienteId, user.id, todayISO(), horaInicio);
      const [neuDiffs, herrDiffs] = await Promise.all([
        compararInventarioNeumaticos(clienteId, totales),
        compararHerramientasInventario(clienteId, toolsCounted).catch(e => { console.error("No se pudo comparar herramientas", e); return []; })
      ]);
      const neuIds = neuDiffs.length ? await registrarDiscrepancias(clienteId, user.id, todayISO(), neuDiffs) : [];
      if (herrDiffs.length) await registrarDiscrepanciasHerramientas(clienteId, user.id, todayISO(), herrDiffs);
      if (neuDiffs.length || herrDiffs.length) {
        setDiscrepancias({
          diffs: [...neuDiffs, ...herrDiffs.map(d => ({ bucket: d.nombre, label: d.nombre, sistema: d.sistema, fisico: d.fisico }))],
          ids: neuIds
        });
        setSaving(false);
        return;
      }
    } catch (e) { console.error("No se pudo comparar el inventario", e); }

    pushToast(navigator.onLine ? "✓ Check diario completado" : "📋 Guardado localmente — se sincronizará al reconectar", navigator.onLine ? "green" : "amber");
    setSaving(false);
    setTimeout(onDone, 700);
  }

  if (discrepancias) {
    return (
      <div className="min-h-screen flex flex-col px-6 pt-16 safe-top">
        {toastNode}
        <div className="w-14 h-14 rounded-2xl bg-[#FEE2E2] flex items-center justify-center mb-5 text-2xl">⚠</div>
        <h1 className="text-[22px] font-extrabold leading-tight mb-2">Tu conteo difiere del inventario registrado</h1>
        <p className="text-[13.5px] text-sub mb-5">Podés seguir trabajando igual. Se le enviará una alerta a tu supervisor.</p>
        <div className="space-y-2 mb-5">
          {discrepancias.diffs.map(d => (
            <div key={d.bucket} className="bg-[#FEF3C7] rounded-2xl px-4 py-3">
              <p className="font-bold text-[14px] text-[#92400E]">{d.label}</p>
              <p className="text-[12.5px] text-[#92400E]">Sistema: {d.sistema} · Contado: {d.fisico}</p>
            </div>
          ))}
        </div>
        <Field label="Observación (opcional)">
          <TextArea placeholder="Contanos si sabés por qué difiere..." value={observacion} onChange={e => setObservacion(e.target.value)} />
        </Field>
        <div className="flex-1" />
        <Button className="w-full mt-5 mb-8" onClick={() => { guardarObservacionDiscrepancia(discrepancias.ids, observacion).catch(() => {}); onDone(); }}>Entendido, continuar</Button>
      </div>
    );
  }

  return (
    <div className="min-h-screen pb-28 px-5 safe-top">
      {toastNode}
      <div className="sticky top-0 z-30 bg-white px-5 pt-14 pb-3">
        <p className="text-[14px] text-muted mb-1">{formatDateLong()}</p>
        <h1 className="text-[30px] font-extrabold leading-none">Hola, {user.nombre}</h1>
        <p className="text-[14px] text-sub mt-2 mb-4">Para iniciar tenés que completar el check del día</p>
        <div className="bg-[#F9FAFB] rounded-[20px] p-5">
          <div className="flex items-center justify-between mb-2">
            <span className="font-bold text-[16px]">Progreso del check</span>
            <span className="text-[13px] font-bold">{toolsFilled + stockFilled}/{totalItems}</span>
          </div>
          <div className="h-2 rounded-full bg-[#E5E7EB] overflow-hidden">
            <div className="h-full bg-ink transition-all" style={{ width: progress + "%" }} />
          </div>
        </div>
      </div>

      <div className="px-0 pt-4">
        <p className="font-extrabold text-[17px] mb-3">Conteo de neumáticos</p>
        <p className="text-[12.5px] text-muted mb-3">Marcá el check para confirmar que revisaste el ítem, aunque tengas 0.</p>
        {renderSeccion("Neumáticos", NEUMATICO_FIELDS)}
        {renderSeccion("Llantas en patio", PATIO_FIELDS)}

        <p className="font-bold text-[15px] mb-2">Checklist de herramientas</p>
        <p className="text-[12.5px] text-muted mb-3">Marcá el check para confirmar que revisaste la herramienta, aunque tengas 0.</p>
        <div className="space-y-2 mb-6">
          {TOOLS_CHECKLIST.map(t => (
            <div key={t} className={cx("bg-white rounded-2xl border shadow-card px-4 py-3 flex items-center gap-3", tools[t].checked ? "border-bd" : "border-[#F59E0B]")}>
              <button type="button" onClick={() => toggleTool(t)} className={cx("w-7 h-7 rounded-lg flex items-center justify-center shrink-0 border", tools[t].checked ? "bg-ink border-ink" : "bg-white border-[#D1D5DB]")}>
                {tools[t].checked && <Icon.check width="15" height="15" className="text-white" />}
              </button>
              <span className="text-[14px] font-semibold text-[#1F2937] flex-1">{t}</span>
              <Stepper value={tools[t].cantidad} onChange={v => setToolQty(t, v)} />
            </div>
          ))}
        </div>
      </div>

      <div className="fixed bottom-0 left-0 right-0 bg-white border-t border-bd p-4 safe-bottom">
        <Button className="w-full" disabled={!complete || saving} onClick={continuar}>
          {saving ? <span className="spinner" /> : "Confirmar check diario"}
        </Button>
        {!complete && <p className="text-center text-[12px] text-muted mt-2">Completá el conteo de neumáticos y confirmá las {TOOLS_CHECKLIST.length} herramientas</p>}
      </div>
    </div>
  );
}

function SeleccionEquipo({ clienteId, cfg, onPick }) {
  const [equipos, setEquipos] = useState(() => getCache(LS.equipos(clienteId), []));
  const [estadosByEquipo, setEstadosByEquipo] = useState({});
  const [filter, setFilter] = useState("todos");
  const [search, setSearch] = useState("");
  const [loading, setLoading] = useState(true);

  useEffect(() => {
    let cancel = false;
    (async () => {
      try {
        const eqs = await db.fetchEquipos(clienteId);
        if (cancel) return;
        setEquipos(eqs);
        const estados = await db.fetchEstadoAuditorias(clienteId);
        if (!cancel) setEstadosByEquipo(estados);
      } catch (e) { console.error(e); } finally { if (!cancel) setLoading(false); }
    })();
    return () => { cancel = true; };
  }, [clienteId]);

  const filtered = equipos.filter(eq => {
    const estado = equipoAuditEstado(estadosByEquipo[eq.id_equipo], cfg.meses_vencimiento_auditoria);
    if (filter !== "todos" && filter !== estado) return false;
    if (search) {
      const s = search.toLowerCase();
      if (!(eq.patente || "").toLowerCase().includes(s) && !(eq.numero_interno || "").toLowerCase().includes(s)) return false;
    }
    return true;
  });

  return (
    <div className="min-h-screen pb-24 px-5 pt-14 safe-top">
      <div className="flex items-center justify-between mb-4">
        <h1 className="text-[30px] font-extrabold">Equipos</h1>
        <div className="w-10 h-10 rounded-full bg-[#F3F4F6] flex items-center justify-center"><Icon.search width="18" height="18" /></div>
      </div>
      <TextInput placeholder="Buscar por patente o número interno" value={search} onChange={e => setSearch(e.target.value)} className="mb-4" />
      <div className="flex gap-2 mb-5 overflow-x-auto">
        {[["todos", "Todos"], ["al_dia", "Al día"], ["abierta", "Aud. Abierta"], ["vencida", "Aud. Vencida"], ["sin_auditoria", "Sin Auditoría"]].map(([k, l]) => (
          <button key={k} onClick={() => setFilter(k)} className={cx("px-4 py-2 rounded-full text-[13px] font-bold whitespace-nowrap", filter === k ? "bg-ink text-white" : "bg-[#F3F4F6] text-[#374151]")}>{l}</button>
        ))}
      </div>
      {loading && <div className="flex justify-center py-10"><span className="spinner" /></div>}
      <div className="space-y-3">
        {filtered.map(eq => {
          const estado = equipoAuditEstado(estadosByEquipo[eq.id_equipo], cfg.meses_vencimiento_auditoria);
          return (
            <button key={eq.id_equipo} onClick={() => onPick(eq)} className="w-full text-left bg-white rounded-[20px] border border-bd shadow-card p-4 flex items-center gap-3">
              <div className="w-[52px] h-[52px] rounded-2xl bg-[#F3F4F6] flex items-center justify-center shrink-0"><Icon.truck width="26" height="26" /></div>
              <div className="flex-1 min-w-0">
                <p className="font-bold text-[15.5px] truncate">{eq.numero_interno ? `${eq.numero_interno} · ` : ""}{eq.patente}</p>
                <p className="text-[12.5px] text-muted truncate">{eq.tipo === "SEMI" ? "Semirremolque" : `Tracto ${eq.configuracion_ejes || ""}`} · {eq.modelo || ""}</p>
              </div>
              <Badge color={equipoAuditColor(estado)}>{equipoAuditLabel(estado)}</Badge>
            </button>
          );
        })}
        {!loading && filtered.length === 0 && <p className="text-center text-muted py-10 text-sm">No hay equipos que coincidan.</p>}
      </div>
    </div>
  );
}

function KmModal({ equipo, clienteId, mecanicoId, km, setKm, onContinue }) {
  const kmActual = equipo.kilometros;
  const kmNum = parseInt(km, 10);
  const menor = km !== "" && !isNaN(kmNum) && kmActual != null && kmNum < kmActual;
  const igual = km !== "" && !isNaN(kmNum) && kmActual != null && kmNum === kmActual;
  const [confirmandoIgual, setConfirmandoIgual] = useState(false);

  function intentarContinuar() {
    if (menor) return;
    if (igual) { setConfirmandoIgual(true); return; }
    onContinue();
  }
  function confirmarIgual() {
    pushQueue({
      id: uuid(), tipo: "alerta", clienteId, ts: Date.now(), data: {
        id: uuid(), cliente_id: clienteId, equipo_id: equipo.id_equipo, mecanico_id: mecanicoId,
        tipo: "km_repetidos", severidad: "amarillo", titulo: `KM repetidos — ${equipo.patente}`,
        descripcion: `El mecánico ingresó los mismos km que el registro anterior: ${km}`,
        leida_mecanico: true, leida_admin: false, leida_superadmin: false
      }
    });
    syncQueue();
    setConfirmandoIgual(false);
    onContinue();
  }

  return (
    <Modal title="Kilometraje actual">
      <Field label="Kilómetros" required>
        <TextInput type="number" inputMode="numeric" value={km} alert={menor} onChange={e => setKm(e.target.value.replace(/[^0-9]/g, ""))} placeholder="Ingresá los km actuales" />
      </Field>
      {menor && <p className="text-[12.5px] font-bold text-[#B91C1C] mt-2">Los km ingresados son menores al último registro. Verificá el odómetro.</p>}
      {igual && !confirmandoIgual && <p className="text-[12.5px] font-bold text-[#92400E] mt-2">⚠ Los km son iguales al último registro. ¿Estás seguro?</p>}
      <Button className="w-full mt-5" disabled={!km || menor} onClick={intentarContinuar}>Continuar</Button>
      {confirmandoIgual && (
        <Confirm title="KM repetidos" desc={`Ingresaste ${km} km, igual al último registro. ¿Confirmás que es correcto?`}
          onConfirm={confirmarIgual} onCancel={() => setConfirmandoIgual(false)} />
      )}
    </Modal>
  );
}

function AuditoriaForm({ user, clienteId, equipo, cfg, onCancel, onGenerarInstructivo }) {
  const [frioConfirmado, setFrioConfirmado] = useState(false);
  const [km, setKm] = useState("");
  const [kmSet, setKmSet] = useState(false);
  const axleCfg = axleConfigFor(equipo);
  const allPositions = axleCfg.rows.flatMap(r => r.positions);
  const [posData, setPosData] = useState({});
  const [editingPos, setEditingPos] = useState(null);
  const [generando, setGenerando] = useState(false);
  const [pendientesAnteriores, setPendientesAnteriores] = useState(null); // null = sin chequear
  const startedAt = useRef(Date.now());

  async function generarInstructivo() {
    setGenerando(true);
    try {
      if (pendientesAnteriores === null) {
        const pend = await db.fetchTareasPendientesAnteriores(equipo.id_equipo).catch(() => []);
        if (pend && pend.length) { setPendientesAnteriores(pend); setGenerando(false); return; }
      }
      await onGenerarInstructivo(posData, axleCfg, km, startedAt.current, []);
    } catch (e) { setGenerando(false); }
  }
  async function confirmarSumarTareas() {
    const fecha = pendientesAnteriores[0] && pendientesAnteriores[0].auditorias ? pendientesAnteriores[0].auditorias.fecha : null;
    const tareasExtra = [];
    pendientesAnteriores.forEach(p => {
      const f = p.auditorias ? p.auditorias.fecha : fecha;
      tareasIncompletasDeReceta(p).forEach(texto => tareasExtra.push({ texto, origen: f }));
    });
    db.marcarRecetasSinCambio(pendientesAnteriores.map(p => p.id)).catch(e => console.error(e));
    setPendientesAnteriores([]);
    setGenerando(true);
    try { await onGenerarInstructivo(posData, axleCfg, km, startedAt.current, tareasExtra); } catch (e) { setGenerando(false); }
  }
  async function confirmarSoloHoy() {
    setPendientesAnteriores([]);
    setGenerando(true);
    try { await onGenerarInstructivo(posData, axleCfg, km, startedAt.current, []); } catch (e) { setGenerando(false); }
  }

  function abrirPosicion(p) { setEditingPos(p); }

  function guardarPosicion(p, data) {
    const ev = evaluarPosicion(axleCfg, cfg, p, equipo.tipo, data);
    if (data.marca_modelo_no_registrado) {
      pushQueue({
        id: uuid(), tipo: "alerta", clienteId, ts: Date.now(), data: {
          id: uuid(), cliente_id: clienteId, equipo_id: equipo.id_equipo, mecanico_id: user.id,
          tipo: "marca_modelo_no_registrado", severidad: "amarillo",
          titulo: `Marca/modelo no registrado — ${equipo.patente} pos ${p}`,
          descripcion: `El mecánico ingresó ${data.marca || ""} ${data.modelo || ""} que no está en el catálogo del cliente`,
          posicion: p, numero_fuego: data.numero_fuego || null,
          leida_mecanico: true, leida_admin: false, leida_superadmin: false
        }
      });
      syncQueue();
    }
    setPosData(s => ({ ...s, [p]: { ...data, posicion: p, status: ev.status, minMM: ev.minMM, motivos: ev.motivos } }));
    setEditingPos(null);
  }

  const completas = allPositions.filter(p => posData[p] && posData[p].posicion != null).length;
  const todasCompletas = completas === allPositions.length;

  if (!frioConfirmado) {
    return (
      <Modal title="Antes de empezar">
        <p className="text-[14px] text-[#374151] mb-2">Las presiones de aire deben controlarse en frío. ¿Confirmás que los neumáticos están fríos?</p>
        <p className="text-[14px] text-[#374151] mb-5">Recordá los mm mínimos de retiro: Tracto: {cfg.mm_minimo_tracto}mm · Semi: {cfg.mm_minimo_semi}mm · Auxilio: {cfg.mm_minimo_auxilio}mm</p>
        <div className="flex gap-3">
          <Button variant="subtle" className="flex-1" onClick={onCancel}>Cancelar</Button>
          <Button className="flex-1" onClick={() => setFrioConfirmado(true)}>Confirmar</Button>
        </div>
      </Modal>
    );
  }
  if (!kmSet) {

        <AxleMap cfg={axleCfg} posData={posData} selectedPos={editingPos} onTap={abrirPosicion} />
      </Card>

      <p className="text-[12.5px] text-muted px-1">{completas}/{allPositions.length} posiciones cargadas</p>

      <div className="fixed bottom-0 left-0 right-0 bg-white border-t border-bd p-4 safe-bottom z-30">

// Marca/Modelo con dropdown del catalogo del cliente (marcas_modelos_cliente)
// en vez de texto libre. Si el catalogo esta vacio para el cliente, cae a
// texto libre sin generar alertas. Si el mecanico elige "+ Otra marca"/"+
// Otro modelo", el campo se vuelve texto libre y se marca noRegistrado=true
// para que el llamador genere la alerta al guardar. Compartido entre el
// modal de posicion de la auditoria (PosicionModal) y el modal de montaje
// de la hoja de cambio (MontajeModal).
function MarcaModeloAuditoriaField({ clienteId, marca, modelo, onChange }) {
  const [catalogo, setCatalogo] = useState(null); // null = cargando
  const [otraMarca, setOtraMarca] = useState(false);
  const [otroModelo, setOtroModelo] = useState(false);
  useEffect(() => { db.fetchMarcasModelosCliente(clienteId).then(setCatalogo).catch(() => setCatalogo([])); }, [clienteId]);

  if (catalogo === null) {
    return (
      <>
        <Field label="Marca"><TextInput disabled placeholder="Cargando..." /></Field>
        <Field label="Modelo"><TextInput disabled placeholder="Cargando..." /></Field>
      </>
    );
  }
  const activos = catalogo.filter(c => c.activo);
  if (!activos.length) {
    return (
      <>
        <Field label="Marca"><TextInput placeholder="Marca" value={marca} onChange={e => onChange(e.target.value, modelo, false)} /></Field>
        <Field label="Modelo"><TextInput placeholder="Modelo" value={modelo} onChange={e => onChange(marca, e.target.value, false)} /></Field>
      </>
    );
  }
  const marcas = [...new Set(activos.map(c => c.marca))].sort();
  const marcaEsOtra = otraMarca || (marca && !marcas.includes(marca));
  const modelos = marca && !marcaEsOtra ? [...new Set(activos.filter(c => c.marca === marca).map(c => c.modelo))].sort() : [];
  const modeloEsOtro = otroModelo || (modelo && !marcaEsOtra && modelos.length && !modelos.includes(modelo));

  return (
    <>
      <Field label="Marca">
        {marcaEsOtra ? (
          <TextInput placeholder="Escribí la marca" value={marca} onChange={e => onChange(e.target.value, modelo, true)} />
        ) : (
          <Select value={marca} onChange={e => {
            const v = e.target.value;
            if (v === "__otra__") { setOtraMarca(true); onChange("", "", true); }
            else { setOtraMarca(false); setOtroModelo(false); onChange(v, "", false); }
          }}>
            <option value="">Seleccionar</option>
            {marcas.map(m => <option key={m} value={m}>{m}</option>)}
            <option value="__otra__">+ Otra marca</option>
          </Select>
        )}
      </Field>
      <Field label="Modelo">
        {marcaEsOtra || modeloEsOtro ? (
          <TextInput placeholder="Escribí el modelo" value={modelo} disabled={!marca} onChange={e => onChange(marca, e.target.value, true)} />
        ) : (
          <Select value={modelo} disabled={!marca} onChange={e => {
            const v = e.target.value;
            if (v === "__otro__") { setOtroModelo(true); onChange(marca, "", true); }
            else { setOtroModelo(false); onChange(marca, v, marcaEsOtra); }
          }}>
            <option value="">Seleccionar</option>
            {modelos.map(m => <option key={m} value={m}>{m}</option>)}
            <option value="__otro__">+ Otro modelo</option>
          </Select>
        )}
      </Field>
    </>
  );
}

function PosicionModal({ pos, equipo, cfg, clienteId, axleCfg, existing, onClose, onSave }) {

  const ev = evaluarPosicion(axleCfg, cfg, pos, equipo.tipo, form);

  const psiVal = parseFloat(form.psi);
  const psiAlert = form.psi !== "" && Math.abs(psiVal - ev.psiObjetivo) > (ev.psiObjetivo * cfg.psi_tolerancia_pct / 100) * 2;
  const psiWarn = form.psi !== "" && Math.abs(psiVal - ev.psiObjetivo) > (ev.psiObjetivo * cfg.psi_tolerancia_pct / 100);

    <Modal title={`Posición P${pos}`} onClose={onClose}>

        </div>
        <Field label="Medida"><TextInput placeholder="295/80R22.5" value={form.medida} onChange={e => setForm(f => ({ ...f, medida: e.target.value }))} /></Field>
        <Field label="PSI" required>
          <TextInput type="number" inputMode="numeric" value={form.psi} alert={psiAlert} warn={psiWarn}
            onChange={e => setForm(f => ({ ...f, psi: e.target.value }))} placeholder={`Objetivo ${ev.psiObjetivo}`} />
        </Field>
        <div className="grid grid-cols-3 gap-2">
          <Field label="MM izq" required><TextInput type="number" step="0.1" value={form.mm_borde_izq} alert={form.mm_borde_izq !== "" && parseFloat(form.mm_borde_izq) < ev.mmMin} warn={form.mm_borde_izq !== "" && parseFloat(form.mm_borde_izq) < ev.mmAmarillo} onChange={e => setForm(f => ({ ...f, mm_borde_izq: e.target.value }))} /></Field>
          <Field label="MM centro" required><TextInput type="number" step="0.1" value={form.mm_centro} alert={form.mm_centro !== "" && parseFloat(form.mm_centro) < ev.mmMin} warn={form.mm_centro !== "" && parseFloat(form.mm_centro) < ev.mmAmarillo} onChange={e => setForm(f => ({ ...f, mm_centro: e.target.value }))} /></Field>
          <Field label="MM der" required><TextInput type="number" step="0.1" value={form.mm_borde_der} alert={form.mm_borde_der !== "" && parseFloat(form.mm_borde_der) < ev.mmMin} warn={form.mm_borde_der !== "" && parseFloat(form.mm_borde_der) < ev.mmAmarillo} onChange={e => setForm(f => ({ ...f, mm_borde_der: e.target.value }))} /></Field>
        </div>
        {(mmAlert || psiAlert) && <p className="text-[12.5px] font-bold text-[#B91C1C]">⚠ Valor por debajo del mínimo permitido</p>}
        {!mmAlert && !psiAlert && (mmWarn || psiWarn) && <p className="text-[12.5px] font-bold text-[#92400E]">⚠ Cerca del límite recomendado</p>}
        <Field label="Tipo de desgaste" required>
          <div className="flex gap-3">
            {[["normal", "Normal"], ["irregular", "Irregular"]].map(([v, l]) => (
              <button key={v} type="button" onClick={() => setForm(f => ({ ...f, tipo_desgaste: v }))}
                className={cx("flex-1 rounded-2xl border px-4 py-3 flex items-center gap-2", form.tipo_desgaste === v ? "border-ink bg-[#F3F4F6]" : "border-bd bg-white")}>
                <span className={cx("w-5 h-5 rounded-full border-2 flex items-center justify-center shrink-0", form.tipo_desgaste === v ? "border-ink" : "border-[#D1D5DB]")}>
                  {form.tipo_desgaste === v && <span className="w-2.5 h-2.5 rounded-full bg-ink" />}
                </span>
                <span className="text-[14px] font-semibold">{l}</span>

        <Button className="w-full" disabled={form.psi === "" || form.mm_borde_izq === "" || form.mm_centro === "" || form.mm_borde_der === "" || !form.tipo_desgaste}
          onClick={() => onSave(form)}>Guardar posición</Button>
      </div>
    </Modal>
  );

// Validacion de rotaciones (hoja de cambio), autocontenida — no depende de
// axleCfg.groups/ladoDePosicion de js/supabase.js porque esas dos quedaban
// mal para este caso: ladoDePosicion partia el array de posiciones de la fila
// en "primera mitad"/"segunda mitad" en vez del lado real alternado (impar/par),
// y AXLE_CONFIGS.semi.groups separaba cada eje del semi en su propio grupo
// cuando el semi debe rotar totalmente libre. configEjes es '4x2'/'6x2'/'6x4'/'semi'.
function validateRotation(fromPos, toPos, configEjes) {
  const ladoIzq = { "4x2": [3, 5], "6x2": [3, 5], "6x4": [3, 5, 7, 9] };
  const ladoDer = { "4x2": [4, 6], "6x2": [4, 6], "6x4": [4, 6, 8, 10] };
  const direccionales = [1, 2];
  const ejeLibre = [7, 8, 9, 10]; // solo 6x2

  if (configEjes === "semi") return { valid: true };

  const ambosDir = direccionales.includes(fromPos) && direccionales.includes(toPos);
  if (ambosDir) return { valid: true };

  const unoDir = direccionales.includes(fromPos) || direccionales.includes(toPos);
  if (unoDir) return { valid: false, msg: "No podés rotar un direccional con un traccional" };

  if (configEjes === "6x2") {
    const ambosEL = ejeLibre.includes(fromPos) && ejeLibre.includes(toPos);
    if (ambosEL) return { valid: true };
    const unoEL = ejeLibre.includes(fromPos) || ejeLibre.includes(toPos);
    if (unoEL) return { valid: false, msg: "El eje libre solo rota entre sus propias posiciones" };
  }

  const izq = ladoIzq[configEjes] || [];
  const der = ladoDer[configEjes] || [];
  const fromIzq = izq.includes(fromPos), toIzq = izq.includes(toPos);
  const fromDer = der.includes(fromPos), toDer = der.includes(toPos);
  if ((fromIzq && toIzq) || (fromDer && toDer)) return { valid: true };

  return { valid: false, msg: "No podés rotar neumáticos de lados opuestos" };
}

function CambioForm({ user, clienteId, equipo, cfg, axleCfg, posDataInicial, checklistInicial, kmInicial, recetaIdInicial, pendiente, discrepanciasNeumaticosInicial, onFinish, onCancel }) {

  // sigue al NEUMATICO (numero_fuego), no a la posicion fija de la auditoria,

  const discrepanciasPendientes = (discrepanciasNeumaticosInicial || []).filter(d => !d.aprobada);

  const [ghost, setGhost] = useState(null); // { x, y }
  const [pushToast, toastNode] = useToasts();

  const [pendienteDlg, setPendienteDlg] = useState(pendiente || null);
  const recetaId = useRef(recetaIdInicial || null);
  const startedAt = useRef(Date.now());
  const entra = useRef([]);
  const sale = useRef([]);
  const rotaciones = useRef([]);
  const intervenciones = useRef([]);
  const dragRef = useRef(null);
  const [saving, setSaving] = useState(false);

  function registrarIntervencion(tipo, pos, extra) {
    intervenciones.current.push({
      id: uuid(), equipo_id: equipo.id_equipo, mecanico_id: user.id, cliente_id: clienteId,
      fecha: todayISO(), tipo, posicion: pos, numero_fuego: posData[pos] ? posData[pos].numero_fuego : null,
      psi_nuevo: extra && extra.psi_nuevo != null ? extra.psi_nuevo : null,
      observaciones: (extra && extra.observaciones) || null, foto_url: (extra && extra.foto_url) || null,
      timestamp_inicio: (extra && extra.timestamp_inicio) || null, timestamp_fin: (extra && extra.timestamp_fin) || null
    });
  }

  function ejecutarSalida(pos, motivo) {
    const d = posData[pos];
    // Retiro: pide confirmacion + motivo (modal aparte, 2 pasos). Transito/reparacion: confirmacion directa.
    if (motivo === "retiro") { setRetiroSel({ pos }); return; }
    const label = motivo === "transito" ? "tránsito" : "reparación";
    const origenMov = motivo === "transito" ? "desmontaje_transito" : "desmontaje_reparacion";
    setConfirmDlg({
      title: "Confirmar salida",
      desc: `¿Enviar el neumático ${d.numero_fuego} (P${pos}) a ${label}?`,
      onConfirm: () => {
        sale.current.push({ numero_fuego: d.numero_fuego, posicion: pos, milimetros: d.minMM || null, psi: d.psi || null, motivo, motivo_salida: motivo, origen_mov: origenMov });
        setPosData(s => { const n = { ...s }; delete n[pos]; return n; });
        pushToast("✓ Salida registrada");
        setConfirmDlg(null); setInfoPos(null);
      }
    });
  }
  function confirmarRetiro(pos, { sel, mm, justificacion }) {
    const d = posData[pos];
    const esDesgaste = sel === "desgaste_normal";
    const motivoSalida = esDesgaste ? "retiro_desgaste" : "retiro_daño_otro";
    const milimetros = esDesgaste ? (parseFloat(mm) || null) : (d.minMM || null);
    sale.current.push({ numero_fuego: d.numero_fuego, posicion: pos, milimetros, psi: d.psi || null, motivo: motivoSalida, motivo_salida: motivoSalida, origen_mov: motivoSalida });
    if (!esDesgaste) {
      pushQueue({
        id: uuid(), tipo: "alerta", clienteId, ts: Date.now(), data: {
          id: uuid(), cliente_id: clienteId, equipo_id: equipo.id_equipo, mecanico_id: user.id,
          tipo: "baja_prematura", severidad: "amarillo", titulo: `Retiro por daño/otro — ${equipo.patente} pos ${pos}`,
          descripcion: sel === "otro" ? justificacion : "Retiro por daño", posicion: pos, numero_fuego: d.numero_fuego,
          leida_mecanico: true, leida_admin: false, leida_superadmin: false
        }
      });
      syncQueue();
    }
    setPosData(s => { const n = { ...s }; delete n[pos]; return n; });
    pushToast("✓ Retiro registrado");
    setRetiroSel(null); setInfoPos(null);
  }

  function montarNeumatico(pos, data, tipo) {
    setPosData(s => ({ ...s, [pos]: { ...data, posicion: pos, status: "ok", minMM: data.mm ? parseFloat(data.mm) : null } }));
    entra.current.push({ numero_fuego: data.numero_fuego, posicion: pos, milimetros: data.mm ? parseFloat(data.mm) : null, psi: data.psi ? parseInt(data.psi, 10) : null, estado: tipo });
    if (tipo === "nuevo") registrarIntervencion("checkpoint", pos, { foto_url: data.fotoUrl, observaciones: "Montaje de neumático nuevo, torqueado y checkpoint confirmado" });
    if (data.marcaModeloNoRegistrado) {
      pushQueue({
        id: uuid(), tipo: "alerta", clienteId, ts: Date.now(), data: {
          id: uuid(), cliente_id: clienteId, equipo_id: equipo.id_equipo, mecanico_id: user.id,
          tipo: "marca_modelo_no_registrado", severidad: "amarillo",
          titulo: `Marca/modelo no registrado — ${equipo.patente} pos ${pos}`,
          descripcion: `Mecánico ingresó ${data.marca || ""} ${data.modelo || ""} que no está en el catálogo del cliente`,
          posicion: pos, numero_fuego: data.numero_fuego || null,
          leida_mecanico: true, leida_admin: false, leida_superadmin: false
        }
      });
      syncQueue();
    }
    pushToast("✓ Montaje registrado");
    setMontaje(null);
  }

  function confirmarRotacion(origen, destino) {
    const configEjes = equipo.tipo === "SEMI" ? "semi" : equipo.configuracion_ejes;
    const check = validateRotation(origen, destino, configEjes);
    if (!check.valid) {
      if (navigator.vibrate) navigator.vibrate(200);
      pushToast(`✕ ${check.msg}`, "red");
      return;
    }
    const destFuego = posData[destino] ? posData[destino].numero_fuego : null;
    setConfirmDlg({
      title: "Confirmar rotación",
      desc: destFuego ? `¿Intercambiar el neumático de P${origen} con el de P${destino}?` : `¿Mover el neumático de P${origen} a la posición P${destino}?`,
      onConfirm: () => {
        const a = posData[origen], b = posData[destino];
        // Registrar la rotacion para persistirla (4 filas de cambio_detalle si es
        // intercambio, 2 si es mover a posicion vacia). No cambia inventario.
        rotaciones.current.push({
          origen, destino,
          a: { numero_fuego: a.numero_fuego, mm: a.minMM != null ? a.minMM : null, psi: a.psi || null },
          b: b ? { numero_fuego: b.numero_fuego, mm: b.minMM != null ? b.minMM : null, psi: b.psi || null } : null
        });
        setPosData(s => {
          const next = { ...s };
          const na = next[origen], nb = next[destino];
          if (nb) next[origen] = { ...nb, posicion: origen }; else delete next[origen];
          next[destino] = { ...na, posicion: destino };
          return next;
        });
        pushToast("✓ Rotación registrada");
        setConfirmDlg(null);
      }
    });
  }

  function resolverDrop(clientX, clientY) {
    const el = document.elementFromPoint(clientX, clientY);
    const salidaEl = el && el.closest("[data-salida]");
    if (salidaEl) return { salida: salidaEl.getAttribute("data-salida") };
    const posEl = el && el.closest("[data-pos]");
    return posEl ? { pos: parseInt(posEl.getAttribute("data-pos"), 10) } : null;
  }

  function onPointerDownTire(pos, e) {
    if (!posData[pos]) return;
    dragRef.current = { sub: "rotate", payload: pos, startX: e.clientX, startY: e.clientY, moved: false };
    try { e.currentTarget.setPointerCapture(e.pointerId); } catch (err) {}
  }
  function onPointerDownEntrada(tipo, e) {
    dragRef.current = { sub: "mount", payload: tipo, startX: e.clientX, startY: e.clientY, moved: false };
    try { e.currentTarget.setPointerCapture(e.pointerId); } catch (err) {}
  }
  function onDragMove(e) {
    const d = dragRef.current;
    if (!d) return;
    const dx = e.clientX - d.startX, dy = e.clientY - d.startY;
    if (!d.moved && Math.hypot(dx, dy) > 10) d.moved = true;
    if (d.moved) {
      e.preventDefault();
      setGhost({ x: e.clientX, y: e.clientY });
      if (e.clientY < 90) window.scrollBy(0, -14);
      else if (e.clientY > window.innerHeight - 90) window.scrollBy(0, 14);
    }
  }
  function onDragEnd(e) {
    const d = dragRef.current;
    dragRef.current = null;
    setGhost(null);
    if (!d) return;
    if (!d.moved) {
      if (d.sub === "rotate") setInfoPos(d.payload);
      else pushToast("Arrastrá este botón hasta una posición vacía del mapa");
      return;
    }
    const dest = resolverDrop(e.clientX, e.clientY);
    if (d.sub === "mount") {
      if (dest && dest.pos != null && !posData[dest.pos]) setMontaje({ tipo: d.payload, pos: dest.pos });
      else pushToast("Soltá sobre una posición vacía del mapa");
    } else if (d.sub === "rotate") {
      if (!dest) return;
      if (dest.salida) { ejecutarSalida(d.payload, dest.salida); return; }
      if (dest.pos == null || dest.pos === d.payload) return;
      confirmarRotacion(d.payload, dest.pos);
    }
  }

  function agregarTarea() {
    if (!nuevaTarea.trim()) return;
    setChecklist(cs => [...cs, { id: uuid(), texto: nuevaTarea.trim(), done: false, extra: true }]);
    setNuevaTarea("");
  }

  async function finalizar() {
    setSaving(true);
    const numero_cambio = await siguienteNumeroCambio(clienteId, cfg).catch(() => String(Date.now()).slice(-6));
    const sistemaTotal = checklist.filter(c => !c.extra).length;
    const cumplidas = checklist.filter(c => !c.extra && c.done).length;
    const pendientesTareas = sistemaTotal - cumplidas;
    // Cierre del instructivo: parcial si quedan tareas, completado si no. Sin alerta.
    const recetaUpdate = recetaId.current ? {
      id: recetaId.current, estado: pendientesTareas > 0 ? "parcial" : "completado",
      tareas_cumplidas: cumplidas, tareas_pendientes: pendientesTareas
    } : null;
    const cab = {
      id_cambio: uuid(), equipo_id: equipo.id_equipo, bultero_id: user.id, cliente_id: clienteId,
      fecha: todayISO(), kilometraje: parseInt(km, 10) || equipo.kilometros,
      hora_ingreso: new Date(startedAt.current).toTimeString().slice(0, 8), hora_salida: nowHM(),
      psi_regulados: intervenciones.current.some(i => i.tipo === "regulacion_psi"),
      ruedas_torqueadas: intervenciones.current.filter(i => i.tipo === "retorqueo" || i.tipo === "checkpoint").length,
      observaciones: `Instructivo seguido: ${sistemaTotal ? Math.round((cumplidas / sistemaTotal) * 100) : 100}%`,
      numero_cambio,
      sale: sale.current, entra: entra.current, rotaciones: rotaciones.current, intervenciones: intervenciones.current,
      recetaUpdate
    };
    pushQueue({ id: uuid(), tipo: "cambio", clienteId, ts: Date.now(), data: cab });
    syncQueue();
    setSaving(false);
    onFinish();
  }

  // Instructivo pendiente: elegir usar el existente (carga el checklist) o abrir limpia.
  if (pendienteDlg) {
    return (
      <InstructivoPendienteModal pendiente={pendienteDlg}
        onUsar={async () => {
          const pa = pendienteDlg.posiciones_alerta || {};
          const recs = Array.isArray(pa.recomendaciones) ? pa.recomendaciones : [];
          const extras = Array.isArray(pa.tareas_extra) ? pa.tareas_extra : (Array.isArray(pendienteDlg.tareas_extra) ? pendienteDlg.tareas_extra : []);
          const cl = [
            ...recs.map(r => ({ id: r.id || uuid(), texto: r.texto, done: !!r.done, extra: false })),
            ...extras.map(t => ({ id: uuid(), texto: t.texto, done: !!t.done, extra: true, origen: t.origen || null }))
          ];
          setChecklist(cl);
          recetaId.current = pendienteDlg.id;
          try { await sb.from("auditorias_receta").update({ estado: "en_proceso" }).eq("id", pendienteDlg.id); } catch (e) { console.error(e); }
          setPendienteDlg(null);
        }}
        onLimpia={async () => {
          try { await sb.from("auditorias_receta").update({ estado: "sin_cambio" }).eq("id", pendienteDlg.id); } catch (e) { console.error(e); }
          recetaId.current = null;
          setPendienteDlg(null);
        }} />
    );
  }

  if (!kmSet) {
    return <KmModal equipo={equipo} clienteId={clienteId} mecanicoId={user.id} km={km} setKm={setKm} onContinue={() => {
      // Entrada directa (sin venir de auditoria): persistir los km en el equipo.
      // Encolado (no llamada directa a sb) para no perder el dato si esta offline.
      pushQueue({ id: uuid(), tipo: "update_equipo_km", clienteId, ts: Date.now(), data: { equipo_id: equipo.id_equipo, kilometros: parseInt(km, 10) } });
      syncQueue();
      setKmSet(true);
    }} />;
  }

  return (
    <div className="min-h-screen pb-[260px] safe-top">
      {toastNode}
      {ghost && <GhostTire x={ghost.x} y={ghost.y} />}
      <div className="sticky top-0 z-30 bg-white px-5 pt-14 pb-3 flex items-center gap-3">
        <button onClick={onCancel} className="w-9 h-9 rounded-full bg-[#F3F4F6] flex items-center justify-center shrink-0"><Icon.back width="18" height="18" /></button>
        <div>
          <h1 className="text-[20px] font-extrabold">Hoja de cambio · {equipo.patente}</h1>
          <p className="text-[12.5px] text-muted">Tocá un neumático para verlo, o arrastralo para rotarlo o sacarlo</p>
        </div>
      </div>

      <div className="px-5">
      {Object.values(posData).filter(d => d.numero_fuego && fuegosPendientesRef.current.includes(d.numero_fuego)).map(d => (
        <div key={d.posicion} className="bg-[#FEF3C7] rounded-2xl px-4 py-3 mb-3">
          <p className="font-bold text-[13.5px] text-[#92400E]">⚠ Posición {d.posicion} — Pendiente de aprobación</p>
          <p className="text-[12.5px] text-[#92400E] mt-1">El supervisor debe aprobar el cambio de neumático detectado en esta posición</p>
        </div>
      ))}
      <Card className="mb-4">
        <AxleMap cfg={axleCfg} posData={posData} selectedPos={null} onTap={() => {}}
          pendientesPos={new Set(Object.values(posData).filter(d => d.numero_fuego && fuegosPendientesRef.current.includes(d.numero_fuego)).map(d => d.posicion))}
          getDragHandlers={(p) => posData[p] ? { onPointerDown: (e) => onPointerDownTire(p, e), onPointerMove: onDragMove, onPointerUp: onDragEnd, onPointerCancel: onDragEnd } : undefined} />
      </Card>

      <p className="font-bold text-[15px] mb-2">Instructivo</p>
      <div className="space-y-2 mb-3">
        {checklist.map(c => {
          // HC-9: si la tarea menciona una posicion especifica ("posición N"/"pos N",
          // o "PN" que es el formato real de generarRecomendaciones, ej. "en P3 (...")
          // y ese neumatico esta montado, agrega un atajo directo a su modal de info.
          const m = /pos(?:ici[oó]n)?\.?\s*(\d+)|\bP(\d+)\b/i.exec(c.texto);
          const posMatch = m ? parseInt(m[1] || m[2], 10) : null;
          return (
            <div key={c.id} className="w-full text-left bg-white rounded-2xl border border-bd shadow-card px-4 py-3 flex items-center gap-3">
              <button onClick={() => setChecklist(cs => cs.map(x => x.id === c.id ? { ...x, done: !x.done } : x))} className="flex items-center gap-3 flex-1 min-w-0 text-left">
                <span className={cx("w-6 h-6 rounded-lg flex items-center justify-center shrink-0", c.done ? "bg-ink" : "bg-white border border-[#D1D5DB]")}>
                  {c.done && <Icon.check width="14" height="14" className="text-white" />}
                </span>
                <span className={cx("text-[14px] font-semibold flex-1", c.done && "strike")}>{c.texto}</span>
              </button>
              {c.origen && <Badge color="amber">De auditoría {formatDateLong(c.origen)}</Badge>}
              {c.extra && <Icon.pencil width="15" height="15" className="text-muted shrink-0" />}
              {posMatch != null && posData[posMatch] && (
                <button onClick={() => setInfoPos(posMatch)} className="text-[11px] font-bold text-ink px-2.5 py-1.5 rounded-full bg-[#F3F4F6] shrink-0 whitespace-nowrap">🔗 Ir al neumático</button>
              )}
            </div>
          );
        })}
      </div>
      <div className="flex gap-2 mb-6">
        <TextInput placeholder="Agregar tarea personalizada" value={nuevaTarea} onChange={e => setNuevaTarea(e.target.value)} onKeyDown={e => { if (e.key === "Enter") agregarTarea(); }} />
        <Button variant="subtle" onClick={agregarTarea}>+ Agregar</Button>
      </div>
      </div>

      <div className="fixed bottom-0 left-0 right-0 bg-white border-t border-bd p-4 safe-bottom space-y-3 z-30">
        <Button className="w-full" disabled={saving} onClick={finalizar}>{saving ? <span className="spinner" /> : "Finalizar hoja de cambio"}</Button>
        <div>
          <p className="text-[11.5px] font-bold text-muted tracking-wide uppercase mb-1.5">Entrada · arrastrá al mapa</p>
          <div className="grid grid-cols-3 gap-2">
            <button onPointerDown={(e) => onPointerDownEntrada("nuevo", e)} onPointerMove={onDragMove} onPointerUp={onDragEnd} onPointerCancel={onDragEnd}
              style={{ touchAction: "none" }} className="h-12 rounded-2xl text-[13.5px] font-bold bg-ink text-white">Nuevo</button>
            <button onPointerDown={(e) => onPointerDownEntrada("transito", e)} onPointerMove={onDragMove} onPointerUp={onDragEnd} onPointerCancel={onDragEnd}
              style={{ touchAction: "none" }} className="h-12 rounded-2xl text-[13.5px] font-bold bg-[#F3F4F6]">Tránsito</button>
            <button onPointerDown={(e) => onPointerDownEntrada("recauchado", e)} onPointerMove={onDragMove} onPointerUp={onDragEnd} onPointerCancel={onDragEnd}
              style={{ touchAction: "none" }} className="h-12 rounded-2xl text-[13.5px] font-bold bg-[#F3F4F6]">Recauchado</button>
          </div>
        </div>
        <div>
          <p className="text-[11.5px] font-bold text-muted tracking-wide uppercase mb-1.5">Salida · arrastrá el neumático acá</p>
          <div className="grid grid-cols-3 gap-2">
            <div data-salida="transito" className="h-12 rounded-2xl text-[13.5px] font-bold bg-[#F3F4F6] flex items-center justify-center">Tránsito</div>
            <div data-salida="reparacion" className="h-12 rounded-2xl text-[13.5px] font-bold bg-[#F3F4F6] flex items-center justify-center">Reparación</div>
            <div data-salida="retiro" className="h-12 rounded-2xl text-[13.5px] font-bold bg-[#FEE2E2] text-[#B91C1C] flex items-center justify-center gap-1"><Icon.trash width="14" height="14" />Retiro</div>
          </div>
        </div>
      </div>

      {infoPos != null && posData[infoPos] && (
        <TireInfoModal pos={infoPos} data={posData[infoPos]} cfg={cfg} equipo={equipo} axleCfg={axleCfg}
          onClose={() => setInfoPos(null)}
          onGirar={() => {
            setConfirmDlg({
              title: "Confirmar giro de neumático",
              desc: `¿Registrar el giro (inversión de cara) del neumático en P${infoPos} (${posData[infoPos].numero_fuego})?`,
              onConfirm: () => { registrarIntervencion("giro_neumatico", infoPos, {}); pushToast("✓ Giro registrado"); setConfirmDlg(null); setInfoPos(null); }
            });
          }}
          onRegularPsi={(nuevoPsi) => {
            setConfirmDlg({
              title: "Confirmar regulación de PSI",
              desc: `Ajustar P${infoPos} (${posData[infoPos].numero_fuego}) a ${nuevoPsi} psi.`,
              onConfirm: () => {
                const ahora = new Date().toISOString();
                // HC-10: el color del circulo se recalcula al toque (evaluarPosicion),
                // no solo al montar - asi pasa de rojo/amarillo a gris default en vivo
                // si la correccion deja el valor dentro de rango (nunca a verde).
                const ev = evaluarPosicion(axleCfg, cfg, infoPos, equipo.tipo, { ...posData[infoPos], psi: nuevoPsi });
                setPosData(s => ({ ...s, [infoPos]: { ...s[infoPos], psi: nuevoPsi, status: ev.status } }));
                registrarIntervencion("regulacion_psi", infoPos, { psi_nuevo: parseInt(nuevoPsi, 10), timestamp_inicio: ahora, timestamp_fin: ahora });
                if (ev.status !== "ok") pushQueue({ id: uuid(), tipo: "alerta", clienteId, ts: Date.now(), data: { id: uuid(), cliente_id: clienteId, equipo_id: equipo.id_equipo, mecanico_id: user.id, tipo: parseInt(nuevoPsi, 10) < ev.psiObjetivo ? "psi_bajo" : "psi_alto", severidad: ev.status === "alerta" ? "rojo" : "amarillo", titulo: "PSI fuera de rango tras regulación", descripcion: `P${infoPos} quedó en ${nuevoPsi} psi (objetivo ${ev.psiObjetivo})`, posicion: infoPos, numero_fuego: posData[infoPos].numero_fuego, leida_mecanico: false, leida_admin: false, leida_superadmin: false } });
                pushToast("✓ Regulación guardada");
                setConfirmDlg(null); setInfoPos(null);
              }
            });
          }}
          onRetorqueo={() => {
            setConfirmDlg({
              title: "Confirmar retorqueo",
              desc: `¿Registrar retorqueo en P${infoPos} (${posData[infoPos].numero_fuego})? Se confirma que se tomó la foto de checkpoint.`,
              onConfirm: () => { registrarIntervencion("retorqueo", infoPos, {}); pushToast("✓ Retorqueo registrado"); setConfirmDlg(null); setInfoPos(null); }
            });
          }}
          onReparacion={() => {
            setConfirmDlg({
              title: "Confirmar reparación",
              desc: `¿Registrar una reparación en P${infoPos} (${posData[infoPos].numero_fuego})?`,
              onConfirm: () => { registrarIntervencion("reparacion", infoPos, {}); pushToast("✓ Reparación registrada"); setConfirmDlg(null); setInfoPos(null); }
            });
          }}
        />
      )}

      {montaje && (
        <MontajeModal tipo={montaje.tipo} pos={montaje.pos} equipo={equipo} clienteId={clienteId} cfg={cfg} axleCfg={axleCfg} user={user}
          onClose={() => setMontaje(null)}
          onConfirm={(data) => setConfirmDlg({
            title: "Confirmar montaje",
            desc: `¿Montar el neumático ${data.numero_fuego} en la posición P${montaje.pos}?`,
            onConfirm: () => { montarNeumatico(montaje.pos, data, montaje.tipo); setConfirmDlg(null); }
          })}
        />
      )}

      {retiroSel && posData[retiroSel.pos] && (
        <RetiroModal pos={retiroSel.pos} fuego={posData[retiroSel.pos].numero_fuego} patente={equipo.patente}
          onClose={() => setRetiroSel(null)}
          onConfirm={(payload) => confirmarRetiro(retiroSel.pos, payload)} />
      )}

      {confirmDlg && <Confirm title={confirmDlg.title} desc={confirmDlg.desc} onConfirm={confirmDlg.onConfirm} onCancel={() => setConfirmDlg(null)} />}
    </div>
  );
}

function TireInfoModal({ pos, data, cfg, equipo, axleCfg, onClose, onRegularPsi, onRetorqueo, onReparacion, onGirar }) {
  const [psiField, setPsiField] = useState(String(data.psi || ""));
  const [showPsi, setShowPsi] = useState(false);
  const esDireccional = axleCfg && ejeTipoDePosicion(axleCfg, pos) === "D";
  return (
    <Modal title={`Posición P${pos}`} onClose={onClose}>
      <div className="mb-4">
        <p className="text-[22px] font-extrabold leading-none">{data.numero_fuego}</p>
        <p className="text-[13px] text-muted mt-1">{data.marca || "Sin marca"} · {data.medida || "-"}</p>
        <div className="flex gap-4 mt-3">
          <div><p className="text-[11px] text-muted font-semibold">PSI actual</p><p className="font-extrabold text-[16px]">{data.psi || "-"}</p></div>
          <div><p className="text-[11px] text-muted font-semibold">MM</p><p className="font-extrabold text-[16px]">{data.minMM != null ? data.minMM : "-"}</p></div>
          <div><p className="text-[11px] text-muted font-semibold">Estado</p><Badge color={statusColor(data.status)}>{statusLabel(data.status)}</Badge></div>
        </div>
      </div>
      {showPsi ? (
        <div className="space-y-3 mb-2">
          <Field label="Nuevo valor de PSI" required><TextInput type="number" inputMode="numeric" value={psiField} onChange={e => setPsiField(e.target.value)} /></Field>
          <Button className="w-full" disabled={!psiField} onClick={() => onRegularPsi(parseInt(psiField, 10))}>Guardar regulación</Button>
        </div>
      ) : (
        <div className="grid grid-cols-1 gap-2">
          <Button variant="subtle" onClick={() => setShowPsi(true)}><Icon.gauge width="18" height="18" /> Regulación PSI</Button>
          <Button variant="subtle" onClick={onRetorqueo}><Icon.wrench width="18" height="18" /> Retorqueo</Button>
          <Button variant="subtle" onClick={onReparacion}><Icon.bandage width="18" height="18" /> Reparación</Button>
          {esDireccional && (
            <Button variant="subtle" onClick={onGirar}><Icon.gauge width="18" height="18" /> Girar neumático (invertir cara)</Button>
          )}
          <p className="text-[11.5px] text-muted text-center mt-2">
            {esDireccional ? "Direccional: girá la cara si hay desgaste irregular, o cerrá esta ventana y arrastralo hasta la otra posición para cambiar de lado." : "Para rotarlo o sacarlo, cerrá esta ventana y arrastralo desde el mapa hasta otra posición o hasta Salida."}
          </p>
        </div>
      )}
    </Modal>
  );
}

// Tipo de neumatico esperado en una posicion, segun configuracion_ejes del
// equipo (HC-2). null = sin restriccion (SEMI o eje auxilio).
function tipoNeumaticoEsperado(equipo, axleCfg, pos) {
  if (equipo.tipo === "SEMI") return null;
  const ejeTipo = ejeTipoDePosicion(axleCfg, pos);
  if (ejeTipo === "auxilio") return null;
  if (ejeTipo === "D") return "direccional";
  if (ejeTipo === "T") return "eje_libre";
  return "traccional";
}
const TIPO_NEUMATICO_OPCIONES = [
  { slug: "direccional", label: "Direccional" },
  { slug: "traccional", label: "Traccional" },
  { slug: "eje_libre", label: "Eje libre" }
];
function TipoNeumaticoField({ equipo, axleCfg, pos, tipo, onChange, onIncorrecto }) {
  const esperado = tipoNeumaticoEsperado(equipo, axleCfg, pos);
  const avisado = useRef(false);
  function elegir(slug) {
    onChange(slug);
    if (esperado && slug !== esperado) {
      if (!avisado.current) { avisado.current = true; onIncorrecto(slug, esperado); }
    } else {
      avisado.current = false;
    }
  }
  const incorrecto = esperado && tipo && tipo !== esperado;
  return (
    <Field label="¿Qué tipo de neumático vas a montar?" required>
      <div className="grid grid-cols-3 gap-2">
        {TIPO_NEUMATICO_OPCIONES.map(o => (
          <button key={o.slug} type="button" onClick={() => elegir(o.slug)}
            className={cx("h-11 rounded-2xl text-[13px] font-bold border", tipo === o.slug ? "border-ink bg-[#F3F4F6]" : "border-bd bg-white")}>
            {o.label}
          </button>
        ))}
      </div>
      {incorrecto && esperado && (
        <p className="text-[12.5px] font-bold text-[#B91C1C] mt-2">
          La posición {pos} corresponde a neumáticos {TIPO_NEUMATICO_OPCIONES.find(o => o.slug === esperado).label.toLowerCase()} en un equipo {equipo.tipo === "SEMI" ? "semi" : equipo.configuracion_ejes}. No podés montar un {TIPO_NEUMATICO_OPCIONES.find(o => o.slug === tipo).label.toLowerCase()} ahí.
        </p>
      )}
    </Field>
  );
}
