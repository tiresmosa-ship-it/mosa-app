// Validador estricto y deterministico de rotaciones (hoja de cambio),
// autocontenido — no depende de axleCfg.groups/ladoDePosicion de
// js/supabase.js porque esas dos quedaban mal para este caso:
// ladoDePosicion partia el array de posiciones de la fila en "primera
// mitad"/"segunda mitad" en vez del lado real alternado (impar/par), y
// AXLE_CONFIGS.semi.groups separaba cada eje del semi en su propio grupo
// cuando el semi debe rotar totalmente libre. configEjes es
// '4x2'/'6x2'/'6x4'/'semi' (equipo.tipo==='SEMI' ? 'semi' : equipo.configuracion_ejes).
function esRotacionValida(posOrigen, posDestino, configEjes) {
  const ladoIzq = { "4x2": [3, 5], "6x2": [3, 5], "6x4": [3, 5, 7, 9] };
  const ladoDer = { "4x2": [4, 6], "6x2": [4, 6], "6x4": [4, 6, 8, 10] };
  const direccionales = [1, 2];
  const ejeLibre = [7, 8, 9, 10]; // solo 6x2
  const etiquetaConfig = { "4x2": "4x2", "6x2": "6x2", "6x4": "6x4" }[configEjes] || configEjes;
  const noPermitida = (motivo) => ({
    valid: false,
    msg: `Rotación no permitida: en configuración ${etiquetaConfig} no se permite intercambiar la posición ${posOrigen} con la posición ${posDestino}${motivo ? ` (${motivo})` : ""}.`
  });

  if (configEjes === "semi") return { valid: true };
  // Equipo sin configuracion de ejes cargada (dato faltante, no infrecuente en
  // equipos viejos) — no hay matriz contra la cual validar, asi que se
  // bloquea con un mensaje claro en vez de caer "por descarte" en el mensaje
  // generico de "lados opuestos" (eso es lo que hacia que la funcion pareciera
  // funcionar "intermitente": bloqueaba SIEMPRE, sin explicar por que, en
  // cualquier equipo al que le faltara este dato).
  if (!configEjes) {
    return { valid: false, msg: "Este equipo no tiene configuración de ejes definida — no se puede validar la rotación. Pedile al Admin que la complete en Equipos." };
  }

  const ambosDir = direccionales.includes(posOrigen) && direccionales.includes(posDestino);
  if (ambosDir) return { valid: true };

  const unoDir = direccionales.includes(posOrigen) || direccionales.includes(posDestino);
  if (unoDir) return noPermitida("un direccional no rota con un traccional");

  if (configEjes === "6x2") {
    const ambosEL = ejeLibre.includes(posOrigen) && ejeLibre.includes(posDestino);
    if (ambosEL) return { valid: true };
    const unoEL = ejeLibre.includes(posOrigen) || ejeLibre.includes(posDestino);
    if (unoEL) return noPermitida("el eje libre solo rota entre sus propias posiciones");
  }

  const izq = ladoIzq[configEjes] || [];
  const der = ladoDer[configEjes] || [];
  const fromIzq = izq.includes(posOrigen), toIzq = izq.includes(posDestino);
  const fromDer = der.includes(posOrigen), toDer = der.includes(posDestino);
  if ((fromIzq && toIzq) || (fromDer && toDer)) return { valid: true };

  return noPermitida("reglas de desgaste y tracción, no se cruzan neumáticos de lados opuestos");
}

function CambioForm({ user, clienteId, equipo, cfg, axleCfg, posDataInicial, checklistInicial, kmInicial, recetaIdInicial, pendiente, discrepanciasNeumaticosInicial, recsInfo, onFinish, onCancel }) {
  // Requerimiento 4: si hay un km guardado en localStorage para este equipo
  // hace menos de 8hs, se usa directo sin volver a pedirlo (independiente de
  // si se llego a hacer algun cambio en la HC o no, y de si el mecanico
  // salio y volvio a entrar).
  const kmGuardadoLocal = kmInicial ? null : leerKmGuardado(equipo.id_equipo);
  const [km, setKm] = useState(kmInicial || (kmGuardadoLocal != null ? String(kmGuardadoLocal) : ""));
  const [kmSet, setKmSet] = useState(!!kmInicial || kmGuardadoLocal != null);
  // Fix 6: si hay una sesion de HC ya abierta hoy para este equipo (header
  // creado, hora_salida todavia null) hace menos de 8hs, se hereda el km de
  // esa sesion y no se vuelve a pedir ni se genera alerta de "km repetidos".
  // undefined = todavia verificando, null = no aplica (pedir km como siempre).
  const [sesionActiva, setSesionActiva] = useState((kmInicial || kmGuardadoLocal != null) ? null : undefined);
  useEffect(() => {
    if (kmInicial || kmGuardadoLocal != null) return; // ya viene de una auditoria de hoy o de localStorage, no hace falta chequear
    let cancel = false;
    db.fetchCambioActivoReciente(equipo.id_equipo, user.id).then(s => {
      if (cancel) return;
      const reciente = s && s.creado_en && (Date.now() - new Date(s.creado_en).getTime()) < 8 * 3600000;
      if (reciente) {
        setKm(String(s.kilometraje));
        setKmSet(true);
        setSesionActiva(s);
        guardarKm(equipo.id_equipo, s.kilometraje);
      } else setSesionActiva(null);
    }).catch(() => { if (!cancel) setSesionActiva(null); });
    return () => { cancel = true; };
  }, []);
  useEffect(() => { if (kmInicial) guardarKm(equipo.id_equipo, parseInt(kmInicial, 10)); }, []);
  // Fix 3 / Fix 4: log de "Movimientos realizados" — se va llenando en vivo
  // con logMovimiento() a medida que se confirma cada accion. Se cachea en
  // localStorage (clave hc_log_[patente], con fecha para no arrastrar el de
  // otro dia) para que un F5 lo muestre al instante; en paralelo se
  // reconstruye siempre desde cambio_detalle/intervenciones (fuente de
  // verdad) para no depender de que sesionActiva se haya calculado -- antes
  // esto solo pasaba si sesionActiva quedaba seteada, pero el atajo de km
  // cacheado (leerKmGuardado) hace que sesionActiva se salte (quede null) en
  // el caso mas comun, y el log se perdia en cada F5.
  const HC_LOG_KEY = "hc_log_" + equipo.patente;
  function leerLogGuardado() {
    try {
      const raw = localStorage.getItem(HC_LOG_KEY);
      if (!raw) return [];
      const d = JSON.parse(raw);
      return d && d.fecha === todayISO() && Array.isArray(d.items) ? d.items : [];
    } catch (e) { return []; }
  }
  function guardarLog(items) {
    try { localStorage.setItem(HC_LOG_KEY, JSON.stringify({ fecha: todayISO(), items })); } catch (e) {}
  }
  const [movimientos, setMovimientos] = useState(leerLogGuardado);
  function logMovimiento(texto, detalle) {
    setMovimientos(m => {
      const next = [...m, { id: uuid(), creado_en: new Date().toISOString(), texto, detalle: detalle || null }];
      guardarLog(next);
      return next;
    });
  }
  useEffect(() => {
    let cancel = false;
    db.fetchCambioActivoReciente(equipo.id_equipo, user.id).then(s => {
      if (cancel || !s) return;
      db.fetchMovimientosCambio(s.id_cambio, equipo.id_equipo, user.id)
        .then(items => { if (cancel) return; setMovimientos(items); guardarLog(items); })
        .catch(e => console.error("No se pudo reconstruir el log de movimientos", e));
    }).catch(() => {});
    return () => { cancel = true; };
  }, []);
  // Requerimiento 2: cantidad en vivo de cada bodega en los botones de
  // entrada (ej. "Nuevo (10)") — se recarga cada vez que un montaje exitoso
  // descuenta stock, para no quedar desincronizado del numero real.
  const [stockBodega, setStockBodega] = useState({ nuevo: null, transito: null, recauchado: null });
  function refrescarStockBodega() {
    Promise.all(["nuevo", "transito", "recauchado"].map(b => fetchNeumaticosBodega(clienteId, b).then(l => l.length).catch(() => null)))
      .then(([nuevo, transito, recauchado]) => setStockBodega({ nuevo, transito, recauchado }));
  }
  useEffect(() => {
    refrescarStockBodega();
    window.addEventListener("mosa-sync-done", refrescarStockBodega);
    return () => window.removeEventListener("mosa-sync-done", refrescarStockBodega);
  }, []);
  const [posData, setPosData] = useState(() => ({ ...posDataInicial }));
  // Item 9: posiciones con discrepancia de neumatico sin aprobar por el Admin
  // (numero_fuego/marca/medida no coincidian al auditar) - muestran banner +
  // candado en el mapa, pero no bloquean el resto del trabajo. El candado
  // sigue al NEUMATICO (numero_fuego), no a la posicion fija de la auditoria,
  // para que se mueva correctamente si el mecanico lo rota.
  const discrepanciasPendientes = (discrepanciasNeumaticosInicial || []).filter(d => !d.aprobada);
  const [fuegosPendientes, setFuegosPendientes] = useState(
    discrepanciasPendientes.map(d => d.campo === "numero_fuego" ? d.valor_mecanico : (posDataInicial[d.posicion] && posDataInicial[d.posicion].numero_fuego)).filter(Boolean)
  );
  const posDataRef = useRef(posData);
  useEffect(() => { posDataRef.current = posData; }, [posData]);
  // recetaId se declara antes que este effect porque lo usa en el deps array.
  const recetaId = useRef(recetaIdInicial || null);
  // Bug 4: si el Admin aprueba la discrepancia mientras el mecanico sigue en
  // la hoja de cambio, sacarle el 🔒/cartel sin que tenga que recargar.
  // Solo se prende el polling si hay algo pendiente (evita pegarle a la DB
  // en el caso comun de que no haya discrepancias sin aprobar).
  useEffect(() => {
    if (!fuegosPendientes.length || !recetaId.current) return;
    let cancel = false;
    const t = setInterval(async () => {
      try {
        const { data, error } = await sb.from("auditorias_receta").select("posiciones_alerta").eq("id", recetaId.current).maybeSingle();
        if (error || !data || cancel) return;
        const pa = data.posiciones_alerta || {};
        const lista = Array.isArray(pa.discrepancias_neumaticos) ? pa.discrepancias_neumaticos : [];
        const pd = posDataRef.current;
        const siguenPendientes = lista.filter(d => !d.aprobada)
          .map(d => d.campo === "numero_fuego" ? d.valor_mecanico : (pd[d.posicion] && pd[d.posicion].numero_fuego))
          .filter(Boolean);
        if (!cancel) setFuegosPendientes(prev => prev.filter(f => siguenPendientes.includes(f)));
      } catch (e) { console.error("No se pudo verificar discrepancias resueltas", e); }
    }, 60000);
    return () => { cancel = true; clearInterval(t); };
  }, [fuegosPendientes.length, recetaId.current]);
  const [checklist, setChecklist] = useState(checklistInicial);
  // Requerimiento 1: reflejar en vivo, sin recargar, las tareas que el Admin
  // agrega o deriva a Pendiente mientras el mecanico sigue con la HC abierta
  // (y viceversa, ver dashboard-actividad-faena en admin.html/superadmin.html).
  // Se agregan las tareas nuevas que trajo el servidor y se sacan del
  // checklist activo las que el servidor ya no tiene (derivadas a pendiente).
  useEffect(() => {
    if (!recetaId.current) return;
    const canal = sb.channel("hc-checklist-" + recetaId.current)
      .on("postgres_changes", { event: "UPDATE", schema: "public", table: "auditorias_receta", filter: `id=eq.${recetaId.current}` }, (payload) => {
        const pa = (payload.new && payload.new.posiciones_alerta) || {};
        const recs = Array.isArray(pa.recomendaciones) ? pa.recomendaciones : [];
        const extras = Array.isArray(pa.tareas_extra) ? pa.tareas_extra : [];
        const idsServidor = new Set([...recs.map(r => r.id), ...extras.map(t => t.id)]);
        setChecklist(cs => {
          const vigentes = cs.filter(c => idsServidor.has(c.id));
          const idsLocales = new Set(vigentes.map(c => c.id));
          const nuevasRecs = recs.filter(r => !idsLocales.has(r.id)).map(r => ({ id: r.id, texto: r.texto, done: !!r.done, extra: false }));
          const nuevasExtras = extras.filter(t => !idsLocales.has(t.id)).map(t => ({ id: t.id, texto: t.texto, done: !!t.done, extra: true, origen: t.origen || null, tipo_origen: t.tipo_origen, creado_por: t.creado_por, fecha_origen: t.fecha_origen }));
          if (vigentes.length === cs.length && !nuevasRecs.length && !nuevasExtras.length) return cs;
          if (nuevasRecs.length || nuevasExtras.length) pushToast("🔔 Nueva tarea agregada al instructivo");
          return [...vigentes, ...nuevasRecs, ...nuevasExtras];
        });
      }).subscribe();
    return () => { sb.removeChannel(canal); };
  }, [recetaId.current]);
  const [nuevaTarea, setNuevaTarea] = useState("");
  const [infoPos, setInfoPos] = useState(null);
  const [montaje, setMontaje] = useState(null); // { tipo, pos }
  const [retiroSel, setRetiroSel] = useState(null); // { pos }
  const [confirmDlg, setConfirmDlg] = useState(null); // { title, desc, onConfirm }
  const [ghost, setGhost] = useState(null); // { x, y }
  const [pushToast, toastNode] = useToasts();
  // Instructivo pendiente (solo entrada directa a la hoja, no viniendo de auditoria):
  // null = ya resuelto / no hay; objeto = falta que el mecanico elija.
  const [pendienteDlg, setPendienteDlg] = useState(pendiente || null);
  const startedAt = useRef(Date.now());
  const entra = useRef([]);
  const sale = useRef([]);
  const rotaciones = useRef([]);
  const intervenciones = useRef([]);
  const dragRef = useRef(null);
  const [saving, setSaving] = useState(false);
  // Bug 1 (persistencia HC): id_cambio se crea una sola vez, en el primer
  // movimiento de la sesion, y se reusa para todos los movimientos
  // siguientes hasta "Finalizar". headerPromiseRef evita crear el header
  // dos veces si dos acciones se confirman casi al mismo tiempo.
  const cambioIdRef = useRef(null);
  const headerPromiseRef = useRef(null);
  function ensureCambioHeader() {
    if (headerPromiseRef.current) return headerPromiseRef.current;
    // Fix 6: si ya hay una sesion de HC activa y reciente para este equipo
    // (detectada al abrir la pantalla), reusar su id_cambio en vez de crear
    // un header nuevo — evita duplicar cambios_neumaticos para la misma HC.
    if (sesionActiva) { headerPromiseRef.current = Promise.resolve(sesionActiva.id_cambio); cambioIdRef.current = sesionActiva.id_cambio; return headerPromiseRef.current; }
    headerPromiseRef.current = (async () => {
      const id_cambio = uuid();
      const numero_cambio = await siguienteNumeroCambio(clienteId, cfg).catch(() => String(Date.now()).slice(-6));
      cambioIdRef.current = id_cambio;
      pushQueue({
        id: uuid(), tipo: "cambio_header", clienteId, ts: Date.now(), data: {
          id_cambio, equipo_id: equipo.id_equipo, bultero_id: user.id, cliente_id: clienteId,
          fecha: todayISO(), kilometraje: parseInt(km, 10) || equipo.kilometros,
          hora_ingreso: new Date(startedAt.current).toTimeString().slice(0, 8), numero_cambio,
          hora_salida: null, observaciones: null, ruedas_torqueadas: 0, psi_regulados: false
        }

  }
  // Persiste de inmediato el checklist (tareas tachadas) en
  // auditorias_receta.posiciones_alerta, para que un refresh no las pierda.
  function persistChecklist(cs) {
    if (!recetaId.current) return;
    const recomendaciones = cs.filter(c => !c.extra).map(c => {
      const r = (recsInfo && recsInfo.recs || []).find(x => x.id === c.id) || {};
      return { id: c.id, key: r.key || null, texto: c.texto, done: !!c.done, tipo_origen: c.tipo_origen || "sistema", creado_por: c.creado_por || "Sistema (Automático)", fecha_origen: c.fecha_origen || todayISO(), estado: c.done ? "COMPLETADA" : "HACER_HOY" };
    });
    const tareas_extra = cs.filter(c => c.extra).map(c => ({ texto: c.texto, done: !!c.done, origen: c.origen || null, tipo_origen: c.tipo_origen || "mecanico", creado_por: c.creado_por || null, fecha_origen: c.fecha_origen || todayISO(), estado: c.done ? "COMPLETADA" : "HACER_HOY" }));
    pushQueue({
      id: uuid(), tipo: "cambio_checklist", clienteId, ts: Date.now(), data: {
        receta_id: recetaId.current,
        posiciones_alerta: { recomendaciones, discrepancias_neumaticos: discrepanciasNeumaticosInicial || [], tareas_extra }
      }
    });
    syncQueue();
  }

  function registrarIntervencion(tipo, pos, extra) {
    const iv = {
      id: uuid(), equipo_id: equipo.id_equipo, mecanico_id: user.id, cliente_id: clienteId,
      fecha: todayISO(), tipo, posicion: pos, numero_fuego: posData[pos] ? posData[pos].numero_fuego : null,
      psi_nuevo: extra && extra.psi_nuevo != null ? extra.psi_nuevo : null,
      observaciones: (extra && extra.observaciones) || null, foto_url: (extra && extra.foto_url) || null,
      timestamp_inicio: (extra && extra.timestamp_inicio) || null, timestamp_fin: (extra && extra.timestamp_fin) || null
    };
    intervenciones.current.push(iv);
    pushQueue({ id: uuid(), tipo: "cambio_item", clienteId, ts: Date.now(), data: { kind: "intervencion", cliente_id: clienteId, item: iv } });
    syncQueue();
    // Fix 3: log de movimientos
    if (tipo === "regulacion_psi") logMovimiento(`Regulación PSI pos ${pos} → ${iv.psi_nuevo} PSI`);
    else if (tipo === "retorqueo") logMovimiento(`Retorqueo pos ${pos}`);
    else if (tipo === "checkpoint") logMovimiento(`Foto pos ${pos} ✓`);
    else if (tipo === "reparacion") logMovimiento(`Reparación pos ${pos}`);
    else if (tipo === "giro_neumatico") logMovimiento(`Giro pos ${pos}`);
  }
  // Requerimiento 2: alargadera/checkpoint colocados en esta posicion --
  // toggle simple, no pasa por intervenciones (estado del neumatico, no
  // evento puntual). Se actualiza posData al toque y se encola el update.
  function actualizarExtras(pos, cambios) {
    const d = posData[pos];
    if (!d || !d.numero_fuego) return;
    setPosData(s => ({ ...s, [pos]: { ...s[pos], ...cambios } }));
    pushQueue({ id: uuid(), tipo: "cambio_item", clienteId, ts: Date.now(), data: { kind: "extras", cliente_id: clienteId, item: { numero_fuego: d.numero_fuego, ...cambios } } });
    syncQueue();
  }

  function ejecutarSalida(pos, motivo) {
    const d = posData[pos];
    // Retiro: pide confirmacion + motivo (modal aparte, 2 pasos). Transito/reparacion: confirmacion directa.
    if (motivo === "retiro") { setRetiroSel({ pos }); return; }
    const label = motivo === "transito" ? "tránsito" : "reparación";
    const origenMov = motivo === "transito" ? "desmontaje_transito" : "desmontaje_reparacion";
    setConfirmDlg({
      title: "Confirmar salida",
      desc: `¿Enviar el neumático ${d.numero_fuego} (P${pos}) a ${label}?`,
      onConfirm: () => {
        const item = { numero_fuego: d.numero_fuego, posicion: pos, milimetros: d.minMM || null, psi: d.psi || null, motivo, motivo_salida: motivo, origen_mov: origenMov };
        sale.current.push(item);
        ensureCambioHeader().then(cambio_id => {
          pushQueue({ id: uuid(), tipo: "cambio_item", clienteId, ts: Date.now(), data: { kind: "sale", cambio_id, cliente_id: clienteId, mecanico_id: user.id, item } });
          syncQueue();
        });
        setPosData(s => { const n = { ...s }; delete n[pos]; return n; });
        pushToast("✓ Salida registrada");
        logMovimiento(`Salida pos ${pos} → ${label === "tránsito" ? "Tránsito" : "Reparación"}`, `N° fuego: ${d.numero_fuego}`);
        setConfirmDlg(null); setInfoPos(null);
      }
    });
  }
  function confirmarRetiro(pos, { sel, mm, justificacion }) {
    const d = posData[pos];
    const esDesgaste = sel === "desgaste_normal";
    const motivoSalida = esDesgaste ? "retiro_desgaste" : "retiro_daño_otro";
    const milimetros = esDesgaste ? (parseFloat(mm) || null) : (d.minMM || null);
    const itemRetiro = { numero_fuego: d.numero_fuego, posicion: pos, milimetros, psi: d.psi || null, motivo: motivoSalida, motivo_salida: motivoSalida, origen_mov: motivoSalida };
    sale.current.push(itemRetiro);
    ensureCambioHeader().then(cambio_id => {
      pushQueue({ id: uuid(), tipo: "cambio_item", clienteId, ts: Date.now(), data: { kind: "sale", cambio_id, cliente_id: clienteId, mecanico_id: user.id, item: itemRetiro } });
      syncQueue();
    });
    if (!esDesgaste) {
      pushQueue({
        id: uuid(), tipo: "alerta", clienteId, ts: Date.now(), data: {
          id: uuid(), cliente_id: clienteId, equipo_id: equipo.id_equipo, mecanico_id: user.id,
          tipo: "baja_prematura", severidad: "amarillo", titulo: `Retiro por daño/otro — ${equipo.patente} pos ${pos}`,
          descripcion: sel === "otro" ? justificacion : "Retiro por daño", posicion: pos, numero_fuego: d.numero_fuego,
          leida_mecanico: true, leida_admin: false, leida_superadmin: false
        }
      });
      syncQueue();
    }
    setPosData(s => { const n = { ...s }; delete n[pos]; return n; });
    pushToast("✓ Retiro registrado");
    logMovimiento(`Salida pos ${pos} → Retiro`, `N° fuego: ${d.numero_fuego}`);
    setRetiroSel(null); setInfoPos(null);
  }

  function montarNeumatico(pos, data, tipo) {
    setPosData(s => ({ ...s, [pos]: { ...data, posicion: pos, status: "ok", minMM: data.mm ? parseFloat(data.mm) : null } }));
    // Bug 1/2: tipo de neumatico (direccional/traccional/eje_libre) inferido
    // de la posicion + configuracion de ejes, no tipeado a mano — se graba en
    // neumaticos.tipo via asegurarNeumatico/actualizarNeumaticoEntra. "estado"
    // sigue siendo el origen del montaje (nuevo/transito/recauchado), campo
    // distinto que ya usaba cambio_detalle.estado.
    const itemEntra = { numero_fuego: data.numero_fuego, posicion: pos, milimetros: data.mm ? parseFloat(data.mm) : null, psi: data.psi ? parseInt(data.psi, 10) : null, estado: tipo, tipo: inferirTipoNeumatico(equipo, axleCfg, pos), marca: data.marca || null, modelo: data.modelo || null, medida: data.medida || null };
    entra.current.push(itemEntra);
    ensureCambioHeader().then(cambio_id => {
      pushQueue({ id: uuid(), tipo: "cambio_item", clienteId, ts: Date.now(), data: { kind: "entra", cambio_id, cliente_id: clienteId, mecanico_id: user.id, equipo_id: equipo.id_equipo, item: itemEntra } });
      syncQueue();
    });
    if (tipo === "nuevo") registrarIntervencion("checkpoint", pos, { foto_url: data.fotoUrl, observaciones: "Montaje de neumático nuevo, torqueado y checkpoint confirmado" });
    if (data.marcaModeloNoRegistrado) {
      pushQueue({
        id: uuid(), tipo: "alerta", clienteId, ts: Date.now(), data: {
          id: uuid(), cliente_id: clienteId, equipo_id: equipo.id_equipo, mecanico_id: user.id,
          tipo: "marca_modelo_no_registrado", severidad: "amarillo",
          titulo: `Marca/modelo no registrado — ${equipo.patente} pos ${pos}`,
          descripcion: `Mecánico ingresó ${data.marca || ""} ${data.modelo || ""} que no está en el catálogo del cliente`,
          posicion: pos, numero_fuego: data.numero_fuego || null,
          leida_mecanico: true, leida_admin: false, leida_superadmin: false
        }
      });
      syncQueue();
    }
    // Requerimiento 2: descuento optimista en el boton de la bodega usada —
    // el numero real se re-confirma con refrescarStockBodega() apenas
    // sincroniza (por si el montaje vino de fuera de stock y no correspondia
    // descontar nada, o de una fila que ya no contaba en el listado).
    if (data.deBodega) setStockBodega(s => ({ ...s, [tipo]: s[tipo] != null ? Math.max(0, s[tipo] - 1) : s[tipo] }));
    pushToast("✓ Montaje registrado");
    logMovimiento(`Entrada pos ${pos} → ${tipo === "nuevo" ? "Nuevo" : tipo === "transito" ? "Tránsito" : "Recauchado"}`, `N° fuego: ${data.numero_fuego}`);
    setMontaje(null);
  }

  function confirmarRotacion(origen, destino) {
    const configEjes = equipo.tipo === "SEMI" ? "semi" : equipo.configuracion_ejes;
    const check = esRotacionValida(origen, destino, configEjes);
    if (!check.valid) {
      if (navigator.vibrate) navigator.vibrate(200);
      pushToast(`✕ ${check.msg}`, "red");
      return;
    }
    const destFuego = posData[destino] ? posData[destino].numero_fuego : null;
    setConfirmDlg({
      title: "Confirmar rotación",
      desc: destFuego ? `¿Intercambiar el neumático de P${origen} con el de P${destino}?` : `¿Mover el neumático de P${origen} a la posición P${destino}?`,
      onConfirm: () => {
        const a = posData[origen], b = posData[destino];
        // Registrar la rotacion para persistirla (4 filas de cambio_detalle si es
        // intercambio, 2 si es mover a posicion vacia). No cambia inventario.
        const itemRot = {
          origen, destino,
          a: { numero_fuego: a.numero_fuego, mm: a.minMM != null ? a.minMM : null, psi: a.psi || null },
          b: b ? { numero_fuego: b.numero_fuego, mm: b.minMM != null ? b.minMM : null, psi: b.psi || null } : null
        };
        rotaciones.current.push(itemRot);
        ensureCambioHeader().then(cambio_id => {
          pushQueue({ id: uuid(), tipo: "cambio_item", clienteId, ts: Date.now(), data: { kind: "rotacion", cambio_id, cliente_id: clienteId, equipo_id: equipo.id_equipo, item: itemRot } });
          syncQueue();
        });
        setPosData(s => {
          const next = { ...s };
          const na = next[origen], nb = next[destino];
          if (nb) next[origen] = { ...nb, posicion: origen }; else delete next[origen];
          next[destino] = { ...na, posicion: destino };
          return next;
        });
        pushToast("✓ Rotación registrada");
        logMovimiento(`Rotación pos ${origen} ↔ pos ${destino}`);
        setConfirmDlg(null);
      }
    });
  }

  function resolverDrop(clientX, clientY) {
    const el = document.elementFromPoint(clientX, clientY);
    const salidaEl = el && el.closest("[data-salida]");
    if (salidaEl) return { salida: salidaEl.getAttribute("data-salida") };
    const posEl = el && el.closest("[data-pos]");
    return posEl ? { pos: parseInt(posEl.getAttribute("data-pos"), 10) } : null;
  }

  function onPointerDownTire(pos, e) {
    if (!posData[pos]) return;
    dragRef.current = { sub: "rotate", payload: pos, startX: e.clientX, startY: e.clientY, moved: false };
    try { e.currentTarget.setPointerCapture(e.pointerId); } catch (err) {}
  }
  function onPointerDownEntrada(tipo, e) {
    dragRef.current = { sub: "mount", payload: tipo, startX: e.clientX, startY: e.clientY, moved: false };
    try { e.currentTarget.setPointerCapture(e.pointerId); } catch (err) {}
  }
  function onDragMove(e) {
    const d = dragRef.current;
    if (!d) return;
    const dx = e.clientX - d.startX, dy = e.clientY - d.startY;
    if (!d.moved && Math.hypot(dx, dy) > 10) d.moved = true;
    if (d.moved) {
      e.preventDefault();
      setGhost({ x: e.clientX, y: e.clientY });
      if (e.clientY < 90) window.scrollBy(0, -14);
      else if (e.clientY > window.innerHeight - 90) window.scrollBy(0, 14);
    }
  }
  function onDragEnd(e) {
    const d = dragRef.current;
    dragRef.current = null;
    setGhost(null);
    if (!d) return;
    if (!d.moved) {
      if (d.sub === "rotate") setInfoPos(d.payload);
      else pushToast("Arrastrá este botón hasta una posición vacía del mapa");
      return;
    }
    const dest = resolverDrop(e.clientX, e.clientY);
    if (d.sub === "mount") {
      if (dest && dest.pos != null && !posData[dest.pos]) setMontaje({ tipo: d.payload, pos: dest.pos });
      else pushToast("Soltá sobre una posición vacía del mapa");
    } else if (d.sub === "rotate") {
      if (!dest) return;
      if (dest.salida) { ejecutarSalida(d.payload, dest.salida); return; }
      if (dest.pos == null || dest.pos === d.payload) return;
      confirmarRotacion(d.payload, dest.pos);
    }
  }

  function agregarTarea() {
    if (!nuevaTarea.trim()) return;
    setChecklist(cs => {
      // Requerimiento 2C: tarea propia del mecanico, marcada como tal para que
      // el Admin sepa quien la agrego (tipo_origen/creado_por/fecha_origen).
      const next = [...cs, { id: uuid(), texto: nuevaTarea.trim(), done: false, extra: true, tipo_origen: "mecanico", creado_por: user.nombre, fecha_origen: todayISO(), estado: "HACER_HOY" }];
      persistChecklist(next);
      return next;
    });
    setNuevaTarea("");
  }
  // Requerimiento 2C: derivar una tarea a "Pendiente" (solo si
  // puede_modificar_instructivo) — sale del checklist activo de hoy y queda
  // guardada en tareas_diferidas de esta receta para que el Admin la vea en
  // Equipos > Tareas Pendientes, y para que la proxima auditoria/HC de este
  // equipo la traiga de nuevo automaticamente.
  async function diferirTarea(c) {
    if (!recetaId.current) return;
    const tarea = { id: c.id, texto: c.texto, tipo_origen: c.tipo_origen || "sistema", creado_por: c.creado_por || "Sistema (Automático)", fecha_origen: c.fecha_origen || todayISO() };
    try {
      await db.diferirTareaChecklist(recetaId.current, tarea);
      setChecklist(cs => {
        const next = cs.filter(x => x.id !== c.id);
        persistChecklist(next);
        return next;
      });
      pushToast("→ Tarea derivada a Pendiente");
    } catch (e) { console.error("No se pudo derivar la tarea", e); pushToast("✕ No se pudo derivar la tarea", "red"); }
  }

  async function finalizar() {
    setSaving(true);
    // Bug 1: el header (cambios_neumaticos) y cada movimiento ya se
    // persistieron de forma incremental al confirmarse (ensureCambioHeader +
    // cambio_item). Si el mecanico no hizo ningun movimiento, el header
    // todavia no existe: se crea aca recien, sin detalle. "Finalizar" solo
    // cierra esa cabecera (hora_salida/observaciones) y el instructivo.
    const cambio_id = await ensureCambioHeader();
    // Requerimiento 3: el % de cumplimiento cuenta TODAS las tareas activas de
    // hoy (sistema + admin + mecanico, ya no solo las del sistema como antes)
    // — las que ya se derivaron a mano a Pendiente ya salieron de `checklist`
    // (ver diferirTarea), asi que no entran en el divisor.
    const totalActivas = checklist.length;
    const cumplidas = checklist.filter(c => c.done).length;
    const sinCompletar = checklist.filter(c => !c.done);
    // Requerimiento 3.3: lo que quedo sin completar al cerrar se deriva solo
    // a Pendiente (no hace falta que el mecanico lo mueva a mano) — queda
    // guardado en tareas_diferidas para Equipos > Tareas Pendientes y para
    // que la proxima auditoria/HC de este equipo lo traiga de nuevo.
    if (sinCompletar.length && recetaId.current) {
      for (const c of sinCompletar) {
        try {
          await db.diferirTareaChecklist(recetaId.current, { id: c.id, texto: c.texto, tipo_origen: c.tipo_origen || "sistema", creado_por: c.creado_por || "Sistema (Automático)", fecha_origen: c.fecha_origen || todayISO() });
        } catch (e) { console.error("No se pudo derivar una tarea inconclusa a pendiente", e); }
      }
    }
    // Cierre del instructivo: parcial si quedan tareas, completado si no. Sin alerta.
    const recetaUpdate = recetaId.current ? {
      id: recetaId.current, estado: sinCompletar.length > 0 ? "parcial" : "completado",
      tareas_cumplidas: cumplidas, tareas_pendientes: sinCompletar.length
    } : null;
    pushQueue({
      id: uuid(), tipo: "cambio_cierre", clienteId, ts: Date.now(), data: {
        id_cambio: cambio_id, equipo_id: equipo.id_equipo, kilometraje: parseInt(km, 10) || equipo.kilometros,
        hora_salida: nowHM(),
        psi_regulados: intervenciones.current.some(i => i.tipo === "regulacion_psi"),
        ruedas_torqueadas: intervenciones.current.filter(i => i.tipo === "retorqueo" || i.tipo === "checkpoint").length,
        observaciones: `Instructivo seguido: ${totalActivas ? Math.round((cumplidas / totalActivas) * 100) : 100}%`,
        recetaUpdate
      }
    });
    syncQueue();
    db.registrarEventoSesion(clienteId, equipo.id_equipo, user.id, "HOJA_CAMBIO_FINALIZADA", { cambioId: cambio_id, equipoLabel: equipo.patente, mecanicoNombre: user.nombre }).catch(e => console.error(e));
    setSaving(false);
    onFinish();
  }

  // Instructivo pendiente: elegir usar el existente (carga el checklist) o abrir limpia.
  if (pendienteDlg) {
    return (
      <InstructivoPendienteModal pendiente={pendienteDlg}
        onUsar={async () => {
          const pa = pendienteDlg.posiciones_alerta || {};
          const recs = Array.isArray(pa.recomendaciones) ? pa.recomendaciones : [];
          const extras = Array.isArray(pa.tareas_extra) ? pa.tareas_extra : (Array.isArray(pendienteDlg.tareas_extra) ? pendienteDlg.tareas_extra : []);
          const cl = [
            ...recs.map(r => ({ id: r.id || uuid(), texto: r.texto, done: !!r.done, extra: false })),
            ...extras.map(t => ({ id: uuid(), texto: t.texto, done: !!t.done, extra: true, origen: t.origen || null }))
          ];
          setChecklist(cl);
          recetaId.current = pendienteDlg.id;
          try { await sb.from("auditorias_receta").update({ estado: "en_proceso" }).eq("id", pendienteDlg.id); } catch (e) { console.error(e); }
          setPendienteDlg(null);
        }}
        onLimpia={async () => {
          try { await sb.from("auditorias_receta").update({ estado: "sin_cambio" }).eq("id", pendienteDlg.id); } catch (e) { console.error(e); }
          recetaId.current = null;
          setPendienteDlg(null);
        }} />
    );
  }

  // Fix 6: mientras se verifica si hay una sesion de HC activa reciente, no
  // mostrar todavia el KmModal (evita el parpadeo de pedirlo y sacarlo enseguida).
  if (sesionActiva === undefined) return <div className="min-h-screen flex items-center justify-center"><span className="spinner" /></div>;

  if (!kmSet) {
    return <KmModal equipo={equipo} clienteId={clienteId} mecanicoId={user.id} km={km} setKm={setKm} onContinue={() => {
      // Entrada directa (sin venir de auditoria): persistir los km en el equipo.
      // Encolado (no llamada directa a sb) para no perder el dato si esta offline.
      pushQueue({ id: uuid(), tipo: "update_equipo_km", clienteId, ts: Date.now(), data: { equipo_id: equipo.id_equipo, kilometros: parseInt(km, 10) } });
      syncQueue();
      guardarKm(equipo.id_equipo, parseInt(km, 10));
      setKmSet(true);
    }} />;
  }

  return (
    <div className="min-h-screen pb-[260px] safe-top">
      {toastNode}
      {ghost && <GhostTire x={ghost.x} y={ghost.y} />}
      <div className="sticky top-0 z-30 bg-white px-5 pt-14 pb-3 flex items-center gap-3">
        <button onClick={onCancel} className="w-9 h-9 rounded-full bg-[#F3F4F6] flex items-center justify-center shrink-0"><Icon.back width="18" height="18" /></button>
        <div>
          <h1 className="text-[20px] font-extrabold">Hoja de cambio · {equipo.patente}</h1>
          <p className="text-[12.5px] text-muted">Tocá un neumático para verlo, o arrastralo para rotarlo o sacarlo</p>
        </div>
      </div>

      {sesionActiva && (
        <p className="px-5 text-[11.5px] text-muted -mt-1 mb-2">Continuando HC iniciada a las {sesionActiva.hora_ingreso ? sesionActiva.hora_ingreso.slice(0, 5) : "-"} — {sesionActiva.kilometraje} km</p>
      )}
      <div className="px-5">
      {Object.values(posData).filter(d => d.numero_fuego && fuegosPendientes.includes(d.numero_fuego)).map(d => (
        <div key={d.posicion} className="bg-[#FEF3C7] rounded-2xl px-4 py-3 mb-3">
          <p className="font-bold text-[13.5px] text-[#92400E]">⚠ Posición {d.posicion} — Pendiente de aprobación</p>
          <p className="text-[12.5px] text-[#92400E] mt-1">El supervisor debe aprobar el cambio de neumático detectado en esta posición</p>
        </div>
      ))}
      <Card className="mb-4">
        <AxleMap cfg={axleCfg} posData={posData} selectedPos={null} onTap={() => {}}
          pendientesPos={new Set(Object.values(posData).filter(d => d.numero_fuego && fuegosPendientes.includes(d.numero_fuego)).map(d => d.posicion))}
          getDragHandlers={(p) => posData[p] ? { onPointerDown: (e) => onPointerDownTire(p, e), onPointerMove: onDragMove, onPointerUp: onDragEnd, onPointerCancel: onDragEnd } : undefined} />
      </Card>

      <p className="font-bold text-[15px] mb-2">Instructivo</p>
      <div className="space-y-2 mb-3">
        {checklist.map(c => {
          // HC-9: si la tarea menciona una posicion especifica ("posición N"/"pos N",
          // o "PN" que es el formato real de generarRecomendaciones, ej. "en P3 (...")
          // y ese neumatico esta montado, agrega un atajo directo a su modal de info.
          const m = /pos(?:ici[oó]n)?\.?\s*(\d+)|\bP(\d+)\b/i.exec(c.texto);
          const posMatch = m ? parseInt(m[1] || m[2], 10) : null;
          const tieneModal = posMatch != null && posData[posMatch];
          return (
            <div key={c.id} onClick={() => tieneModal && setInfoPos(posMatch)}
              className={cx("w-full text-left bg-white rounded-2xl border border-bd shadow-card px-4 py-3 flex items-center gap-3",
                c.origen && "border-l-4 border-l-amber-500", tieneModal && "cursor-pointer")}>
              <button onClick={(e) => { e.stopPropagation(); setChecklist(cs => { const next = cs.map(x => x.id === c.id ? { ...x, done: !x.done } : x); persistChecklist(next); return next; }); }} className="shrink-0">
                <span className={cx("w-6 h-6 rounded-lg flex items-center justify-center", c.done ? "bg-ink" : "bg-white border border-[#D1D5DB]")}>
                  {c.done && <Icon.check width="14" height="14" className="text-white" />}
                </span>
              </button>
              <div className="flex items-center gap-2 flex-1 min-w-0">
                <span className={cx("text-[14px] font-semibold flex-1", c.done && "strike")}>{c.texto}</span>
                {c.origen && <span className="text-[10px] font-bold text-[#B45309] bg-[#FEF3C7] px-2 py-0.5 rounded-full shrink-0 whitespace-nowrap">TAREAS PENDIENTES</span>}
              </div>
              {c.extra && <Icon.pencil width="15" height="15" className="text-muted shrink-0" />}
              {/* Requerimiento 2C: solo si el mecanico tiene permiso — sin el
                  permiso, unicamente puede tachar (COMPLETADA), no derivar. */}
              {user.puede_modificar_instructivo && !c.done && (
                <button onClick={(e) => { e.stopPropagation(); diferirTarea(c); }} className="text-[11px] font-bold text-[#92400E] px-2.5 py-1.5 rounded-full bg-[#FEF3C7] shrink-0 whitespace-nowrap">➡️ A Pendiente</button>
              )}
            </div>
          );
        })}
      </div>
      {user.puede_modificar_instructivo && (
        <div className="flex gap-2 mb-6">
          <TextInput placeholder="Agregar tarea personalizada" value={nuevaTarea} onChange={e => setNuevaTarea(e.target.value)} onKeyDown={e => { if (e.key === "Enter") agregarTarea(); }} />
          <Button variant="subtle" onClick={agregarTarea}>+ Agregar</Button>
        </div>
      )}

      {/* Fix 3: log informativo de movimientos, solo lectura — sin checkboxes
          ni acciones, se va completando a medida que se confirma cada accion. */}
      {movimientos.length > 0 && (
        <>
          <p className="font-bold text-[15px] mb-2">Movimientos realizados</p>
          <div className="space-y-2 mb-6">
            {movimientos.map(m => (
              <div key={m.id} className="bg-[#F9FAFB] rounded-2xl px-4 py-2.5">
                <p className="text-[13.5px] font-semibold text-[#1F2937]">✅ {formatHora(m.creado_en)} — {m.texto}</p>
                {m.detalle && <p className="text-[12px] text-muted mt-0.5 ml-6">{m.detalle}</p>}
              </div>
            ))}
          </div>
        </>
      )}
      </div>

      <div className="fixed bottom-0 left-0 right-0 bg-white border-t border-bd p-4 safe-bottom space-y-3 z-30">
        <Button className="w-full" disabled={saving} onClick={finalizar}>{saving ? <span className="spinner" /> : "Finalizar hoja de cambio"}</Button>
        <div>
          <p className="text-[11.5px] font-bold text-muted tracking-wide uppercase mb-1.5">Entrada · arrastrá al mapa</p>
          <div className="grid grid-cols-3 gap-2">
            <button onPointerDown={(e) => onPointerDownEntrada("nuevo", e)} onPointerMove={onDragMove} onPointerUp={onDragEnd} onPointerCancel={onDragEnd}
              style={{ touchAction: "none" }} className="h-12 rounded-2xl text-[13.5px] font-bold bg-ink text-white">Nuevo{stockBodega.nuevo != null ? ` (${stockBodega.nuevo})` : ""}</button>
            <button onPointerDown={(e) => onPointerDownEntrada("transito", e)} onPointerMove={onDragMove} onPointerUp={onDragEnd} onPointerCancel={onDragEnd}
              style={{ touchAction: "none" }} className="h-12 rounded-2xl text-[13.5px] font-bold bg-[#F3F4F6]">Tránsito{stockBodega.transito != null ? ` (${stockBodega.transito})` : ""}</button>
            <button onPointerDown={(e) => onPointerDownEntrada("recauchado", e)} onPointerMove={onDragMove} onPointerUp={onDragEnd} onPointerCancel={onDragEnd}
              style={{ touchAction: "none" }} className="h-12 rounded-2xl text-[13.5px] font-bold bg-[#F3F4F6]">Recauchado{stockBodega.recauchado != null ? ` (${stockBodega.recauchado})` : ""}</button>
          </div>
        </div>
        <div>
          <p className="text-[11.5px] font-bold text-muted tracking-wide uppercase mb-1.5">Salida · arrastrá el neumático acá</p>
          <div className="grid grid-cols-3 gap-2">
            <div data-salida="transito" className="h-12 rounded-2xl text-[13.5px] font-bold bg-[#F3F4F6] flex items-center justify-center">Tránsito</div>
            <div data-salida="reparacion" className="h-12 rounded-2xl text-[13.5px] font-bold bg-[#F3F4F6] flex items-center justify-center">Reparación</div>
            <div data-salida="retiro" className="h-12 rounded-2xl text-[13.5px] font-bold bg-[#FEE2E2] text-[#B91C1C] flex items-center justify-center gap-1"><Icon.trash width="14" height="14" />Retiro</div>
          </div>
        </div>
      </div>

      {infoPos != null && posData[infoPos] && (
        <TireInfoModal pos={infoPos} data={posData[infoPos]} cfg={cfg} equipo={equipo} axleCfg={axleCfg}
          pendienteAprobacion={!!(posData[infoPos].numero_fuego && fuegosPendientes.includes(posData[infoPos].numero_fuego))}
          onClose={() => setInfoPos(null)}
          onToggleAlargadera={(v) => actualizarExtras(infoPos, { alargadera: v })}
          onToggleCheckpoint={(v) => actualizarExtras(infoPos, { checkpoint: v })}
          onGirar={() => {
            setConfirmDlg({
              title: "Confirmar giro de neumático",
              desc: `¿Registrar el giro (inversión de cara) del neumático en P${infoPos} (${posData[infoPos].numero_fuego})?`,
              onConfirm: () => { registrarIntervencion("giro_neumatico", infoPos, {}); pushToast("✓ Giro registrado"); setConfirmDlg(null); setInfoPos(null); }
            });
          }}
          onRegularPsi={(nuevoPsi) => {
            setConfirmDlg({
              title: "Confirmar regulación de PSI",
              desc: `Ajustar P${infoPos} (${posData[infoPos].numero_fuego}) a ${nuevoPsi} psi.`,
              onConfirm: () => {
                const ahora = new Date().toISOString();
                // HC-10: el color del circulo se recalcula al toque (evaluarPosicion),
                // no solo al montar - asi pasa de rojo/amarillo a gris default en vivo
                // si la correccion deja el valor dentro de rango (nunca a verde).
                const ev = evaluarPosicion(axleCfg, cfg, infoPos, equipo.tipo, { ...posData[infoPos], psi: nuevoPsi });
                setPosData(s => ({ ...s, [infoPos]: { ...s[infoPos], psi: nuevoPsi, status: ev.status } }));
                registrarIntervencion("regulacion_psi", infoPos, { psi_nuevo: parseInt(nuevoPsi, 10), timestamp_inicio: ahora, timestamp_fin: ahora });
                if (ev.status !== "ok") pushQueue({ id: uuid(), tipo: "alerta", clienteId, ts: Date.now(), data: { id: uuid(), cliente_id: clienteId, equipo_id: equipo.id_equipo, mecanico_id: user.id, tipo: parseInt(nuevoPsi, 10) < ev.psiObjetivo ? "psi_bajo" : "psi_alto", severidad: ev.status === "alerta" ? "rojo" : "amarillo", titulo: "PSI fuera de rango tras regulación", descripcion: `P${infoPos} quedó en ${nuevoPsi} psi (objetivo ${ev.psiObjetivo})`, posicion: infoPos, numero_fuego: posData[infoPos].numero_fuego, leida_mecanico: false, leida_admin: false, leida_superadmin: false } });
                pushToast("✓ Regulación guardada");
                setConfirmDlg(null); setInfoPos(null);
              }
            });
          }}
          onRetorqueo={() => {
            setConfirmDlg({
              title: "Confirmar retorqueo",
              desc: `¿Registrar retorqueo en P${infoPos} (${posData[infoPos].numero_fuego})? Se confirma que se tomó la foto de checkpoint.`,
              onConfirm: () => { registrarIntervencion("retorqueo", infoPos, {}); pushToast("✓ Retorqueo registrado"); setConfirmDlg(null); setInfoPos(null); }
            });
          }}
          onReparacion={() => {
            setConfirmDlg({
              title: "Confirmar reparación",
              desc: `¿Registrar una reparación en P${infoPos} (${posData[infoPos].numero_fuego})?`,
              onConfirm: () => { registrarIntervencion("reparacion", infoPos, {}); pushToast("✓ Reparación registrada"); setConfirmDlg(null); setInfoPos(null); }
            });
          }}
        />
      )}

      {montaje && (
        <MontajeModal tipo={montaje.tipo} pos={montaje.pos} equipo={equipo} clienteId={clienteId} cfg={cfg} axleCfg={axleCfg} user={user}
          onClose={() => setMontaje(null)}
          onConfirm={(data) => setConfirmDlg({
            title: "Confirmar montaje",
            desc: `¿Montar el neumático ${data.numero_fuego} en la posición P${montaje.pos}?`,
            onConfirm: () => { montarNeumatico(montaje.pos, data, montaje.tipo); setConfirmDlg(null); }
          })}
        />
      )}

      {retiroSel && posData[retiroSel.pos] && (
        <RetiroModal pos={retiroSel.pos} fuego={posData[retiroSel.pos].numero_fuego} patente={equipo.patente}
          mmActual={posData[retiroSel.pos].minMM}
          onClose={() => setRetiroSel(null)}
          onConfirm={(payload) => confirmarRetiro(retiroSel.pos, payload)} />
      )}

      {confirmDlg && <Confirm title={confirmDlg.title} desc={confirmDlg.desc} onConfirm={confirmDlg.onConfirm} onCancel={() => setConfirmDlg(null)} />}
    </div>
  );
}

// Fix 3: badge de origen (nuevo/tránsito/recauchado) — no confundir con el
// Badge de estado psi/mm (ok/atencion/alerta) que ya existe al lado.
const ORIGEN_BADGE = {
  recauchado: { color: "amber", label: "♻ Recauchado" },
  nuevo: { color: "green", label: "✦ Nuevo" },
  transito: { color: "gray", label: "↔ Tránsito" }
};
function OrigenNeumaticoBadge({ numeroFuego }) {
  const [origen, setOrigen] = useState(undefined); // undefined = cargando, null = sin dato
  useEffect(() => {
    let cancel = false;
    setOrigen(undefined);
    fetchOrigenNeumatico(numeroFuego).then(o => { if (!cancel) setOrigen(o); }).catch(() => { if (!cancel) setOrigen(null); });
    return () => { cancel = true; };
  }, [numeroFuego]);
  if (!origen || !ORIGEN_BADGE[origen]) return null;
  return <Badge color={ORIGEN_BADGE[origen].color}>{ORIGEN_BADGE[origen].label}</Badge>;
}
function TireInfoModal({ pos, data, cfg, equipo, axleCfg, onClose, onRegularPsi, onRetorqueo, onReparacion, onGirar, pendienteAprobacion, onToggleAlargadera, onToggleCheckpoint }) {
  const [psiField, setPsiField] = useState(String(data.psi || ""));
  const [showPsi, setShowPsi] = useState(false);
  const esDireccional = axleCfg && ejeTipoDePosicion(axleCfg, pos) === "D";
  // Fix 6: en el Instructivo (revision previa a la HC) este modal se usa
  // solo para consulta, sin las acciones de la hoja de cambio — se pasan
  // los handlers en undefined y se ocultan los botones correspondientes.
  const soloConsulta = !onRegularPsi && !onRetorqueo && !onReparacion;
  // Requerimiento: la alargadera solo aplica al neumatico interno de una
  // rueda doble (dupla) -- en direccionales/externos no se muestra el check.
  const mostrarAlargadera = onToggleAlargadera && esPosicionInterna(axleCfg, pos);
  return (
    <Modal title={`Posición P${pos}`} onClose={onClose}>
      <div className="mb-4">
        <div className="flex items-center gap-2 flex-wrap">
          <p className="text-[22px] font-extrabold leading-none">{data.numero_fuego}</p>
          <OrigenNeumaticoBadge numeroFuego={data.numero_fuego} />
        </div>
        {/* Fix 4: desgaste irregular detectado en la ultima auditoria (ya viene
            en posData/data.tipo_desgaste, sin necesidad de query aparte). */}
        {data.tipo_desgaste === "irregular" && (
          <div className="mt-2 bg-[#FEF3C7] rounded-xl px-3 py-2">
            <p className="text-[12.5px] font-bold text-[#92400E]">⚠ Desgaste irregular detectado en última auditoría</p>
          </div>
        )}
        {/* Fix 5: discrepancia de neumatico sin aprobar por el Admin — informativo,
            el mecanico no puede resolverla desde aca. */}
        {pendienteAprobacion && (
          <div className="mt-2 bg-[#FEE2E2] rounded-xl px-3 py-2">
            <p className="text-[12.5px] font-bold text-[#B91C1C]">🔒 Pendiente de aprobación del supervisor</p>
            <p className="text-[11.5px] text-[#B91C1C] mt-0.5">Este neumático tiene una discrepancia detectada en la última auditoría.</p>
          </div>
        )}
        <p className="text-[13px] text-muted mt-2">{data.marca || "Sin marca"} · {data.medida || "-"}</p>
        <div className="flex gap-4 mt-3">
          <div><p className="text-[11px] text-muted font-semibold">PSI actual</p><p className="font-extrabold text-[16px]">{data.psi || "-"}</p></div>
          <div><p className="text-[11px] text-muted font-semibold">MM</p><p className="font-extrabold text-[16px]">{data.minMM != null ? data.minMM : "-"}</p></div>
          <div><p className="text-[11px] text-muted font-semibold">Estado</p><Badge color={statusColor(data.status)}>{statusLabel(data.status)}</Badge></div>
        </div>
      </div>
      {/* Requerimiento 2: alargadera/checkpoint colocados en esta posicion —
          solo en la HC (no en la revision de solo consulta previa). */}
      {(mostrarAlargadera || onToggleCheckpoint) && (
        <div className="space-y-2 mb-4">
          {mostrarAlargadera && (
            <div className="flex items-center justify-between bg-[#F9FAFB] rounded-xl px-3 py-2.5">
              <p className="text-[13px] font-bold">🔘 Alargadera colocada</p>
              <div className="flex gap-1.5">
                <button onClick={() => onToggleAlargadera(true)} className={cx("h-8 px-3 rounded-full text-[12px] font-bold", data.alargadera ? "bg-ink text-white" : "bg-white border border-bd")}>Sí</button>
                <button onClick={() => onToggleAlargadera(false)} className={cx("h-8 px-3 rounded-full text-[12px] font-bold", !data.alargadera ? "bg-ink text-white" : "bg-white border border-bd")}>No</button>
              </div>
            </div>
          )}
          {onToggleCheckpoint && (
            <div className="flex items-center justify-between bg-[#F9FAFB] rounded-xl px-3 py-2.5">
              <p className="text-[13px] font-bold">🔘 Checkpoint colocado</p>
              <div className="flex gap-1.5">
                <button onClick={() => onToggleCheckpoint(true)} className={cx("h-8 px-3 rounded-full text-[12px] font-bold", data.checkpoint ? "bg-ink text-white" : "bg-white border border-bd")}>Sí</button>
                <button onClick={() => onToggleCheckpoint(false)} className={cx("h-8 px-3 rounded-full text-[12px] font-bold", !data.checkpoint ? "bg-ink text-white" : "bg-white border border-bd")}>No</button>
              </div>
            </div>
          )}
        </div>
      )}
      {soloConsulta ? null : showPsi ? (
        <div className="space-y-3 mb-2">
          <Field label="Nuevo valor de PSI" required><TextInput type="number" inputMode="numeric" value={psiField} onChange={e => setPsiField(e.target.value)} /></Field>
          <Button className="w-full" disabled={!psiField} onClick={() => onRegularPsi(parseInt(psiField, 10))}>Guardar regulación</Button>
        </div>
      ) : (
        <div className="grid grid-cols-1 gap-2">
          <Button variant="subtle" onClick={() => setShowPsi(true)}><Icon.gauge width="18" height="18" /> Regulación PSI</Button>
          <Button variant="subtle" onClick={onRetorqueo}><Icon.wrench width="18" height="18" /> Retorqueo</Button>
          <Button variant="subtle" onClick={onReparacion}><Icon.bandage width="18" height="18" /> Reparación</Button>
          {esDireccional && (
            <Button variant="subtle" onClick={onGirar}><Icon.gauge width="18" height="18" /> Girar neumático (invertir cara)</Button>
          )}
          <p className="text-[11.5px] text-muted text-center mt-2">
            {esDireccional ? "Direccional: girá la cara si hay desgaste irregular, o cerrá esta ventana y arrastralo hasta la otra posición para cambiar de lado." : "Para rotarlo o sacarlo, cerrá esta ventana y arrastralo desde el mapa hasta otra posición o hasta Salida."}
          </p>
        </div>
      )}
    </Modal>
  );
}

const TIPO_NEUMATICO_OPCIONES = [
  { slug: "direccional", label: "Direccional" },
  { slug: "traccional", label: "Traccional" },
  { slug: "eje_libre", label: "Eje libre" }
];
function TipoNeumaticoField({ equipo, axleCfg, pos, tipo, onChange, onIncorrecto }) {
  const esperado = tipoNeumaticoEsperado(equipo, axleCfg, pos);
  const avisado = useRef(false);
  function elegir(slug) {
    onChange(slug);
    if (esperado && slug !== esperado) {
      if (!avisado.current) { avisado.current = true; onIncorrecto(slug, esperado); }
    } else {
      avisado.current = false;
    }
  }
  const incorrecto = esperado && tipo && tipo !== esperado;
  return (
    <Field label="¿Qué tipo de neumático vas a montar?" required>
      <div className="grid grid-cols-3 gap-2">
        {TIPO_NEUMATICO_OPCIONES.map(o => (
          <button key={o.slug} type="button" onClick={() => elegir(o.slug)}
            className={cx("h-11 rounded-2xl text-[13px] font-bold border", tipo === o.slug ? "border-ink bg-[#F3F4F6]" : "border-bd bg-white")}>
            {o.label}
          </button>
        ))}
      </div>
      {incorrecto && esperado && (
        <p className="text-[12.5px] font-bold text-[#B91C1C] mt-2">
          La posición {pos} corresponde a neumáticos {TIPO_NEUMATICO_OPCIONES.find(o => o.slug === esperado).label.toLowerCase()} en un equipo {equipo.tipo === "SEMI" ? "semi" : equipo.configuracion_ejes}. No podés montar un {TIPO_NEUMATICO_OPCIONES.find(o => o.slug === tipo).label.toLowerCase()} ahí.
        </p>
      )}
    </Field>
  );
}

const BODEGA_LABEL = { nuevo: "Nuevo", transito: "Tránsito", recauchado: "Recauchado" };
// Requerimiento 4: bodega sin stock — bloquea el montaje directo y ofrece
// avisar al supervisor (alerta 'stock_minimo') o seguir igual con un
// formulario manual (deja constancia via alerta 'neumatico_no_registrado').
function SinStockModal({ tipo, equipo, clienteId, user, onClose, onMontarFueraDeStock }) {
  const [avisado, setAvisado] = useState(false);
  async function avisar() {
    const cliente = await db.fetchCliente(clienteId).catch(() => null);
    pushQueue({
      id: uuid(), tipo: "alerta", clienteId, ts: Date.now(), data: {
        id: uuid(), cliente_id: clienteId, equipo_id: equipo.id_equipo, mecanico_id: user.id,
        tipo: "stock_minimo", severidad: "amarillo",
        titulo: `Sin stock de ${BODEGA_LABEL[tipo].toLowerCase()} — ${cliente ? cliente.nombre : clienteId}`,
        descripcion: `El mecánico ${user.nombre} intentó montar un neumático de bodega "${BODEGA_LABEL[tipo]}" pero no hay stock.`,
        leida_mecanico: true, leida_admin: false, leida_superadmin: false
      }
    });
    syncQueue();
    setAvisado(true);
  }
  return (
    <Modal title="Bodega sin stock" onClose={onClose}>
      <p className="text-[14px] text-[#374151] mb-5">No hay neumáticos registrados en la bodega "{BODEGA_LABEL[tipo]}".</p>
      {avisado ? (
        <p className="text-[13px] font-bold text-[#15803D] mb-3">✓ Se avisó al administrador</p>
      ) : (
        <Button className="w-full mb-3" onClick={avisar}>📢 Notificar falta de stock al supervisor</Button>
      )}
      <Button variant="subtle" className="w-full mb-3" onClick={onMontarFueraDeStock}>Montar neumático fuera de stock</Button>
      <Button variant="ghost" className="w-full" onClick={onClose}>Cerrar</Button>
    </Modal>
  );
}
function MontajeModal({ tipo, pos, equipo, clienteId, cfg, axleCfg, user, onClose, onConfirm }) {
  const [fuego, setFuego] = useState("");
  const [tipoNeumatico, setTipoNeumatico] = useState("");
  const [marca, setMarca] = useState("");
  const [modelo, setModelo] = useState("");
  const [marcaModeloNoRegistrado, setMarcaModeloNoRegistrado] = useState(false);
  // Fix 1: medida siempre precargada con config_cliente.medida_default (no
  // hardcodeada), el mecanico la puede cambiar si el neumatico es distinto.
  const [medida, setMedida] = useState(cfg.medida_default || "");
  const [medidaManual, setMedidaManual] = useState(false);
  const [psi, setPsi] = useState("");
  const [mm, setMm] = useState("");
  const [torqueado, setTorqueado] = useState(false);
  const [fisicoConfirmado, setFisicoConfirmado] = useState(false);
  const [fotoUrl, setFotoUrl] = useState(null);
  const [fotoNombre, setFotoNombre] = useState("");
  const [subiendoFoto, setSubiendoFoto] = useState(false);
  const [fotoError, setFotoError] = useState("");
  const [search, setSearch] = useState("");
  // Requerimiento 3: "¿Tiene N° de fuego?" es ahora la primera pregunta para
  // los 3 tipos (nuevo/transito/recauchado), no solo recauchado como antes.
  // null = sin contestar, true = si (buscador sobre la bodega), false = no
  // (se asigna automaticamente el primer neumatico disponible de esa bodega,
  // sin pedirle al mecanico que elija uno especifico).
  const [fuegoMarcado, setFuegoMarcado] = useState(null);
  const [opciones, setOpciones] = useState(null); // null = cargando la bodega
  // Registro del sistema del neumatico elegido/asignado — se guarda aparte
  // (no se precarga en los campos) para poder validar marca/modelo contra lo
  // que tipee el mecanico, y para saber si hay que descontar stock de una
  // fila real o si es un montaje manual (Caso B / fuera de stock).
  const [seleccionado, setSeleccionado] = useState(null);
  const [errorValidacion, setErrorValidacion] = useState("");
  // Requerimiento 4: se llega aca al confirmar "Montar neumatico fuera de
  // stock" en SinStockModal, o al usar el escape "cargar manualmente" del
  // buscador con stock (Caso B) — en ambos casos se genera un fuego sugerido
  // y se arma la alerta correspondiente al confirmar.
  const [manual, setManual] = useState(false);

  useEffect(() => {
    // Requerimiento 3 nota: para "nuevo" se filtra por el tipo esperado de la
    // posicion (direccional/traccional/eje_libre) para no ofrecer, p.ej., un
    // direccional en un eje traccional — no aplica a transito/recauchado.
    const tipoEsperado = tipo === "nuevo" ? tipoNeumaticoEsperado(equipo, axleCfg, pos) : null;
    fetchNeumaticosBodega(clienteId, tipo)
      .then(list => setOpciones(tipoEsperado ? list.filter(o => !o.tipo || o.tipo === tipoEsperado) : list))
      .catch(() => setOpciones([]));
  }, []);
  // "No tiene fuego" + hay stock: se asigna solo el primero disponible (el
  // mecanico no tiene que buscarlo/elegirlo, solo confirmar/ajustar datos).
  useEffect(() => {
    if (fuegoMarcado === false && !manual && opciones && opciones.length && !seleccionado) elegirDeLista(opciones[0]);
  }, [fuegoMarcado, opciones]);

  async function generarFuegoManual() {
    try { const sug = await generarNumeroFuegoSugerido(clienteId, cfg, equipo.numero_interno, pos, todayISO()); setFuego(f => (f ? f : sug)); } catch (e) {}
  }
  function irAManual() { setManual(true); setSeleccionado(null); generarFuegoManual(); }

  const filtradas = (opciones || []).filter(o => {
    if (!search) return true;
    const s = search.toLowerCase();
    return (o.numero_fuego || "").toLowerCase().includes(s) || (o.marca || "").toLowerCase().includes(s) || (o.modelo || "").toLowerCase().includes(s);
  });

  function elegirDeLista(o) {
    setSeleccionado(o);
    setErrorValidacion("");
    setManual(false);
    setMarca(""); setModelo(""); // el mecanico los tipea de nuevo mirando el neumatico fisico
    setFuego(o.numero_fuego);
  }
  function confirmarMontaje() {
    // Fix 2: la validacion estricta marca/modelo contra el sistema SOLO
    // aplica cuando el mecanico busco y eligio el neumatico a mano
    // (fuegoMarcado === true, leyo el numero fisico). Si "No tiene marca
    // fuego", `seleccionado` se autoasigna solo (primer disponible de la
    // bodega, ver efecto de arriba) para descontar stock -- pero el
    // mecanico no tiene forma de confirmar que ese es realmente el
    // neumatico fisico que tiene enfrente, asi que no puede quedar
    // bloqueado si tipea una marca/modelo distinta a la de esa fila.
    if (seleccionado && fuegoMarcado === true) {
      const sisMarca = normStr(seleccionado.marca), sisModelo = normStr(seleccionado.modelo);
      const inMarca = normStr(marca), inModelo = normStr(modelo);
      const difiere = (sisMarca && sisMarca !== inMarca) || (sisModelo && sisModelo !== inModelo);
      if (difiere) { setErrorValidacion("La marca/modelo que ingresaste difiere del registro del sistema. Revisá los datos e intentá de nuevo."); return; }
    }
    // Requerimiento 3 (Caso B) / Requerimiento 4 (fuera de stock): montaje
    // manual, sin vincular a una fila existente de la bodega — avisa al
    // Admin que ese fuego no estaba registrado ahi.
    if (manual) {
      pushQueue({
        id: uuid(), tipo: "alerta", clienteId, ts: Date.now(), data: {
          id: uuid(), cliente_id: clienteId, equipo_id: equipo.id_equipo, mecanico_id: user.id,
          tipo: "neumatico_no_registrado", severidad: "amarillo",
          titulo: `Neumático no registrado — ${equipo.patente} pos ${pos}`,
          descripcion: `Se montó un neumático con marca de fuego ${fuego} que no se encontraba registrado en la bodega "${BODEGA_LABEL[tipo]}".`,
          posicion: pos, leida_mecanico: true, leida_admin: false, leida_superadmin: false
        }
      });
      syncQueue();
    }
    // Requerimiento 2.2: medida ingresada como "Otra" -- avisa al Admin para
    // que la revise y, si corresponde, la sume a la lista estandar.
    if (medidaManual && medida.trim()) {
      pushQueue({
        id: uuid(), tipo: "alerta", clienteId, ts: Date.now(), data: {
          id: uuid(), cliente_id: clienteId, equipo_id: equipo.id_equipo, mecanico_id: user.id,
          tipo: "marca_modelo_no_registrado", severidad: "amarillo",
          titulo: "Medida de neumático no estandarizada",
          descripcion: `El mecánico ${user.nombre} ingresó manualmente la medida ${medida} en el equipo ${equipo.patente} pos ${pos}, la cual no está en la lista estándar.`,
          posicion: pos, numero_fuego: fuego || null, leida_mecanico: true, leida_admin: false, leida_superadmin: false
        }
      });
      syncQueue();
    }
    onConfirm({ numero_fuego: fuego, marca, modelo, marcaModeloNoRegistrado, medida, psi, mm, fotoUrl, deBodega: !manual });
  }

  async function onFotoChange(e) {
    const file = e.target.files && e.target.files[0];
    if (!file) return;
    setFotoNombre(file.name); setSubiendoFoto(true); setFotoError(""); setFotoUrl(null);
    try {
      const url = await subirFotoCheckpoint(clienteId, pos, file);
      setFotoUrl(url);
    } catch (err) {
      setFotoError("No se pudo subir la foto. Verificá que exista el bucket público 'checkpoints' en Supabase Storage.");
    } finally {
      setSubiendoFoto(false);
    }
  }

  function elegirTipoIncorrecto(slug, esperado) {
    pushQueue({
      id: uuid(), tipo: "alerta", clienteId, ts: Date.now(), data: {
        id: uuid(), cliente_id: clienteId, equipo_id: equipo.id_equipo, mecanico_id: user.id,
        tipo: "tipo_neumatico_incorrecto", severidad: "amarillo",
        titulo: `Tipo incorrecto — ${equipo.patente} pos ${pos}`,
        descripcion: `El mecánico intentó montar un ${TIPO_NEUMATICO_OPCIONES.find(o => o.slug === slug).label.toLowerCase()} en posición ${pos} (${TIPO_NEUMATICO_OPCIONES.find(o => o.slug === esperado).label.toLowerCase()} en ${equipo.tipo === "SEMI" ? "semi" : equipo.configuracion_ejes})`,
        posicion: pos, leida_mecanico: true, leida_admin: false, leida_superadmin: false
      }
    });
    syncQueue();
  }

  // Requerimiento 3: "¿Tiene N° de fuego?" antes que cualquier otra cosa,
  // para los 3 tipos (antes solo se preguntaba en recauchado).
  if (fuegoMarcado === null) {
    return (
      <Modal title="N° de fuego" onClose={onClose}>
        <p className="text-[14px] text-[#374151] mb-5">¿Este neumático tiene N° de fuego marcado?</p>
        <div className="space-y-3">
          <Button className="w-full" onClick={() => setFuegoMarcado(true)}>Sí, tiene N° de fuego</Button>
          <Button variant="subtle" className="w-full" onClick={() => setFuegoMarcado(false)}>No tiene N° de fuego</Button>
        </div>
      </Modal>
    );
  }

  // Requerimiento 4: bodega sin stock -> bloquea antes de mostrar el
  // buscador/auto-asignacion, salvo que ya haya elegido seguir igual
  // ("Montar neumático fuera de stock", manual=true).
  if (!manual && opciones !== null && opciones.length === 0) {
    return <SinStockModal tipo={tipo} equipo={equipo} clienteId={clienteId} user={user} onClose={onClose} onMontarFueraDeStock={irAManual} />;
  }
  if (fuegoMarcado === true && !manual && !seleccionado) {
    const tituloBuscador = `Montar ${BODEGA_LABEL[tipo].toLowerCase()} — bodega`;
    if (opciones === null) return <Modal title={tituloBuscador} onClose={onClose}><div className="flex justify-center py-10"><span className="spinner" /></div></Modal>;
    return (
      <Modal title={tituloBuscador} onClose={onClose}>
        <TextInput placeholder="Buscar por N° fuego, marca o modelo" value={search} onChange={e => setSearch(e.target.value)} className="mb-3" />
        <div className="space-y-2 max-h-72 overflow-y-auto">
          {filtradas.map(o => (
            <button key={o.id_neumatico} onClick={() => elegirDeLista(o)}
              className="w-full text-left bg-[#F9FAFB] rounded-xl px-3 py-2.5 flex items-center justify-between">
              <div><p className="font-bold text-[14px]">{o.numero_fuego}</p><p className="text-[12px] text-muted">{o.marca} {o.modelo}</p></div>
              <span className="text-[12px] text-muted">P{o.posicion_actual || "-"}</span>
            </button>
          ))}
          {filtradas.length === 0 && <p className="text-center text-muted text-sm py-6">No hay neumáticos que coincidan.</p>}
        </div>
        {/* Requerimiento 3, Caso B: el fuego que tiene el mecanico no esta en
            la bodega — sigue manual y se avisa al Admin al confirmar. */}
        <button onClick={irAManual} className="w-full text-center text-[13px] font-bold text-muted mt-4 py-2">No está en la lista — cargar manualmente</button>
      </Modal>
    );
  }
  if ((fuegoMarcado === false || manual) && !seleccionado && !fuego && opciones === null) {
    return <Modal title="Montar neumático" onClose={onClose}><div className="flex justify-center py-10"><span className="spinner" /></div></Modal>;
  }

  const titulo = tipo === "nuevo" ? "Montar neumático nuevo" : tipo === "transito" ? "Confirmar montaje" : "Montar recauchado";
  const tipoOk = tipo !== "nuevo" || (tipoNeumatico && (tipoNeumaticoEsperado(equipo, axleCfg, pos) == null || tipoNeumatico === tipoNeumaticoEsperado(equipo, axleCfg, pos)));
  const disabled = !fuego || psi === "" || mm === "" || !tipoOk
    || (tipo !== "nuevo" && (!marca.trim() || !modelo.trim()))
    || (tipo === "nuevo" && (!torqueado || !fotoUrl || subiendoFoto || !fisicoConfirmado));

  return (
    <Modal title={titulo} onClose={onClose}>
      <div className="space-y-4">
        {manual && <p className="text-[12.5px] font-semibold text-[#92400E] bg-[#FEF3C7] rounded-xl px-3 py-2.5">⚠ Montaje manual — se va a avisar al administrador que este fuego no estaba registrado en bodega.</p>}
        {tipo === "nuevo" && (
          <TipoNeumaticoField equipo={equipo} axleCfg={axleCfg} pos={pos} tipo={tipoNeumatico} onChange={setTipoNeumatico} onIncorrecto={elegirTipoIncorrecto} />
        )}
        {/* El fuego solo se bloquea cuando el mecanico lo eligio a mano de la
            lista (confirmando que coincide con el neumatico fisico). Si vino
            de "No tiene N° de fuego" (auto-asignado) o es manual, se deja
            editable — el mecanico puede corregirlo. */}
        <Field label="N° de fuego" required hint={manual ? "Sugerido automáticamente, podés modificarlo (solo números)" : fuegoMarcado === false ? "Asignado automáticamente, podés modificarlo" : null}>
          <TextInput inputMode="numeric" value={fuego} onChange={e => setFuego(e.target.value.replace(/[^0-9]/g, ""))} className="font-extrabold" disabled={fuegoMarcado === true && !manual && !!seleccionado} />
        </Field>
        <div className="grid grid-cols-2 gap-3">
          <MarcaModeloAuditoriaField clienteId={clienteId} marca={marca} modelo={modelo}
            onChange={(m, mo, noRegistrado) => { setMarca(m); setModelo(mo); setMarcaModeloNoRegistrado(noRegistrado); setErrorValidacion(""); }} />
        </div>
        {/* Fix 1/4: medida siempre visible, precargada con medida_default */}
        <MedidaField cfg={cfg} value={medida} isManual={medidaManual} onChange={(v, manual) => { setMedida(v); setMedidaManual(manual); }} />
        <div className="grid grid-cols-2 gap-3">
          <Field label="PSI actual" required><TextInput type="number" inputMode="numeric" value={psi} onChange={e => setPsi(e.target.value)} /></Field>
          <Field label="MM actual" required><TextInput type="number" step="0.1" value={mm} onChange={e => setMm(e.target.value)} /></Field>
        </div>
        {errorValidacion && <p className="text-[12.5px] font-bold text-[#B91C1C] bg-[#FEE2E2] rounded-xl px-3 py-2.5">{errorValidacion}</p>}
        {tipo === "nuevo" && (
          <div className="space-y-3">
            <label className="flex items-center gap-2 text-[13.5px] font-semibold"><input type="checkbox" checked={torqueado} onChange={e => setTorqueado(e.target.checked)} /> Ruedas torqueadas</label>
            <Field label="Foto de checkpoint" required hint="Obligatoria para completar el montaje">
              <label className="h-14 px-5 rounded-2xl font-bold text-[15px] bg-ink text-white flex items-center justify-center gap-2 cursor-pointer active:scale-[0.98] transition w-full">
                <span className="text-[18px]">📷</span> Tomar foto
                <input type="file" accept="image/*" capture="environment" onChange={onFotoChange} className="hidden" />
              </label>
            </Field>
            {subiendoFoto && <p className="text-[12.5px] text-muted">Subiendo foto...</p>}
            {fotoUrl && <p className="text-[12.5px] font-bold text-[#15803D]">✓ Foto subida: {fotoNombre}</p>}
            {fotoError && <p className="text-[12.5px] font-bold text-[#B91C1C]">{fotoError}</p>}
            {fuego && (
              <label className="flex items-start gap-2 text-[13.5px] font-semibold bg-[#F9FAFB] rounded-2xl p-3">
                <input type="checkbox" className="mt-0.5" checked={fisicoConfirmado} onChange={e => setFisicoConfirmado(e.target.checked)} />
                <span>Confirmé que el neumático fue marcado físicamente con el N° de fuego {fuego}</span>
              </label>
            )}
          </div>
        )}
        <Button className="w-full" disabled={disabled} onClick={confirmarMontaje}>Continuar</Button>
      </div>
    </Modal>
  );
}

/* =====================================================================
   PANTALLA 8 - RECONTEO DE STOCK AL CIERRE
   Paso obligatorio antes de cerrar: mismo formato checkbox+stepper del
   check diario (reusa NEUMATICO_FIELDS/LLANTA_CIERRE_FIELDS/Stepper), pero
   arranca siempre en 0 sin precargar nada, para no inducir al mecanico.
===================================================================== */
// Requerimiento: el Check de Cierre clona la misma estructura por pasos y
// por categoria (Nuevos/Tránsito/Reparación/Recauchados x Direccional/
// Traccional/Eje Libre) que el Check de Inicio (CheckDiario), reutilizando
// PasoStockNeumaticos/PasoStockLlantas -- unico bloque distinto: las llantas
// del cierre se comparan contra `insumos` (subtipos LLANTA_CIERRE_FIELDS),
// por eso el Paso 2 recibe un `fields` distinto al de CheckDiario.
function ReconteoCierre({ onConfirmar, verificando }) {
  const [step, setStep] = useState(1);
  const [stockNeu, setStockNeu] = useState(() =>
    Object.fromEntries(BODEGAS_NEU.map(b => [b.key, Object.fromEntries(TIPOS_NEU.map(t => [t.key, { value: 0, checked: false }]))])));
  const [stockLlantas, setStockLlantas] = useState(() => Object.fromEntries(LLANTA_CIERRE_FIELDS.map(f => [f.key, { value: 0, checked: false }])));

  const stockNeuFilled = BODEGAS_NEU.reduce((n, b) => n + TIPOS_NEU.filter(t => stockNeu[b.key][t.key].checked).length, 0);
  const stockNeuTotal = BODEGAS_NEU.length * TIPOS_NEU.length;
  const llantasFilled = LLANTA_CIERRE_FIELDS.filter(f => stockLlantas[f.key].checked).length;
  const totalItems = stockNeuTotal + LLANTA_CIERRE_FIELDS.length;
  const itemsCompletos = stockNeuFilled + llantasFilled;
  const progress = Math.round((itemsCompletos / totalItems) * 100);
  const paso1Completo = stockNeuFilled === stockNeuTotal;
  const complete = paso1Completo && llantasFilled === LLANTA_CIERRE_FIELDS.length;

  function setStockNeuVal(bKey, tKey, v) { setStockNeu(s => ({ ...s, [bKey]: { ...s[bKey], [tKey]: { value: v, checked: true } } })); }
  function toggleStockNeu(bKey, tKey) { setStockNeu(s => ({ ...s, [bKey]: { ...s[bKey], [tKey]: { ...s[bKey][tKey], checked: !s[bKey][tKey].checked } } })); }
  function setStockLlantasVal(key, v) { setStockLlantas(s => ({ ...s, [key]: { value: v, checked: true } })); }
  function toggleStockLlantas(key) { setStockLlantas(s => ({ ...s, [key]: { ...s[key], checked: !s[key].checked } })); }

  function confirmar() {
    const totalBodega = (bKey) => TIPOS_NEU.reduce((n, t) => n + (stockNeu[bKey][t.key].value || 0), 0);
    const totalesNeumaticos = { nuevo: totalBodega("nuevos"), transito: totalBodega("transito"), recauchado: totalBodega("recauchados"), reparacion: totalBodega("reparar") };
    const totalesLlantas = Object.fromEntries(LLANTA_CIERRE_FIELDS.map(f => [f.key, stockLlantas[f.key].value]));
    onConfirmar(totalesNeumaticos, totalesLlantas);
  }

  return (
    <div className="min-h-screen pb-28 px-5 safe-top">
      <div className="sticky top-0 z-30 bg-white px-5 pt-14 pb-3">
        <h1 className="text-[26px] font-extrabold mb-1">Antes de cerrar, confirmá el stock actual</h1>
        <p className="text-[14px] text-sub mt-1 mb-4">Paso {step} de 2</p>
        <div className="bg-[#F9FAFB] rounded-[20px] p-5">
          <div className="flex items-center justify-between mb-2">
            <span className="font-bold text-[16px]">Ítems confirmados</span>
            <span className="text-[13px] font-bold">{itemsCompletos}/{totalItems}</span>
          </div>
          <div className="h-2 rounded-full bg-[#E5E7EB] overflow-hidden">
            <div className="h-full bg-ink transition-all" style={{ width: progress + "%" }} />
          </div>
        </div>
      </div>

      {step === 1 && (
        <>
          <PasoStockNeumaticos titulo="Paso 1 · Stock de neumáticos" stockNeu={stockNeu} toggleStockNeu={toggleStockNeu} setStockNeuVal={setStockNeuVal} />
          <Button className="w-full mb-4" onClick={() => setStep(2)}>Continuar</Button>
        </>
      )}

      {step === 2 && (
        <>
          <PasoStockLlantas stockPatio={stockLlantas} toggleStockPatio={toggleStockLlantas} setStockPatioVal={setStockLlantasVal} fields={LLANTA_CIERRE_FIELDS} />
          <Button variant="subtle" className="w-full mb-4" onClick={() => setStep(1)}>Volver</Button>
        </>
      )}

      {/* Fix 4: z-40 (por encima del z-30 de BottomNav, que sigue montado
          en esta pantalla) — sin esto la barra de navegación de abajo tapaba
          este botón, tambien fixed bottom-0, porque ganaba por z-index. */}
      {step === 2 && (
        <div className="fixed bottom-0 left-0 right-0 bg-white border-t border-bd p-4 safe-bottom z-40">
          <Button className="w-full" disabled={!complete || verificando} onClick={confirmar}>
            {verificando ? <span className="spinner" /> : "Confirmar y cerrar jornada"}
          </Button>
          {!complete && <p className="text-center text-[12px] text-muted mt-2">Marcá el checkbox de los {totalItems} ítems para continuar</p>}
        </div>
      )}
    </div>
  );
}

/* =====================================================================
   PANTALLA 8b - CIERRE DEL DIA
===================================================================== */
function CierreDelDia({ user, clienteId, onCerrado }) {
  const [resumen, setResumen] = useState(null);
  const [reconteando, setReconteando] = useState(false);
  const [cerrando, setCerrando] = useState(false);
  const [cerrado, setCerrado] = useState(false);
  // Fix 3: si el reconteo difiere del sistema, antes de cerrar se muestra
  // una pantalla intermedia con el detalle (no bloquea, solo informa).
  const [discrepancias, setDiscrepancias] = useState(null); // null = sin calcular/sin diffs; { neuDiffs, llantaDiffs } = hay diferencias
  const [observacion, setObservacion] = useState("");
  const [pushToast, toastNode] = useToasts();

  useEffect(() => {
    construirResumenJornada(user.id, clienteId, todayISO()).then(({ conteos }) => setResumen(conteos)).catch(() => setResumen(null));
  }, [clienteId]);

  async function confirmarReconteo(totalesNeumaticos, totalesLlantas) {
    setCerrando(true);
    try {
      const { neuDiffs, llantaDiffs } = await compararStockCierre(clienteId, totalesNeumaticos, totalesLlantas);
      if (neuDiffs.length || llantaDiffs.length) {
        setDiscrepancias({ neuDiffs, llantaDiffs });
        setCerrando(false);
        return;
      }
    } catch (e) {
      console.error("No se pudo comparar el stock al cierre", e);
    }
    await ejecutarCierre([], []);
  }

  async function ejecutarCierre(neuDiffs, llantaDiffs) {
    setCerrando(true);
    try {
      if (neuDiffs.length || llantaDiffs.length) {
        await registrarDiscrepanciasCierre(clienteId, user, todayISO(), neuDiffs, llantaDiffs, observacion.trim() || null);
        pushToast("⚠ Se detectaron diferencias de stock — se avisó a tu supervisor", "amber");
      } else {
        pushToast("✓ Stock verificado");
      }
    } catch (e) {
      console.error("No se pudo registrar la discrepancia de cierre", e);
    }
    try {
      await cerrarJornadaConResumen({ user, clienteId, fecha: todayISO(), horaCierre: nowHM(), motivoSinCierre: null });
      localStorage.setItem("jornada_cerrada_hoy", "true");
      setCerrado(true);
      if (onCerrado) onCerrado();
    } catch (e) {
      console.error("No se pudo cerrar la jornada", e);
    } finally {
      setCerrando(false);
      setReconteando(false);
      setDiscrepancias(null);
    }
  }

  if (cerrado) {
    return (
      <div className="min-h-screen flex flex-col items-center justify-center px-8 text-center">
        <div className="w-14 h-14 rounded-2xl bg-[#DCFCE7] flex items-center justify-center mb-5"><Icon.check width="26" height="26" className="text-[#15803D]" /></div>
        <p className="text-[22px] font-extrabold mb-2">¡Jornada cerrada!</p>
        <p className="text-[15px] text-sub">Hasta mañana, {user.nombre}</p>
      </div>
    );
  }

  // Fix 3: pantalla intermedia con las diferencias encontradas — informa,
  // no bloquea (el mecanico confirma igual y recien ahi se ejecuta el cierre).
  if (discrepancias) {
    const filas = [...discrepancias.neuDiffs.map(d => ({ ...d, esLlanta: false })), ...discrepancias.llantaDiffs.map(d => ({ ...d, esLlanta: true }))];
    return (
      <div className="min-h-screen pb-28 px-5 pt-14 safe-top">
        {toastNode}
        <div className="w-14 h-14 rounded-2xl bg-[#FEE2E2] flex items-center justify-center mb-5 text-2xl">⚠</div>
