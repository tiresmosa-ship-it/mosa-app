  useEffect(() => {
    let cancel = false;
    fetchInstructivosHoy(c.cliente_id).then(data => {
      if (!cancel) setInstructivos(data.filter(r => r.mecanico && r.mecanico.id === c.mecanico_id));
    }).catch(e => console.error(e));
    return () => { cancel = true; };
  }, [c.mecanico_id, c.cliente_id]);
  useEffect(() => {
    let cancel = false;
    sb.from("intervenciones").select("id,foto_url,posicion,numero_fuego")
      .eq("tipo", "checkpoint").eq("mecanico_id", c.mecanico_id).eq("fecha", c.fecha)
      .not("foto_url", "is", null)
      .then(({ data, error }) => { if (!cancel && !error) setFotosMontaje(data || []); })
      .catch(e => console.error("No se pudieron cargar las fotos de montaje", e));
    return () => { cancel = true; };
  }, [c.mecanico_id, c.fecha]);

  const empresa = (empresas.find(e => e.id_cliente === c.cliente_id) || {}).nombre || c.cliente_id;
  const nombreMecanico = c.mecanico ? `${c.mecanico.nombre} ${c.mecanico.apellido || ""}` : "-";

  function exportarExcel() {
    const filas = [
      ["Mecánico", nombreMecanico], ["Empresa", empresa], ["Turno", c.turno || 1],
      ["Hora ingreso", (c.hora_inicio || "").slice(0, 5)], ["Hora salida", (c.hora_cierre || "").slice(0, 5)],
      ["Duración", calcDuracion(c.hora_inicio, c.hora_cierre)],
      ["Auditorías", c.auditorias_realizadas], ["Hojas de cambio", c.cambios_realizados],
      ["Regulaciones PSI", c.regulaciones_psi], ["Retorqueos", c.retorqueos],
      ["Rotaciones", c.rotaciones], ["Reparaciones", c.reparaciones],
      ["% promedio instructivo", c.pct_receta_promedio != null ? `${c.pct_receta_promedio}%` : "-"],
      ["Stock nuevos", c.stock_nuevo], ["Stock tránsito", c.stock_transito], ["Stock recauchados", c.stock_recauchado],
      ["Observación general", c.observaciones || ""]
    ];
    const csv = filas.map(([k, v]) => `"${k}","${v == null ? "" : v}"`).join("\n");
    const blob = new Blob(["﻿" + csv], { type: "text/csv;charset=utf-8;" });
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = `reporte_cierre_${nombreMecanico.replace(/\s+/g, "_")}_${c.fecha}.csv`;
    a.click();
  }
  function exportarPDF() {
    const w = window.open("", "_blank");
    w.document.write(`<html><head><title>Reporte de cierre</title><style>body{font-family:sans-serif;padding:24px;} h2{margin-bottom:4px;} p{margin:4px 0;font-size:13.5px;} hr{margin:14px 0;}</style></head><body>
      <h2>Reporte de cierre — ${nombreMecanico}</h2>
      <p><b>Empresa:</b> ${empresa} · <b>Turno:</b> ${c.turno || 1}</p>
      <p><b>Hora ingreso:</b> ${(c.hora_inicio || "").slice(0, 5)} · <b>Hora salida:</b> ${(c.hora_cierre || "").slice(0, 5)} · <b>Duración:</b> ${calcDuracion(c.hora_inicio, c.hora_cierre)}</p>
      <hr/>
      <p><b>Auditorías:</b> ${c.auditorias_realizadas}</p>
      <p><b>Hojas de cambio:</b> ${c.cambios_realizados}</p>
      <p><b>Regulaciones PSI:</b> ${c.regulaciones_psi}</p>
      <p><b>Retorqueos:</b> ${c.retorqueos}</p>
      <p><b>Rotaciones:</b> ${c.rotaciones}</p>
      <p><b>Reparaciones:</b> ${c.reparaciones}</p>
      <p><b>% promedio instructivo:</b> ${c.pct_receta_promedio != null ? c.pct_receta_promedio + "%" : "-"}</p>
      <hr/>
      <p><b>Stock nuevos:</b> ${c.stock_nuevo} · <b>Tránsito:</b> ${c.stock_transito} · <b>Recauchados:</b> ${c.stock_recauchado}</p>
      ${c.observaciones ? `<hr/><p><b>Observación general del día:</b></p><p>${c.observaciones.replace(/</g, "&lt;")}</p>` : ""}
    </body></html>`);
    w.document.close();
    w.focus();
    w.print();
  }

  return (
    <Modal title="Reporte de jornada" onClose={onClose} wide>
      <div className="space-y-5">
        <div>
          <p className="text-[11px] font-extrabold text-muted uppercase tracking-wide mb-1.5">Jornada</p>
          <p className="text-[14px] font-bold">{nombreMecanico} <span className="text-muted font-semibold">· {empresa}</span></p>
          <p className="text-[13px] text-sub mt-1">Turno: {c.turno || 1}{c.turno > 1 && <Badge color="black">Turno {c.turno}</Badge>}</p>
          <p className="text-[13px] text-sub">Hora ingreso: {(c.hora_inicio || "").slice(0, 5) || "—"} · Hora salida: {(c.hora_cierre || "").slice(0, 5) || "—"}</p>
          <p className="text-[13px] text-sub">Duración: {calcDuracion(c.hora_inicio, c.hora_cierre)}</p>
          {c.motivo_sin_cierre === "olvido_cierre" && <Badge color="amber">Cerró al día siguiente</Badge>}
        </div>

        <div>
          <p className="text-[11px] font-extrabold text-muted uppercase tracking-wide mb-1.5">Actividad del día</p>
          <div className="grid grid-cols-2 gap-2 text-[13.5px]">
            <p>Auditorías: <b>{c.auditorias_realizadas}</b> {c.auditorias_realizadas > 0 && <button className="text-[12px] font-bold text-ink underline" onClick={() => setVerAuditorias(true)}>ver equipos</button>}</p>
            <p>Hojas de cambio: <b>{c.cambios_realizados}</b> {fotosMontaje.length > 0 && <button className="text-[12px] font-bold text-ink underline" onClick={() => setFotoUrl(fotosMontaje[0].foto_url)}>📷 Ver foto{fotosMontaje.length > 1 ? "s" : ""} ({fotosMontaje.length})</button>}</p>
            <p>Regulaciones PSI: <b>{c.regulaciones_psi}</b></p>
            <p>Retorqueos: <b>{c.retorqueos}</b></p>
            <p>Rotaciones: <b>{c.rotaciones}</b></p>
            <p>Reparaciones: <b>{c.reparaciones}</b></p>
          </div>
          {fotosMontaje.length > 1 && (
            <div className="flex flex-wrap gap-2 mt-3">
              {fotosMontaje.map(f => (
                <button key={f.id} onClick={() => setFotoUrl(f.foto_url)} className="text-[12px] font-bold text-ink underline">
                  📷 pos {f.posicion} · N° {f.numero_fuego}
                </button>
              ))}
            </div>
          )}
        </div>

        <div>
          <p className="text-[11px] font-extrabold text-muted uppercase tracking-wide mb-1.5">Instructivos</p>
          {instructivos === null ? <div className="flex justify-center py-4"><span className="spinner" /></div> : (
            <div className="space-y-2">
              {instructivos.map(r => <InstructivoResumenRow key={r.id} r={r} />)}

            </div>
          )}
          <p className="text-[13px] text-sub mt-2 font-semibold">% promedio instructivo: {c.pct_receta_promedio != null ? `${c.pct_receta_promedio}%` : "—"}</p>

          <p className="text-[13.5px]">Nuevos: <b>{c.stock_nuevo}</b> · Tránsito: <b>{c.stock_transito}</b> · Recauchados: <b>{c.stock_recauchado}</b></p>
        </div>

        {/* Requerimiento 3.2: observacion_general de la jornada -- se guarda
            en cierre_dia.observaciones (columna generica preexistente, ver
            cerrarJornadaConResumen en js/supabase.js). Tarjeta destacada,
            solo si el mecanico escribio algo. */}
        {c.observaciones && (
          <div className="bg-[#FFFBEB] border border-[#FDE68A] rounded-2xl p-4">
            <p className="text-[11px] font-extrabold text-[#92400E] uppercase tracking-wide mb-1.5">📝 Observación general del día</p>
            <p className="text-[13.5px] text-[#374151] whitespace-pre-wrap">{c.observaciones}</p>

      {verAuditorias && <AuditoriasDelDiaModal mecanico={{ id: c.mecanico_id }} fecha={c.fecha} onClose={() => setVerAuditorias(false)} />}

}

function JornadaView({ empresaCtl, adminUser }) {
  const { filtro, empresas } = empresaCtl;
  const [sub, setSub] = useState(() => { try { const o = JSON.parse(sessionStorage.getItem("alerta_origen") || "null"); return (o && o.destinoSub) || null; } catch (e) { return null; } });
  const [cierres, setCierres] = useState([]);

  const [verReporte, setVerReporte] = useState(null);
  const [loading, setLoading] = useState(false);
  const [pushToast, toastNode] = useToasts();

  useEffect(() => {
    if (sub !== "cierre") return;
    setLoading(true);
    Promise.all([fetchCierresHoy(filtro), fetchStatsCierreMes(filtro)])
      .then(([cs, stats]) => { setCierres(cs); setStatsMes(stats); })
      .catch(e => console.error(e)).finally(() => setLoading(false));
  }, [sub, filtro]);

  if (!sub) {
    return (
      <div>
        <h1 className="text-[26px] font-extrabold mb-5">Jornada</h1>
        <div className="grid sm:grid-cols-3 gap-3">
          <button onClick={() => setSub("inicio")} className="text-left"><Card><p className="text-[24px] mb-2">✅</p><p className="font-bold text-[15px]">Inicio del día</p><p className="text-[12.5px] text-muted mt-1">Checks diarios completados hoy</p></Card></button>
          <button onClick={() => setSub("movimientos")} className="text-left"><Card><p className="text-[24px] mb-2">⚡</p><p className="font-bold text-[15px]">Movimientos del día</p><p className="text-[12.5px] text-muted mt-1">Auditorías y cambios de hoy</p></Card></button>
          <button onClick={() => setSub("cierre")} className="text-left"><Card><p className="text-[24px] mb-2">🌙</p><p className="font-bold text-[15px]">Cierre del día</p><p className="text-[12.5px] text-muted mt-1">Estado de cierre por mecánico</p></Card></button>
        </div>
      </div>
    );
  }

  const titulo = sub === "inicio" ? "Inicio del día" : sub === "movimientos" ? "Movimientos del día" : "Cierre del día";
  return (
    <div>
      {toastNode}
      <button onClick={() => setSub(null)} className="flex items-center gap-2 text-[13.5px] font-bold text-muted mb-4"><Icon.back width="15" height="15" /> Jornada</button>
      <h1 className="text-[26px] font-extrabold mb-5">{titulo}</h1>

        <>

            <div>
              <div className="bg-white rounded-2xl border border-bd shadow-card overflow-hidden mb-5">
                {cierres.map((c, i) => {
                  const info = CierreEstadoInfo(c);
                  const nombre = c.mecanico ? `${c.mecanico.nombre} ${c.mecanico.apellido || ""}` : "-";
                  return (
                    <button key={c.id} onClick={() => c.cerrado && setVerReporte(c)}
                      className={cx("w-full flex items-center justify-between px-4 py-3 text-left", i > 0 && "border-t border-bd", !c.cerrado && "cursor-default")}>
                      <div className="flex items-center gap-2 min-w-0">
                        <span>{info.icon}</span>
                        <div className="min-w-0">
                          <p className="font-bold text-[14px] truncate">{nombre} {c.turno > 1 && <span className="text-muted font-semibold">· Turno {c.turno}</span>}</p>
                          <p className="text-[12px] text-muted">{info.label}</p>
                        </div>
                      </div>
                      <div className="flex items-center gap-2 shrink-0">
                        {info.badge && <Badge color="amber">{info.badge}</Badge>}
                        {c.cerrado && <span className="text-[12px] font-bold text-ink">Ver reporte</span>}
                      </div>
                    </button>

                })}
                {!cierres.length && <p className="text-[13.5px] text-muted p-4">Los mecánicos aún no han cerrado su jornada</p>}
              </div>

              {!!cierres.length && (
                <div className="grid grid-cols-2 sm:grid-cols-4 gap-3">
                  <KpiCard label="Cerraron correctamente hoy" value={`${cierres.filter(c => c.cerrado && !c.motivo_sin_cierre).length}/${cierres.length}`} />
                  <KpiCard label="Con jornada abierta" value={cierres.filter(c => !c.cerrado).length} />
                  <KpiCard label="% cierre correcto del mes" value={statsMes ? `${statsMes.pct}%` : "—"} />
                  <KpiCard label="Cierres registrados este mes" value={statsMes ? statsMes.total : "—"} />
                </div>
              )}

              {verReporte && <ReporteCierreModal c={verReporte} empresas={empresas} onClose={() => setVerReporte(null)} />}
            </div>
          )}
        </>
      )}
    </div>
  );
}

function MecanicoMaestroModal({ mecanico, filtro, empresas, onClose, onSaved, pushToast }) {
  const editando = !!mecanico;
  const [nombre, setNombre] = useState(mecanico ? (mecanico.nombre || "") : "");
  const [apellido, setApellido] = useState(mecanico ? (mecanico.apellido || "") : "");
  const [telefono, setTelefono] = useState(mecanico ? (mecanico.telefono || "") : "");
  const [email, setEmail] = useState(mecanico ? (mecanico.email || "") : "");
  const [usuario, setUsuario] = useState(mecanico ? (mecanico.usuario || "") : "");
  const [password, setPassword] = useState("");
  const [clienteId, setClienteId] = useState(mecanico ? mecanico.cliente_id : (filtro !== "todas" ? filtro : ""));
  // Requerimiento 2A: permiso para derivar tareas del instructivo a Pendiente
  // y agregar tareas propias (sin el permiso, el mecanico solo puede tachar
  // tareas como completadas).
  const [puedeModificar, setPuedeModificar] = useState(mecanico ? !!mecanico.puede_modificar_instructivo : false);
  const [saving, setSaving] = useState(false);
  const [error, setError] = useState("");

  async function guardar() {
    setError("");
    if (!nombre.trim() || !usuario.trim()) { setError("Nombre y usuario son obligatorios."); return; }
    if (!editando && !password.trim()) { setError("La contraseña es obligatoria al crear un mecánico."); return; }
    if (!clienteId) { setError("Elegí una empresa."); return; }
    setSaving(true);
    try {
      let q = sb.from("usuarios").select("id").eq("usuario", usuario.trim());
      if (editando) q = q.neq("id", mecanico.id);
      const { data: dup } = await q;
      if (dup && dup.length) { setError("Ya existe un usuario con ese nombre de usuario."); setSaving(false); return; }

      const payload = { nombre: nombre.trim(), apellido: apellido.trim() || null, telefono: telefono.trim() || null, email: email.trim() || null, usuario: usuario.trim(), cliente_id: clienteId, puede_modificar_instructivo: puedeModificar };
      if (password.trim()) payload.password_hash = await sha256Hex(password.trim());
      if (editando) {
        const { error: e } = await sb.from("usuarios").update(payload).eq("id", mecanico.id);
        if (e) throw e;
        pushToast("✓ Mecánico actualizado");
      } else {
        const { error: e } = await sb.from("usuarios").insert({ ...payload, id: uuid(), rol: "mecanico", activo: true });
        if (e) throw e;
        pushToast("✓ Mecánico creado");
      }
      onSaved();
    } catch (e) { console.error("No se pudo guardar el mecánico", e); setError("No se pudo guardar. Intentá de nuevo."); }
    setSaving(false);
  }

  return (
    <Modal title={editando ? "Editar mecánico" : "Nuevo mecánico"} onClose={onClose}>
      <div className="space-y-4">
        <Field label="Nombre" required><TextInput value={nombre} onChange={e => setNombre(e.target.value)} /></Field>
        <Field label="Apellido"><TextInput value={apellido} onChange={e => setApellido(e.target.value)} /></Field>
        <Field label="Teléfono"><TextInput value={telefono} onChange={e => setTelefono(e.target.value)} /></Field>
        <Field label="Email"><TextInput type="email" value={email} onChange={e => setEmail(e.target.value)} /></Field>
        <Field label="Usuario" required><TextInput value={usuario} onChange={e => setUsuario(e.target.value)} /></Field>
        <Field label="Contraseña" required={!editando} hint={editando ? "Dejar vacío para no cambiarla" : null}>
          <TextInput type="password" value={password} onChange={e => setPassword(e.target.value)} placeholder={editando ? "••••••" : ""} />
        </Field>
        <Field label="Empresa asignada" required>
          <Select value={clienteId} onChange={e => setClienteId(e.target.value)}>
            <option value="">Seleccionar</option>
            {empresas.map(e => <option key={e.id_cliente} value={e.id_cliente}>{e.nombre}</option>)}
          </Select>
        </Field>
        <label className="flex items-start gap-3 bg-[#F9FAFB] rounded-2xl p-3.5 cursor-pointer" onClick={() => setPuedeModificar(v => !v)}>
          <span className={cx("w-11 h-6 rounded-full shrink-0 relative transition mt-0.5", puedeModificar ? "bg-ink" : "bg-[#D1D5DB]")}>
            <span className={cx("absolute top-0.5 w-5 h-5 rounded-full bg-white transition", puedeModificar ? "left-[22px]" : "left-0.5")} />
          </span>
          <span>
            <span className="block text-[14px] font-bold">Puede modificar el instructivo</span>
            <span className="block text-[12px] text-muted mt-0.5">Deriva tareas a Pendiente y agrega tareas propias en la Hoja de Cambio. Sin esto, solo puede tacharlas como completadas.</span>
          </span>
        </label>
        {error && <p className="text-[12.5px] font-bold text-[#B91C1C]">{error}</p>}
        <Button className="w-full" disabled={saving} onClick={guardar}>{saving ? <span className="spinner" /> : (editando ? "Guardar cambios" : "Crear mecánico")}</Button>
      </div>
    </Modal>
  );
}

function ProveedorMaestroModal({ proveedor, filtro, onClose, onSaved, pushToast }) {

  const [email, setEmail] = useState(proveedor ? (proveedor.email || "") : "");
  const [saving, setSaving] = useState(false);
  const [error, setError] = useState("");

  async function guardar() {
    setError("");
    if (!nombre.trim()) { setError("El nombre es obligatorio."); return; }
    if (!editando && (!filtro || filtro === "todas")) { setError("Elegí una empresa específica en el selector de arriba antes de crear un proveedor."); return; }

      onSaved();

  return (
    <Modal title={editando ? "Editar proveedor" : "Nuevo proveedor"} onClose={onClose}>

        <Field label="Nombre" required><TextInput value={nombre} onChange={e => setNombre(e.target.value)} /></Field>

// Trae, para una lista de numero_fuego, el ultimo valor relevante de una
// tabla relacionada (cambio_detalle.milimetros o alertas.descripcion) —
// se usa para mostrar "MM retiro"/"Motivo" en los checklists de abajo, dato
// que no vive en la propia fila de neumaticos. order+reduce en JS porque
// PostgREST no tiene "distinct on" via REST.
async function fetchUltimoPorFuego(tabla, campo, filtroExtra, numerosFuego) {
  if (!numerosFuego.length) return {};
  let q = sb.from(tabla).select(`numero_fuego,${campo},creado_en`).in("numero_fuego", numerosFuego).order("creado_en", { ascending: false });
  Object.entries(filtroExtra).forEach(([k, v]) => { q = q.eq(k, v); });
  const { data } = await q;
  const map = {};
  (data || []).forEach(d => { if (map[d.numero_fuego] === undefined) map[d.numero_fuego] = d[campo]; });
  return map;
}
function diasDesde(fechaISO) {
  if (!fechaISO) return null;
  const ms = Date.now() - new Date(fechaISO + "T00:00:00").getTime();
  return Math.floor(ms / 86400000);
}
// Requerimiento: reemplaza el viejo ChecklistBodegaSeccion (una sola accion
// por bodega) por un componente generico que soporta VARIAS acciones de
// transferencia por bodega (cada una con su propio modal de confirmacion),
// resalta en rojo suave las filas con MM<=3 cuando la seccion lo pide
// (columnas.mmDe), y muestra la foto de evidencia subida por el mecanico en
// los retiros por Daño/Otro (columna renderRow recibe un callback `verFoto`).
// esSuperAdmin: EXCEPCION de regla de negocio -- el SuperAdmin puede omitir
// las restricciones de MM (accion.deshabilitadaSi) y mover neumaticos
// libremente entre bodegas para correcciones operativas.
function BodegaMultiAccionSeccion({ filtro, pushToast, onCambio, bodegaOrigen, columnas, sinDatosLabel, acciones, resaltarRiesgo, esSuperAdmin }) {
  const [lista, setLista] = useState([]);
  const [extra, setExtra] = useState({});
  const [sel, setSel] = useState({});
  const [loading, setLoading] = useState(true);
  const [accionActiva, setAccionActiva] = useState(null);
  const [justificacion, setJustificacion] = useState("");
  const [saving, setSaving] = useState(false);
  const [fotoVer, setFotoVer] = useState(null);

  async function cargar() {
    setLoading(true);
    let q = sb.from("neumaticos").select("*").eq("bodega", bodegaOrigen).eq("activo", true);
    q = filtroCliente(q, filtro);
    const { data } = await q;
    const rows = data || [];
    const ex = await columnas.fetchExtra(rows.map(n => n.numero_fuego).filter(Boolean));
    setExtra(ex); setLista(rows); setSel({}); setLoading(false);
  }
  useEffect(() => { cargar(); }, [filtro, bodegaOrigen]);

  const seleccionados = Object.keys(sel).filter(k => sel[k]);
  const filasSeleccionadas = lista.filter(n => sel[n.id_neumatico]);
  function accionBloqueada(accion) {
    if (esSuperAdmin || !accion.deshabilitadaSi) return false;
    return filasSeleccionadas.some(n => accion.deshabilitadaSi(n, extra));
  }
  // Requerimiento: "indicando los numeros a fuego que no cumplen el
  // requisito" -- lista los N° de fuego seleccionados que bloquean esta
  // accion, para que el Admin sepa cuales sacar de la seleccion.
  function fuegosBloqueando(accion) {
    if (esSuperAdmin || !accion.deshabilitadaSi) return [];
    return filasSeleccionadas.filter(n => accion.deshabilitadaSi(n, extra)).map(n => n.numero_fuego || "(sin fuego)");
  }

  async function confirmar() {
    if (!accionActiva) return;
    if (accionActiva.requiereJustificacion && !justificacion.trim()) return;
    setSaving(true);
    try {
      // extra se pasa para que accionMoverBodega pueda re-validar
      // deshabilitadaSi justo antes de escribir (defensa en profundidad,
      // por si el boton deshabilitado se saltea de algun modo).
      await accionActiva.aplicar(seleccionados, lista, justificacion.trim(), extra);
      pushToast(`✓ ${accionActiva.toastLabel(seleccionados.length)}`);
      setAccionActiva(null); setJustificacion("");
      cargar(); onCambio && onCambio();
    } catch (e) {
      console.error("No se pudo aplicar la accion de bodega", e);
      pushToast(`✕ ${e.message || "No se pudo completar la acción"}`, "red");
    }
    setSaving(false);
  }

  if (loading) return <div className="flex justify-center py-10"><span className="spinner" /></div>;
  return (
    <div>
      <div className="bg-white rounded-2xl border border-bd shadow-card overflow-x-auto mb-4">
        <table className="w-full text-[13.5px] min-w-[560px]">
          <thead><tr className="text-left text-muted border-b border-bd">
            <th className="py-3 px-4"></th>
            {columnas.headers.map(h => <th key={h} className="font-semibold py-3 px-4">{h}</th>)}
          </tr></thead>
          <tbody>
            {lista.map(n => {
              const mm = columnas.mmDe ? columnas.mmDe(n, extra) : null;
              const enRiesgo = resaltarRiesgo && mm != null && mm <= 3;
              return (
                <tr key={n.id_neumatico} className={cx("border-b border-bd last:border-0", enRiesgo && "bg-red-100/60 border-l-4 border-red-500")}>
                  <td className="py-2.5 px-4"><input type="checkbox" checked={!!sel[n.id_neumatico]} onChange={e => setSel(s => ({ ...s, [n.id_neumatico]: e.target.checked }))} /></td>
                  {columnas.renderRow(n, extra, setFotoVer)}
                </tr>
              );
            })}
            {!lista.length && <tr><td colSpan={columnas.headers.length + 1} className="text-center text-muted py-8">{sinDatosLabel}</td></tr>}
          </tbody>
        </table>
      </div>
      {!!acciones.length && (
        <div className="mb-2">
          <div className="flex flex-wrap gap-2">
            {acciones.map(accion => (
              <Button key={accion.id} variant={accion.variant || "primary"} className="h-11 px-4 text-[13.5px]"
                disabled={!seleccionados.length || accionBloqueada(accion)} onClick={() => setAccionActiva(accion)}>
                {accion.label} ({seleccionados.length})
              </Button>
            ))}
          </div>
          {acciones.map(accion => {
            const fuegos = fuegosBloqueando(accion);
            if (!fuegos.length) return null;
            return (
              <p key={accion.id} className="text-[12px] font-semibold text-[#B91C1C] mt-2">
                🛑 "{accion.label}" bloqueado — MM≤3 en: {fuegos.join(", ")}
              </p>
            );
          })}
        </div>
      )}
      {accionActiva && (
        <Modal title={accionActiva.tituloConfirm} onClose={() => { setAccionActiva(null); setJustificacion(""); }}>
          <p className="text-[14px] text-[#374151] mb-4">{accionActiva.descConfirm(seleccionados.length)}</p>
          {accionActiva.requiereJustificacion && (
            <Field label="Justificación" required><TextArea value={justificacion} onChange={e => setJustificacion(e.target.value)} /></Field>
          )}
          <Button className="w-full mt-4" variant={accionActiva.variant === "danger" ? "danger" : "primary"}
            disabled={saving || (accionActiva.requiereJustificacion && !justificacion.trim())} onClick={confirmar}>
            {saving ? <span className="spinner" /> : "Confirmar"}
          </Button>
        </Modal>
      )}
      {fotoVer && (
        <Modal title="Foto de evidencia" onClose={() => setFotoVer(null)}>
          <img src={fotoVer} alt="Evidencia" className="w-full rounded-xl border border-bd" />
        </Modal>
      )}
    </div>
  );
}
// Fabrica de acciones "Mandar a <bodega>" -- evita repetir el mismo
// update+insert de movimientos_bodega en cada seccion.
function accionMoverBodega(filtro, { id, label, variant, bodegaDestino, estadoDestino, origenMov, tituloConfirm, descConfirm, toastLabel, requiereJustificacion, deshabilitadaSi, esSuperAdmin }) {
  return {
    id, label, variant, requiereJustificacion: !!requiereJustificacion, deshabilitadaSi, tituloConfirm, descConfirm, toastLabel,
    aplicar: async (seleccionados, lista, justificacion, extra) => {
      // Requerimiento: defensa en profundidad -- revalida deshabilitadaSi
      // (la misma regla que ya deshabilita el boton en la UI) justo antes
      // de escribir, por si esa proteccion se salteara de algun modo.
      // Unica excepcion: SuperAdmin.
      if (!esSuperAdmin && deshabilitadaSi) {
        const bloqueados = lista.filter(n => seleccionados.includes(n.id_neumatico) && deshabilitadaSi(n, extra));
        if (bloqueados.length) {
          throw new Error(`No se puede mover a "${bodegaDestino}" — MM≤3 en: ${bloqueados.map(n => n.numero_fuego || "(sin fuego)").join(", ")}`);
        }
      }
      await sb.from("neumaticos").update({ bodega: bodegaDestino, estado_actual: estadoDestino }).in("id_neumatico", seleccionados);
      await sb.from("movimientos_bodega").insert(seleccionados.map(id => {
        const n = lista.find(x => x.id_neumatico === id);
        return { id: uuid(), cliente_id: n ? n.cliente_id : filtro, fecha: todayISO(), categoria: "neumatico", tipo: "salida", origen: origenMov, numero_fuego: n ? n.numero_fuego : null, motivo: justificacion || null };
      }));
    }
  };
}
function RetiroDesgasteSeccion({ filtro, pushToast, onCambio, usaRecauchados, esSuperAdmin }) {

    headers: ["N° fuego", "Marca", "Modelo", "MM retiro", "Fecha"],

      toastLabel: (n) => `${n} neumáticos enviados a Para Recauchar`

  }
  return (
    <BodegaMultiAccionSeccion filtro={filtro} pushToast={pushToast} onCambio={onCambio} bodegaOrigen="retiro_desgaste" columnas={columnas}
      sinDatosLabel="No hay neumáticos en retiro por desgaste normal." acciones={acciones} esSuperAdmin={esSuperAdmin} />

        extraExtra ? extraExtra.fetchExtra(fuegos) : Promise.resolve({})

      return { mm, foto, fechas, ...extra2 };
    },
    mmDe: (n, extra) => extra.mm[n.numero_fuego],
    renderRow: (n, extra, verFoto) => (
      <>

      </>
    )
  };
}

function LlantaEditModal({ llanta, onClose, onSaved, pushToast }) {
  const [cantidad, setCantidad] = useState(String(llanta.cantidad));
  const [precio, setPrecio] = useState(String(llanta.precio || 0));
  const [saving, setSaving] = useState(false);
  const [error, setError] = useState("");
  async function guardar() {
    const cant = parseInt(cantidad, 10), pre = parseFloat(precio);
    if (isNaN(cant) || cant < 0) { setError("Cantidad inválida."); return; }
    if (isNaN(pre) || pre < 0) { setError("Precio inválido."); return; }
    setSaving(true); setError("");
    try {
      const { error: err } = await sb.from("insumos").update({ cantidad: cant, precio: pre }).eq("id", llanta.id);
      if (err) throw err;
      pushToast("✓ Llantas actualizadas");
      onSaved();
    } catch (e) { console.error(e); setError("No se pudo guardar."); setSaving(false); }
  }
  return (
    <Modal title={`Editar — ${LLANTA_LABELS[llanta.subtipo] || llanta.subtipo}`} onClose={onClose}>
      <div className="space-y-4">
        <Field label="Cantidad" required><TextInput type="number" inputMode="numeric" value={cantidad} onChange={e => setCantidad(e.target.value)} /></Field>
        <Field label="Precio unitario" required><TextInput type="number" inputMode="numeric" value={precio} onChange={e => setPrecio(e.target.value)} /></Field>
        {error && <p className="text-[12.5px] font-bold text-[#B91C1C]">{error}</p>}
        <Button className="w-full" disabled={saving} onClick={guardar}>{saving ? <span className="spinner" /> : "Guardar"}</Button>
      </div>
    </Modal>
  );
}

function HerramientaMaestroModal({ herramienta, filtro, empresaNombre, proveedores, onClose, onSaved, pushToast }) {
  const editando = !!herramienta;
  const [nombre, setNombre] = useState(herramienta ? (herramienta.nombre || "") : "");
  const [descripcion, setDescripcion] = useState(herramienta ? (herramienta.descripcion || "") : "");
  const [cantidad, setCantidad] = useState(herramienta ? String(herramienta.cantidad || "") : "");
  const [precioUnit, setPrecioUnit] = useState(herramienta ? String(herramienta.precio_unitario || "") : "");
  const [empresaCosto, setEmpresaCosto] = useState(herramienta ? (herramienta.empresa_costo || "MOSA") : "MOSA");
  const [proveedorId, setProveedorId] = useState(herramienta ? (herramienta.proveedor_id || "") : "");
  const [numeroDoc, setNumeroDoc] = useState(herramienta ? (herramienta.numero_documento || "") : "");
  const [fechaIngreso, setFechaIngreso] = useState(herramienta ? (herramienta.fecha_ingreso || todayISO()) : todayISO());
  const [saving, setSaving] = useState(false);
  const [error, setError] = useState("");

  async function guardar() {
    setError("");
    if (!nombre.trim()) { setError("El nombre es obligatorio."); return; }
    if (!editando && (!filtro || filtro === "todas")) { setError("Elegí una empresa específica en el selector de arriba."); return; }
    setSaving(true);
    try {
      const payload = {
        nombre: nombre.trim(), descripcion: descripcion.trim() || null, cantidad: cantidad ? parseInt(cantidad, 10) : 0,
        precio_unitario: precioUnit ? parseFloat(precioUnit) : null, empresa_costo: empresaCosto, proveedor_id: proveedorId || null,
        numero_documento: numeroDoc.trim() || null, fecha_ingreso: fechaIngreso
      };
      if (editando) {
        const { error: e } = await sb.from("herramientas_inventario").update(payload).eq("id", herramienta.id);
        if (e) throw e;
        pushToast("✓ Herramienta actualizada");
      } else {
        const { error: e } = await sb.from("herramientas_inventario").insert({ ...payload, id: uuid(), cliente_id: filtro, activo: true });
        if (e) throw e;
        await sb.from("movimientos_bodega").insert({
          id: uuid(), cliente_id: filtro, fecha: fechaIngreso, categoria: "herramienta", tipo: "entrada", origen: "ingreso_herramienta",
          precio_unitario: precioUnit ? parseFloat(precioUnit) : null, numero_documento: numeroDoc.trim() || null, cantidad: cantidad ? parseInt(cantidad, 10) : 0
        });
        pushToast("✓ Herramienta creada");
      }
      onSaved();
    } catch (e) { console.error("No se pudo guardar la herramienta", e); setError("No se pudo guardar. Intentá de nuevo."); }
    setSaving(false);
  }

  return (
    <Modal title={editando ? "Editar herramienta" : "Nueva herramienta"} onClose={onClose}>
      <div className="space-y-4">
        <Field label="Nombre" required><TextInput value={nombre} onChange={e => setNombre(e.target.value)} /></Field>
        <Field label="Descripción"><TextArea value={descripcion} onChange={e => setDescripcion(e.target.value)} /></Field>
        <div className="grid grid-cols-2 gap-3">
          <Field label="Cantidad"><TextInput type="number" inputMode="numeric" value={cantidad} onChange={e => setCantidad(e.target.value)} /></Field>
          <Field label="Precio unitario"><TextInput type="number" value={precioUnit} onChange={e => setPrecioUnit(e.target.value)} /></Field>
        </div>
        <Field label="Empresa que absorbe el costo" required>
          <div className="flex gap-2">
            {["MOSA", empresaNombre].map(op => (
              <button key={op} type="button" onClick={() => setEmpresaCosto(op)} className={cx("flex-1 h-11 rounded-2xl text-[13.5px] font-bold", empresaCosto === op ? "bg-ink text-white" : "bg-[#F3F4F6] text-[#374151]")}>{op}</button>
            ))}
          </div>
        </Field>
        <Field label="Proveedor">
          <Select value={proveedorId} onChange={e => setProveedorId(e.target.value)}>
            <option value="">Sin especificar</option>
            {proveedores.map(p => <option key={p.id} value={p.id}>{p.nombre}</option>)}
          </Select>
        </Field>
        <div className="grid grid-cols-2 gap-3">
          <Field label="N° documento"><TextInput value={numeroDoc} onChange={e => setNumeroDoc(e.target.value)} /></Field>
          <Field label="Fecha ingreso"><TextInput type="date" value={fechaIngreso} onChange={e => setFechaIngreso(e.target.value)} /></Field>
        </div>
        {error && <p className="text-[12.5px] font-bold text-[#B91C1C]">{error}</p>}
        <Button className="w-full" disabled={saving} onClick={guardar}>{saving ? <span className="spinner" /> : (editando ? "Guardar cambios" : "Crear herramienta")}</Button>
      </div>
    </Modal>
  );
}

/* =====================================================================
   PRODUCTIVIDAD — auditorías, hojas de cambio, % instructivo, jornada
   y discrepancias por mecánico. Solo lectura, agrega usuarios(rol=mecanico)
   + auditorias + auditorias_receta + cambios_neumaticos + cierre_dia +
   intervenciones + discrepancias_inventario del período elegido.
===================================================================== */
function prodStartOfWeek(d) {
  const dt = new Date(d);
  const day = dt.getDay();
  const diff = (day === 0 ? -6 : 1) - day;
  dt.setDate(dt.getDate() + diff);
  return dt;
}
function prodISODate(d) { return d.toISOString().slice(0, 10); }
function prodGetRango(tipo, personalizado) {
  const hoy = new Date();
  if (tipo === "semana") { const ini = prodStartOfWeek(hoy); return { desde: prodISODate(ini), hasta: prodISODate(hoy) }; }
  if (tipo === "mes") { const ini = new Date(hoy.getFullYear(), hoy.getMonth(), 1); return { desde: prodISODate(ini), hasta: prodISODate(hoy) }; }
  if (tipo === "trimestre") { const q = Math.floor(hoy.getMonth() / 3); const ini = new Date(hoy.getFullYear(), q * 3, 1); return { desde: prodISODate(ini), hasta: prodISODate(hoy) }; }
  return personalizado && personalizado.desde && personalizado.hasta ? personalizado : { desde: prodISODate(prodStartOfWeek(hoy)), hasta: prodISODate(hoy) };
}
/* hora_inicio/hora_cierre son TIME ("HH:MM:SS") en cierre_dia — no se
   puede restar como timestamp, se parsea a minutos desde medianoche. */
function prodHorasEntre(hIni, hFin) {
  if (!hIni || !hFin) return null;
  const [h1, m1] = hIni.split(":").map(Number);
  const [h2, m2] = hFin.split(":").map(Number);
  if (isNaN(h1) || isNaN(h2)) return null;
  let mins = (h2 * 60 + m2) - (h1 * 60 + m1);
  if (mins < 0) mins += 24 * 60; // cruza medianoche
  return mins / 60;
}
function prodMinutosDelDia(hora) {
  if (!hora) return null;
  const [h, m] = hora.split(":").map(Number);
  if (isNaN(h)) return null;
  return h * 60 + m;
}
function prodFormatHoraProm(mins) {
  if (mins == null) return "—";
  const h = Math.floor(mins / 60), m = Math.round(mins % 60);
  return `${String(h).padStart(2, "0")}:${String(m).padStart(2, "0")}`;
}

async function fetchProductividadData(filtro, desde, hasta) {
  let uq = sb.from("usuarios").select("id,cliente_id,nombre,apellido,rol,activo").eq("rol", "mecanico");
  if (filtro && filtro !== "todas") uq = uq.eq("cliente_id", filtro);
  const [{ data: mecanicos }, { data: clientes }] = await Promise.all([
    uq, sb.from("clientes").select("id_cliente,nombre")
  ]);
  const mecs = mecanicos || [];
  const clientesMap = {}; (clientes || []).forEach(c => clientesMap[c.id_cliente] = c.nombre);
  const mecIds = mecs.map(m => m.id);
  if (!mecIds.length) return { mecanicos: [], clientesMap, auditorias: [], cambios: [], cierres: [], cierresHoy: [], intervenciones: [], discrepancias: [], recetaPorAuditoria: {}, horasNormalPorCliente: {} };

  const hoy = todayISO();
  const [{ data: auditorias }, { data: cambios }, { data: cierres }, { data: cierresHoy }, { data: intervenciones }, { data: discrepancias }, { data: cfgRows }] = await Promise.all([
    sb.from("auditorias").select("id_auditoria,equipo_id,bultero_id,fecha,numero_auditoria").in("bultero_id", mecIds).gte("fecha", desde).lte("fecha", hasta),
    sb.from("cambios_neumaticos").select("id_cambio,equipo_id,bultero_id,fecha,numero_cambio").in("bultero_id", mecIds).gte("fecha", desde).lte("fecha", hasta),
    sb.from("cierre_dia").select("*").in("mecanico_id", mecIds).gte("fecha", desde).lte("fecha", hasta),
    sb.from("cierre_dia").select("*").in("mecanico_id", mecIds).eq("fecha", hoy),
    sb.from("intervenciones").select("id,mecanico_id,tipo,fecha,equipo_id").in("mecanico_id", mecIds).gte("fecha", desde).lte("fecha", hasta),
    sb.from("discrepancias_inventario").select("id,mecanico_id,fecha,origen,resuelta").in("mecanico_id", mecIds).gte("fecha", desde).lte("fecha", hasta),
    sb.from("config_cliente").select("cliente_id,valor").eq("clave", "horas_jornada_normal")
  ]);

  const auditoriaIds = (auditorias || []).map(a => a.id_auditoria);
  let recetas = [];
  if (auditoriaIds.length) {
    const { data } = await sb.from("auditorias_receta").select("auditoria_id,pct_receta_seguida,tareas_cumplidas,tareas_pendientes,total_tareas,estado").in("auditoria_id", auditoriaIds);
    recetas = data || [];
  }
  const recetaPorAuditoria = {};
  recetas.forEach(r => { recetaPorAuditoria[r.auditoria_id] = r; });
  const horasNormalPorCliente = {};
  (cfgRows || []).forEach(r => { horasNormalPorCliente[r.cliente_id] = parseFloat(r.valor) || 9; });

  return {
    mecanicos: mecs, clientesMap, auditorias: auditorias || [], cambios: cambios || [], cierres: cierres || [],
    cierresHoy: cierresHoy || [], intervenciones: intervenciones || [], discrepancias: discrepancias || [], recetaPorAuditoria, horasNormalPorCliente
  };
}
// MAX(hora_cierre, NOW()) - hora_inicio - horas_jornada_normal, sin negativos.
function prodHorasExtrasHoy(cierreHoy, horasNormal) {
  if (!cierreHoy || !cierreHoy.hora_inicio) return 0;
  const [h1, m1] = cierreHoy.hora_inicio.split(":").map(Number);
  const inicio = new Date(); inicio.setHours(h1, m1, 0, 0);
  let fin = new Date();
  if (cierreHoy.hora_cierre) {
    const [h2, m2] = cierreHoy.hora_cierre.split(":").map(Number);
    const finCierre = new Date(); finCierre.setHours(h2, m2, 0, 0);
    if (finCierre > fin) fin = finCierre; // MAX(hora_cierre, NOW())
  }
  let diffH = (fin - inicio) / 3600000;
  if (diffH < 0) diffH += 24;
  const extra = diffH - horasNormal;
  return extra > 0 ? extra : 0;
}

function computeMecanicoStats(mecId, data, clienteId) {
  const auds = data.auditorias.filter(a => a.bultero_id === mecId);
  const cambios = data.cambios.filter(c => c.bultero_id === mecId);
  const cierres = data.cierres.filter(c => c.mecanico_id === mecId);
  const intervs = data.intervenciones.filter(i => i.mecanico_id === mecId);
  const discs = data.discrepancias.filter(d => d.mecanico_id === mecId);
  const horasNormal = (data.horasNormalPorCliente && data.horasNormalPorCliente[clienteId]) || 9;
  const cierreHoy = (data.cierresHoy || []).find(c => c.mecanico_id === mecId) || null;
  const horasExtrasHoy = prodHorasExtrasHoy(cierreHoy, horasNormal);
  let diasConHorasExtras = 0, horasExtrasAcumuladas = 0;
  cierres.forEach(c => {
    const dur = prodHorasEntre(c.hora_inicio, c.hora_cierre);
    if (dur == null) return;
    const extra = dur - horasNormal;
    if (extra > 0) { diasConHorasExtras++; horasExtrasAcumuladas += extra; }
  });

  const recetasM = auds.map(a => data.recetaPorAuditoria[a.id_auditoria]).filter(Boolean);
  const pctProm = recetasM.length ? recetasM.reduce((s, r) => s + (r.pct_receta_seguida || 0), 0) / recetasM.length : null;

  const cierresOk = cierres.filter(c => c.cerrado).length;
  const cierresOlvidados = cierres.filter(c => !!c.motivo_sin_cierre).length;
  const duraciones = cierres.map(c => prodHorasEntre(c.hora_inicio, c.hora_cierre)).filter(h => h != null);
  const hsProm = duraciones.length ? duraciones.reduce((a, b) => a + b, 0) / duraciones.length : null;
  const iniciosMin = cierres.map(c => prodMinutosDelDia(c.hora_inicio)).filter(v => v != null);
  const cierresMin = cierres.map(c => prodMinutosDelDia(c.hora_cierre)).filter(v => v != null);
  const horaInicioProm = iniciosMin.length ? iniciosMin.reduce((a, b) => a + b, 0) / iniciosMin.length : null;
  const horaCierreProm = cierresMin.length ? cierresMin.reduce((a, b) => a + b, 0) / cierresMin.length : null;

  const regulaciones = intervs.filter(i => i.tipo === "regulacion_psi").length;
  const retorqueos = intervs.filter(i => i.tipo === "retorqueo").length;
  const reparaciones = intervs.filter(i => i.tipo === "reparacion").length;

  const completados = recetasM.filter(r => r.tareas_pendientes === 0).length;
  const parciales = recetasM.filter(r => (r.tareas_pendientes || 0) > 0 && (r.tareas_cumplidas || 0) > 0).length;
  const sinHoja = auds.length - recetasM.length;

  const discResueltas = discs.filter(d => d.resuelta).length;
  const discPendientes = discs.length - discResueltas;
  const discCheckDiario = discs.filter(d => d.origen === "check_diario").length;
  const discAuditoria = discs.filter(d => d.origen === "auditoria").length;

  return {
    auditorias: auds.length, cambios: cambios.length, pctProm, cierresOk, cierresOlvidados, hsProm,
    horaInicioProm, horaCierreProm, regulaciones, retorqueos, reparaciones,
    completados, parciales, sinHoja, discTotal: discs.length, discResueltas, discPendientes, discCheckDiario, discAuditoria,
    diasTrabajados: cierres.length, horasExtrasHoy, diasConHorasExtras, horasExtrasAcumuladas,
    auds, cambiosList: cambios, cierres, intervs, discs, recetasM
  };
}

function ProductividadView({ empresaCtl, esSuperAdmin }) {
  const { filtro, empresas } = empresaCtl;
  const mostrarEmpresa = filtro === "todas" && !!esSuperAdmin;
  const [periodoTipo, setPeriodoTipo] = useState("semana");
  const [personalizado, setPersonalizado] = useState({ desde: "", hasta: "" });
  const [loading, setLoading] = useState(true);
  const [data, setData] = useState(null);
  const [detalleMec, setDetalleMec] = useState(null);

  const { desde, hasta } = prodGetRango(periodoTipo, personalizado);

  useEffect(() => {
    if (periodoTipo === "personalizado" && (!personalizado.desde || !personalizado.hasta)) return;
    let cancel = false;
    setLoading(true);
    fetchProductividadData(filtro, desde, hasta).then(d => { if (!cancel) { setData(d); setLoading(false); } })
      .catch(e => { console.error("No se pudo cargar Productividad", e); if (!cancel) setLoading(false); });
    return () => { cancel = true; };
  }, [filtro, periodoTipo, personalizado.desde, personalizado.hasta]);

  const filas = React.useMemo(() => {
    if (!data) return [];
    return data.mecanicos.map(m => ({ mecanico: m, stats: computeMecanicoStats(m.id, data, m.cliente_id) }));
  }, [data]);

  const kpis = React.useMemo(() => {
    if (!data) return null;
    const totalAud = filas.reduce((s, f) => s + f.stats.auditorias, 0);
    const totalCambios = filas.reduce((s, f) => s + f.stats.cambios, 0);
    const pctVals = filas.flatMap(f => f.stats.recetasM.map(r => r.pct_receta_seguida || 0));
    const pctProm = pctVals.length ? pctVals.reduce((a, b) => a + b, 0) / pctVals.length : null;
    const cierresOk = filas.reduce((s, f) => s + f.stats.cierresOk, 0);
    const cierresOlvidados = filas.reduce((s, f) => s + f.stats.cierresOlvidados, 0);
    const duraciones = filas.flatMap(f => f.stats.hsProm != null ? [f.stats.hsProm] : []);
    const hsProm = duraciones.length ? duraciones.reduce((a, b) => a + b, 0) / duraciones.length : null;
    return { totalAud, totalCambios, pctProm, cierresOk, cierresOlvidados, hsProm };
  }, [filas]);

  const semanas = React.useMemo(() => {
    if (!data) return [];
    const out = [];
    let cur = prodStartOfWeek(new Date(desde + "T00:00:00"));
    const fin = new Date(hasta + "T00:00:00");
    let n = 1;
    while (cur <= fin) {
      const iniISO = prodISODate(cur);
      const finDt = new Date(cur); finDt.setDate(finDt.getDate() + 6);
      const finISO = prodISODate(finDt < fin ? finDt : fin);
      const audsSemana = data.auditorias.filter(a => a.fecha >= iniISO && a.fecha <= finISO);
      const pctVals = audsSemana.map(a => data.recetaPorAuditoria[a.id_auditoria]).filter(Boolean).map(r => r.pct_receta_seguida || 0);
      out.push({ label: `Sem ${n}`, pct: pctVals.length ? Math.round(pctVals.reduce((a, b) => a + b, 0) / pctVals.length) : 0, auditorias: audsSemana.length });
      cur.setDate(cur.getDate() + 7);
      n++;
    }
    return out;
  }, [data, desde, hasta]);

  function badgePct(pct) {
    if (pct == null) return <Badge color="gray">Sin datos</Badge>;
    const r = Math.round(pct);
    if (r >= 80) return <Badge color="green">{r}%</Badge>;
    if (r >= 50) return <Badge color="amber">{r}%</Badge>;
    return <Badge color="red">{r}%</Badge>;
  }
  function badgeOlvidados(n) {
    if (n === 0) return <Badge color="green">{n}</Badge>;
    if (n > 2) return <Badge color="red">{n}</Badge>;
    return <Badge color="amber">{n}</Badge>;
  }
  // 0 horas extras -> gris; 1-2hs en el dia -> amarillo; mas de 2hs -> rojo.
  function badgeHorasExtras(hs) {
    if (!hs || hs <= 0) return <Badge color="gray">0</Badge>;
    if (hs <= 2) return <Badge color="amber">{hs.toFixed(1)}</Badge>;
    return <Badge color="red">{hs.toFixed(1)}</Badge>;
  }

  function exportarTabla() {
    const filasExport = filas.map(f => {
      const base = {
        Mecánico: `${f.mecanico.nombre} ${f.mecanico.apellido || ""}`.trim(),

        Auditorías: f.stats.auditorias,
        "Hojas cambio": f.stats.cambios,
        "% Instructivo": f.stats.pctProm != null ? Math.round(f.stats.pctProm) : "",
        "Cierres ok": f.stats.cierresOk,
        Olvidados: f.stats.cierresOlvidados,
        "Hs jornada prom.": f.stats.hsProm != null ? Number(f.stats.hsProm.toFixed(1)) : "",
        "Hs extras hoy": Number(f.stats.horasExtrasHoy.toFixed(1)),
        "Días con hs extras": f.stats.diasConHorasExtras,
        "Hs extras acum.": Number(f.stats.horasExtrasAcumuladas.toFixed(1)),
        Regulaciones: f.stats.regulaciones,
        Retorqueos: f.stats.retorqueos,
        Reparaciones: f.stats.reparaciones
      };
      return base;
    });
    const ws = XLSX.utils.json_to_sheet(filasExport);
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, "Productividad");
    XLSX.writeFile(wb, `productividad_${desde}_${hasta}.xlsx`);
  }

  const ranking = React.useMemo(() => {
    return [...filas].filter(f => f.stats.pctProm != null).sort((a, b) => b.stats.pctProm - a.stats.pctProm).slice(0, 3);
  }, [filas]);
  const medallas = ["🥇", "🥈", "🥉"];

  return (
    <div>
      <h1 className="text-[26px] font-extrabold mb-5">📈 Productividad</h1>

      <div className="flex flex-wrap items-center gap-2 mb-5">
        {PRODUCTIVIDAD_PERIODOS.map(p => (

            className={cx("px-4 py-2 rounded-full text-[13px] font-bold whitespace-nowrap", periodoTipo === p.id ? "bg-ink text-white" : "bg-[#F3F4F6] text-[#374151]")}>{p.label}</button>
        ))}
        {periodoTipo === "personalizado" && (
          <div className="flex items-center gap-2">
            <TextInput type="date" value={personalizado.desde} onChange={e => setPersonalizado(p => ({ ...p, desde: e.target.value }))} className="h-10 w-auto" />
            <span className="text-muted text-[12px]">a</span>
            <TextInput type="date" value={personalizado.hasta} onChange={e => setPersonalizado(p => ({ ...p, hasta: e.target.value }))} className="h-10 w-auto" />
          </div>
        )}
      </div>

      {loading || !data ? <div className="flex justify-center py-16"><span className="spinner" /></div> : (
        <>
          <div className="grid grid-cols-2 md:grid-cols-6 gap-3 mb-6">
            <KpiCard label="Auditorías realizadas" value={kpis.totalAud} />
            <KpiCard label="Hojas de cambio" value={kpis.totalCambios} />
            <KpiCard label="% instructivo prom." value={kpis.pctProm != null ? Math.round(kpis.pctProm) + "%" : "—"} />
            <KpiCard label="Cierres correctos" value={kpis.cierresOk} />
            <KpiCard label="Cierres sin cerrar" value={kpis.cierresOlvidados} />
            <KpiCard label="Jornada prom." value={kpis.hsProm != null ? `${kpis.hsProm.toFixed(1)} hs` : "—"} />
          </div>

          {ranking.length > 0 && (
            <>
              <p className="font-bold text-[16px] mb-3">Ranking top 3 — % instructivo</p>
              <div className="grid sm:grid-cols-3 gap-3 mb-8">
                {ranking.map((f, i) => (
                  <Card key={f.mecanico.id}>
                    <p className="text-[24px] mb-1">{medallas[i]}</p>

                  </Card>
                ))}

            </>
          )}

          <div className="flex items-center justify-between gap-3 mb-3 flex-wrap">
            <p className="font-bold text-[16px]">Productividad por mecánico</p>
            <Button variant="subtle" className="h-10 px-4 text-[13px]" onClick={exportarTabla}>Exportar tabla completa</Button>

          <div className="bg-white rounded-2xl border border-bd shadow-card overflow-x-auto mb-8">

              </thead>
              <tbody>
                {filas.map((f, i) => (
                  <tr key={f.mecanico.id} className={cx(i > 0 && "border-t border-bd", "cursor-pointer hover:bg-[#F9FAFB]")} onClick={() => setDetalleMec(f)}>

  { id: "todas", label: "Todas", tipos: null },

  { id: "herramientas", label: "Herramientas", tipos: ["herramienta_nueva"] }
];
const SEVERIDAD_RANK = { rojo: 0, amarillo: 1, info: 2 };
function ordenarAlertas(lista) {
  // Las criticas (rojo) siempre primero; cierre_dia/instructivo (severidad
  // info) van al fondo, sin importar el filtro de fecha.
  return [...lista].sort((a, b) => {
    const ra = SEVERIDAD_RANK[a.severidad] != null ? SEVERIDAD_RANK[a.severidad] : 1;
    const rb = SEVERIDAD_RANK[b.severidad] != null ? SEVERIDAD_RANK[b.severidad] : 1;
    if (ra !== rb) return ra - rb;
    return (b.creado_en || "").localeCompare(a.creado_en || "");
  });
}
function timeAgoCorto(iso) {
  if (!iso) return "";
  const diffMs = Date.now() - new Date(iso).getTime();
  const mins = Math.floor(diffMs / 60000);
  if (mins < 1) return "ahora";
  if (mins < 60) return `hace ${mins}m`;
  const hrs = Math.floor(mins / 60);
  if (hrs < 24) return `hace ${hrs}h`;
  const dias = Math.floor(hrs / 24);
  if (dias < 7) return `hace ${dias}d`;
  return formatFecha(iso);
}
async function fetchAlertasCompletas(clienteId) {
  let q = sb.from("alertas").select("*").order("creado_en", { ascending: false }).limit(300);
  q = filtroCliente(q, clienteId);
  const { data, error } = await q;
  if (error) throw error;
  const eqIds = [...new Set((data || []).map(a => a.equipo_id))].filter(Boolean);
  const mecIds = [...new Set((data || []).map(a => a.mecanico_id))].filter(Boolean);
  const adminIds = [...new Set((data || []).map(a => a.en_proceso_por))].filter(Boolean);
  const [{ data: eqs }, { data: mecs }, { data: admins }] = await Promise.all([
    eqIds.length ? sb.from("equipos").select("id_equipo,patente,numero_interno").in("id_equipo", eqIds) : Promise.resolve({ data: [] }),
    mecIds.length ? sb.from("usuarios").select("id,nombre,apellido,cliente_id").in("id", mecIds) : Promise.resolve({ data: [] }),
    adminIds.length ? sb.from("usuarios").select("id,nombre,apellido").in("id", adminIds) : Promise.resolve({ data: [] })
  ]);
  const eqMap = {}; (eqs || []).forEach(e => { eqMap[e.id_equipo] = e; });
  const mecMap = {}; (mecs || []).forEach(m => { mecMap[m.id] = m; });
  const adminMap = {}; (admins || []).forEach(u => { adminMap[u.id] = u; });
  return (data || []).map(a => ({ ...a, equipo: eqMap[a.equipo_id] || null, mecanico: mecMap[a.mecanico_id] || null, en_proceso_admin: adminMap[a.en_proceso_por] || null }));
}
async function fetchStatsAlertas(clienteId) {
  const hoy = todayISO();
  let qa = sb.from("alertas").select("creado_en,severidad,leida_admin"); qa = filtroCliente(qa, clienteId);
  let qd = sb.from("discrepancias_inventario").select("creado_en,resuelto_en,resuelta,fecha"); qd = filtroCliente(qd, clienteId);
  const [{ data: als }, { data: discs }] = await Promise.all([qa, qd]);
  const totalHoy = (als || []).filter(a => (a.creado_en || "").slice(0, 10) === hoy).length;
  const criticasSinResolver = (als || []).filter(a => a.severidad === "rojo" && !a.leida_admin).length;
  const resueltasHoy = (discs || []).filter(d => d.fecha === hoy && d.resuelta && d.resuelto_en);
  let tiempoProm = null;
  if (resueltasHoy.length) {
    const totalHoras = resueltasHoy.reduce((sum, d) => sum + (new Date(d.resuelto_en) - new Date(d.creado_en)) / 3600000, 0);
    tiempoProm = totalHoras / resueltasHoy.length;
  }
  return { totalHoy, criticasSinResolver, tiempoProm };
}

function DiscrepanciaNeumaticoDetalleModal({ alerta, adminUser, onClose, onResuelto, pushToast }) {
  const [disc, setDisc] = useState(undefined); // undefined=cargando, null=no encontrada
  useEffect(() => {
    let cancel = false;
    // Sin filtro de fecha exacta (misma razon que en DiscrepanciaInventarioDetalleModal):
    // equipo+posicion+mecanico+sin resolver ya identifica la discrepancia sin ambiguedad.
    let q = sb.from("discrepancias_inventario").select("*").eq("origen", "auditoria").eq("resuelta", false).order("creado_en", { ascending: false });
    if (alerta.equipo_id) q = q.eq("equipo_id", alerta.equipo_id);
    if (alerta.posicion != null) q = q.eq("posicion", alerta.posicion);
    if (alerta.mecanico_id) q = q.eq("mecanico_id", alerta.mecanico_id);
    q.then(({ data }) => { if (!cancel) setDisc((data && data[0]) || null); });
    return () => { cancel = true; };
  }, [alerta.id]);

  async function resolver(d, aprobar, justificacion) {
    await resolverDiscrepanciaAuditoria(d, aprobar, justificacion, adminUser);
    await marcarAlertaResuelta(alerta.id, adminUser.id, justificacion);
    pushToast(aprobar ? "✓ Discrepancia aprobada — neumaticos actualizado" : "✓ Discrepancia rechazada");
    onResuelto();
  }

  return (
    <Modal title="Discrepancia de neumático" onClose={onClose}>
      {disc === undefined ? <div className="flex justify-center py-8"><span className="spinner" /></div> : disc ? (
        <DiscrepanciaAuditoriaCard d={{ ...disc, equipo: alerta.equipo, mecanico: alerta.mecanico }} onResolver={resolver} />
      ) : <p className="text-[13.5px] text-muted">Esta discrepancia ya fue resuelta.</p>}
    </Modal>
  );
}
function DiscrepanciaInventarioDetalleModal({ alerta, adminUser, onClose, onResuelto, pushToast }) {
  const [lista, setLista] = useState(null);
  function cargar() {
    // No se filtra por fecha exacta: la fecha guardada en discrepancias_inventario
    // puede diferir en 1 dia de alerta.creado_en por el huso horario (el check
    // diario corre cerca de medianoche UTC).
    sb.from("discrepancias_inventario").select("*").eq("mecanico_id", alerta.mecanico_id).eq("origen", "check_diario").eq("resuelta", false)
      .order("creado_en", { ascending: true })
      .then(({ data, error }) => { if (error) { console.error(error); setLista([]); } else setLista(data || []); });
  }
  useEffect(() => { cargar(); }, [alerta.id]);

  async function resolver(d, aprobar, justificacion) {
    await resolverDiscrepancia(d, aprobar, justificacion, adminUser.id);
    pushToast(aprobar ? "✓ Ajuste aprobado" : "✓ Discrepancia rechazada");
    const restantes = lista.filter(x => x.id !== d.id);
    setLista(restantes);
    if (!restantes.length) await marcarAlertaResuelta(alerta.id, adminUser.id, justificacion);
    onResuelto();
  }

  return (
    <Modal title="Discrepancias del check diario" onClose={onClose} wide>
      {lista === null ? <div className="flex justify-center py-8"><span className="spinner" /></div> : (
        <div className="space-y-3">
          {lista.map(d => <DiscrepanciaCard key={d.id} d={d} onResolver={resolver} />)}
          {!lista.length && <p className="text-[13.5px] text-muted">Sin discrepancias pendientes para este mecánico.</p>}
        </div>
      )}
    </Modal>
  );
}
function ReporteCierreDetalleModal({ alerta, empresas, onClose }) {

function BannerVolverAlertas({ setView }) {
  // Sin estado local: sessionStorage se lee de nuevo en cada render (el
  // componente no desmonta al navegar entre vistas, asi que un useState con
  // inicializador perezoso quedaria pegado al valor del primer mount).
  let origen = null;
  try { origen = JSON.parse(sessionStorage.getItem("alerta_origen") || "null"); } catch (e) {}
  if (!origen) return null;
  return (
    <button onClick={() => { sessionStorage.removeItem("alerta_origen"); setView("alertas"); }}
      className="w-full text-left bg-[#111] text-white rounded-2xl px-4 py-3 mb-4 text-[13px] font-bold flex items-center gap-2">
      <Icon.back width="15" height="15" /> Volvé a Alertas para seguir resolviendo
      {(origen.equipoPatente || origen.mecanicoNombre) && <span className="font-normal opacity-70">· Buscá: {origen.equipoPatente || origen.mecanicoNombre}</span>}
    </button>
  );
}

const ALERTA_ICONO = { rojo: "🔴", amarillo: "🟡", info: "ℹ️" };
function AlertaCard({ a, empresaLabel, onVer, onMarcarLeida, onMarcarEnProceso, onMarcarResuelta, onIgnorar, onAbrirMecanico, onNavegar, onAprobarHerramienta }) {
  const equipoLabel = a.equipo ? `${a.equipo.patente}${a.equipo.numero_interno ? ` (${a.equipo.numero_interno})` : ""}` : null;
  const mecanicoLabel = a.mecanico ? `${a.mecanico.nombre} ${a.mecanico.apellido || ""}`.trim() : null;
  const esDesbloqueo = a.tipo === "solicitud_desbloqueo";
  const esDiscNeu = a.tipo === "neumatico_no_registrado";
  const esDiscInv = a.tipo === "discrepancia_inventario";
  const esCierre = a.tipo === "cierre_dia";
  const esHerramientaNueva = a.tipo === "herramienta_nueva";
  const nivel = nivelDeAlerta(a.tipo) || (a.severidad === "rojo" ? "rojo" : a.severidad === "amarillo" ? "amarillo" : "info");
  const esInfo = nivel === "info";
  const tieneResolucionDedicada = esDesbloqueo || esDiscNeu || esDiscInv;
  const icono = esDesbloqueo ? "🔒" : (ALERTA_ICONO[a.severidad] || "ℹ️");
  const estado = a.estado || "nueva";

  function resolverClick() {
    if (tieneResolucionDedicada) onVer(a);
    else onMarcarResuelta(a);
  }

  return (
    <div className={cx("bg-white rounded-2xl border border-bd shadow-card p-4", estado === "resuelta" && "opacity-60")}>
      <div className="flex items-start justify-between gap-2 cursor-pointer" onClick={() => onNavegar && onNavegar(a)}>
        <div className="flex-1 min-w-0">
          <p className="font-bold text-[14px]">{icono} {a.titulo}{equipoLabel && !(a.titulo || "").includes(equipoLabel) ? ` — ${equipoLabel}` : ""}</p>
          {(mecanicoLabel || a.posicion != null) && (
            <p className="text-[12.5px] text-sub mt-0.5">{mecanicoLabel}{a.posicion != null ? `${mecanicoLabel ? " — " : ""}Posición ${a.posicion}` : ""}</p>
          )}
          {!esCierre && a.descripcion && <p className="text-[12.5px] text-muted mt-0.5 line-clamp-2">{a.descripcion}</p>}
          {empresaLabel && <p className="text-[11px] text-muted mt-1">{empresaLabel}</p>}
        </div>
        <span className="text-[11px] text-muted shrink-0 whitespace-nowrap">{timeAgoCorto(a.creado_en)}</span>
      </div>
      <div className="flex items-center justify-between gap-2 mt-2.5">
        <div>
          {estado === "en_proceso" && <Badge color="amber">En proceso{a.en_proceso_admin ? ` por ${a.en_proceso_admin.nombre}` : ""}</Badge>}
          {estado === "resuelta" && <Badge color="green">Resuelta</Badge>}
          {estado === "nueva" && <span className="text-[11px] font-bold text-ink">● Nueva</span>}
          {estado === "vista" && <span className="text-[11px] font-bold text-muted">Vista</span>}
        </div>
        <div className="flex gap-2 flex-wrap justify-end">
          {esDesbloqueo && estado !== "resuelta" && (
            <>
              <button onClick={() => onAbrirMecanico(a, "turno")} className="text-[12px] font-bold text-white px-3 py-1.5 rounded-full bg-ink">Nuevo turno</button>
              <button onClick={() => onAbrirMecanico(a, "empresa")} className="text-[12px] font-bold text-ink px-3 py-1.5 rounded-full bg-[#F3F4F6]">Cambiar empresa</button>
              <button onClick={() => onIgnorar(a)} className="text-[12px] font-bold text-ink px-3 py-1.5 rounded-full bg-[#F3F4F6]">Ignorar</button>
            </>
          )}
          {(esDiscNeu || esDiscInv || esCierre) && (
            <button onClick={() => onVer(a)} className="text-[12px] font-bold text-ink px-3 py-1.5 rounded-full bg-[#F3F4F6]">{esCierre ? "Ver reporte" : "Ver detalle"}</button>
          )}
          {esHerramientaNueva && estado !== "resuelta" && (
            <button onClick={() => onAprobarHerramienta(a)} className="text-[12px] font-bold text-white px-3 py-1.5 rounded-full bg-ink">➕ Sumar a Bodega / Catálogo</button>
          )}
          {!esInfo && !esDesbloqueo && estado === "nueva" && <button onClick={() => onMarcarLeida(a)} className="text-[12px] font-bold text-ink px-3 py-1.5 rounded-full bg-[#F3F4F6]">👁 Marcar vista</button>}
          {!esInfo && !esDesbloqueo && (estado === "nueva" || estado === "vista") && <button onClick={() => onMarcarEnProceso(a)} className="text-[12px] font-bold text-ink px-3 py-1.5 rounded-full bg-[#F3F4F6]">⚙ En proceso</button>}
          {!esInfo && !esDesbloqueo && estado !== "resuelta" && <button onClick={resolverClick} className="text-[12px] font-bold text-white px-3 py-1.5 rounded-full bg-ink">✅ Resolver</button>}
          {esInfo && !a.leida_admin && <button onClick={() => onMarcarLeida(a)} className="text-[12px] font-bold text-ink px-3 py-1.5 rounded-full bg-[#F3F4F6]">Marcar leída</button>}
        </div>
      </div>
    </div>
  );
}

function AlertasAdminView({ empresaCtl, adminUser, setView }) {
  const { filtro, empresas } = empresaCtl;
  const [alertas, setAlertas] = useState([]);
  const [stats, setStats] = useState(null);
  const [loading, setLoading] = useState(true);
  const [filtroEstado, setFiltroEstado] = useState("noleidas");
  const [filtroSeveridad, setFiltroSeveridad] = useState("todas");
  const [filtroTipo, setFiltroTipo] = useState("todas");
  const [search, setSearch] = useState("");
  const [verDetalle, setVerDetalle] = useState(null); // { alerta, tipo: 'discNeu'|'discInv'|'cierre' }
  const [mecanicoAccion, setMecanicoAccion] = useState(null); // { mecanico, initialModo }
  const [pushToast, toastNode] = useToasts();

  function cargar() {
    setLoading(true);
    Promise.all([fetchAlertasCompletas(filtro), fetchStatsAlertas(filtro)])
      .then(([al, st]) => { setAlertas(al); setStats(st); })
      .catch(e => console.error("No se pudieron cargar las alertas", e))
      .finally(() => setLoading(false));
  }
  useEffect(() => { cargar(); }, [filtro]);

  const filtradas = ordenarAlertas(alertas.filter(a => {
    if (filtroEstado === "noleidas" && a.leida_admin) return false;
    if (filtroEstado === "leidas" && !a.leida_admin) return false;
    if (filtroSeveridad !== "todas" && a.severidad !== filtroSeveridad) return false;
    if (filtroTipo !== "todas") {
      const grupo = ALERTA_TIPO_GRUPOS.find(g => g.id === filtroTipo);
      if (grupo && grupo.tipos && !grupo.tipos.includes(a.tipo)) return false;
    }
    if (search.trim()) {
      const s = search.trim().toLowerCase();
      const eqTxt = a.equipo ? `${a.equipo.patente} ${a.equipo.numero_interno || ""}`.toLowerCase() : "";
      const mecTxt = a.mecanico ? `${a.mecanico.nombre} ${a.mecanico.apellido || ""}`.toLowerCase() : "";
      if (!eqTxt.includes(s) && !mecTxt.includes(s)) return false;
    }
    return true;
  }));

  async function marcarLeida(a) {
    await adminDb.marcarAlertaLeida(a.id);
    setAlertas(as => as.map(x => x.id === a.id ? { ...x, leida_admin: true, estado: x.estado === "nueva" ? "vista" : x.estado } : x));
    pushToast("✓ Alerta marcada como vista");
  }
  async function marcarEnProceso(a) {
    await marcarAlertaEnProceso(a.id, adminUser.id);
    setAlertas(as => as.map(x => x.id === a.id ? { ...x, leida_admin: true, estado: "en_proceso", en_proceso_admin: { nombre: adminUser.nombre, apellido: adminUser.apellido } } : x));
    pushToast("✓ Alerta en proceso");
  }
  async function marcarTodasLeidas() {
    let q = sb.from("alertas").update({ leida_admin: true }).eq("leida_admin", false);
    q = filtroCliente(q, filtro);
    await q;
    let q2 = sb.from("alertas").update({ visto_en: new Date().toISOString(), estado: "vista" }).eq("estado", "nueva");
    q2 = filtroCliente(q2, filtro);
    await q2;
    pushToast("✓ Todas las alertas marcadas como leídas");
    cargar();
  }
  function empresaLabel(a) {
    if (filtro !== "todas") return null;
    return (empresas.find(e => e.id_cliente === a.cliente_id) || {}).nombre || a.cliente_id;
  }
  function verDetalleAlerta(a) {
    if (a.tipo === "neumatico_no_registrado") setVerDetalle({ alerta: a, tipo: "discNeu" });
    else if (a.tipo === "discrepancia_inventario") setVerDetalle({ alerta: a, tipo: "discInv" });
    else if (a.tipo === "cierre_dia") setVerDetalle({ alerta: a, tipo: "cierre" });
  }
  function abrirMecanico(a, modo) {
    if (!a.mecanico) return;
    setMecanicoAccion({ mecanico: a.mecanico, initialModo: modo === "empresa" ? "empresa" : null });
  }
  async function ignorarDesbloqueo(a) {
    await adminDb.marcarAlertaLeida(a.id);
    await marcarAlertaResuelta(a.id, adminUser.id, null);
    setAlertas(as => as.map(x => x.id === a.id ? { ...x, leida_admin: true } : x));
    pushToast("✓ Solicitud ignorada — el mecánico sigue bloqueado");
  }
  async function marcarResueltaManual(a) {
    await marcarAlertaResuelta(a.id, adminUser.id, null);
    if (!a.leida_admin) await adminDb.marcarAlertaLeida(a.id);
    setAlertas(as => as.map(x => x.id === a.id ? { ...x, leida_admin: true, estado: "resuelta" } : x));
    pushToast("✓ Alerta marcada como resuelta");
  }
  function handleMecanicoDone() {
    setMecanicoAccion(null);
    cargar();
  }
  // Requerimiento 3: aprobar una herramienta declarada en terreno -- la suma
  // al catalogo de la empresa (herramientas_inventario) y resuelve la alerta.
  async function aprobarHerramienta(a) {
    try {
      await aprobarHerramientaNueva(a, adminUser.id);
      setAlertas(as => as.map(x => x.id === a.id ? { ...x, leida_admin: true, estado: "resuelta" } : x));
      const nombre = (a.datos_extra && a.datos_extra.nombre_herramienta) || a.titulo;
      pushToast(`✓ Herramienta "${nombre}" agregada al catálogo oficial. Aparecerá en los próximos Check Diarios.`);
    } catch (e) { console.error("No se pudo sumar la herramienta al catálogo", e); pushToast("✕ No se pudo sumar la herramienta", "red"); }
  }

  return (
    <div>
      {toastNode}
      <div className="flex items-center justify-between gap-3 mb-5 flex-wrap">
        <h1 className="text-[26px] font-extrabold">🔔 Alertas</h1>
        <Button variant="subtle" className="h-10 px-4 text-[13px]" onClick={marcarTodasLeidas}>Marcar todas como leídas</Button>
      </div>

      <TextInput placeholder="Buscar por equipo o mecánico" value={search} onChange={e => setSearch(e.target.value)} className="mb-4 max-w-md" />

      <div className="flex gap-2 mb-3 overflow-x-auto">
        {[["todas", "Todas"], ["noleidas", "No leídas"], ["leidas", "Leídas"]].map(([k, l]) => (
          <button key={k} onClick={() => setFiltroEstado(k)} className={cx("px-4 py-2 rounded-full text-[13px] font-bold whitespace-nowrap", filtroEstado === k ? "bg-ink text-white" : "bg-[#F3F4F6] text-[#374151]")}>{l}</button>
        ))}
      </div>
      <div className="flex gap-2 mb-3 overflow-x-auto">
        {[["todas", "Todas"], ["rojo", "🔴 Críticas"], ["amarillo", "🟡 Atención"], ["info", "ℹ️ Informativas"]].map(([k, l]) => (
          <button key={k} onClick={() => setFiltroSeveridad(k)} className={cx("px-4 py-2 rounded-full text-[13px] font-bold whitespace-nowrap", filtroSeveridad === k ? "bg-ink text-white" : "bg-[#F3F4F6] text-[#374151]")}>{l}</button>
        ))}
      </div>
      <div className="flex gap-2 mb-5 overflow-x-auto">
        {ALERTA_TIPO_GRUPOS.map(g => (
          <button key={g.id} onClick={() => setFiltroTipo(g.id)} className={cx("px-4 py-2 rounded-full text-[13px] font-bold whitespace-nowrap", filtroTipo === g.id ? "bg-ink text-white" : "bg-[#F3F4F6] text-[#374151]")}>{g.label}</button>
        ))}
      </div>

      {loading ? <div className="flex justify-center py-10"><span className="spinner" /></div> : (
        <div className="space-y-2 mb-6">
          {filtradas.map(a => (
            <AlertaCard key={a.id} a={a} empresaLabel={empresaLabel(a)} onVer={verDetalleAlerta}
              onMarcarLeida={marcarLeida} onMarcarEnProceso={marcarEnProceso} onIgnorar={ignorarDesbloqueo} onAbrirMecanico={abrirMecanico}
              onMarcarResuelta={marcarResueltaManual} onNavegar={(al) => irAResolucion(al, setView)} onAprobarHerramienta={aprobarHerramienta} />
          ))}
          {!filtradas.length && <p className="text-center text-muted py-10 text-sm">Sin alertas que coincidan.</p>}
        </div>
      )}

      {stats && (
        <div className="grid grid-cols-3 gap-3">
          <KpiCard label="Total alertas hoy" value={stats.totalHoy} />
          <KpiCard label="Críticas sin resolver" value={stats.criticasSinResolver} />
          <KpiCard label="Tiempo prom. resolución" value={stats.tiempoProm != null ? `${stats.tiempoProm.toFixed(1)}h` : "—"} />
        </div>
      )}

      {verDetalle && verDetalle.tipo === "discNeu" && (
        <DiscrepanciaNeumaticoDetalleModal alerta={verDetalle.alerta} adminUser={adminUser} pushToast={pushToast}
          onClose={() => setVerDetalle(null)} onResuelto={() => { setVerDetalle(null); cargar(); }} />
      )}
      {verDetalle && verDetalle.tipo === "discInv" && (
        <DiscrepanciaInventarioDetalleModal alerta={verDetalle.alerta} adminUser={adminUser} pushToast={pushToast}
          onClose={() => setVerDetalle(null)} onResuelto={() => cargar()} />
      )}
      {verDetalle && verDetalle.tipo === "cierre" && (
        <ReporteCierreDetalleModal alerta={verDetalle.alerta} empresas={empresas} onClose={() => setVerDetalle(null)} />
      )}
      {mecanicoAccion && (
        <MecanicoBloqueadoModal mecanico={mecanicoAccion.mecanico} empresas={empresas} initialModo={mecanicoAccion.initialModo}
          onClose={() => setMecanicoAccion(null)} onDone={handleMecanicoDone} />
      )}
    </div>
  );
}

function CambiarPasswordModal({ user, onClose, pushToast }) {
  const [actual, setActual] = useState("");
  const [nueva, setNueva] = useState("");
  const [confirmar, setConfirmar] = useState("");
  const [saving, setSaving] = useState(false);
  const [error, setError] = useState("");

  async function guardar() {
    setError("");
    if (!actual || !nueva || !confirmar) { setError("Completá los 3 campos."); return; }
    if (nueva.length < 4) { setError("La nueva contraseña debe tener al menos 4 caracteres."); return; }
    if (nueva !== confirmar) { setError("La confirmación no coincide con la nueva contraseña."); return; }
    setSaving(true);
    try {
      const hashActual = await sha256Hex(actual);
      if (hashActual !== user.password_hash) { setError("La contraseña actual es incorrecta."); setSaving(false); return; }
      const hashNueva = await sha256Hex(nueva);
      const { error: e } = await sb.from("usuarios").update({ password_hash: hashNueva }).eq("id", user.id);
      if (e) throw e;
      pushToast("✓ Contraseña actualizada");
      onClose();
    } catch (e) { console.error("No se pudo cambiar la contraseña", e); setError("No se pudo guardar. Intentá de nuevo."); }
    setSaving(false);
  }

  return (
    <Modal title="Cambiar contraseña" onClose={onClose}>
      <div className="space-y-4">
        <Field label="Contraseña actual" required><TextInput type="password" value={actual} onChange={e => setActual(e.target.value)} /></Field>
        <Field label="Nueva contraseña" required><TextInput type="password" value={nueva} onChange={e => setNueva(e.target.value)} /></Field>
        <Field label="Confirmar nueva contraseña" required><TextInput type="password" value={confirmar} onChange={e => setConfirmar(e.target.value)} /></Field>
        {error && <p className="text-[12.5px] font-bold text-[#B91C1C]">{error}</p>}
        <Button className="w-full" disabled={saving} onClick={guardar}>{saving ? <span className="spinner" /> : "Cambiar contraseña"}</Button>
      </div>
    </Modal>
  );
}

===================================================================== */
const TIPO_NEUMATICO_OPCIONES = [
  { id: "direccional", label: "Direccional" }, { id: "traccional", label: "Traccional" },
  { id: "eje_libre", label: "Eje libre" }, { id: "auxilio", label: "Auxilio" }
];
const TIPO_NEUMATICO_LABELS = Object.fromEntries(TIPO_NEUMATICO_OPCIONES.map(t => [t.id, t.label]));

// Requerimiento: Configuraciones de Flota -- esquemas de ejes/neumaticos
// dinamicos por cliente (tabla configuraciones_equipos), en vez de la lista
// fija hardcodeada. slug = mismo valor que se guarda en
// equipos.configuracion_ejes (ver construirAxleConfigDesdeDB/axleConfigFor
// en js/supabase.js).
const CATEGORIA_LABELS = { tractor: "Tractor", trailer: "Trailer", chasis: "Chasis" };
function slugify(nombre) {
  return nombre.trim().toLowerCase()
    .normalize("NFD").replace(/[̀-ͯ]/g, "")
    .replace(/[^a-z0-9]+/g, "-").replace(/(^-|-$)/g, "") || uuid().slice(0, 8);
}
function ConfiguracionEquipoModal({ filtro, onClose, onSaved, pushToast }) {
  const [nombre, setNombre] = useState("");
  const [categoria, setCategoria] = useState("tractor");
  const [numeroEjes, setNumeroEjes] = useState(2);
  const [tiposPorEje, setTiposPorEje] = useState({ 1: "direccional", 2: "traccion" });
  const [auxiliares, setAuxiliares] = useState(0);
  const [saving, setSaving] = useState(false);
  const [error, setError] = useState("");

  function setNumEjes(n) {
    setNumeroEjes(n);
    setTiposPorEje(prev => {
      const next = {};
      for (let i = 1; i <= n; i++) next[i] = prev[i] || (i === 1 ? "direccional" : "traccion");
      return next;
    });
  }

  // Vista previa en vivo del total de posiciones -- mismo calculo que
  // construirAxleConfigDesdeDB (2 ruedas direccional, 4 traccion, +1 por auxiliar).
  const totalPreview = Array.from({ length: numeroEjes }, (_, i) => tiposPorEje[i + 1])
    .reduce((n, t) => n + (t === "direccional" ? 2 : 4), 0) + auxiliares;

  async function guardar() {
    setError("");
    if (!nombre.trim()) { setError("El nombre es obligatorio."); return; }
    setSaving(true);
    try {
      const ejes = Array.from({ length: numeroEjes }, (_, i) => ({ eje: i + 1, tipo: tiposPorEje[i + 1] }));
      await db.guardarConfiguracionEquipo({
        cliente_id: filtro, nombre: nombre.trim(), categoria, slug: slugify(nombre),
        numero_ejes: numeroEjes, ejes, auxiliares
      });
      pushToast("✓ Configuración creada");
      onSaved();
    } catch (e) {
      console.error("No se pudo guardar la configuración de flota", e);
      setError(e.message && e.message.includes("duplicate") ? "Ya existe una configuración con ese nombre para esta empresa." : "No se pudo guardar. Intentá de nuevo.");
    }
    setSaving(false);
  }

  return (
    <Modal title="Nueva configuración de flota" onClose={onClose}>
      <div className="space-y-4">
        <Field label="Nombre de la configuración" required>
          <TextInput value={nombre} onChange={e => setNombre(e.target.value)} placeholder='Ej: "Chasis 8x4 ELB"' />
        </Field>
        <Field label="Categoría" required>
          <div className="flex gap-2">
            {["tractor", "trailer", "chasis"].map(c => (
              <button key={c} type="button" onClick={() => setCategoria(c)}
                className={cx("flex-1 h-11 rounded-2xl text-[13.5px] font-bold", categoria === c ? "bg-ink text-white" : "bg-[#F3F4F6] text-[#374151]")}>
                {CATEGORIA_LABELS[c]}
              </button>
            ))}
          </div>
        </Field>
        <Field label="Número de ejes" required>
          <div className="flex gap-2 flex-wrap">
            {[1, 2, 3, 4, 5, 6].map(n => (
              <button key={n} type="button" onClick={() => setNumEjes(n)}
                className={cx("w-11 h-11 rounded-2xl text-[13.5px] font-bold", numeroEjes === n ? "bg-ink text-white" : "bg-[#F3F4F6] text-[#374151]")}>{n}</button>
            ))}
          </div>
        </Field>
        <div className="space-y-3">
          {Array.from({ length: numeroEjes }, (_, i) => i + 1).map(n => (
            <Field key={n} label={`Eje ${n}`} required>
              <div className="flex gap-2">
                {[["direccional", "Direccional / Sencillo (2 ruedas)"], ["traccion", "Tracción / Dual (4 ruedas)"]].map(([v, l]) => (
                  <button key={v} type="button" onClick={() => setTiposPorEje(p => ({ ...p, [n]: v }))}
                    className={cx("flex-1 h-11 rounded-2xl text-[12.5px] font-bold px-2", tiposPorEje[n] === v ? "bg-ink text-white" : "bg-[#F3F4F6] text-[#374151]")}>{l}</button>
                ))}
              </div>
            </Field>
          ))}
        </div>
        <Field label="Cantidad de auxiliares/repuestos" required>
          <div className="flex gap-2">
            {[0, 1, 2].map(n => (
              <button key={n} type="button" onClick={() => setAuxiliares(n)}

            ))}
          </div>
        </Field>
        <p className="text-[12px] text-muted">Total de posiciones en el mapa: <b>{totalPreview}</b></p>
        {error && <p className="text-[12.5px] font-bold text-[#B91C1C]">{error}</p>}
        <Button className="w-full" disabled={saving} onClick={guardar}>{saving ? <span className="spinner" /> : "Crear configuración"}</Button>
      </div>
    </Modal>
  );
}

    setError("");

        pushToast("✓ Marca/modelo agregado al catálogo");

      onSaved();
