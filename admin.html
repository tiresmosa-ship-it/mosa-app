/* =====================================================================
   MOSA TIRES — kit de UI compartido (JSX). Cargado con Babel en modo
   clásico (sin módulos) antes del script propio de cada página, así que
   todo lo declarado acá (Icon, Button, Card, Modal, BottomNav, hooks...)
   queda disponible como global. Depende de React (CDN) y de
   js/supabase.js (LS, getQueue, db) ya cargados antes que este archivo.
===================================================================== */
const { useState, useEffect, useCallback, createContext, useContext } = React;

/* =====================================================================
   CONTEXTO GLOBAL
===================================================================== */
const AppCtx = createContext(null);
function useApp() { return useContext(AppCtx); }
function useOnline() {
  const [online, setOnline] = useState(navigator.onLine);
  useEffect(() => {
    const on = () => setOnline(true), off = () => setOnline(false);
    window.addEventListener("online", on); window.addEventListener("offline", off);
    return () => { window.removeEventListener("online", on); window.removeEventListener("offline", off); };
  }, []);
  return online;
}
function useQueueCount() {
  const [count, setCount] = useState(getQueue().length);
  useEffect(() => {
    const upd = () => setCount(getQueue().length);
    window.addEventListener("mosa-queue-changed", upd);
    const t = setInterval(upd, 3000);
    return () => { window.removeEventListener("mosa-queue-changed", upd); clearInterval(t); };
  }, []);
  return count;
}
function useAlertasNoLeidas(clienteId, mecanicoId) {
  const [count, setCount] = useState(0);
  const queuePending = useQueueCount();
  useEffect(() => {
    if (!clienteId || !mecanicoId) return;
    let cancel = false;
    const cargar = () => db.fetchAlertas(clienteId, mecanicoId).then(as => { if (!cancel) setCount(as.filter(a => !a.leida_mecanico).length); }).catch(() => {});
    cargar();
    window.addEventListener("mosa-alertas-changed", cargar);
    const t = setInterval(cargar, 15000);
    return () => { cancel = true; window.removeEventListener("mosa-alertas-changed", cargar); clearInterval(t); };
  }, [clienteId, mecanicoId, queuePending]);
  return count;
}

    primary: "bg-ink text-white",

    danger: "bg-[#FEE2E2] text-[#B91C1C]",
    subtle: "bg-[#F3F4F6] text-ink"

  return <button className={cx(base, variants[variant], className)} {...props}>{children}</button>;
}

/* Formatea un monto según moneda (CLP/ARS/USD, snapshot por carga — ver
   config_cliente.moneda). CLP/ARS sin decimales (uso local), USD con 2
   decimales (estándar internacional). No se suman monedas distintas entre sí. */
function formatMoney(n, moneda) {
  if (n == null || isNaN(n)) return "-";
  const m = moneda || "CLP";
  if (m === "USD") return "US$" + Number(n).toLocaleString("en-US", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  if (m === "ARS") return "AR$" + Math.round(n).toLocaleString("es-AR");
  return "$" + Math.round(n).toLocaleString("es-CL");
}
function MarcaSelect({ value, onChange }) {
  const isOtra = value && !MARCAS_NEUMATICOS.slice(0, -1).includes(value);
  const [otra, setOtra] = useState(isOtra ? value : "");
  return (
    <div>
      <Select value={isOtra ? "Otra" : value} onChange={e => { if (e.target.value === "Otra") { onChange(otra); } else { onChange(e.target.value); } }}>
        <option value="">Seleccionar</option>
        {MARCAS_NEUMATICOS.map(m => <option key={m} value={m}>{m}</option>)}
      </Select>
      {isOtra && (
        <TextInput className="mt-2" placeholder="Escribí la marca" value={otra}
          onChange={e => { setOtra(e.target.value); onChange(e.target.value); }} />
      )}
    </div>
  );
}

function Toast({ msg, onDone, color = "green" }) {
  useEffect(() => { const t = setTimeout(onDone, 2000); return () => clearTimeout(t); }, []);
  const styles = color === "amber" ? { background: "#FEF3C7", color: "#92400E" } : color === "red" ? { background: "#FEE2E2", color: "#B91C1C" } : { background: "#DCFCE7", color: "#15803D" };
  return (
    <div className="fixed top-4 left-1/2 -translate-x-1/2 z-[80] px-4 py-3 rounded-2xl shadow-lg text-sm font-semibold flex items-center gap-3" style={styles}>
      <span>{msg}</span>
      <button onClick={onDone} className="opacity-60">✕</button>
    </div>
  );
}
function useToasts() {
  const [toasts, setToasts] = useState([]);
  const push = useCallback((msg, color = "green") => setToasts(t => [...t, { id: uuid(), msg, color }]), []);
  const remove = (id) => setToasts(t => t.filter(x => x.id !== id));
  const node = <div>{toasts.map(t => <Toast key={t.id} msg={t.msg} color={t.color} onDone={() => remove(t.id)} />)}</div>;
  return [push, node];
}
function SyncStatusToast() {
  const [state, setState] = useState(null); // null | {type:'syncing'} | {type:'done', failed}
  useEffect(() => {
    let doneTimer;
    const onStart = () => { clearTimeout(doneTimer); setState({ type: "syncing" }); };
    const onDone = (e) => {
      const failed = (e.detail && e.detail.failed) || 0;
      setState({ type: "done", failed });
      doneTimer = setTimeout(() => setState(null), failed > 0 ? 3500 : 2000);
    };
    window.addEventListener("mosa-sync-start", onStart);
    window.addEventListener("mosa-sync-done", onDone);
    return () => { window.removeEventListener("mosa-sync-start", onStart); window.removeEventListener("mosa-sync-done", onDone); clearTimeout(doneTimer); };
  }, []);
  if (!state) return null;
  let bg = "#E5E7EB", color = "#374151", text = "🔄 Sincronizando…";
  if (state.type === "done") {
    if (state.failed === 0) { bg = "#DCFCE7"; color = "#15803D"; text = "✓ Todo sincronizado"; }
    else { bg = "#FEF3C7"; color = "#92400E"; text = `⚠ ${state.failed} registro${state.failed !== 1 ? "s" : ""} no pudieron sincronizarse`; }
  }
  return (
    <div className="fixed top-4 left-1/2 -translate-x-1/2 z-[85] px-4 py-3 rounded-2xl shadow-lg text-sm font-semibold" style={{ background: bg, color }}>
      {text}
    </div>
  );
}
function Confirm({ title, desc, onConfirm, onCancel }) {
  return (
    <Modal title={title} onClose={onCancel}>
      <p className="text-[14px] text-[#374151] mb-5">{desc}</p>
      <div className="flex gap-3">
        <Button variant="subtle" className="flex-1" onClick={onCancel}>Cancelar</Button>
        <Button className="flex-1" onClick={onConfirm}>Confirmar</Button>
      </div>

  );
}
function OfflineBadge() {
  const online = useOnline();
  const pending = useQueueCount();
  if (online && pending === 0) return null;

      {pending > 0 && <div className="mb-2 rounded-xl bg-[#FEF3C7] text-[#92400E] text-xs font-bold px-3 py-2 text-center">{pending} registro{pending !== 1 ? "s" : ""} pendiente{pending !== 1 ? "s" : ""} de sincronizar</div>}

// Requerimiento 3: el Admin ve las recomendaciones que dejo la auditoria y
// puede aprobarlas/desaprobarlas, marcarlas prioritarias o derivarlas
// directo a Pendiente sin tener que esperar a que el mecanico llegue a la HC.
function RecomendacionesModal({ auditoriaId, equipoId, equipoLabel, adminUser, pushToast, onClose, onCambio }) {
  const [receta, setReceta] = useState(undefined); // undefined = cargando, null = no encontrada
  const [ocupado, setOcupado] = useState(null);
  const [nuevaTarea, setNuevaTarea] = useState("");
  const [agregando, setAgregando] = useState(false);

  function cargar() {
    db.fetchRecetaPorAuditoria(auditoriaId).then(setReceta).catch(e => { console.error("No se pudo cargar la auditoria", e); setReceta(null); });
  }
  useEffect(cargar, [auditoriaId]);

  const recs = receta ? (Array.isArray(receta.posiciones_alerta.recomendaciones) ? receta.posiciones_alerta.recomendaciones : []) : [];

  // Requerimiento 2.2: cargar una tarea manual directo desde Recomendaciones,
  // igual mecanismo que usa "Ver Hoja de Cambio en Vivo" (db.agregarTareaEquipo
  // ya decide si inyectarla a la HC activa de hoy o dejarla pendiente).
  async function agregarTarea() {
    if (!nuevaTarea.trim()) return;
    setAgregando(true);
    try {
      await db.agregarTareaEquipo(equipoId, nuevaTarea.trim(), adminUser);
      pushToast("✓ Tarea agregada al instructivo");
      setNuevaTarea("");
      onCambio && onCambio();
    } catch (e) { console.error("No se pudo agregar la tarea", e); pushToast(e.message || "✕ No se pudo agregar la tarea", "red"); }
    setAgregando(false);
  }

  async function actualizar(r, cambios, msg) {
    setOcupado(r.id);
    try {
      await db.actualizarRecomendacion(receta.id, r.id, cambios);
      pushToast(msg);
      cargar();
      onCambio && onCambio();
    } catch (e) { console.error("No se pudo actualizar la recomendación", e); pushToast("✕ No se pudo actualizar", "red"); }
    setOcupado(null);
  }
  async function aPendiente(r) {
    setOcupado(r.id);
    try {
      await db.enviarTareaActivaAPendiente(receta.id, r, false, adminUser);
      pushToast("→ Recomendación derivada a Pendiente");
      cargar();
      onCambio && onCambio();
    } catch (e) { console.error("No se pudo derivar la recomendación", e); pushToast("✕ No se pudo derivar", "red"); }
    setOcupado(null);
  }

  return (
    <Modal title={`Recomendaciones — ${equipoLabel}`} onClose={onClose}>
      {receta === undefined ? <div className="flex justify-center py-8"><span className="spinner" /></div> : receta === null ? (
        <p className="text-[13.5px] text-muted text-center py-6">No se encontró el instructivo de esta auditoría.</p>
      ) : (
        <div className="space-y-2">
          {recs.map(r => (
            <div key={r.id} className="bg-white rounded-2xl border border-bd shadow-card px-4 py-3">
              <div className="flex items-start justify-between gap-2">
                <p className={cx("text-[13.5px] font-semibold flex-1", r.done && "text-[#15803D]")}>{r.done ? "✅" : "🟢"} {r.texto}</p>
                <div className="flex gap-1.5 shrink-0">
                  {r.prioritaria && <Badge color="red">Prioritaria</Badge>}
                  <Badge color={r.aprobada === false ? "red" : r.aprobada ? "green" : "gray"}>{r.aprobada === false ? "Desaprobada" : r.aprobada ? "Aprobada" : "Sin revisar"}</Badge>
                </div>
              </div>
              <div className="flex gap-2 flex-wrap mt-2.5">
                <button disabled={ocupado === r.id} onClick={() => actualizar(r, { aprobada: true }, "✓ Recomendación aprobada")} className="text-[11px] font-bold text-[#15803D] px-2.5 py-1 rounded-full bg-[#DCFCE7]">Aprobar</button>
                <button disabled={ocupado === r.id} onClick={() => actualizar(r, { aprobada: false }, "✓ Recomendación desaprobada")} className="text-[11px] font-bold text-[#B91C1C] px-2.5 py-1 rounded-full bg-[#FEE2E2]">Desaprobar</button>
                <button disabled={ocupado === r.id} onClick={() => actualizar(r, { prioritaria: !r.prioritaria }, r.prioritaria ? "✓ Ya no es prioritaria" : "✓ Marcada como prioritaria")} className="text-[11px] font-bold text-ink px-2.5 py-1 rounded-full bg-[#F3F4F6]">{r.prioritaria ? "Quitar prioridad" : "Marcar prioritaria"}</button>
                {!r.done && <button disabled={ocupado === r.id} onClick={() => aPendiente(r)} className="text-[11px] font-bold text-[#92400E] px-2.5 py-1 rounded-full bg-[#FEF3C7]">⏳ Mandar a Pendiente</button>}
              </div>
            </div>
          ))}
          {!recs.length && <p className="text-[13.5px] text-muted text-center py-6">Sin recomendaciones activas para este equipo.</p>}
          <div className="flex gap-2 pt-2 border-t border-bd">
            <TextInput placeholder="Cargar nueva tarea" value={nuevaTarea} onChange={e => setNuevaTarea(e.target.value)} onKeyDown={e => { if (e.key === "Enter") agregarTarea(); }} className="h-10 text-[13px]" />
            <Button variant="subtle" className="h-10 px-4 text-[13px]" disabled={!nuevaTarea.trim() || agregando} onClick={agregarTarea}>{agregando ? <span className="spinner" /> : "➕ Agregar Tarea"}</Button>
          </div>
        </div>
      )}
    </Modal>
  );
}
// Requerimiento 3: la HC del mecanico en vivo, con canal Realtime sobre la
// misma auditorias_receta que usa mecanico.html (mismo patron de canal) para
// que el Admin vea completadas/en proceso/postergadas sin refrescar, y pueda
// agregar una tarea de texto libre mientras el mecanico sigue trabajando.
function HojaCambioEnVivoModal({ auditoriaId, equipoId, equipoLabel, adminUser, pushToast, onClose, onCambio }) {
  const [receta, setReceta] = useState(undefined);
  const [nuevaTarea, setNuevaTarea] = useState("");
  const [agregando, setAgregando] = useState(false);
  const [ocupado, setOcupado] = useState(null);

  function cargar() {
    db.fetchRecetaPorAuditoria(auditoriaId).then(setReceta).catch(e => { console.error("No se pudo cargar la HC", e); setReceta(null); });
  }
  useEffect(cargar, [auditoriaId]);

  useEffect(() => {
    if (!receta || !receta.id) return;
    const canal = sb.channel("admin-hc-en-vivo-" + receta.id)
      .on("postgres_changes", { event: "UPDATE", schema: "public", table: "auditorias_receta", filter: `id=eq.${receta.id}` },
        (payload) => setReceta(r => ({ ...r, posiciones_alerta: payload.new.posiciones_alerta })))
      .subscribe();
    return () => { sb.removeChannel(canal); };
  }, [receta && receta.id]);

  async function agregar() {
    if (!nuevaTarea.trim()) return;
    setAgregando(true);
    try {
      await db.agregarTareaEquipo(equipoId, nuevaTarea.trim(), adminUser);
      pushToast("✓ Tarea agregada — ya aparece en la Hoja de Cambio del mecánico");
      setNuevaTarea("");
      onCambio && onCambio();
    } catch (e) { console.error("No se pudo agregar la tarea", e); pushToast(e.message || "✕ No se pudo agregar la tarea", "red"); }
    setAgregando(false);
  }

  // Requerimiento 3.3: mandar a pendiente EN VIVO una tarea activa de la HC en
  // curso -- reusa enviarTareaActivaAPendiente (misma funcion que usa
  // Recomendaciones), marcando esExtra segun de que lista vino cada tarea. El
  // canal realtime de arriba actualiza este modal solo, y el que ya escucha
  // mecanico.html (canal "hc-checklist-<recetaId>") hace que desaparezca del
  // HACER_HOY del mecanico en el momento en que llega el update.
  async function aPendiente(t, esExtra) {
    const key = t.id || t.texto;
    setOcupado(key);
    try {
      await db.enviarTareaActivaAPendiente(receta.id, t, esExtra, adminUser);
      pushToast("⏳ Tarea mandada a Pendiente — se quita de la Hoja de Cambio del mecánico");
      onCambio && onCambio();
    } catch (e) { console.error("No se pudo mandar la tarea a pendiente", e); pushToast("✕ No se pudo mandar a pendiente", "red"); }
    setOcupado(null);
  }

  const pa = (receta && receta.posiciones_alerta) || {};
  const recs = (Array.isArray(pa.recomendaciones) ? pa.recomendaciones : []).map(t => ({ ...t, esExtra: false }));
  const extras = (Array.isArray(pa.tareas_extra) ? pa.tareas_extra : []).map(t => ({ ...t, esExtra: true }));
  const activas = [...recs, ...extras];
  const completadas = activas.filter(t => t.done);
  const enProceso = activas.filter(t => !t.done);
  const postergadas = (Array.isArray(pa.tareas_diferidas) ? pa.tareas_diferidas : []).filter(t => t.estado === "PENDIENTE");

  return (
    <Modal title={`Hoja de Cambio en vivo — ${equipoLabel}`} onClose={onClose}>
      {receta === undefined ? <div className="flex justify-center py-8"><span className="spinner" /></div> : receta === null ? (
        <p className="text-[13.5px] text-muted text-center py-6">No se encontró la Hoja de Cambio de este equipo.</p>
      ) : (
        <div className="space-y-5">
          <div>
            <p className="font-bold text-[13.5px] mb-2">🟡 En proceso ({enProceso.length})</p>
            <div className="space-y-1.5">
              {enProceso.map((t, i) => (
                <div key={i} className="text-[13px] text-[#92400E] bg-[#FEF3C7] rounded-xl px-3 py-2 flex items-center justify-between gap-2">
                  <span className="flex-1">{t.texto}</span>
                  <button disabled={ocupado === (t.id || t.texto)} onClick={() => aPendiente(t, t.esExtra)} className="text-[11px] font-bold text-[#92400E] px-2.5 py-1 rounded-full bg-white shrink-0 whitespace-nowrap">
                    {ocupado === (t.id || t.texto) ? "..." : "⏳ Mandar a Pendiente"}
                  </button>
                </div>
              ))}
              {!enProceso.length && <p className="text-[12.5px] text-muted">Nada pendiente por hacer hoy.</p>}
            </div>
          </div>
          <div>
            <p className="font-bold text-[13.5px] mb-2">✅ Completadas ({completadas.length})</p>
            <div className="space-y-1.5">
              {completadas.map((t, i) => <p key={i} className="text-[13px] text-[#15803D] strike">{t.texto}</p>)}
              {!completadas.length && <p className="text-[12.5px] text-muted">Todavía ninguna.</p>}
            </div>
          </div>
          <div>
            <p className="font-bold text-[13.5px] mb-2">➡️ Postergadas por el mecánico ({postergadas.length})</p>
            <div className="space-y-1.5">
              {postergadas.map(t => <p key={t.id} className="text-[13px] text-muted bg-[#F3F4F6] rounded-xl px-3 py-2">{t.texto}</p>)}
              {!postergadas.length && <p className="text-[12.5px] text-muted">Sin tareas postergadas.</p>}
            </div>
          </div>
          <div className="flex gap-2 pt-2 border-t border-bd">
            <TextInput placeholder="Agregar tarea de texto libre" value={nuevaTarea} onChange={e => setNuevaTarea(e.target.value)} onKeyDown={e => { if (e.key === "Enter") agregar(); }} className="h-10 text-[13px]" />
            <Button variant="subtle" className="h-10 px-4 text-[13px]" disabled={!nuevaTarea.trim() || agregando} onClick={agregar}>{agregando ? <span className="spinner" /> : "+ Agregar"}</Button>
          </div>
        </div>
      )}
    </Modal>
  );
}
function DashboardView({ empresaCtl, onAbrirMecanico, setView, adminUser }) {
  const { filtro } = empresaCtl;
  const [kpis, setKpis] = useState({ equipos: null, auditorias: null, alertas: null, pct: null });
  const [nivel1, setNivel1] = useState([]);
  const [pendientes, setPendientes] = useState([]);
  const [stock, setStock] = useState(null);
  const [mecanicos, setMecanicos] = useState([]);
  const [actividad, setActividad] = useState([]);
  const [equiposMap, setEquiposMap] = useState({});
  const [mecanicosMap, setMecanicosMap] = useState({});
  const [loading, setLoading] = useState(true);
  const [refrescando, setRefrescando] = useState(false);
  const [pushToast, toastNode] = useToasts();

  async function cargar(silent) {
    if (!silent) setLoading(true); else setRefrescando(true);
    try {
      const [equiposCount, auditoriasCount, criticasList, pct, pend, stk, mecs, nivel1List, act] = await Promise.all([
        adminDb.countEquiposActivos(filtro), adminDb.countAuditoriasHoy(filtro),
        adminDb.fetchAlertasCriticas(filtro, true), adminDb.fetchPctInstructivoHoy(filtro),
        adminDb.fetchInstructivosPendientes(filtro), adminDb.fetchStockRapido(filtro),
        adminDb.fetchMecanicosEnJornada(filtro), adminDb.fetchAlertasNivel1Pendientes(filtro),
        adminDb.fetchActividadFaena(filtro).catch(e => { console.error("No se pudo cargar la actividad en faena", e); return []; })
      ]);
      setKpis({ equipos: equiposCount, auditorias: auditoriasCount, alertas: criticasList.length, pct });
      setNivel1(nivel1List);
      setPendientes(pend);
      setStock(stk);
      setMecanicos(mecs);
      setActividad(act);
      const eqIds = [...new Set([...criticasList, ...nivel1List].map(a => a.equipo_id))].filter(Boolean);
      if (eqIds.length) {
        const { data: eqs } = await sb.from("equipos").select("id_equipo,patente,numero_interno").in("id_equipo", eqIds);
        const map = {}; (eqs || []).forEach(e => { map[e.id_equipo] = e.numero_interno ? `${e.numero_interno} · ${e.patente}` : e.patente; });
        setEquiposMap(map);
      } else setEquiposMap({});
      // Fix 2: resolver el nombre del mecánico (join con usuarios) en vez de
      // mostrar el mecanico_id crudo en el bloque rojo de urgentes.
      const mecIds = [...new Set(nivel1List.map(a => a.mecanico_id))].filter(Boolean);
      if (mecIds.length) {
        const { data: mecs2 } = await sb.from("usuarios").select("id,nombre,apellido").in("id", mecIds);
        const map = {}; (mecs2 || []).forEach(m => { map[m.id] = `${m.nombre} ${m.apellido || ""}`.trim(); });
        setMecanicosMap(map);
      } else setMecanicosMap({});
    } catch (e) { console.error("No se pudo cargar el dashboard", e); }
    if (!silent) setLoading(false); else setRefrescando(false);
  }
  // Bug 3: refrescar el bloque de urgentes y los KPIs solos, sin esperar a
  // que el Admin recargue la pagina a mano. Polling cada 30s + refresco
  // inmediato apenas se resuelve una alerta desde cualquier parte de la app
  // (marcarAlertaLeida/marcarAlertaResuelta/etc. disparan "mosa-alertas-changed").
  // silent=true en el poll/evento para no tapar la pantalla con el spinner
  // de carga inicial cada vez que refresca solo.
  useEffect(() => {
    cargar();
    const cargarSilencioso = () => cargar(true);
    const t = setInterval(cargarSilencioso, 30000);
    window.addEventListener("mosa-alertas-changed", cargarSilencioso);
    // Requerimiento 1: reflejar en vivo (sin refrescar a mano) los eventos de
    // sesion que registra el mecanico (auditoria/HC) apenas se insertan.
    const canal = sb.channel("dashboard-actividad-faena")
      .on("postgres_changes", { event: "INSERT", schema: "public", table: "sesiones_trabajo" }, cargarSilencioso)
      .subscribe();
    return () => { clearInterval(t); window.removeEventListener("mosa-alertas-changed", cargarSilencioso); sb.removeChannel(canal); };
  }, [filtro]);

  if (loading) return <div className="flex justify-center py-16"><span className="spinner" /></div>;

  return (
    <div>
      {toastNode}
      <h1 className="text-[26px] font-extrabold mb-5">Dashboard</h1>

      {nivel1.length > 0 && (
        <div className="bg-[#FEE2E2] border border-[#FCA5A5] rounded-2xl p-4 mb-6">
          <p className="font-extrabold text-[14px] text-[#B91C1C] mb-3 flex items-center gap-2">
            🔴 {nivel1.length} alerta{nivel1.length !== 1 ? "s" : ""} requiere{nivel1.length !== 1 ? "n" : ""} atención inmediata
            {refrescando && <span className="text-[11px] font-semibold text-[#B91C1C]/70">🔄 Actualizando...</span>}
          </p>
          <div className="space-y-2">
            {nivel1.slice(0, 8).map(a => {
              const mecanicoNombre = a.mecanico_id ? mecanicosMap[a.mecanico_id] : null;
              return (
                <div key={a.id} className="flex items-center justify-between gap-3 bg-white rounded-xl px-3 py-2">
                  <div className="min-w-0">
                    <p className="text-[13px] font-semibold truncate">
                      {a.titulo}{equiposMap[a.equipo_id] ? ` — ${equiposMap[a.equipo_id]}` : ""}{a.posicion != null ? ` pos ${a.posicion}` : ""}{mecanicoNombre ? ` — ${mecanicoNombre}` : ""}
                    </p>
                    <p className="text-[11px] text-muted mt-0.5">{timeAgoCorto(a.creado_en)}</p>
                  </div>
                  <button onClick={() => irAResolucion(a, setView)} className="text-[12px] font-bold text-white bg-ink px-3 py-1.5 rounded-full whitespace-nowrap shrink-0">Resolver →</button>
                </div>
              );
            })}
          </div>
        </div>
      )}

      <div className="grid grid-cols-2 md:grid-cols-4 gap-3 mb-6">
        <KpiCard label="Equipos activos" value={kpis.equipos} />
        <KpiCard label="Auditorías hoy" value={kpis.auditorias} />
        <KpiCard label="Alertas críticas" value={kpis.alertas} />
        <KpiCard label="% instructivo prom." value={kpis.pct != null ? kpis.pct + "%" : "—"} />
      </div>

      <div className="flex items-center gap-2 mb-3">
        <p className="font-bold text-[16px]">🔴 Actividad en Faena (En Vivo)</p>
        {refrescando && <span className="text-[11px] font-semibold text-muted">🔄 Actualizando...</span>}
      </div>
      <div className="bg-white rounded-2xl border border-bd shadow-card overflow-hidden mb-8">
        {actividad.map((a, i) => (
          <ActividadFaenaRow key={a.equipo_id} item={a} borde={i > 0} adminUser={adminUser} pushToast={pushToast} onCambio={() => cargar(true)} />
        ))}
        {!actividad.length && <p className="text-[13.5px] text-muted p-4">Sin actividad registrada hoy.</p>}
      </div>

      <p className="font-bold text-[16px] mb-3">Equipos con instructivo pendiente o parcial</p>
      <div className="bg-white rounded-2xl border border-bd shadow-card overflow-hidden mb-8">
        {pendientes.map((p, i) => (
          <div key={i} className={cx("flex items-center justify-between px-4 py-3", i > 0 && "border-t border-bd")}>
            <div>
              <p className="font-bold text-[14px]">{p.numero_interno ? `${p.numero_interno} · ` : ""}{p.patente}</p>
              <p className="text-[12px] text-muted">Auditoría del {p.fecha ? formatDateLong(p.fecha) : "-"} · {p.tareas_pendientes}/{p.total_tareas} tareas pendientes</p>
            </div>
            <Badge color={p.estado === "parcial" ? "amber" : "red"}>{p.estado === "parcial" ? "Parcial" : "Pendiente"}</Badge>
          </div>
        ))}
        {!pendientes.length && <p className="text-[13.5px] text-muted p-4">No hay instructivos pendientes.</p>}
      </div>

      <p className="font-bold text-[16px] mb-3">Stock rápido</p>
      <div className="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-3 mb-8">
        <KpiCard label="Nuevos" value={stock ? stock.nuevo : null} />
        <KpiCard label="Tránsito" value={stock ? stock.transito : null} />
        <KpiCard label="En reparar" value={stock ? stock.reparacion : null} />
        <KpiCard label="Retiro Desgaste" value={stock ? stock.retiro_desgaste : null} />
        <KpiCard label="Para Recauchar" value={stock ? stock.para_recauchar : null} />
        <KpiCard label="Recauchados" value={stock ? stock.recauchado : null} />
        <KpiCard label="En equipo" value={stock ? stock.en_equipo : null} />
        <KpiCard label="Retiro Daño" value={stock ? stock.retiro_dano : null} />
        <KpiCard label="Retiro Otro" value={stock ? stock.retiro_otro : null} />
        <KpiCard label="NFU" value={stock ? stock.nfu : null} />
      </div>

      <p className="font-bold text-[16px] mb-3">Mecánicos en jornada</p>
      <div className="bg-white rounded-2xl border border-bd shadow-card overflow-hidden">
        {mecanicos.map((m, i) => {
          const bloqueado = m.estado === "cerrado";
          const dot = m.estado === "activo" ? "🟢" : m.estado === "cerrado" ? "🔴" : "⏳";
          const detalle = m.estado === "activo" ? `Activo desde ${(m.turno.hora_inicio || "").slice(0, 5) || "—"}`
            : m.estado === "cerrado" ? `Jornada cerrada ${(m.turno.hora_cierre || "").slice(0, 5) || ""}`
            : "Sin iniciar";
          return (
            <button key={m.id} onClick={() => bloqueado && onAbrirMecanico(m)}
              className={cx("w-full flex items-center justify-between px-4 py-3 text-left", i > 0 && "border-t border-bd", !bloqueado && "cursor-default")}>
              <div className="flex items-center gap-2">
                <span>{dot}</span>
                <div>
                  <p className="font-bold text-[14px]">{m.nombre} {m.apellido || ""}</p>
                  <p className="text-[12px] text-muted">{detalle}</p>
                </div>
              </div>
              {bloqueado && <Icon.lock width="16" height="16" className="text-muted shrink-0" />}
            </button>
          );
        })}
        {!mecanicos.length && <p className="text-[13.5px] text-muted p-4">No hay mecánicos para esta empresa.</p>}
      </div>
    </div>
  );
}

function MecanicoBloqueadoModal({ mecanico, empresas, onClose, onDone, initialModo }) {
  const [modo, setModo] = useState(initialModo || null); // null | "empresa"
  const [nuevaEmpresa, setNuevaEmpresa] = useState(mecanico.cliente_id);
  const [saving, setSaving] = useState(false);
  const [error, setError] = useState("");

  async function iniciarNuevoTurno() {
    setSaving(true); setError("");
    try {
      const alerta = await adminDb.fetchSolicitudesDesbloqueoPendientes("todas").then(as => as.find(a => a.mecanico_id === mecanico.id));
      await adminDb.iniciarNuevoTurno(mecanico, alerta ? alerta.id : null);
      onDone();
    } catch (e) { console.error("No se pudo iniciar el nuevo turno", e); setError("No se pudo iniciar el nuevo turno. Intentá de nuevo."); setSaving(false); }
  }
  async function cambiarEmpresa() {
    setSaving(true); setError("");
    try {
      const alerta = await adminDb.fetchSolicitudesDesbloqueoPendientes("todas").then(as => as.find(a => a.mecanico_id === mecanico.id));
      await adminDb.cambiarEmpresaMecanico(mecanico, nuevaEmpresa, alerta ? alerta.id : null);
      onDone();
    } catch (e) { console.error("No se pudo cambiar la empresa del mecánico", e); setError("No se pudo cambiar la empresa. Intentá de nuevo."); setSaving(false); }
  }

  if (modo === "empresa") {
    return (
      <Modal title="Cambiar de empresa" onClose={() => setModo(null)}>
        <p className="text-[14px] text-[#374151] mb-4">Elegí la empresa donde {mecanico.nombre} va a trabajar hoy.</p>
        <Field label="Empresa">
          <Select value={nuevaEmpresa} onChange={e => setNuevaEmpresa(e.target.value)}>
            {empresas.map(e => <option key={e.id_cliente} value={e.id_cliente}>{e.nombre}</option>)}
          </Select>
        </Field>
        {error && <p className="text-[12.5px] font-semibold text-[#B91C1C] mt-3">{error}</p>}
        <Button className="w-full mt-5" disabled={saving} onClick={cambiarEmpresa}>{saving ? <span className="spinner" /> : "Confirmar cambio de empresa"}</Button>
      </Modal>
    );
  }

  return (
    <Modal title={`${mecanico.nombre} ${mecanico.apellido || ""}`} onClose={onClose}>
      <p className="text-[14px] text-[#374151] mb-5">Esta jornada está cerrada. Elegí cómo desbloquearlo.</p>
      {error && <p className="text-[12.5px] font-semibold text-[#B91C1C] mb-3">{error}</p>}
      <div className="space-y-3">
        <Button className="w-full" disabled={saving} onClick={iniciarNuevoTurno}>{saving ? <span className="spinner" /> : "Iniciar nuevo turno"}</Button>
        <Button variant="subtle" className="w-full" disabled={saving} onClick={() => setModo("empresa")}>Cambiar empresa</Button>
      </div>
    </Modal>
  );
}

const EQUIPO_BADGE_INFO = {
  al_dia: { icon: "✅", label: "Al día", color: "green" },
  atencion: { icon: "⚠", label: "Atención", color: "amber" },
  alertas: { icon: "🔴", label: "Con alertas", color: "red" },
  sin_auditar: { icon: "⚪", label: "Sin auditar", color: "gray" }
};
async function fetchEquiposConEstado(clienteId) {
  let q = sb.from("equipos").select("*").order("numero_interno");
  if (clienteId && clienteId !== "todas") q = q.eq("cliente_id", clienteId);
  const { data: equipos, error } = await q;
  if (error) throw error;
  if (!equipos || !equipos.length) return [];
  const ids = equipos.map(e => e.id_equipo);

  const [{ data: alertas }, { data: auditorias }] = await Promise.all([
    sb.from("alertas").select("equipo_id").eq("severidad", "rojo").eq("leida_admin", false).in("equipo_id", ids),
    sb.from("auditorias").select("id_auditoria,equipo_id,fecha,creado_en").in("equipo_id", ids).order("fecha", { ascending: false }).order("creado_en", { ascending: false })
  ]);

  const alertasPorEquipo = {};
  (alertas || []).forEach(a => { alertasPorEquipo[a.equipo_id] = (alertasPorEquipo[a.equipo_id] || 0) + 1; });

  const auditoriasPorEquipo = {};
  const ultimaAuditoriaPorEquipo = {};
  (auditorias || []).forEach(a => {
    auditoriasPorEquipo[a.equipo_id] = (auditoriasPorEquipo[a.equipo_id] || 0) + 1;
    if (!ultimaAuditoriaPorEquipo[a.equipo_id]) ultimaAuditoriaPorEquipo[a.equipo_id] = a; // primero = mas reciente (orden desc)
  });

  const auditoriaIdsUltimas = Object.values(ultimaAuditoriaPorEquipo).map(a => a.id_auditoria);
  const recetaPorAuditoria = {};
  if (auditoriaIdsUltimas.length) {
    const { data: recetas } = await sb.from("auditorias_receta").select("auditoria_id,estado").in("auditoria_id", auditoriaIdsUltimas);
    (recetas || []).forEach(r => { recetaPorAuditoria[r.auditoria_id] = r.estado; });
  }

  return equipos.map(eq => {
    const alertasCount = alertasPorEquipo[eq.id_equipo] || 0;
    const auditoriasCount = auditoriasPorEquipo[eq.id_equipo] || 0;
    const ultima = ultimaAuditoriaPorEquipo[eq.id_equipo];
    const estadoInstructivo = ultima ? recetaPorAuditoria[ultima.id_auditoria] : null;
    let badge;
    if (alertasCount > 0) badge = "alertas";
    else if (estadoInstructivo === "pendiente" || estadoInstructivo === "parcial") badge = "atencion";
    else if (auditoriasCount === 0) badge = "sin_auditar";
    else badge = "al_dia";
    return { ...eq, badge };
  });
}

const EQUIPOS_FILTROS = [
  { id: "todos", label: "Todos" },
  { id: "tractos", label: "Tractos" },
  { id: "semis", label: "Semis" },
  { id: "alertas", label: "Con alertas" },
  { id: "instructivo_pendiente", label: "Instructivo pendiente" },
  { id: "sin_auditar", label: "Sin auditar" }
];
function aplicaFiltroEquipo(eq, filtroTab) {
  if (filtroTab === "todos") return true;
  if (filtroTab === "tractos") return eq.tipo !== "SEMI";
  if (filtroTab === "semis") return eq.tipo === "SEMI";
  if (filtroTab === "alertas") return eq.badge === "alertas";
  if (filtroTab === "instructivo_pendiente") return eq.badge === "atencion";
  if (filtroTab === "sin_auditar") return eq.badge === "sin_auditar";
  return true;
}

// Fallback de compatibilidad: si el cliente todavia no tiene ninguna
// Configuracion de Flota cargada para "tractor" (Admin > Configuracion >
// Configuraciones de Flota), se ofrecen estas 3 de siempre en vez de dejar
// el selector vacio -- BYS y clientes nuevos no pierden la funcionalidad.
const CONFIG_EJES_OPCIONES = ["4x2", "6x2", "6x4"];
function EquipoModal({ equipo, filtro, empresas, onClose, onSaved, pushToast }) {
  const editando = !!equipo;
  const [numeroInterno, setNumeroInterno] = useState(equipo ? (equipo.numero_interno || "") : "");
  const [patente, setPatente] = useState(equipo ? (equipo.patente || "") : "");
  const [tipo, setTipo] = useState(equipo ? equipo.tipo : "TRACTO");
  const [configEjes, setConfigEjes] = useState(equipo ? (equipo.configuracion_ejes || "") : "4x2");
  const [modelo, setModelo] = useState(equipo ? (equipo.modelo || "") : "");
  const [km, setKm] = useState(equipo ? (equipo.kilometros != null ? String(equipo.kilometros) : "") : "");
  const [clienteId, setClienteId] = useState(equipo ? equipo.cliente_id : (filtro !== "todas" ? filtro : ""));
  const [saving, setSaving] = useState(false);
  const [error, setError] = useState("");
  // Requerimiento 2: el selector de "Configuración" carga UNICAMENTE los
  // esquemas dados de alta para el cliente elegido (Admin > Configuracion >
  // Configuraciones de Flota), filtrados por categoria segun el Tipo elegido
  // (TRACTO -> tractor, SEMI -> trailer/chasis).
  const [configsDinamicas, setConfigsDinamicas] = useState([]);
  useEffect(() => {
    if (!clienteId) { setConfigsDinamicas([]); return; }
    db.fetchConfiguracionesEquipos(clienteId, true).then(setConfigsDinamicas).catch(e => { console.error("No se pudieron cargar las configuraciones de flota", e); setConfigsDinamicas([]); });
  }, [clienteId]);
  const categoriasParaTipo = tipo === "TRACTO" ? ["tractor"] : ["trailer", "chasis"];
  const opcionesDinamicas = configsDinamicas.filter(c => categoriasParaTipo.includes(c.categoria));
  // Cambiar el Tipo resetea la Configuracion elegida a un default sensato
  // segun la nueva categoria -- evita guardar un slug de tractor en un SEMI
  // (o viceversa) si el usuario cambia de tipo sin volver a tocar el selector.
  function cambiarTipo(t) {
    if (t === tipo) return;
    setTipo(t);
    setConfigEjes(t === "TRACTO" ? "4x2" : "");
  }

  async function guardar() {
    setError("");
    if (!numeroInterno.trim() || !patente.trim()) { setError("Número interno y patente son obligatorios."); return; }
    if (!clienteId) { setError("Elegí una empresa."); return; }
    setSaving(true);
    try {
      let q = sb.from("equipos").select("id_equipo").eq("cliente_id", clienteId).eq("numero_interno", numeroInterno.trim());
      if (editando) q = q.neq("id_equipo", equipo.id_equipo);
      const { data: dup } = await q;
      if (dup && dup.length) { setError("Ya existe un equipo con ese número interno en esta empresa."); setSaving(false); return; }

      // Requerimiento 2: antes un SEMI siempre guardaba configuracion_ejes=null
      // (forzado); ahora puede tener un slug de trailer/chasis dinamico (ej.
      // ELB "1+1"/"3+1") si el cliente tiene esquemas de esa categoria
      // cargados -- si no hay ninguno disponible para elegir, sigue quedando
      // null como antes (compatibilidad exacta con equipos.tipo==="SEMI" sin
      // configuracion_ejes, que axleConfigFor resuelve al layout fijo "semi").
      const payload = {
        numero_interno: numeroInterno.trim(), patente: patente.trim().toUpperCase(), tipo,
        configuracion_ejes: configEjes || null,
        modelo: modelo.trim() || null, kilometros: km ? parseInt(km, 10) : 0
      };
      if (editando) {
        const { error: e } = await sb.from("equipos").update(payload).eq("id_equipo", equipo.id_equipo);
        if (e) throw e;
        pushToast("✓ Equipo actualizado");
      } else {
        const { error: e } = await sb.from("equipos").insert({ ...payload, id_equipo: uuid(), cliente_id: clienteId, activo: true });
        if (e) throw e;
        pushToast("✓ Equipo creado");
      }
      onSaved();
    } catch (e) {
      console.error("No se pudo guardar el equipo", e);
      setError(e.message && e.message.includes("duplicate") ? "Ya existe un equipo con ese número interno." : "No se pudo guardar. Intentá de nuevo.");
    }
    setSaving(false);
  }

  return (
    <Modal title={editando ? "Editar equipo" : "Nuevo equipo"} onClose={onClose}>
      <div className="space-y-4">
        {!editando && (
          <Field label="Empresa" required>
            <Select value={clienteId} onChange={e => setClienteId(e.target.value)}>
              <option value="">Seleccionar</option>
              {empresas.map(e => <option key={e.id_cliente} value={e.id_cliente}>{e.nombre}</option>)}
            </Select>
          </Field>
        )}
        <Field label="Número interno" required>
          <TextInput value={numeroInterno} onChange={e => setNumeroInterno(e.target.value)} placeholder="Ej: 119" />
        </Field>
        <Field label="Patente" required>
          <TextInput value={patente} onChange={e => setPatente(e.target.value)} placeholder="Ej: AH771HG" />
        </Field>
        <Field label="Tipo" required>
          <div className="flex gap-2">
            {["TRACTO", "SEMI"].map(t => (
              <button key={t} type="button" onClick={() => cambiarTipo(t)}
                className={cx("flex-1 h-11 rounded-2xl text-[13.5px] font-bold", tipo === t ? "bg-ink text-white" : "bg-[#F3F4F6] text-[#374151]")}>
                {t === "TRACTO" ? "Tracto" : "Semi"}
              </button>
            ))}
          </div>
        </Field>
        {tipo === "TRACTO" && (
          <Field label="Configuración" required>
            <div className="flex gap-2 flex-wrap">
              {(opcionesDinamicas.length ? opcionesDinamicas.map(c => [c.slug, c.nombre]) : CONFIG_EJES_OPCIONES.map(c => [c, c])).map(([slug, label]) => (
                <button key={slug} type="button" onClick={() => setConfigEjes(slug)}
                  className={cx("h-11 px-3.5 rounded-2xl text-[13px] font-bold", configEjes === slug ? "bg-ink text-white" : "bg-[#F3F4F6] text-[#374151]")}>{label}</button>
              ))}
            </div>
          </Field>
        )}
        {tipo === "SEMI" && !!opcionesDinamicas.length && (
          <Field label="Configuración" hint="Opcional — si no elegís ninguna, se usa el layout estándar de semi (13 posiciones)">
            <div className="flex gap-2 flex-wrap">
              <button type="button" onClick={() => setConfigEjes("")}
                className={cx("h-11 px-3.5 rounded-2xl text-[13px] font-bold", !configEjes ? "bg-ink text-white" : "bg-[#F3F4F6] text-[#374151]")}>Estándar</button>
              {opcionesDinamicas.map(c => (
                <button key={c.slug} type="button" onClick={() => setConfigEjes(c.slug)}
                  className={cx("h-11 px-3.5 rounded-2xl text-[13px] font-bold", configEjes === c.slug ? "bg-ink text-white" : "bg-[#F3F4F6] text-[#374151]")}>{c.nombre}</button>
              ))}
            </div>
          </Field>
        )}
        <Field label="Modelo"><TextInput value={modelo} onChange={e => setModelo(e.target.value)} placeholder="Ej: SCANIA R500 6X4" /></Field>
        <Field label="Km iniciales"><TextInput type="number" inputMode="numeric" value={km} onChange={e => setKm(e.target.value.replace(/[^0-9]/g, ""))} placeholder="0" /></Field>
        {error && <p className="text-[12.5px] font-bold text-[#B91C1C]">{error}</p>}
        <Button className="w-full" disabled={saving} onClick={guardar}>{saving ? <span className="spinner" /> : (editando ? "Guardar cambios" : "Crear equipo")}</Button>
      </div>
    </Modal>
  );
}

function EquiposView({ empresaCtl, adminUser, setView }) {
  const { filtro, empresas } = empresaCtl;
  const [equipos, setEquipos] = useState([]);
  const [search, setSearch] = useState("");
  const [filtroTab, setFiltroTab] = useState("todos");
  const [loading, setLoading] = useState(true);
  const [detalle, setDetalle] = useState(null);
  const [modalEquipo, setModalEquipo] = useState(undefined); // undefined=cerrado, null=nuevo, {..}=editar
  const [pushToast, toastNode] = useToasts();
  const puedeGestionar = adminUser && (adminUser.rol === "admin" || adminUser.rol === "superadmin");

  function cargar() {
    setLoading(true);
    fetchEquiposConEstado(filtro).then(data => { setEquipos(data); setLoading(false); }).catch(e => { console.error("No se pudo cargar equipos", e); setLoading(false); });
  }
  useEffect(() => { cargar(); }, [filtro]);
  // Requerimiento 3: axleConfigFor necesita el cache de Configuraciones de
  // Flota (CONFIGURACIONES_CACHE) ya poblado para poder resolver un slug
  // dinamico de forma sincronica al dibujar el mapa (Mapa/Instructivo del
  // equipo). Se precarga por cliente al entrar a Equipos, igual que en
  // mecanico.html al confirmar empresa.
  useEffect(() => {
    if (filtro === "todas") { (empresas || []).forEach(e => precargarConfiguracionesCliente(e.id_cliente)); }
    else precargarConfiguracionesCliente(filtro);
  }, [filtro, empresas]);

  const filtrados = equipos.filter(eq => {
    if (!aplicaFiltroEquipo(eq, filtroTab)) return false;
    if (!search) return true;
    const s = search.toLowerCase();
    return (eq.patente || "").toLowerCase().includes(s) || (eq.numero_interno || "").toLowerCase().includes(s);
  });

  async function toggleActivo(eq) {
    try {
      await sb.from("equipos").update({ activo: !eq.activo }).eq("id_equipo", eq.id_equipo);
      setEquipos(es => es.map(x => x.id_equipo === eq.id_equipo ? { ...x, activo: !eq.activo } : x));
      pushToast(eq.activo ? "✓ Equipo desactivado" : "✓ Equipo activado");
    } catch (e) { console.error("No se pudo cambiar el estado del equipo", e); }
  }

  if (detalle) return <EquipoDetalleView equipo={detalle} onBack={() => setDetalle(null)} setView={setView} adminUser={adminUser} />;

  return (
    <div>
      {toastNode}
      <div className="flex items-center justify-between gap-3 mb-5 flex-wrap">
        <h1 className="text-[26px] font-extrabold">Equipos</h1>
        <Button className="h-11 px-4 text-[13.5px]" onClick={() => setModalEquipo(null)}>+ Nuevo equipo</Button>
      </div>
      <TextInput placeholder="Buscar por patente o número interno" value={search} onChange={e => setSearch(e.target.value)} className="mb-4 max-w-md" />
      <div className="flex gap-2 mb-5 overflow-x-auto">
        {EQUIPOS_FILTROS.map(f => (
          <button key={f.id} onClick={() => setFiltroTab(f.id)}
            className={cx("px-4 py-2 rounded-full text-[13px] font-bold whitespace-nowrap", filtroTab === f.id ? "bg-ink text-white" : "bg-[#F3F4F6] text-[#374151]")}>{f.label}</button>
        ))}
      </div>
      {loading ? <div className="flex justify-center py-10"><span className="spinner" /></div> : (
        <div className="grid sm:grid-cols-2 lg:grid-cols-3 gap-3">
          {filtrados.map(eq => {
            const b = !eq.activo ? { icon: "⚪", label: "Inactivo", color: "gray" } : (EQUIPO_BADGE_INFO[eq.badge] || EQUIPO_BADGE_INFO.sin_auditar);
            return (
              <Card key={eq.id_equipo} className={cx("relative h-full", !eq.activo && "opacity-60")}>
                <div className="absolute top-4 right-4"><Badge color={b.color}>{b.icon} {b.label}</Badge></div>
                <button onClick={() => setDetalle(eq)} className="text-left block w-full">
                  <p className="font-bold text-[15px] pr-28">{eq.numero_interno ? `${eq.numero_interno} · ` : ""}{eq.patente}</p>
                  <p className="text-[12.5px] text-muted mt-1">{eq.tipo === "SEMI" ? "Semirremolque" : `Tracto ${eq.configuracion_ejes || ""}`} · {eq.modelo || "-"}</p>
                  <p className="text-[12px] text-muted mt-1">{eq.kilometros ? `${eq.kilometros.toLocaleString()} km` : "Sin km registrados"}</p>
                </button>
                {puedeGestionar && (
                  <div className="flex items-center gap-2 mt-3 pt-3 border-t border-bd">
                    <button onClick={() => setModalEquipo(eq)} className="w-8 h-8 rounded-full bg-[#F3F4F6] flex items-center justify-center"><Icon.pencil width="14" height="14" /></button>
                    <button onClick={() => toggleActivo(eq)} className="text-[12px] font-bold text-ink px-3 py-1.5 rounded-full bg-[#F3F4F6] ml-auto">{eq.activo ? "Desactivar" : "Activar"}</button>
                  </div>
                )}
              </Card>
            );
          })}
          {!filtrados.length && <p className="text-[13.5px] text-muted py-6 col-span-full text-center">No hay equipos que coincidan.</p>}
        </div>
      )}
      {modalEquipo !== undefined && (
        <EquipoModal equipo={modalEquipo} filtro={filtro} empresas={empresas} pushToast={pushToast}
          onClose={() => setModalEquipo(undefined)} onSaved={() => { setModalEquipo(undefined); cargar(); }} />
      )}
    </div>
  );
}

  const rows = [
    ["Patente", equipo.patente || "-"],
    ["Interno", equipo.numero_interno || "-"],
    ["Tipo", equipo.tipo === "SEMI" ? "Semirremolque" : "Tracto"],
    // Requerimiento 3: un SEMI ahora puede tener un slug dinamico (ej. ELB
    // "1+1"/"3+1") en vez de siempre el layout fijo de 13 posiciones.
    ["Configuración de ejes", equipo.configuracion_ejes || (equipo.tipo === "SEMI" ? "Semi estándar (13 posiciones)" : "No definida")],
    ["Modelo", equipo.modelo || "-"],
    ["Km actuales", equipo.kilometros ? equipo.kilometros.toLocaleString() : "-"],
    ["Última auditoría", ultimaAuditoria === undefined ? "…" : ultimaAuditoria ? `N°${ultimaAuditoria.numero_auditoria} · ${formatDateLong(ultimaAuditoria.fecha)}` : "Sin auditorías registradas"]
  ];
  return (
    <Card className="max-w-lg">
      <div className="space-y-3 text-[14px]">
        {rows.map(([k, v]) => (
          <div key={k} className="flex items-center justify-between gap-3">
            <span className="text-muted">{k}</span>
            <span className="font-bold text-right">{v}</span>
          </div>
        ))}
      </div>

// Fix 3: origen real (nuevo/transito/recauchado) — neumaticos.estado_actual
// siempre queda "en_uso" tras montar, no sirve para esto (ver nota en
// fetchOrigenNeumatico, js/supabase.js). Se busca en cambio_detalle.
const ORIGEN_BADGE = {
  recauchado: { color: "amber", label: "♻ Recauchado" },
  nuevo: { color: "green", label: "✦ Nuevo" },
  transito: { color: "gray", label: "↔ Tránsito" }
};
function OrigenNeumaticoBadge({ numeroFuego }) {
  const [origen, setOrigen] = useState(undefined);
  useEffect(() => {
    let cancel = false;
    setOrigen(undefined);
    fetchOrigenNeumatico(numeroFuego).then(o => { if (!cancel) setOrigen(o); }).catch(() => { if (!cancel) setOrigen(null); });
    return () => { cancel = true; };
  }, [numeroFuego]);
  if (!origen || !ORIGEN_BADGE[origen]) return null;
  return <Badge color={ORIGEN_BADGE[origen].color}>{ORIGEN_BADGE[origen].label}</Badge>;
}
function PosicionDetalleModal({ n, pos, equipo, discrepanciaPendiente, setView, onClose }) {
  // Requerimiento: evidencia fotografica de desgaste irregular (subida
  // obligatoria por el mecanico en PosicionModal, mecanico.html).
  const [fotoDesgasteVer, setFotoDesgasteVer] = useState(false);
  // Fix sincronizacion mapa: neumaticos.milimetros es el valor EN VIVO (lo
  // escribe el montaje de la Hoja de Cambio, ver actualizarNeumaticoEntra/
  // renombrarNeumaticoOrigen en js/supabase.js) y siempre es mas reciente que
  // el snapshot de la ultima auditoria (n.aud, que solo se actualiza al
  // auditar). Mismo criterio que ya usaba psi (n.psi_actual primero).
  const mm = n.milimetros != null ? n.milimetros : (n.aud ? (n.aud.mm_centro != null ? n.aud.mm_centro : n.aud.milimetros) : null);
  const psi = n.psi_actual != null ? n.psi_actual : (n.aud ? n.aud.psi : null);
  return (
    <Modal title={`Posición ${pos}`} onClose={onClose}>
      <div className="space-y-3 text-[14px]">
        <div className="flex items-center justify-between"><span className="text-muted">N° fuego</span><span className="font-bold flex items-center gap-2">{n.numero_fuego || "-"}<OrigenNeumaticoBadge numeroFuego={n.numero_fuego} /></span></div>
        {/* Fix 4: desgaste irregular detectado en la ultima auditoria. */}
        {n.aud && n.aud.tipo_desgaste === "irregular" && (
          <div className="bg-[#FEF3C7] rounded-xl px-3 py-2">
            <p className="text-[12.5px] font-bold text-[#92400E]">⚠ Desgaste irregular detectado en última auditoría</p>
            {n.aud.url_foto_desgaste_irregular ? (
              <button onClick={() => setFotoDesgasteVer(true)} className="mt-2 flex items-center gap-2">
                <img src={n.aud.url_foto_desgaste_irregular} alt="Evidencia de desgaste irregular" className="w-14 h-14 rounded-lg object-cover border border-[#FDE68A]" />
                <span className="text-[12px] font-bold text-[#92400E] underline">Ver foto de evidencia</span>
              </button>
            ) : (
              <p className="text-[11.5px] text-[#92400E] mt-1">Sin foto de evidencia registrada.</p>
            )}
          </div>
        )}
        {fotoDesgasteVer && <FotoMontajeModal url={n.aud.url_foto_desgaste_irregular} titulo="Evidencia de desgaste irregular" onClose={() => setFotoDesgasteVer(false)} />}
        {/* Fix 5: discrepancia sin aprobar — a diferencia de mecanico.html, acá
            el Admin SI puede resolverla, con un boton directo a Jornada >
            Movimientos > Discrepancias. */}
        {discrepanciaPendiente && (
          <div className="bg-[#FEE2E2] rounded-xl px-3 py-2">
            <p className="text-[12.5px] font-bold text-[#B91C1C]">🔒 Pendiente de aprobación del supervisor</p>
            <p className="text-[11.5px] text-[#B91C1C] mt-0.5 mb-2">Este neumático tiene una discrepancia detectada en la última auditoría.</p>
            <Button variant="subtle" className="h-9 px-3 text-[12.5px]" onClick={() => irAResolucion({ tipo: "neumatico_no_registrado", equipo_id: equipo.id_equipo, posicion: pos, equipo }, setView)}>Resolver →</Button>
          </div>
        )}
        <div className="flex items-center justify-between"><span className="text-muted">Marca</span><span className="font-bold">{n.marca || "-"}</span></div>

function AxleMapReadOnly({ cfg, porPosicion, colorDePosicion, selectedPos, onTap }) {

function MapaEquipoTab({ equipo, setView }) {
  const [posiciones, setPosiciones] = useState(null);
  const [verPos, setVerPos] = useState(null);
  const [showReferencias, setShowReferencias] = useState(false);
  // Fix 5: discrepancias de neumatico sin aprobar de este equipo — matchean
  // por numero_fuego (item_detalle) o por posicion, igual que el candado del
  // mapa del mecanico en mecanico.html.
  const [discrepancias, setDiscrepancias] = useState([]);

  useEffect(() => {
    let cancel = false;
    (async () => {
      const { data: neumaticos } = await sb.from("neumaticos").select("*").eq("equipo_actual", equipo.id_equipo).eq("estado_actual", "en_uso");
      const numerosFuego = (neumaticos || []).map(n => n.numero_fuego).filter(Boolean);
      const mmPorFuego = {};
      if (numerosFuego.length) {
        const { data: ultimaAud } = await sb.from("auditorias").select("id_auditoria").eq("equipo_id", equipo.id_equipo).order("fecha", { ascending: false }).order("creado_en", { ascending: false }).limit(1);
        if (ultimaAud && ultimaAud[0]) {
          // Fix 4: tipo_desgaste sumado al select para poder mostrar el badge
          // de desgaste irregular en el modal de la posicion.
          const { data: posAud } = await sb.from("auditoria_posiciones").select("numero_fuego,milimetros,psi,mm_borde_izq,mm_centro,mm_borde_der,tipo_desgaste,url_foto_desgaste_irregular").eq("auditoria_id", ultimaAud[0].id_auditoria).in("numero_fuego", numerosFuego);
          (posAud || []).forEach(p => { mmPorFuego[p.numero_fuego] = p; });
        }
      }
      const { data: discs } = await sb.from("discrepancias_inventario").select("id,tipo_discrepancia,item_detalle,posicion,valor_sistema,valor_fisico")
        .eq("equipo_id", equipo.id_equipo).eq("resuelta", false);
      if (!cancel) {
        setPosiciones((neumaticos || []).map(n => ({ ...n, aud: mmPorFuego[n.numero_fuego] || null })));
        setDiscrepancias(discs || []);
      }
    })();
    return () => { cancel = true; };
  }, [equipo.id_equipo]);

  if (!equipo.configuracion_ejes && equipo.tipo !== "SEMI") {
    return <p className="text-[13.5px] text-muted py-6">⚠ Este equipo no tiene configuración de ejes definida. Editá el equipo para configurarla.</p>;
  }
  if (posiciones === null) return <div className="flex justify-center py-10"><span className="spinner" /></div>;

  const cfg = axleConfigFor(equipo);
  const porPosicion = {};
  posiciones.forEach(p => { porPosicion[p.posicion_actual] = p; });

  function colorDePosicion(pos) {
    const n = porPosicion[pos];
    if (!n) return "empty";
    const data = {
      psi: n.psi_actual != null ? n.psi_actual : (n.aud ? n.aud.psi : null),
      mm_borde_izq: n.aud ? n.aud.mm_borde_izq : null,
      mm_centro: n.milimetros != null ? n.milimetros : (n.aud ? (n.aud.mm_centro != null ? n.aud.mm_centro : n.aud.milimetros) : null),
      mm_borde_der: n.aud ? n.aud.mm_borde_der : null
    };
    const ev = evaluarPosicion(cfg, DEFAULT_CFG, pos, equipo.tipo, data);
    return ev.status;
  }

  return (
    <div>
      <Card>
        <p className="text-[12.5px] text-muted mb-4">Tocá un neumático para verlo. Solo lectura — sin arrastre.</p>
        <AxleMapReadOnly cfg={cfg} porPosicion={porPosicion} colorDePosicion={colorDePosicion}
          selectedPos={verPos} onTap={(pos) => porPosicion[pos] && setVerPos(pos)} />
      </Card>
      <MapaLeyenda onAbrirReferencias={() => setShowReferencias(true)} />
      {showReferencias && <ReferenciasModal onClose={() => setShowReferencias(false)} />}
      {verPos != null && porPosicion[verPos] && (
        <PosicionDetalleModal n={porPosicion[verPos]} pos={verPos} equipo={equipo} setView={setView} onClose={() => setVerPos(null)}
          discrepanciaPendiente={discrepancias.some(d => d.item_detalle === porPosicion[verPos].numero_fuego || d.posicion === verPos)} />
      )}
    </div>
  );
}

// Requerimiento 4B: tabla centralizada de tareas derivadas a Pendiente para
// este equipo (de cualquier auditoria/HC, no solo la ultima). "Reasignar a
// hoy" inyecta la tarea en la HC activa de hoy si existe (visible al toque
// para el mecanico); si no hay sesion activa, queda marcada para que el
// arrastre automatico de la proxima auditoria la traiga sola.
// Requerimiento 3: desde la ficha del equipo (Equipos > Historial), ver las
// tareas ACTIVAS del instructivo de la Hoja de Cambio en curso (recomendaciones
// + tareas_extra) y poder mandarlas a Pendiente sin depender de "Actividad en
// Faena". El canal realtime "hc-checklist-<recetaId>" que ya escucha
// mecanico.html hace que la tarea desaparezca de HACER_HOY del mecanico en
// el momento en que este update llega.
function TareasActivasInstructivoSeccion({ equipo, adminUser, pushToast }) {
  const [receta, setReceta] = useState(null); // null = cargando/sin HC activa
  const [ocupado, setOcupado] = useState(null);

  function cargar() {
    db.fetchRecetaEnProcesoHoy(equipo.id_equipo).then(r => setReceta(r || false)).catch(e => { console.error("No se pudo cargar el instructivo activo", e); setReceta(false); });
  }
  useEffect(() => { cargar(); }, [equipo.id_equipo]);

  if (!receta) return null;

  const pa = receta.posiciones_alerta || {};
  const recs = (Array.isArray(pa.recomendaciones) ? pa.recomendaciones : []).filter(r => !r.done).map(r => ({ ...r, esExtra: false }));
  const extras = (Array.isArray(pa.tareas_extra) ? pa.tareas_extra : []).filter(t => !t.done).map(t => ({ ...t, esExtra: true }));
  const activas = [...recs, ...extras];

  async function aPendiente(t) {
    setOcupado(t.id);
    try {
      await db.enviarTareaActivaAPendiente(receta.id, t, t.esExtra, adminUser);
      pushToast("⏳ Tarea mandada a Pendiente — se quita de la Hoja de Cambio del mecánico");
      cargar();
    } catch (e) { console.error("No se pudo mandar la tarea a pendiente", e); pushToast("✕ No se pudo mandar a pendiente", "red"); }
    setOcupado(null);
  }

  if (!activas.length) return null;

  return (
    <div className="mb-8">
      <p className="font-bold text-[16px] mb-3">🟡 Tareas activas de la Hoja de Cambio en curso ({activas.length})</p>
      <div className="space-y-2 mb-4">
        {activas.map(t => (
          <div key={t.id} className="bg-white rounded-2xl border border-bd shadow-card px-4 py-3 flex items-center justify-between gap-3">
            <p className="text-[13.5px] font-semibold flex-1">{t.texto}</p>
            <button disabled={ocupado === t.id} onClick={() => aPendiente(t)} className="text-[11px] font-bold text-[#92400E] px-2.5 py-1 rounded-full bg-[#FEF3C7] shrink-0 whitespace-nowrap">
              {ocupado === t.id ? "..." : "⏳ Mandar a Pendiente"}
            </button>
          </div>
        ))}
      </div>
    </div>
  );
}

      </div>
    </div>
  );
}

        sb.from("cambios_neumaticos").select("id_cambio,fecha,kilometraje,numero_cambio,creado_en,bultero_id,hora_ingreso,hora_salida").eq("equipo_id", equipo.id_equipo)
      ]);
      if (e1 || e2) { console.error("No se pudo cargar el historial", e1 || e2); if (!cancel) setItems([]); return; }
      const mecIds = [...new Set([...(auds || []).map(a => a.bultero_id), ...(cams || []).map(c => c.bultero_id)])].filter(Boolean);
      const mecMap = {};
      if (mecIds.length) {
        const { data: mecs } = await sb.from("usuarios").select("id,nombre,apellido").in("id", mecIds);
        (mecs || []).forEach(m => { mecMap[m.id] = `${m.nombre} ${m.apellido || ""}`.trim(); });
      }
      const audIds = (auds || []).map(a => a.id_auditoria);
      const recetaMap = {};
      if (audIds.length) {
        const { data: recetas } = await sb.from("auditorias_receta").select("auditoria_id,total_tareas,tareas_cumplidas,pct_receta_seguida").in("auditoria_id", audIds);
        (recetas || []).forEach(r => { recetaMap[r.auditoria_id] = r; });
      }
      const rows = [
        ...(auds || []).map(a => {
          const receta = recetaMap[a.id_auditoria];
          return {
            id: `a_${a.id_auditoria}`, tipo_evento: "auditoria", evento_id: a.id_auditoria, equipo_id: equipo.id_equipo,
            fecha: a.fecha, kilometraje: a.kilometraje, creado_en: a.creado_en, mecanico_id: a.bultero_id,
            mecanicoNombre: mecMap[a.bultero_id] || null, desc: `Auditoría N°${a.numero_auditoria}`,
            total_tareas: receta ? receta.total_tareas : null, tareas_cumplidas: receta ? receta.tareas_cumplidas : null,
            pct_receta_seguida: receta ? receta.pct_receta_seguida : null
          };
        }),
        ...(cams || []).map(c => ({
          id: `c_${c.id_cambio}`, tipo_evento: "cambio", evento_id: c.id_cambio, equipo_id: equipo.id_equipo,
          fecha: c.fecha, kilometraje: c.kilometraje, creado_en: c.creado_en, mecanico_id: c.bultero_id,
          mecanicoNombre: mecMap[c.bultero_id] || null, desc: `Hoja de cambio N°${c.numero_cambio}`,
          hora_ingreso: c.hora_ingreso, hora_salida: c.hora_salida
        }))
      ].sort((a, b) => (b.creado_en || "").localeCompare(a.creado_en || "")).slice(0, 20);
      if (!cancel) setItems(rows);
    })();
    return () => { cancel = true; };
  }, [equipo.id_equipo]);

  function exportarExcel() {
    const filas = (items || []).map(it => ({
      Tipo: it.tipo_evento === "auditoria" ? "Auditoría" : "Hoja de cambio",
      Fecha: it.fecha || "", Descripción: it.desc, Mecánico: it.mecanicoNombre || "", "Fecha y hora": it.creado_en || ""
    }));
    const ws = XLSX.utils.json_to_sheet(filas);
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, "Historial");
    XLSX.writeFile(wb, `historial_${(equipo.patente || equipo.id_equipo)}.xlsx`);
  }

  return (
    <div>
      <TareasActivasInstructivoSeccion equipo={equipo} adminUser={adminUser} pushToast={pushToast} />
      <TareasPendientesSeccion equipo={equipo} adminUser={adminUser} pushToast={pushToast} />
      <p className="font-bold text-[16px] mb-3">Historial clínico</p>
      {items === null ? <div className="flex justify-center py-10"><span className="spinner" /></div> : (
        <>
          <div className="flex justify-end mb-4">
            <Button variant="subtle" className="h-10 px-4 text-[13px]" disabled={!items.length} onClick={exportarExcel}>📊 Exportar historial completo a Excel</Button>
          </div>
          <div className="space-y-3">
            {items.map(it => <HistorialEventoCard key={it.id} item={it} equipo={equipo} expandido={expandido} onToggle={setExpandido} />)}
            {!items.length && <p className="text-[13.5px] text-muted py-6 text-center">Sin historial registrado.</p>}
          </div>
        </>
      )}
    </div>
  );
}

const EQUIPO_DETALLE_TABS_BASE = [
  { id: "info", label: "Info" },
  { id: "mapa", label: "Mapa" },
  { id: "historial", label: "Tareas Pendientes e Historial" }
];
function EquipoDetalleView({ equipo, onBack, setView, adminUser }) {
  const [tab, setTab] = useState("info");
  const [ultimaAuditoria, setUltimaAuditoria] = useState(undefined); // undefined=cargando, null=sin auditorías
  const [instructivoPendiente, setInstructivoPendiente] = useState(undefined);
  const [pushToast, toastNode] = useToasts();

  useEffect(() => {
    let cancel = false;
    sb.from("auditorias").select("id_auditoria,fecha,numero_auditoria,creado_en").eq("equipo_id", equipo.id_equipo)
      .order("fecha", { ascending: false }).order("creado_en", { ascending: false }).limit(1)
      .then(({ data }) => { if (!cancel) setUltimaAuditoria((data && data[0]) || null); });
    return () => { cancel = true; };
  }, [equipo.id_equipo]);

  useEffect(() => {
    let cancel = false;
    (async () => {
      const { data: auds } = await sb.from("auditorias").select("id_auditoria,fecha").eq("equipo_id", equipo.id_equipo).order("fecha", { ascending: false });
      if (!auds || !auds.length) { if (!cancel) setInstructivoPendiente(null); return; }
      const ids = auds.map(a => a.id_auditoria);
      const { data: recetas } = await sb.from("auditorias_receta").select("*").in("auditoria_id", ids).in("estado", ["pendiente", "parcial"]);
      if (!recetas || !recetas.length) { if (!cancel) setInstructivoPendiente(null); return; }
      const audMap = {}; auds.forEach(a => { audMap[a.id_auditoria] = a; });
      recetas.sort((a, b) => ((audMap[b.auditoria_id] || {}).fecha || "").localeCompare((audMap[a.auditoria_id] || {}).fecha || ""));
      const top = recetas[0];
      if (!cancel) setInstructivoPendiente({ ...top, fecha: audMap[top.auditoria_id] ? audMap[top.auditoria_id].fecha : null });
    })();
    return () => { cancel = true; };
  }, [equipo.id_equipo]);

  const tabs = [...EQUIPO_DETALLE_TABS_BASE];
  if (instructivoPendiente) tabs.splice(2, 0, { id: "instructivo", label: "Instructivo" });

  return (
    <div>
      <button onClick={onBack} className="flex items-center gap-2 text-[13.5px] font-bold text-muted mb-4"><Icon.back width="15" height="15" /> Equipos</button>
      <h1 className="text-[26px] font-extrabold mb-1">{equipo.numero_interno ? `${equipo.numero_interno} · ` : ""}{equipo.patente}</h1>
      <p className="text-[13px] text-muted mb-5">{equipo.tipo === "SEMI" ? "Semirremolque" : `Tracto ${equipo.configuracion_ejes || ""}`} · {equipo.modelo || "-"}</p>

      <div className="flex gap-2 mb-5 overflow-x-auto">
        {tabs.map(t => (
          <button key={t.id} onClick={() => setTab(t.id)}
            className={cx("px-4 py-2 rounded-full text-[13px] font-bold whitespace-nowrap", tab === t.id ? "bg-ink text-white" : "bg-[#F3F4F6] text-[#374151]")}>{t.label}</button>
        ))}
      </div>

      {toastNode}
      {tab === "info" && <InfoEquipoTab equipo={equipo} ultimaAuditoria={ultimaAuditoria} />}
      {tab === "mapa" && <MapaEquipoTab equipo={equipo} setView={setView} />}
      {tab === "instructivo" && instructivoPendiente && <InstructivoEquipoTab receta={instructivoPendiente} />}
      {tab === "historial" && <HistorialEquipoTab equipo={equipo} adminUser={adminUser} pushToast={pushToast} />}
    </div>
  );
}

function DetalleCheckModal({ mecanico, filtro, empresas, adminUser, onClose, pushToast, onResuelto }) {
  const [stock, setStock] = useState(null);

  const [discrepancias, setDiscrepancias] = useState([]);

  async function cargar() {
    setLoading(true);
    try {
      const [stk, herr, disc] = await Promise.all([
        adminDb.fetchStockRapido(filtro),
        check ? fetchHerramientasCheck(check.id) : Promise.resolve([]),
        fetchDiscrepanciasPendientes(mecanico.id, todayISO())
      ]);
      setStock(stk); setHerramientas(herr); setDiscrepancias(disc);
    } catch (e) { console.error("No se pudo cargar el detalle del check diario", e); }
    setLoading(false);
  }
  useEffect(() => { cargar(); }, []);

  async function resolver(d, aprobar, justificacion) {
    await resolverDiscrepancia(d, aprobar, justificacion, adminUser.id);
    setDiscrepancias(ds => ds.filter(x => x.id !== d.id));
    pushToast(aprobar ? "✓ Ajuste aprobado" : "✓ Discrepancia rechazada");
    onResuelto();

        <div className="space-y-6">
          <div>
            <p className="text-[13px] text-muted">Empresa: {empresaNombre}</p>
            <p className="text-[13px] text-muted">Fecha: {formatDateLong(todayISO())}{check ? ` · Hora inicio: ${(check.hora_inicio || "").slice(0, 5)}` : ""}</p>

            <>
              <div>
                <p className="font-bold text-[14.5px] mb-2">Conteo de neumáticos</p>
                <div className="overflow-x-auto -mx-1">
                  <table className="w-full text-[13px]">
                    <thead>
                      <tr className="text-left text-muted">
                        <th className="font-semibold pb-2 px-1">Tipo</th>
                        <th className="font-semibold pb-2 px-1 text-right">Sistema</th>
                        <th className="font-semibold pb-2 px-1 text-right">Físico</th>
                        <th className="font-semibold pb-2 px-1 text-right">Diferencia</th>
                      </tr>
                    </thead>
                    <tbody>
                      {CONTEO_ROWS.map(r => {
                        const sistema = stock ? stock[r.bodega] : null;
                        const fisico = check[r.campo] != null ? check[r.campo] : 0;
                        const diff = sistema != null ? fisico - sistema : null;
                        return (
                          <tr key={r.label} className="border-t border-bd">
                            <td className="py-2 px-1 font-semibold">{r.label}</td>
                            <td className="py-2 px-1 text-right">{sistema != null ? sistema : "—"}</td>
                            <td className="py-2 px-1 text-right">{fisico}</td>
                            <td className="py-2 px-1 text-right font-bold">{diff == null ? "—" : diff === 0 ? "✅ 0" : `🔴 ${diff > 0 ? "+" : ""}${diff}`}</td>
                          </tr>
                        );
                      })}
                      {LLANTAS_ROWS.map(r => (
                        <tr key={r.label} className="border-t border-bd">
                          <td className="py-2 px-1 font-semibold">{r.label}</td>
                          <td className="py-2 px-1 text-right text-muted">—</td>
                          <td className="py-2 px-1 text-right">{check[r.campo] != null ? check[r.campo] : 0}</td>

function InicioDelDiaView({ empresaCtl, adminUser, pushToast }) {
  const { filtro, empresas } = empresaCtl;
  const [lista, setLista] = useState([]);
  const [stats, setStats] = useState({ pendientes: 0, resueltas: 0 });
  const [loading, setLoading] = useState(true);
  const [verMecanico, setVerMecanico] = useState(null);

  async function cargar() {
    setLoading(true);
    try {
      const [data, pendientes, resueltas] = await Promise.all([
        fetchInicioDelDia(filtro), countDiscrepanciasPendientes(filtro), countDiscrepanciasResueltasHoy(filtro)
      ]);
      setLista(data);
      setStats({ pendientes, resueltas });
    } catch (e) { console.error("No se pudo cargar el inicio del día", e); }
    setLoading(false);
  }
  useEffect(() => { cargar(); }, [filtro]);

  const completados = lista.filter(m => m.check && m.check.completado).length;

  if (loading) return <div className="flex justify-center py-10"><span className="spinner" /></div>;

  return (
    <div>
      <div className="bg-white rounded-2xl border border-bd shadow-card overflow-hidden mb-5">
        {lista.map((m, i) => {
          const done = m.check && m.check.completado;
          return (
            <button key={m.id} onClick={() => done && setVerMecanico(m)}
              className={cx("w-full flex items-center justify-between px-4 py-3 text-left", i > 0 && "border-t border-bd", !done && "cursor-default")}>
              <div className="flex items-center gap-2">
                <span>{done ? "✅" : "⏳"}</span>
                <div>
                  <p className="font-bold text-[14px]">{m.nombre} {m.apellido || ""}</p>
                  <p className="text-[12px] text-muted">{done ? `Completó ${(m.check.hora_inicio || "").slice(0, 5)}` : "Sin completar"}</p>
                </div>
              </div>
              {done && <span className="text-[12px] font-bold text-ink shrink-0">Ver detalle</span>}
            </button>
          );
        })}
        {!lista.length && <p className="text-[13.5px] text-muted p-4">No hay mecánicos para esta empresa.</p>}
      </div>

      <div className="grid grid-cols-3 gap-3">
        <KpiCard label={`Completaron el check`} value={`${completados}/${lista.length}`} />
        <KpiCard label="Discrepancias pendientes" value={stats.pendientes} />
        <KpiCard label="Resueltas hoy" value={stats.resueltas} />
      </div>

      {verMecanico && (
        <DetalleCheckModal mecanico={verMecanico} filtro={filtro} empresas={empresas} adminUser={adminUser}
          onClose={() => setVerMecanico(null)} pushToast={pushToast} onResuelto={cargar} />
      )}
    </div>
  );
}

// Requerimiento 2B: el Admin puede ver el instructivo activo de cualquier
// equipo y togear cada tarea HACER_HOY (🟢, se manda al mecanico) / PENDIENTE
// (🔴, se saca de hoy y se deriva a Equipos > Tareas Pendientes — misma
// tabla que usa el mecanico, db.diferirTareaChecklist), ademas de agregar
// tareas propias (tipo_origen:'admin').
function InstructivoCard({ r, adminUser, pushToast, onRefrescar }) {
  const pa = r.posiciones_alerta || {};
  const recs = Array.isArray(pa.recomendaciones) ? pa.recomendaciones : [];
  const extras = Array.isArray(pa.tareas_extra) ? pa.tareas_extra : [];
  const est = INSTRUCTIVO_ESTADO[r.estado] || { label: (r.estado || "-").toUpperCase(), color: "gray" };
  const [nuevaTarea, setNuevaTarea] = useState("");
  const [ocupado, setOcupado] = useState(null);

  async function derivarAPendiente(t, extra) {
    setOcupado(t.id);
    try {
      // Los dos cambios (sacarla de recomendaciones/tareas_extra + agregarla a
      // tareas_diferidas) van en UN solo read-modify-write sobre la misma
      // fila -- llamar a db.diferirTareaChecklist (que hace su propio
      // read-write) y despues otro update separado los pisa entre si, mismo
      // bug que ya aparecio en reasignarTareaAHoy.
      const { data: fresh, error: eFresh } = await sb.from("auditorias_receta").select("posiciones_alerta").eq("id", r.id).maybeSingle();
      if (eFresh) throw eFresh;
      const paFresca = fresh.posiciones_alerta || {};
      const diferidas = Array.isArray(paFresca.tareas_diferidas) ? paFresca.tareas_diferidas : [];
      const nuevaDiferida = { id: t.id, texto: t.texto, tipo_origen: t.tipo_origen || "sistema", creado_por: t.creado_por || "Sistema (Automático)", fecha_origen: t.fecha_origen || r.fecha, estado: "PENDIENTE" };
      const nuevaPa = extra
        ? { ...paFresca, tareas_extra: (paFresca.tareas_extra || []).filter(x => x.id !== t.id || x.texto !== t.texto), tareas_diferidas: [...diferidas, nuevaDiferida] }
        : { ...paFresca, recomendaciones: (paFresca.recomendaciones || []).filter(x => x.id !== t.id), tareas_diferidas: [...diferidas, nuevaDiferida] };
      const { error } = await sb.from("auditorias_receta").update({ posiciones_alerta: nuevaPa }).eq("id", r.id);
      if (error) throw error;
      pushToast("→ Tarea derivada a Pendiente");
      onRefrescar();
    } catch (e) { console.error("No se pudo derivar la tarea", e); pushToast("✕ No se pudo derivar la tarea", "red"); }
    setOcupado(null);
  }
  async function agregarTareaAdmin() {
    if (!nuevaTarea.trim()) return;
    setOcupado("nueva");
    try {
      const tarea = { id: uuid(), texto: nuevaTarea.trim(), done: false, tipo_origen: "admin", creado_por: adminUser ? `${adminUser.nombre} ${adminUser.apellido || ""}`.trim() : "Admin", fecha_origen: todayISO(), estado: "HACER_HOY" };
      await sb.from("auditorias_receta").update({ posiciones_alerta: { ...pa, tareas_extra: [...extras, tarea] } }).eq("id", r.id);
      setNuevaTarea("");
      pushToast("✓ Tarea agregada al instructivo");
      onRefrescar();
    } catch (e) { console.error("No se pudo agregar la tarea", e); pushToast("✕ No se pudo agregar la tarea", "red"); }
    setOcupado(null);
  }

  return (
    <div className="bg-white rounded-2xl border border-bd shadow-card p-4">
      <div className="flex items-start justify-between gap-2 mb-2">
        <div>
          <p className="font-bold text-[14px]">{r.equipo ? `${r.equipo.patente} (${r.equipo.numero_interno || "-"})` : "-"} — {r.mecanico ? `${r.mecanico.nombre} ${r.mecanico.apellido || ""}` : "-"} — {r.hora}</p>
          <p className="text-[12.5px] text-muted mt-0.5">Estado: <span className="font-bold">{est.label}</span> · {r.tareas_cumplidas}/{r.total_tareas} tareas · {r.pct_receta_seguida != null ? r.pct_receta_seguida : 0}%</p>
        </div>
        <Badge color={est.color}>{est.label}</Badge>
      </div>
      <div className="space-y-1.5 mt-3">
        {recs.map(t => (
          <div key={t.id} className="flex items-center justify-between gap-2">
            <p className={cx("text-[13px] flex-1", t.done ? "text-[#15803D]" : "text-[#92400E]")}>{t.done ? "✅" : "🟢"} {t.texto} <span className="text-muted">{t.done ? "(cumplida)" : "(hacer hoy)"}</span></p>
            {!t.done && <button disabled={ocupado === t.id} onClick={() => derivarAPendiente(t, false)} className="text-[11px] font-bold text-[#92400E] px-2.5 py-1 rounded-full bg-[#FEF3C7] shrink-0 whitespace-nowrap">{ocupado === t.id ? "…" : "🔴 Pendiente"}</button>}
          </div>
        ))}
        {extras.map((t, i) => (
          <div key={i} className="flex items-center justify-between gap-2">
            <p className={cx("text-[13px] flex-1", t.done ? "text-[#15803D]" : "text-[#92400E]")}>➕ {t.texto} {t.done ? "✅" : "🟢"} <span className="text-muted">({t.tipo_origen || "extra"}{t.creado_por ? ` — ${t.creado_por}` : ""})</span></p>
            {!t.done && <button disabled={ocupado === t.id} onClick={() => derivarAPendiente(t, true)} className="text-[11px] font-bold text-[#92400E] px-2.5 py-1 rounded-full bg-[#FEF3C7] shrink-0 whitespace-nowrap">{ocupado === t.id ? "…" : "🔴 Pendiente"}</button>}
          </div>
        ))}
        {!recs.length && !extras.length && <p className="text-[13px] text-muted">Sin tareas registradas.</p>}
      </div>
      <div className="flex gap-2 mt-3 pt-3 border-t border-bd">
        <TextInput placeholder="Agregar tarea al instructivo" value={nuevaTarea} onChange={e => setNuevaTarea(e.target.value)} onKeyDown={e => { if (e.key === "Enter") agregarTareaAdmin(); }} className="h-9 text-[12.5px]" />
        <Button variant="subtle" className="h-9 px-3 text-[12.5px]" disabled={ocupado === "nueva"} onClick={agregarTareaAdmin}>+ Agregar</Button>
      </div>
    </div>
  );
}

function monthStartISO() {
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-01`;
}
async function fetchStatsCierreMes(clienteId) {
  let q = sb.from("cierre_dia").select("cerrado,motivo_sin_cierre").gte("fecha", monthStartISO()).lte("fecha", todayISO());
  q = filtroCliente(q, clienteId);
  const { data, error } = await q;
  if (error) throw error;
  const total = (data || []).length;
  const correctos = (data || []).filter(c => c.cerrado && !c.motivo_sin_cierre).length;
  return { total, correctos, pct: total ? Math.round((correctos / total) * 100) : 0 };
}
function calcDuracion(inicio, cierre) {
  if (!inicio || !cierre) return "—";
  const [h1, m1] = inicio.split(":").map(Number);
  const [h2, m2] = cierre.split(":").map(Number);
  let mins = (h2 * 60 + m2) - (h1 * 60 + m1);
  if (mins < 0) mins += 24 * 60;
  return `${Math.floor(mins / 60)}h ${mins % 60}min`;
}
function CierreEstadoInfo(c) {
  if (!c.cerrado) return { icon: "⏳", label: `Jornada abierta${c.hora_inicio ? ` desde ${c.hora_inicio.slice(0, 5)}` : ""}` };
  if (c.motivo_sin_cierre === "olvido_cierre") return { icon: "✅", label: `Cerró ${(c.hora_cierre || "").slice(0, 5)}`, badge: "Cerró al día siguiente" };
  if (c.motivo_sin_cierre) return { icon: "⚠", label: `Cerró sin completar check (${c.motivo_sin_cierre})` };
  return { icon: "✅", label: `Cerró ${(c.hora_cierre || "").slice(0, 5)}` };
}
