<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>MOSA System · Sin conexión</title>
<meta name="theme-color" content="#FFFFFF" />
<link rel="icon" type="image/png" href="icons/icon-192.png" />
<style>
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#fff;color:#0a0a0a;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;text-align:center;padding:24px}
  main{max-width:340px}
  img{width:72px;height:72px;border-radius:18px}
  h1{font-size:22px;margin:20px 0 8px}
  p{color:#6b7280;font-size:15px;line-height:1.5;margin:0 0 24px}
  button{background:#0a0a0a;color:#fff;border:0;border-radius:16px;padding:14px 28px;font-size:15px;font-weight:700}
</style>
</head>
<body>
<main>
  <img src="icons/icon-192.png" alt="MOSA System" />
  <h1>Sin conexión</h1>
  <p>No pudimos conectarnos. Revisá tu internet y volvé a intentar. Los datos que ya cargaste en el equipo se conservan.</p>
  <button onclick="location.reload()">Reintentar</button>
</main>
</body>
</html>
